nchors the strip of Levantine shops along Cobble Hill's northern edge. Come for the bins of olives, nuts, dried fruit, spices and halvah.","tip":"Open daily 10am-7pm. Grab olives, spices, dried fruit and halva from the bulk bins for a picnic.","x":123.29,"y":160.01},{"name":"Warren Place Mews","address":"Warren Pl (between Warren St & Baltic St, off Hicks St)","why":"A hidden pedestrian lane of tiny 1879 workingmen's cottages, built by housing reformer Alfred Tredway White.","tip":"Enter from Warren St and walk through quietly to Baltic St; the White-built Home and Tower Buildings are around the corner on Hicks St.","x":113.51,"y":168.34},{"name":"Cobble Hill Cinemas","address":"265 Court St","why":"An old-school neighborhood movie house on Court St that has outlived nearly all of its kind in Brooklyn.","tip":"Catch an afternoon matinee; they sell beer and wine at the concession stand.","x":120.7,"y":174.76}],"coffee":[{"name":"Octavia Coffee","address":"198 Court St, Brooklyn, NY 11201","why":"A small, friendly Court Street shop with good espresso and a novelty punch-card that makes regulars out of visitors.","x":122.97,"y":168.53},{"name":"Maman","address":"154 Court St","why":"A French-country cafe with a pretty room and excellent pastries, especially the nutty chocolate chip cookie.","x":124.65,"y":163.96},{"name":"Bolo Bolo Cafe & Bakery","address":"196 Court St","why":"A tiny Court St cafe with creative lattes, baklava and a great outdoor setup for people-watching.","x":122.97,"y":168.53}],"park":[{"name":"Cobble Hill Park + Verandah Place","address":"Clinton St between Verandah Pl and Congress St, Brooklyn, NY 11201","why":"A small, leafy square on the site of a 1776 Revolutionary War earthwork, the fort that gave the neighborhood its name. Leave through Verandah Place, a 19th-century mews of carriage houses right beside the park.","x":118.88,"y":165.77},{"name":"Brooklyn Bridge Park Pier 6","address":"Atlantic Ave & Furman St","why":"Cobble Hill's door to the waterfront, with harbor views, beach volleyball courts and the ferry to Governors Island.","x":108.12,"y":154.35},{"name":"Van Voorhees Park","address":"Hicks St & Congress St","why":"The neighborhood's real local park, with ballfields and two public tennis courts (sign-up sheet at 6am).","x":111.39,"y":162.44}],"bite":[{"name":"Shelsky's of Brooklyn","address":"141 Court St, Brooklyn, NY 11201","why":"A modern Jewish appetizing counter on Court Street that keeps the old Brooklyn smoked-fish tradition alive. Takeout only, so you can eat as you walk the brownstone blocks.","order":"The Member of the Tribe (nova lox on a bagel or bialy, scallion cream cheese) or the pastrami-smoked salmon","x":125.57,"y":161.44},{"name":"Court Pastry Shop","address":"298 Court St","why":"An old-school Italian pastry shop known for some of Brooklyn's best cannoli and rainbow cookies.","order":"A cannoli filled to order, plus a bag of rainbow cookies","x":119.52,"y":177.99},{"name":"Cafe Luluc","address":"214 Smith St","why":"A cash-only French bistro whose pancakes have a citywide cult following.","order":"The pancakes (nearly every table orders them)","x":126.47,"y":176.67}],"bite_gf":[{"name":"Bareburger (Cobble Hill)","address":"149 Court St, Brooklyn, NY 11201","why":"Cobble Hill has no dedicated GF kitchen. Atly tags this branch celiac-friendly, and it offers GF buns and gluten-free chicken tenders, but fries may share a fryer, so ask before ordering them.","order":"Any burger on the gluten-free bun with a side salad","gf_level":"GF options w/ precautions","x":125.18,"y":162.49},{"name":"Lemongrass Brooklyn","address":"156 Court St","why":"A lively Thai spot where much of the curry and rice menu can be made gluten-free.","order":"A coconut curry with rice; ask them to skip soy sauce and fried items","gf_level":"GF options w/ precautions","x":124.57,"y":164.17}],"bar":[{"name":"Boat","address":"175 Smith St","why":"A proper neighborhood dive with pinball machines, ping pong, pool and cheap shot-and-beer combos.","tag":"Dive · pinball + shot-and-beer specials","type":"dive","x":128.74,"y":172.26},{"name":"Clover Club","address":"210 Smith St","why":"Julie Reiner's cocktail parlor, with a long mahogany bar, a back room with a fireplace, and some of the best classic cocktails in Brooklyn.","type":"cocktail","x":126.69,"y":176.25},{"name":"Henry Public","address":"329 Henry St","why":"A vintage-styled tavern with excellent cocktails, Prohibition-era jazz nights and a famous turkey leg sandwich.","type":"music","x":116.6,"y":158.95}]}},{"name":"Carroll Gardens","tagline":"Deep front gardens, old Italian social clubs, Smith Street buzz","getting_there":"From 2 Av (F) at Houston St, ride the F to Carroll St (about 25 min). For the Columbia St Waterfront, walk west over the BQE footbridge at President or Union St.","stops":{"known_for":[{"name":"Carroll Gardens Historic District (the 'Places')","address":"First through Fourth Places between Henry St and Smith St, Brooklyn, NY 11231","why":"An 1846 survey required deep setbacks here, which created the oversized front gardens that gave the area its name. Many still hold Virgin Mary shrines from the old Italian community. Walk these blocks, then go to St. Mary Star of the Sea (471 Court St), where Al Capone was married.","tip":"Walk First through Fourth Places to see the deep front gardens, then stop by the old-school Italian bakeries and pork stores on Court St.","x":115.99,"y":192.43},{"name":"St. Mary Star of the Sea","address":"467 Court St","why":"The grand parish church where Al Capone married Mae Coughlin on December 30, 1918.","tip":"The church is usually open weekday mornings until about noon; step in quietly to see the interior.","x":112.11,"y":198.26},{"name":"Mazzola Bakery","address":"192 Union St","why":"An old-school Italian bakery famous for lard bread studded with cured meat, a relic of the neighborhood's dockworker days.","tip":"It's cash only (ATM out front); get a whole lard bread to split, since there's no seating inside.","x":109.16,"y":179.4}],"coffee":[{"name":"High Beam Coffee","address":"398 Court St","why":"Newer café on Court St with a backyard garden, open from 7am on weekdays.","x":115.92,"y":187.8},{"name":"Hungry Ghost (Carroll Gardens)","address":"343 Smith St","why":"A dependable Brooklyn-grown espresso bar right at the Carroll St subway stop.","x":120.07,"y":189.13},{"name":"D'Amico Coffee Roasters","address":"309 Court St","why":"A family Italian roaster on Court St since 1948; the smell of roasting beans hits you half a block away.","x":119.13,"y":179.05}],"park":[{"name":"Carroll Park","address":"Court St to Smith St, between Carroll St and President St, Brooklyn, NY 11231","why":"Brooklyn's third-oldest park (bought by the city in 1853) and the neighborhood's living room. Grab a bench and watch the locals and the old-timers who still gather there.","x":118.84,"y":186.51},{"name":"The Backyard","address":"61-73 Hamilton Ave","why":"A community-run garden and events space on the Columbia St side, open weekend mornings, with sidewalk plantings and pop-up programming.","x":95.48,"y":180.46},{"name":"Saint Mary's Park","address":"440 Smith St","why":"A rebuilt park under the elevated F/G tracks; watch the small skate park from the benches, with the Gowanus Canal redevelopment on view.","x":114.97,"y":201.49}],"bite":[{"name":"F&F Pizzeria","address":"459 Court St, Brooklyn, NY 11231","why":"The Frankies team's slice counter puts a sourdough-crusted spin on the neighborhood's red-sauce Italian roots, and it is the casual way to eat on Court Street when Lucali's dinner line is out of reach.","order":"A clam slice, plus a plain or pepperoni slice","x":112.41,"y":197.44},{"name":"Court Street Grocers","address":"485 Court St","why":"A sandwich shop and deli where the sandwiches are serious and the breakfast sandwiches have a cult following.","order":"The breakfast sandwich, or the Turkey Delight for lunch","x":111.24,"y":200.65},{"name":"Lucali","address":"575 Henry St","why":"A candlelit, cash-only, BYOB pizzeria that's often called the best pizza in New York.","order":"A plain pie with pepperoni and the calzone; put your name on the list in person around 4pm (closed Tuesdays)","x":107.53,"y":183.88}],"bite_gf":[{"name":"Planted Cafe","address":"333 Smith St, Brooklyn, NY 11231","why":"Atly lists it as 100% dedicated gluten-free, and the menu is also vegetarian-forward and organic. One past reviewer questioned staff's cross-contact answers, so confirm when you order.","order":"Goat cheese, egg and avocado focaccia (on house-made GF focaccia)","gf_level":"dedicated","x":120.6,"y":188.12},{"name":"White Maize","address":"277 Smith St","why":"A Venezuelan counter spot whose arepas and bowls are built on corn and rice rather than wheat.","order":"A pabellon arepa or pulled chicken bowl with maduros; ask about the fryer before ordering fried items","gf_level":"GF options w/ precautions","x":123.57,"y":182.33}],"bar":[{"name":"Queue Beer","address":"500 Smith St","why":"A 24-tap beer bar under the Smith-9th St viaduct, where the owner pours an unusually careful Guinness through a Czech side-pull faucet.","tag":"Guinness on tap · Lukr side-pull pour","type":"dive","x":112.88,"y":207.23},{"name":"Brooklyn Social","address":"335 Smith St","why":"It occupies a former private Sicilian men's club, with the members' photos from the 1920s still on the walls. Order a classic cocktail and play the pool table or the jukebox.","type":"cocktail","x":120.6,"y":188.12},{"name":"Jalopy Tavern","address":"317 Columbia St","why":"A twinkly little pub next to the Jalopy Theatre, with live folk and roots music and long-time locals (closed Mondays).","type":"music","x":98.62,"y":185.28}]}},{"name":"Red Hook","tagline":"Cobblestones, converted warehouses, and Lady Liberty staring right back","getting_there":"From 2 Av (F), ride the F to Smith-9 Sts, then take the B61 bus west to Van Brunt St, or walk about 20 min. You can also walk to the Wall St/Pier 11 ferry and take the NYC Ferry South Brooklyn route to Red Hook/Atlantic Basin.","stops":{"known_for":[{"name":"Pioneer Works","address":"159 Pioneer St, Brooklyn, NY 11231","why":"This artist-run cultural center fills a cavernous 1860s ironworks, the kind of industrial waterfront building Red Hook is made of. The fall 2026 lineup includes three exhibitions running into November and December.","tip":"Galleries and garden are open Wed-Sun 12-6pm. If you can, time your visit for a Second Sunday open-studios day, such as Nov 8, 2026.","x":82.17,"y":191.61},{"name":"Waterfront Museum (Lehigh Valley Barge No. 79)","address":"290 Conover St","why":"A free floating museum aboard a 1914 wooden railroad barge, with the captain who lives aboard as your guide and Statue of Liberty views off the stern.","tip":"It's open only Thursday 4 to 8pm and Saturday 1 to 5pm; check the website before going.","x":68.7,"y":204.13},{"name":"Widow Jane Distillery","address":"218 Conover St","why":"A Red Hook bourbon distillery in an old waterfront warehouse, known for whiskey cut with limestone mine water from upstate Rosendale.","tip":"Book a tour online (Wednesday to Sunday), then get a flight at Botanica, the bar next door, open Thursday to Sunday.","x":74.0,"y":198.15}],"coffee":[{"name":"The Black Flamingo","address":"281 Van Brunt St, Brooklyn, NY 11231","why":"A European-feeling cafe with a plant-filled hidden back patio, still a local favorite in 2026.","x":84.19,"y":192.28},{"name":"Baked","address":"359 Van Brunt St","why":"The beloved Van Brunt St bakery-cafe with standout cinnamon rolls and coffee cake.","x":78.34,"y":198.85},{"name":"Abbotsford Road Coffee Specialists","address":"499 Van Brunt St, Unit 3A","why":"A roaster's flagship cafe near the end of Van Brunt with knowledgeable baristas and excellent lattes (closed Mondays).","x":71.47,"y":206.57}],"park":[{"name":"Louis Valentino Jr. Park and Pier","address":"Coffey St and Ferris St, Brooklyn, NY 11231","why":"Walk to the end of the pier at sunset for the closest head-on view of the Statue of Liberty from land in NYC.","x":70.43,"y":195.3},{"name":"Erie Basin Park","address":"1 Beard St (behind IKEA)","why":"A quiet waterfront esplanade that keeps old harbor cranes and ship moorings, with Statue of Liberty sunsets.","x":83.73,"y":212.83},{"name":"Coffey Park","address":"85 Richards St","why":"The renovated heart of Red Hook, with tree-lined paths and a view of Visitation Church; a good place to sit down between Van Brunt stops.","x":89.65,"y":192.99}],"bite":[{"name":"Steve's Authentic Key Lime Pie","address":"185 Van Dyke St, Brooklyn, NY 11231","why":"A waterfront pie shop in an old warehouse by Valentino Pier, and the sweet the neighborhood is known for.","order":"A chocolate-dipped frozen 'Swingle' key lime pie on a stick","x":70.37,"y":198.1},{"name":"Defonte's Sandwich Shop","address":"379 Columbia St","why":"A Red Hook institution since 1922, serving enormous Italian heroes to dockworkers and everyone since.","order":"The Red Hook Special or roast beef with fried eggplant (cash only, closed Sundays)","x":95.96,"y":192.59},{"name":"Red Hook Tavern","address":"329 Van Brunt St","why":"A tavern whose dry-aged burger is ranked among the city's best and some say rivals Peter Luger's.","order":"The burger and the croquettes; reserve ahead or try a weekend lunch","x":80.8,"y":196.08}],"bite_gf":[{"name":"Hometown Bar-B-Que","address":"454 Van Brunt St, Brooklyn, NY 11231","why":"Red Hook has no dedicated GF spot. Smoked brisket is usually just meat and a salt-and-pepper rub, but Hometown publishes no allergen info, so call ahead (347-294-4644) and ask about the rub and cutting-board cross-contact.","order":"Half pound of brisket with pickles; skip the sauces, cornbread, mac and cheese and sandwiches","gf_level":"GF options w/ precautions","x":72.73,"y":205.15},{"name":"GOOG Thai Cook Shop","address":"380 Van Brunt St","why":"A serious regional Thai kitchen where papaya salad, curries and rice dishes can work without wheat.","order":"Som tum, Isaan sausage (ask about fillers) or a curry with rice, made without soy sauce","gf_level":"GF options w/ precautions","x":78.52,"y":198.65}],"bar":[{"name":"Brooklyn Ice House","address":"318 Van Brunt St","why":"A no-fuss dive with a backyard, cheap burgers and tots, open until 4am every night.","type":"dive","x":83.74,"y":192.78},{"name":"Pony's","address":"424 Van Brunt St","why":"A newer, beautifully designed bar with a great house martini, a curated wine list and a good soundtrack (closed Monday and Tuesday).","type":"cocktail","x":75.17,"y":202.42},{"name":"Sunny's Bar","address":"253 Conover St","why":"A longshoremen's saloon run by the same family for generations. It's cash only, with a legendary Saturday-night bluegrass jam.","tag":"Oldest bar · since 1890","type":"music","x":70.24,"y":202.39}]}},{"name":"Gowanus","tagline":"Superfund canal turned breweries, shuffleboard and maker studios","getting_there":"Walk to 8 St-NYU (R/W) and ride the R to Union St (about 25 min). Or take the F from 2 Av to Carroll St and walk east over the canal.","stops":{"known_for":[{"name":"Carroll Street Bridge","address":"Carroll St over the Gowanus Canal (between Nevins St and Bond St), Brooklyn, NY 11215","why":"Built in 1889 and a city landmark, it is one of only four retractable bridges left in the US: the whole span rolls sideways on rails. It reopened in June 2026 to walkers and bikes after the canal cleanup.","tip":"Cross on foot and look down the canal both ways. Then walk the new waterfront stretches and read the cleanup signage.","x":132.9,"y":195.11},{"name":"Powerhouse Arts","address":"322 3rd Ave, Brooklyn, NY 11215","why":"The canal's hulking 1904 power station (the old graffiti-covered 'Batcave') has been reborn as a public arts fabrication center.","tip":"The lobby is open daily (weekends 10-6); grab a drink at the Turbine Cafe & Bar and check the exhibitions calendar before you go.","x":137.85,"y":200.77},{"name":"Coignet Stone Company Building","address":"360 3rd Ave (at 3rd St), Brooklyn, NY 11215","why":"An 1873 landmark and one of NYC's earliest concrete buildings, now stranded like a relic beside the Whole Foods parking lot.","tip":"It's an exterior-only look; pair it with the canal-side walk behind Whole Foods next door.","x":135.59,"y":204.37}],"coffee":[{"name":"Ninth Street Espresso (inside Threes Brewing)","address":"333 Douglass St, Brooklyn, NY 11217","why":"The East Village's own Ninth Street pulls shots in Threes' front room daily 8am-3pm, a good warm-up before the brewery opens.","x":148.42,"y":191.12},{"name":"Root Hill Cafe","address":"262 4th Ave, Brooklyn, NY 11215","why":"Roomy, plant-filled neighborhood cafe with strong coffee, free Wi-Fi and a full brunch menu.","x":144.69,"y":201.1},{"name":"Principles GI Coffee House","address":"139 9th St, Brooklyn, NY 11215","why":"Big, community-minded cafe pouring several rotating roasters, with pay-what-you-wish small coffees and tips built into prices.","x":124.61,"y":212.45}],"park":[{"name":"Gowanus Canal Conservancy Salt Lot","address":"Canal-side at 2nd Ave & 5th St (GCC's current base: 25 9th St, by the Smith-9 Sts station), Brooklyn, NY 11215","why":"The Conservancy's canal-side nursery and rain-garden site. Join a volunteer day or public tour to plant and learn how the canal is being brought back.","x":128.84,"y":206.7},{"name":"Carroll Street Eco Basin ('The Basin')","address":"420 Carroll St (at Nevins St), Brooklyn, NY 11215","why":"New canal-side park with a boardwalk, salt-marsh plantings and stepped seating right down at the water, just off the Carroll Street Bridge.","x":134.56,"y":195.93},{"name":"Whole Foods canal esplanade","address":"214 3rd St (at 3rd Ave), Brooklyn, NY 11215","why":"A public waterfront walkway with benches along the canal behind Whole Foods, good for watching the water and the bridges.","x":134.1,"y":203.42}],"bite":[{"name":"Baba's Pierogies","address":"295 3rd Ave, Brooklyn, NY 11215","why":"A cozy, family-run dumpling shop near the canal that sums up Gowanus: unpretentious and quirky, with a grandmother's recipe behind it.","order":"A mixed plate of pierogies, pan-fried (get the mac and cheese, plus the jalapeno or spinach and feta), or the Sloppy Kielbasy sandwich","x":139.19,"y":198.75},{"name":"Four & Twenty Blackbirds","address":"439 3rd Ave, Brooklyn, NY 11215","why":"The Brooklyn pie shop that put Gowanus on the dessert map, with seasonal slices and good coffee.","order":"A slice of salted caramel apple or the salty honey pie","x":129.92,"y":213.32},{"name":"Insa","address":"328 Douglass St, Brooklyn, NY 11217","why":"Lively Korean BBQ spot with tabletop grills and private karaoke rooms, a Gowanus favorite for groups.","order":"The BBQ set with pork belly and galbi, plus kimchi pancake","x":148.16,"y":190.99}],"bite_gf":[{"name":"Sixteen Mill Bakery","address":"552 Union St, Brooklyn, NY 11215","why":"Everything here is gluten-free (and plant-based, with no refined sugar), and Atly reviewers call it all celiac-safe. Open Wed-Sun.","order":"Sourdough rosemary focaccia, plus a chocolate babka muffin","gf_level":"dedicated","x":140.74,"y":194.32},{"name":"T-Swirl Crepe (Park Slope)","address":"77 5th Ave, Brooklyn, NY 11217","why":"Japanese-style crepes made with a rice-flour batter, a short walk up 5th Ave from the canal.","order":"Strawberry banana Nutella crepe, or a savory one like the tuna or chicken","gf_level":"GF options w/ precautions","x":158.56,"y":188.8}],"bar":[{"name":"Canal Bar","address":"270 3rd Ave","why":"Cheap, scruffy, friendly dive with a backyard, one of the original pre-boom Gowanus bars.","tag":"Dive · since 2005","type":"dive","x":140.52,"y":196.35},{"name":"Upstairs at Public Records","address":"233 Butler St","why":"An intimate listening lounge and cocktail bar in the old ASPCA building, pairing a hi-fi vinyl system with sharp drinks like a fermented-lime daiquiri and low-ABV shochu drinks.","type":"cocktail","x":139.06,"y":183.93},{"name":"Threes Brewing","address":"333 Douglass St","why":"Gowanus's flagship brewery taproom, with excellent house beers and a big backyard. It also books live shows; Stephan Crump's Passerine plays Sun Oct 25, 2026.","type":"music","x":148.42,"y":191.12}]}},{"name":"Park Slope","tagline":"Brownstone blocks, stroller traffic and Fifth Avenue's bars","getting_there":"Walk to 8 St-NYU (R/W) and ride the R to Union St, 9 St or Prospect Av (about 25-30 min). Or take the F from 2 Av to 7 Av for the upper Slope.","stops":{"known_for":[{"name":"Park Slope Historic District & the Montauk Club","address":"25 8th Ave","why":"Block after block of 1880s-1900s brownstones and limestone rowhouses, one of the largest landmarked districts in the city. The Montauk Club at Lincoln Pl is a Venetian Gothic palazzo modeled on the Ca' d'Oro, with terra-cotta friezes of Montauk tribal history.","tip":"The club is private, so admire it from the sidewalk, then walk Carroll St and Montgomery Pl between 8th Ave and Prospect Park West.","x":171.45,"y":205.32},{"name":"Montgomery Place","address":"Montgomery Pl between 8th Ave and Prospect Park West, Brooklyn, NY 11215","why":"Maybe the prettiest block in Brooklyn: a one-block run of 1880s-90s Romanesque and Queen Anne rowhouses, many by C.P.H. Gilbert.","tip":"Walk it from 8th Ave toward the park and finish at the Grand Army Plaza end of Prospect Park West.","x":169.41,"y":215.88},{"name":"Community Bookstore","address":"143 7th Ave, Brooklyn, NY 11215","why":"Park Slope's beloved independent bookstore, open since 1971, with a backyard reading spot and a resident cat.","tip":"Ask staff for their shelf picks and look for the cat, Tiny.","x":161.09,"y":211.27}],"coffee":[{"name":"Poetica Coffee (7th Ave)","address":"240 7th Ave, Brooklyn, NY 11215","why":"Part of a small Uzbek-rooted local chain known for warm hospitality, a banned-books shelf in every shop, and poetry nights.","x":155.37,"y":220.33},{"name":"Colson Patisserie","address":"374 9th St, Brooklyn, NY 11215","why":"Long-running French patisserie and coffee bar near the 9th St corridor, good for a cortado and a croissant.","x":144.74,"y":225.32},{"name":"Postmark Cafe","address":"326 6th St, Brooklyn, NY 11215","why":"Cozy, long-loved independent coffee shop on a residential side street, with a back garden.","x":141.8,"y":215.87}],"park":[{"name":"Old Stone House & Washington Park","address":"336 3rd St","why":"A rebuilt 1699 Dutch farmhouse at the center of the 1776 Battle of Brooklyn, on the ground where the early Brooklyn Dodgers played; the house is open Fri-Sun 12-4pm and the park around it is open daily.","x":143.89,"y":209.65},{"name":"Litchfield Villa & Picnic House lawn","address":"Prospect Park West at 5th St entrance, Brooklyn, NY 11215","why":"Park Slope's front yard: an 1850s Italianate villa (Prospect Park HQ) above sloping lawns where the neighborhood picnics.","x":167.41,"y":228.6},{"name":"Dog Beach","address":"Enter at Prospect Park West & 9th St, Brooklyn, NY 11215","why":"A concrete-edged dog pond where Slope dogs swim and fetch; go before 9am for peak off-leash chaos.","x":160.74,"y":235.51}],"bite":[{"name":"Luigi's Pizza","address":"686 5th Ave, Brooklyn, NY 11215","why":"A family-run South Slope slice shop open since 1973 and regularly named among NYC's best classic slices. Closed Sundays.","order":"A plain slice and a grandma or fresh-mozzarella slice","x":123.7,"y":244.78},{"name":"Bonnie's Grill","address":"278 5th Ave, Brooklyn, NY 11215","why":"Long-standing diner-counter burger joint on 5th Ave, a no-fuss neighborhood classic.","order":"Cheeseburger and fries with a side of buffalo wings","x":148.92,"y":206.9},{"name":"Al Di La Trattoria","address":"248 5th Ave, Brooklyn, NY 11215","why":"Park Slope's beloved Venetian trattoria, serving handmade pasta since 1998.","order":"Casunziei (beet ravioli) and the braised rabbit","x":150.64,"y":204.17}],"bite_gf":[{"name":"WILD Park Slope","address":"148 5th Ave, Brooklyn, NY 11217","why":"WILD bills itself as 100% gluten-free and celiac-safe, using organic GF flours for its pizza, pasta and desserts, and celiac reviewers through Oct 2026 rave about it. Dinner opens at 2pm on weekdays and brunch runs 11am-4pm on weekends.","order":"Margherita pizza, then the penne alla vodka or a GF cannoli","gf_level":"fully GF menu","x":155.49,"y":194.76},{"name":"Burger Village","address":"222 7th Ave, Brooklyn, NY 11215","why":"Burger spot that celiac diners rate for its GF buns, careful prep and a dedicated fryer for fries.","order":"Village smash burger on a GF bun with waffle fries","gf_level":"GF options w/ precautions","x":156.37,"y":218.74},{"name":"Miriam","address":"79 5th Ave, Brooklyn, NY 11217","why":"Israeli-Mediterranean brunch favorite that reviewers say handles celiac requests with care and serves GF pita.","order":"Shakshuka with GF pita","gf_level":"GF options w/ precautions","x":158.48,"y":188.95}],"bar":[{"name":"Freddy's Bar","address":"627 5th Ave","why":"A beloved South Slope dive (it relocated from its original Prospect Heights home) with a quirky art-filled back room, live music and late hours, open daily until 4am.","tag":"Dive · Prohibition-era roots","type":"dive","x":128.13,"y":239.15},{"name":"Blueprint","address":"196 5th Ave","why":"A long-running 5th Ave cocktail lounge that makes its drinks from scratch with fresh juice and house syrups, with a strong mezcal list. Open until midnight, 1am on weekends.","type":"cocktail","x":153.2,"y":199.22},{"name":"Union Hall","address":"702 Union St","why":"Library-style bar with two indoor bocce courts, fireplaces and a basement venue for comedy and music.","type":"music","x":153.2,"y":200.71}]}},{"name":"Prospect Heights","tagline":"Brownstones, Vanderbilt Ave restaurant row, and Brooklyn's big cultural campus","getting_there":"L from 1 Av to Union Sq, then the 2/3 to Grand Army Plaza or Eastern Pkwy-Brooklyn Museum (about 30 min)","stops":{"known_for":[{"name":"Brooklyn Museum","address":"200 Eastern Pkwy, Brooklyn, NY 11238","why":"This Beaux-Arts giant is one of the largest art museums in the country, and together with the Central Library and Grand Army Plaza it makes the neighborhood Brooklyn's cultural hub. Highlights are Judy Chicago's The Dinner Party and the Egyptian collection.","tip":"Go on the first Saturday of the month, when Target First Saturdays offers free evening programming. The 2/3 stops right at the front steps.","x":192.79,"y":214.61},{"name":"Brooklyn Public Library, Central Library","address":"10 Grand Army Plaza, Brooklyn, NY 11238","why":"A 1941 Art Deco landmark shaped like an open book, with a gilded 50-foot entrance screen of literary figures.","tip":"Look up at the bronze doors and gilded reliefs, then step in for the lobby and reading rooms.","x":176.93,"y":211.61},{"name":"Prospect Heights Historic District","address":"St. Marks Ave & Sterling Pl between Flatbush and Vanderbilt Aves, Brooklyn, NY 11238","why":"One of NYC's largest historic districts, packed with intact 1870s-1910s brownstones and limestones.","tip":"Loop St. Marks Ave, Prospect Pl and Park Pl between Carlton and Vanderbilt for the best stretches.","x":176.18,"y":197.19}],"coffee":[{"name":"Canyon Coffee","address":"601 Vanderbilt Ave, Brooklyn, NY 11238","why":"This LA roaster's first NYC cafe opened in March 2026 with draft oat lattes and a sunny spot for people-watching on Vanderbilt.","x":180.18,"y":191.46},{"name":"Ciao, Gloria","address":"550 Vanderbilt Ave, Brooklyn, NY 11238","why":"Sunny Italian-style cafe and bakery on Vanderbilt with strong espresso and excellent pastries.","x":180.79,"y":189.17},{"name":"Cafe Mado","address":"791 Washington Ave, Brooklyn, NY 11238","why":"All-day cafe by the Botanic Garden with good coffee, great breakfast sandwiches and a plant-filled back patio.","x":192.39,"y":210.96}],"park":[{"name":"Brooklyn Botanic Garden","address":"990 Washington Ave, Brooklyn, NY 11225","why":"Its 52 acres sit next to the museum. In late October, walk the Cherry Esplanade and Japanese Hill-and-Pond Garden for fall color, then see the bonsai in the Steinhardt Conservatory.","x":193.96,"y":221.87},{"name":"Mount Prospect Park","address":"Eastern Pkwy between the Central Library and Brooklyn Museum (enter at Eastern Pkwy & Underhill Ave), Brooklyn, NY 11238","why":"A quiet hilltop park on the old reservoir site, one of the highest points in Brooklyn, with a grassy lawn and views down Eastern Parkway.","x":182.0,"y":210.41},{"name":"Grand Army Plaza & Saturday Greenmarket","address":"Grand Army Plaza (Flatbush Ave & Prospect Park West), Brooklyn, NY 11238","why":"Browse Brooklyn's biggest greenmarket (Saturdays, year-round) under the Soldiers' and Sailors' Arch and Bailey Fountain.","x":175.05,"y":210.58}],"bite":[{"name":"Tom's Restaurant","address":"782 Washington Ave, Brooklyn, NY 11238","why":"A diner run by the same family since 1936, a few steps from the Brooklyn Museum and the Botanic Garden, and the neighborhood's oldest institution. Open breakfast and lunch only, closing at 3 PM on weekdays.","order":"Lemon-ricotta or blueberry pancakes and a cherry lime rickey","x":191.65,"y":205.88},{"name":"Ample Hills Creamery","address":"623 Vanderbilt Ave, Brooklyn, NY 11238","why":"The original shop of the Brooklyn ice cream brand, with wildly inventive flavors.","order":"Ooey Gooey Butter Cake or Salted Crack Caramel","x":179.47,"y":194.07},{"name":"Lowerline","address":"794 Washington Ave, Brooklyn, NY 11238","why":"Tiny New Orleans spot near the Botanic Garden doing po'boys, gumbo and étouffée right.","order":"A cup of gumbo and a fried shrimp po'boy (or the crawfish étouffée)","x":191.8,"y":206.97}],"bite_gf":[{"name":"Brooklyn High Low","address":"611 Vanderbilt Ave, Brooklyn, NY 11238","why":"This British-style tea room builds a separate gluten-free tier, and a celiac reviewer in May 2026 said staff handled it knowledgeably. Request GF at least 48 hours ahead on the reservation. Service is Friday to Sunday with timed sittings.","order":"Afternoon tea with the gluten-free tea tier (sandwiches, scones and sweets)","gf_level":"GF options w/ precautions","x":179.89,"y":192.51},{"name":"Ogliastro Pizza Bar","address":"784 Washington Ave, Brooklyn, NY 11238","why":"Candlelit pizza spot with a secret patio that offers GF crust.","order":"GF margherita; ask about the oven and prep","gf_level":"GF options w/ precautions","x":191.67,"y":206.06}],"bar":[{"name":"Finn's Corner","address":"660 Washington Ave","why":"Classic neighborhood dive with a strong happy hour, darts, sports on TV and a pool table in the backyard.","tag":"Dive · pool in the backyard","type":"dive","x":189.93,"y":194.15},{"name":"Wallace","address":"663 Vanderbilt Ave","why":"Intimate Vanderbilt wine bar with a thoughtful natural-leaning list and good snacks.","type":"other","x":178.27,"y":198.42},{"name":"Grimm Tavern","address":"659 Vanderbilt Ave","why":"Grimm Artisanal Ales opened this tavern in June 2026 in the old Olmsted space, keeping the plant wall and backyard and adding 20 taps of its own beer.","type":"other","x":178.39,"y":197.99}]}},{"name":"Prospect Park","tagline":"Olmsted and Vaux's masterpiece, which many think beats Central Park","getting_there":"L from 1 Av to Union Sq, then the Q to 7 Av (Park Slope side) or Prospect Park station (Parkside/Ocean Ave side); or the 2/3 to Grand Army Plaza","stops":{"known_for":[{"name":"Long Meadow","address":"Enter at Grand Army Plaza (Flatbush Ave & Prospect Park West)","why":"At nearly a mile, this is the longest unbroken meadow in any US urban park. Olmsted and Vaux designed it to feel like open countryside, and it's the heart of the park and of Brooklyn weekends.","tip":"Go in through the Meadowport Arch near Grand Army Plaza, a vaulted 1870 passage that frames the meadow when it opens up in front of you.","x":171.22,"y":232.58},{"name":"Prospect Park Zoo","address":"450 Flatbush Ave, Brooklyn, NY 11225","why":"A compact, walkable zoo inside the park with sea lions, red pandas and a prairie dog town.","tip":"Catch the sea lion training at 11:30am or 3:30pm; October weekends have 'Spooktober' Halloween events, and from Nov 1 it closes at 4:30pm.","x":190.85,"y":235.15},{"name":"The Ravine & Binnen Falls","address":"Enter from Long Meadow near the Nethermead Arches (mid-park, west of the Boathouse)","why":"Brooklyn's only forest: an Olmsted-and-Vaux designed gorge with streams, waterfalls and stone arches.","tip":"Follow the stream path from the Nethermead toward the Boathouse; it is prettiest in fall color.","x":178.43,"y":237.34}],"coffee":[{"name":"Radio Bakery (Prospect Heights)","address":"186 Underhill Ave, Brooklyn, NY 11238","why":"Locals grab coffee and a pastry here before the park, a few blocks from Grand Army Plaza. Expect a line; it's worth it.","x":183.55,"y":204.63},{"name":"Elk Cafe","address":"154 Prospect Park SW, Brooklyn, NY 11218","why":"Neighborhood cafe right by the Bartel-Pritchard Circle gate, good for coffee and pastries before a loop.","x":168.59,"y":264.14},{"name":"Winner (bakery)","address":"367 7th Ave, Brooklyn, NY 11215","why":"Standout bakery-cafe three blocks from the park, with Cafe Integrale espresso and some of Brooklyn's best bread and pastries.","x":147.81,"y":232.28}],"park":[{"name":"Boathouse, Audubon Center and the Lullwater","address":"Near the Lincoln Rd / Ocean Ave entrance (Q/B to Prospect Park)","why":"Walk the Lullwater path to the 1905 white terracotta Boathouse, which houses the Audubon Center and runs free fall nature walks. Then follow the Ravine trail into Brooklyn's only forest.","x":186.82,"y":246.77},{"name":"Lookout Hill & the Maryland Monument","address":"South end of the park, near the Peninsula (enter at Prospect Park SW & 16th St or via Wellhouse Dr)","why":"Climb to one of the park's high points, then descend to the 1895 monument honoring the Maryland 400 of the Battle of Brooklyn.","x":175.05,"y":255.18},{"name":"Vale of Cashmere","address":"Northeast corner near Flatbush Ave (enter at Grand Army Plaza and bear left)","why":"A secluded sunken garden and pools that birders love, a quiet escape a few minutes from the plaza.","x":182.04,"y":221.58}],"bite":[{"name":"Terrace Bagels","address":"222 Prospect Park W, Brooklyn, NY 11215","why":"A beloved neighborhood bagel shop right across Prospect Park West from the park's southwest edge, made for picking up a picnic. Open 7 AM to 4 PM.","order":"The 'Split Decision' (lox on one half, whitefish salad on the other) to carry into the park","x":151.98,"y":249.3},{"name":"Peppa's Jerk Chicken","address":"738 Flatbush Ave, Brooklyn, NY 11226","why":"Smoky, drum-grilled jerk chicken just off the park's Parkside Ave corner, a Flatbush institution.","order":"Jerk chicken with rice and peas and plantains","x":199.4,"y":264.56},{"name":"Morgan's Brooklyn Barbecue","address":"267 Flatbush Ave, Brooklyn, NY 11217","why":"Texas-style barbecue a short walk from Grand Army Plaza, good for a post-park feast.","order":"Brisket by the half-pound with mac and cheese","x":166.37,"y":190.35}],"bite_gf":[{"name":"Lively Brooklyn","address":"396 7th Ave","why":"A fully gluten-free café a short walk from the park's west side, so you can pick up lunch and eat on the Long Meadow.","order":"A smoothie bowl or grain bowl to carry into the park","gf_level":"dedicated","x":146.35,"y":234.58},{"name":"Pasta Louise","address":"1114 8th Ave, Brooklyn, NY 11215","why":"Casual, family-friendly pasta spot a block from the park's southwest edge with GF pasta on offer.","order":"Any pasta swapped to GF; ask for a fresh pot and clean prep","gf_level":"GF options w/ precautions","x":152.97,"y":235.93}],"bar":[{"name":"Sharlene's","address":"353 Flatbush Ave","why":"Gruff, beloved dive a few blocks from Grand Army Plaza, with pinball, frozen drinks and a bring-your-own-food policy.","tag":"Dive · old-man bar lineage","type":"dive","x":170.96,"y":198.71},{"name":"Weather Up","address":"589 Vanderbilt Ave","why":"Quiet, tiled cocktail bar a few blocks from Grand Army Plaza, good for a drink after the park (closed Mondays).","type":"cocktail","x":180.64,"y":189.75},{"name":"Barbès","address":"376 9th St","why":"Tiny French-owned bar and world-music room two blocks from the 9th St entrance, with live sets most nights.","type":"music","x":144.89,"y":225.42}]}},{"name":"Crown Heights","tagline":"Caribbean heartbeat, Eastern Parkway grandeur, and Franklin Ave nightlife","getting_there":"L from 1 Av to Union Sq, then the 4/5 express to Franklin Av (or the 4 to Crown Hts-Utica Av for Weeksville); about 30-35 min","stops":{"known_for":[{"name":"Weeksville Heritage Center (Hunterfly Road Houses)","address":"158 Buffalo Ave, Brooklyn, NY 11213","why":"Weeksville was one of the country's largest free Black communities before the Civil War, and these restored 1800s houses are what's left of it. Today the neighborhood's identity is West Indian, shown in the Labor Day parade on Eastern Parkway and the jerk and curry shops along Nostrand and Utica.","tip":"Open Tue-Sat. Book the house tour ahead. If you're there on a Saturday, the Weeksville Green farmers market runs 12-5.","x":277.45,"y":208.06},{"name":"770 Eastern Parkway (Chabad-Lubavitch World Headquarters)","address":"770 Eastern Pkwy, Brooklyn, NY 11213","why":"The Gothic Revival brownstone is the world center of the Chabad movement and the heart of Crown Heights' Hasidic community; it has been copied brick for brick around the globe.","tip":"It's an active synagogue: dress modestly, skip Friday night and Saturday, and walk Kingston Ave afterward for kosher bakeries.","x":237.49,"y":221.16},{"name":"Eastern Parkway","address":"Eastern Pkwy between Washington Ave and Ralph Ave, Brooklyn, NY","why":"Olmsted and Vaux's tree-lined boulevard (the world's first 'parkway') runs through the neighborhood and is the route of the Labor Day West Indian American Day Carnival.","tip":"Walk the shaded side malls east from Franklin Ave; on Labor Day weekend, come early for J'ouvert and the parade.","x":192.92,"y":214.65}],"coffee":[{"name":"Cafe Cotton Bean","address":"1077 Bergen St, Brooklyn, NY 11216","why":"This Japanese-style coffee shop makes its own almond and oat milk, and the Infatuation reviewed it in October 2026. There's no restroom, so plan a short stop.","x":220.45,"y":201.28},{"name":"Villager","address":"841 Classon Ave, Brooklyn, NY 11238","why":"An airy, plant-filled specialty bar pouring carefully sourced single origins, with bags of beans to take home.","x":196.26,"y":213.36},{"name":"Little Zelda","address":"728 Franklin Ave, Brooklyn, NY 11238","why":"A tiny, much-loved Franklin Ave espresso nook with no formal menu (they make whatever you ask for) and a busy sidewalk scene.","x":205.7,"y":208.73}],"park":[{"name":"Brower Park","address":"Park Pl & Brooklyn Ave, Brooklyn, NY 11213","why":"A shady neighborhood park off Eastern Parkway. Combine it with the Brooklyn Children's Museum on its edge, or just bring a coffee and watch the local pickup games.","x":233.38,"y":210.2},{"name":"Lincoln Terrace / Arthur S. Somers Park","address":"Eastern Pkwy & Buffalo Ave, Brooklyn, NY 11213","why":"Eastern Crown Heights' big hilltop park has 11 tennis courts, a track and lawns, and it hosts the International African Arts Festival each summer (a short walk from Weeksville).","x":276.26,"y":223.94},{"name":"St. John's Park","address":"Troy Ave & Prospect Pl, Brooklyn, NY 11213","why":"A large neighborhood park with ballfields, a track, an outdoor gym and picnic areas, next to the St. John's Recreation Center.","x":252.24,"y":208.9}],"bite":[{"name":"Trinidad Golden Place","address":"788 Nostrand Ave, Brooklyn, NY 11216","why":"A busy Trini bakery and roti shop on the Nostrand Avenue Caribbean strip, the street-food heart of West Indian Crown Heights. Cash only, closed Sundays.","order":"Doubles, plus a currant roll or cassava pone for later","x":220.53,"y":214.41},{"name":"Gloria's","address":"987 Nostrand Ave, Brooklyn, NY 11225","why":"A cash-only Trinidadian institution (and an Anthony Bourdain favorite) for roti and doubles.","order":"Shrimp and pumpkin roti with tamarind sauce, plus doubles","x":219.02,"y":236.06},{"name":"Chavela's","address":"736 Franklin Ave, Brooklyn, NY 11238","why":"Franklin Ave's go-to Mexican spot for years, with a big, festive, kitsch-filled room and strong margaritas.","order":"Camarones al ajillo, then fajitas mixtas and a margarita","x":205.44,"y":209.68}],"bite_gf":[{"name":"Arden","address":"788 Franklin Ave, Brooklyn, NY 11238","why":"This seasonal wood-fire New American spot marks GF dishes on every menu, and celiac diners on Atly have flagged it as celiac-friendly. Confirm the grill and fryer before ordering.","order":"Brick-roasted chicken (dinner) or prime hanger steak & eggs (weekend brunch), then the flourless chocolate torte","gf_level":"GF options w/ precautions","x":204.0,"y":214.91},{"name":"Puerto Viejo","address":"564 Grand Ave, Brooklyn, NY 11238","why":"Traditional Dominican cooking where much of the menu (roast meats, rice, beans, plantains) is naturally gluten-free.","order":"Pernil with rice, beans and tostones; tell them it's celiac and skip anything fried in shared oil","gf_level":"GF options w/ precautions","x":194.31,"y":192.91},{"name":"Stocked Cafe + Burgers","address":"663 Washington Ave, Brooklyn, NY 11238","why":"Celiac diners praise its house-made GF buns and focaccia and its dedicated GF fryer; it sits right at Crown Heights' western edge.","order":"Burger or grilled Italian chicken sandwich on the GF bun, with tots from the GF fryer","gf_level":"GF options w/ precautions","x":190.39,"y":197.3}],"bar":[{"name":"The Canary","address":"789 Franklin Ave","why":"An Irish-owned pub with a properly poured Guinness, GAA and Premier League on the TVs, and spice bags and curry chips on the menu.","tag":"Irish pub · Guinness on tap","type":"dive","x":204.34,"y":213.71},{"name":"King Tai","address":"1095 Bergen St","why":"A tiny tiki-leaning Crown Heights bar with $15 'party drinks' like the Satellite of Love (oolong-infused overproof bourbon, passion fruit, falernum, hibiscus) and the curry-rum Sweet Talk. As of 2026 it also serves dinner.","type":"cocktail","x":222.03,"y":201.39},{"name":"Friends and Lovers","address":"641 Classon Ave","why":"A Classon Ave bar with a packed calendar. In October 2026 it had a Wednesday open jam, live performances, salsa nights and DJ dance parties in the back room.","type":"music","x":201.56,"y":193.99}]}},{"name":"Lefferts Gardens","tagline":"Landmarked brownstone blocks, Haitian kitchens, and rum punch on Rogers Ave","getting_there":"L from 1 Av to Union Sq, then the Q to Prospect Park (or the 2/5 to Sterling St / Winthrop St); about 35 min","stops":{"known_for":[{"name":"Lefferts Manor Historic District","address":"Maple, Midwood & Rutland Sts between Flatbush & Nostrand Aves, Brooklyn, NY 11225","why":"This landmarked district of intact 1890s-1910s rowhouses gave the neighborhood its name and its quiet, leafy character. Flatbush and Nostrand are lined with Haitian and West Indian restaurants and bakeries, which show who lives here now.","tip":"Walk Maple St and Midwood St from Flatbush to Nostrand. Fall foliage on the stoops is the best time to go.","x":208.86,"y":251.62},{"name":"Ebbets Field site (Ebbets Field Apartments)","address":"Bedford Ave & Sullivan Pl, Brooklyn, NY 11225","why":"Home of the Brooklyn Dodgers, where Jackie Robinson broke baseball's color line in 1947; the stadium was razed in 1960 and replaced by these apartment towers.","tip":"Look for the cornerstone tribute and Dodgers markers on the complex, then walk the block of McKeever Pl named for the team's co-owner.","x":204.82,"y":236.42},{"name":"Chester Court Historic District","address":"Chester Ct (off Flatbush Ave near Rutland Rd), Brooklyn, NY 11225","why":"A hidden cul-de-sac of 18 Tudor Revival rowhouses that feels like a slice of an English village off busy Flatbush Ave.","tip":"It's a residential dead end, so keep it quiet; pair it with a stroll down Maple and Midwood Streets in the Lefferts Manor district.","x":195.79,"y":248.35}],"coffee":[{"name":"Hamlet Coffee Company","address":"465 Rogers Ave, Brooklyn, NY 11225","why":"Two neighbors run this cafe, which rotates roasters and has a cozy back garden. It's the neighborhood's living room.","x":213.2,"y":246.29},{"name":"PLG Coffee House and Tavern","address":"499 Rogers Ave, Brooklyn, NY 11225","why":"The neighborhood's long-running coffee-by-day, beer-by-night living room on Rogers Ave.","x":213.46,"y":249.4},{"name":"Pacha Cafe","address":"594 Rogers Ave, Brooklyn, NY 11225","why":"A cozy, highly rated cafe with creative lattes and big breakfast plates, and space in back to sit for a while.","x":214.11,"y":257.47}],"park":[{"name":"Lefferts Historic House & Carousel area, Prospect Park","address":"Flatbush Ave & Empire Blvd entrance, Prospect Park","why":"Visit the 1783 Dutch farmhouse of the Lefferts family, whose land became the neighborhood. It now runs as a living-history museum with a garden, and the 1912 carousel is next door.","x":190.15,"y":236.38},{"name":"Maple Street Community Garden","address":"237 Maple St, Brooklyn, NY 11225","why":"A volunteer-run garden in the middle of Lefferts Manor where gardeners will show you the herb and vegetable beds; it's open Saturday mornings to early afternoon.","x":214.84,"y":247.16},{"name":"LeFrak Center at Lakeside","address":"171 East Dr, Prospect Park (enter at Ocean Ave & Parkside Ave), Brooklyn, NY 11225","why":"PLG's front door to Prospect Park: skate on the covered rink from late fall (roller skating in warm months), then walk the lake shore.","x":192.06,"y":260.83}],"bite":[{"name":"Allan's Bakery","address":"1109 Nostrand Ave, Brooklyn, NY 11225","why":"A decades-old Caribbean bakery where locals queue out the door, and the taste of the neighborhood's West Indian community. Closed Mondays.","order":"A warm currant roll (buy extra) and a beef patty in coco bread","x":219.84,"y":247.14},{"name":"Errol's Caribbean Delights","address":"661 Flatbush Ave, Brooklyn, NY 11225","why":"A Jamaican bakery and steam table locals rely on for patties, curry goat and sweets.","order":"Beef patty and curry goat, with bread pudding or coconut drops for later","x":198.17,"y":257.45},{"name":"Risbo","address":"701 Flatbush Ave, Brooklyn, NY 11225","why":"A French-Caribbean rotisserie with a lovely back garden, known for some of the best chicken in the borough.","order":"Rotisserie chicken platter with spicy cabbage and the lamb hash","x":198.82,"y":261.11}],"bite_gf":[{"name":"Djon Djon","address":"1206 Nostrand Ave, Brooklyn, NY 11225","why":"This Haitian spot is new and well reviewed (Infatuation, May 2026), and its core plates are naturally free of wheat. It doesn't advertise GF, though, so check for a shared fryer and bouillon cubes like Maggi (which often contain wheat) before ordering.","order":"Griot (fried pork) with pikliz and diri djon djon (black mushroom rice)","gf_level":"GF options w/ precautions","x":220.53,"y":255.65},{"name":"Bonafini","address":"663 Flatbush Ave, Brooklyn, NY 11225","why":"A neighborhood Italian spot with a few GF items, including GF pasta and a lemon GF cake, for when Djon Djon is closed.","order":"GF pasta with a simple sauce; ask about separate pots and water","gf_level":"GF options w/ precautions","x":198.21,"y":257.68}],"bar":[{"name":"Fiona's Bar","address":"562 Flatbush Ave","why":"An unfussy Flatbush Ave neighborhood dive with cheap drinks and friendly regulars; the kitchen is closed, so you can bring your own food.","tag":"Dive · cheap pints","type":"dive","x":197.36,"y":249.13},{"name":"Wolfpup Bar","address":"447 Rogers Ave","why":"A 90s-nostalgia cocktail bar with neon, floppy-disk coasters and playful drinks, plus cheap beer.","type":"cocktail","x":213.08,"y":244.66},{"name":"Bar Bayeux","address":"1066 Nostrand Ave","why":"A small Nostrand Ave bar known for live jazz, with quartet and trio sets on its 2026 calendar. It's open Tue-Sun and has happy hour until 7pm Tue-Fri.","tag":"Live jazz","type":"music","x":219.51,"y":243.07}]}},{"name":"Windsor Terrace","tagline":"Tiny, Irish-rooted village wedged between two giant green spaces","getting_there":"From 2 Av (F), ride the F to 15 St-Prospect Park or Fort Hamilton Pkwy (about 30 min).","stops":{"known_for":[{"name":"'Dog Day Afternoon' bank site","address":"279 Prospect Park West (between 17th & 18th Sts), Brooklyn, NY 11215","why":"Most of Sidney Lumet's 1975 Al Pacino heist classic was shot on this block, with the former storage building standing in as the bank.","tip":"Rewatch the 'Attica!' scene first and stand across PPW to line up the shot.","x":148.12,"y":254.82},{"name":"Nitehawk Cinema Prospect Park","address":"188 Prospect Park W, Brooklyn, NY 11215","why":"The 1928 Sanders Theatre, restored as a dine-in movie palace that keeps its old-time grandeur.","tip":"Book a matinee, order the truffle popcorn and a cocktail to your seat, and look up at the restored ceiling.","x":155.09,"y":244.47}],"coffee":[{"name":"Steeplechase Coffee","address":"3013 Fort Hamilton Pkwy, Brooklyn, NY 11218","why":"The local favorite on the neighborhood's southern main drag, with a cozy, community-hub feel. Open 7 days, until 3pm.","x":157.06,"y":283.62},{"name":"Krupa Grocery","address":"231 Prospect Park W, Brooklyn, NY 11215","why":"An all-day cafe-restaurant on PPW for good morning coffee and pastry steps from the park.","x":151.78,"y":249.62},{"name":"Daytime","address":"199 Windsor Pl, Brooklyn, NY 11215","why":"A bright, plant-filled neighborhood cafe with strong espresso and excellent breakfast sandwiches on a quiet side street.","x":157.51,"y":253.54}],"park":[{"name":"Bartel-Pritchard Square","address":"Prospect Park West and Prospect Park Southwest, Brooklyn, NY 11215","why":"This traffic circle was named in 1923 for two local friends killed in WWI. Look at the Stanford White-designed columns flanking the park entrance, then walk into the park's quiet southwest corner.","x":153.85,"y":246.26},{"name":"Prospect Park Stable (BeBrooklyn Equine)","address":"51-55 Caton Pl, Brooklyn, NY 11218","why":"The last stable near Prospect Park, offering guided horseback rides from the edge of Windsor Terrace onto the park's bridle paths; book ahead by phone or email.","x":168.61,"y":280.49}],"bite":[{"name":"Brancaccio's Food Shop","address":"3011 Fort Hamilton Pkwy, Brooklyn, NY 11218","why":"A tiny Italian sandwich and prepared-foods shop that feels like small-town Windsor Terrace, with an owner who cooks everything. Open Wednesday to Sunday only.","order":"The Green Eggs and Ham breakfast sandwich, or the steak and eggs, or a meatball hero at lunch","x":157.1,"y":283.6},{"name":"Le Paddock","address":"1235 Prospect Ave, Brooklyn, NY 11218","why":"A neighborhood French bistro by the Fort Hamilton subway that's great for steak frites and moules (cash or AmEx only).","order":"Steak frites with deviled eggs to start","x":162.39,"y":270.43},{"name":"Cozie's Pizzeria & Cafe","address":"424 Greenwood Ave, Brooklyn, NY 11218","why":"A family-run slice shop across from Greenwood Playground with crisp, thin slices and its own ice cream counter.","order":"Margherita and pepperoni slices, then a scoop of ice cream","x":158.98,"y":276.81}],"bite_gf":[{"name":"Hamilton's","address":"2826 Fort Hamilton Pkwy, Brooklyn, NY 11218","why":"Atly checked it as celiac-friendly, with GF items marked, trained staff, and reported dedicated prep space and cookware. A celiac reviewer reported no reactions.","order":"Salmon with spinach and wedge potatoes, then the GF apple cake","gf_level":"GF options w/ precautions","x":160.74,"y":281.67},{"name":"CENA","address":"601 Greenwood Ave, Brooklyn, NY 11218","why":"A Mexican spot where much of the menu is reportedly naturally gluten-free, thanks to corn tortillas.","order":"Fish or pork tacos on corn tortillas and elote; confirm the fryer and salsas","gf_level":"GF options w/ precautions","x":163.09,"y":274.67}],"bar":[{"name":"Farrell's Bar & Grill","address":"215 Prospect Park W","why":"Windsor Terrace's legendary no-food corner bar, pouring beer since 1933 and famous for 32-ounce beers in styrofoam cups.","tag":"Since 1933 · 32-oz beers","type":"dive","x":152.79,"y":248.02},{"name":"The Double Windsor","address":"210 Prospect Park West","why":"A dark, cozy horseshoe-bar pub right across from Farrell's, with a deep rotating craft-beer and cask list.","type":"other","x":152.79,"y":248.02},{"name":"The Lonesome Club","address":"1674 10th Ave","why":"A warm Irish pub where reviewers praise the two-step Guinness pour, plus soda bread, short-rib shepherd's pie and happy-hour oysters.","tag":"Irish pub · Guinness on tap","type":"other","x":154.94,"y":256.42}]}},{"name":"Green-Wood Cemetery","tagline":"478 hilly acres of Victorian monuments, Revolutionary history, and parakeets","getting_there":"L from 1 Av to Union Sq, then the R to 25 St; walk one block east to the main gate at 5th Ave & 25th St (about 40 min)","stops":{"known_for":[{"name":"Battle Hill & the Altar to Liberty (Minerva statue)","address":"Battle Hill, inside Green-Wood (from the main gate, 5th Ave & 25th St)","why":"Battle Hill is the highest point in Brooklyn and a site of the 1776 Battle of Brooklyn. A bronze Minerva stands there raising her hand to the Statue of Liberty, which you can see across the harbor.","tip":"Pick up a free map at the main gate. Fall hours are 8am-5pm. Basquiat's and Leonard Bernstein's graves are worth a detour on the way.","x":128.15,"y":255.47,"approx":1},{"name":"Jean-Michel Basquiat's grave","address":"Inside Green-Wood (enter at the main gate, 5th Ave & 25th St)","why":"The painter's simple headstone has become a pilgrimage site, with fans leaving pennies, flowers, drawings and even empty frames.","tip":"It's marked on the free Green-Wood map at the gate; Leonard Bernstein's grave is also marked, so you can do both on one loop.","x":129.95,"y":267.07,"approx":1},{"name":"The Catacombs","address":"Inside Green-Wood (from the main gate, 5th Ave & 25th St)","why":"A row of 1850s hillside vaults behind iron doors, one of the cemetery's most atmospheric early structures.","tip":"The interior only opens on Green-Wood's guided tours, so check the events calendar and book ahead; otherwise view the facade from the path.","x":134.69,"y":263.8,"approx":1}],"coffee":[{"name":"Southside Coffee","address":"654 6th Ave, Brooklyn, NY 11215","why":"A South Slope window-service favorite pouring Counter Culture, a short walk uphill from the cemetery's north edge.","x":130.96,"y":245.82},{"name":"Tin Cup Cafe","address":"719 4th Ave, Brooklyn, NY 11232","why":"A laid-back laptop-and-crepes cafe on 4th Ave, a few blocks from the main gate, with blankets for outdoor tables.","x":115.37,"y":245.02},{"name":"Sole Cafe at the Green-House","address":"500 25th St, Brooklyn, NY 11232","why":"A carefully run specialty cafe inside Green-Wood's new visitor center (opened April 2026) around the restored 1895 Weir Greenhouse, right at the main gate (open Thu-Mon).","x":118.11,"y":251.86}],"park":[{"name":"Main Gate & Sylvan Water","address":"5th Ave & 25th St (main entrance)","why":"Look up at the 1861 Gothic Revival main gate, where wild monk parakeets nest in the spires. Then wander the paths around Sylvan Water, the quietest of the cemetery's glacial ponds.","x":118.11,"y":251.86},{"name":"Valley Water & the Historic Chapel","address":"Inside Green-Wood, a short walk from the main gate (5th Ave & 25th St)","why":"Pair the Warren & Wetmore chapel (1911-13, modeled on Oxford's Tom Tower) with the pond nearby, one of the cemetery's prettiest reflecting spots.","x":118.11,"y":251.86},{"name":"Water Crescent & Water Dell","address":"Inside Green-Wood (use the map from the main gate or Fort Hamilton Pkwy gate)","why":"Two quieter interior ponds from the 1870s, ringed by mausoleums and old trees, good for a slow loop and bird-watching away from the crowds.","x":135.59,"y":265.58,"approx":1}],"bite":[{"name":"Baked in Brooklyn","address":"755 5th Ave, Brooklyn, NY 11232","why":"A working bread bakery on 5th Avenue at 25th Street, right across from Green-Wood's Gothic main gate. You can smell the loaves from the street and pick up supplies before a walk among the graves.","order":"A coffee with the free pastry deal, or a sandwich on their own bread","x":116.8,"y":253.52},{"name":"Jey Diner","address":"721 4th Ave, Brooklyn, NY 11232","why":"A small, friendly diner near the main gate whose food is made fresh and plated with surprising care.","order":"Fried chicken sandwich or huevos rancheros, plus the fries with four sauces","x":115.18,"y":245.26},{"name":"Giuseppina's","address":"691 6th Ave, Brooklyn, NY 11215","why":"A candlelit brick-oven pizzeria from the Lucali family, a few blocks from the cemetery's north side.","order":"A half-pepperoni pie and a calzone (dinner only, closed Tuesdays)","x":129.64,"y":247.49}],"bite_gf":[{"name":"Everybody Eats","address":"294 3rd Ave, Brooklyn, NY 11215","why":"A fully gluten-free bakery since 2004, a block from the Union St R station, so stop on your way to 25 St. Open Mon-Sat, closed Sunday.","order":"A loaf of GF bread plus a seasonal pie slice or cake","gf_level":"dedicated","x":139.41,"y":198.42}],"bar":[{"name":"Buttermilk Bar","address":"577 5th Ave","why":"South Slope's classic dive, open until 4am, with cheap beer-and-shot specials, pool, pinball, air hockey and a photo booth, about 10 minutes up 5th Ave from the main gate.","tag":"Dive · pool & pinball","type":"dive","x":131.5,"y":234.44},{"name":"Folk","address":"689 6th Ave","why":"A new South Slope cocktail bar from the couple behind Lore, about 5-10 min from the cemetery. It has three Negronis on draft and Indian-inflect he R/W downtown to Rector St, then walk west about 5 minutes to the river (around 20 minutes total); or the 1 from 14 St to Rector St / WTC Cortlandt.","stops":{"known_for":[{"name":"Irish Hunger Memorial","address":"Vesey St & North End Ave","why":"A sloping half-acre of real Irish fieldstone, native plants and a relocated 19th-century cottage, cantilevered toward the Hudson to remember the Great Famine.","tip":"Walk up through the cottage to the top for a framed view of the river and the Statue of Liberty.","x":192.68,"y":1332.31},{"name":"Museum of Jewish Heritage","address":"36 Battery Pl","why":"The six-sided Holocaust memorial museum on the harbor, now showing the Warsaw Ghetto underground archive exhibition (through Feb 2027).","tip":"Thursdays 4-8pm are free with an advance reservation; don't miss Andy Goldsworthy's Garden of Stones outside. Closed Mon, Tue, Sat.","x":216.72,"y":1395.49},{"name":"The Skyscraper Museum","address":"39 Battery Pl","why":"A small, mirror-ceilinged museum devoted entirely to tall buildings, which is perfect for architecture nerds.","tip":"Open Wed-Sat 12-6; book a free timed ticket or just walk in.","x":216.22,"y":1394.85}],"coffee":[{"name":"Hutch + Waldo","address":"South End Ave, Battery Park City","why":"An Aussie-style neighborhood cafe that BPC residents actually use, with good flat whites and brekkie bowls.","tip":"Open 7am-4pm daily; grab it to go and walk the esplanade.","x":207.16,"y":1362.92},{"name":"Daily Provisions","address":"230 Vesey St (Brookfield Place)","why":"Danny Meyer's bakery-cafe, known for its crullers and solid drip coffee, in the old Olive's space at Brookfield.","tip":"Get a maple cruller with your coffee and take it out to North Cove marina.","x":196.67,"y":1332.38},{"name":"Sant Ambroeus","address":"200 Vesey St (Brookfield Place)","why":"A proper Milanese espresso bar where you stand at the counter, drink a cappuccino, and grab a pastry.","tip":"Order at the bar Italian-style; the cornetti are excellent.","x":197.66,"y":1332.4}],"park":[{"name":"Teardrop Park","address":"Warren St & River Terrace","why":"A Michael Van Valkenburgh hidden park of bluestone cliffs, marsh plantings and one of the city's best long slides.","tip":"Adults ride the big slide too; then check out the ice-wall rock formation.","x":184.55,"y":1312.8},{"name":"Nelson A. Rockefeller Park","address":"River Terrace & Chambers St","why":"Big open lawns on the Hudson with Tom Otterness's quirky Real World bronze sculptures scattered along the walk.","tip":"Go hunting for the little Otterness figures by the Rockefeller Park pathways, then stay for sunset over Jersey City.","x":186.66,"y":1307.9},{"name":"Wagner Park","address":"20 Battery Pl","why":"Reopened in 2025 after a near-$300M flood-resilience rebuild, raised 10 feet with new lawns and a rooftop garden on the pavilion.","tip":"Head up to the pavilion's rooftop garden for one of the best free Statue of Liberty views in Manhattan.","x":221.84,"y":1397.74}],"bite":[{"name":"All'Antico Vinaio (Hudson Eats)","address":"230 Vesey St (Brookfield Place)","why":"The Florentine sandwich shop with its first-ever overseas lines now has a stall at Brookfield's Hudson Eats, with no hour-long wait.","order":"La Favolosa (salami, pecorino cream, artichoke cream, spicy eggplant) on schiacciata.","x":196.67,"y":1332.38},{"name":"Milu (Hudson Eats)","address":"230 Vesey St (Brookfield Place)","why":"Modern Chinese rice bowls from Connie Chung, a former Eleven Madison Park chef, that are a real step up from food-court fare.","order":"Crispy chicken or mapo tofu rice bowl.","x":196.67,"y":1332.38},{"name":"Le District","address":"225 Liberty St (Brookfield Place)","why":"A sprawling French market hall facing the marina, with a creperie, patisserie, boulangerie and a bar-bistro.","order":"A ham-and-gruyère galette at the creperie or a croque monsieur, then a pastry for the walk.","x":205.87,"y":1351.42}],"bite_gf":[],"bar":[{"name":"P.J. Clarke's on the Hudson","address":"250 Vesey St","why":"The downtown outpost of the classic 1884 saloon, with checkered tablecloths, a long bar and big windows over North Cove marina; it's the closest thing BPC has to an old-school bar.","type":"other","x":196.0,"y":1332.37},{"name":"Black Hound","address":"301 South End Ave","why":"A low-key cocktail bar at Albany St that serves as BPC's neighborhood spot for a proper drink.","type":"cocktail","x":208.24,"y":1362.42},{"name":"Merchants River House","address":"375 South End Ave","why":"A waterfront patio bar on the esplanade, best for a sunset beer or spritz facing the Statue of Liberty.","type":"other","x":206.56,"y":1354.6}]}},{"name":"Central Park","tagline":"843 acres of rambles, castles, and the city's best people-watching.","getting_there":"R/W from 8 St–NYU to 5 Av/59 St (about 15 min) for the south end. Or take the 6 from Astor Pl to 103 St or 110 St for the north end.","stops":{"known_for":[{"name":"Bethesda Terrace","address":"Mid-park at W 72nd St","why":"The park's grand centerpiece, with a tiled arcade, the Angel of the Waters, and buskers echoing under the arches.","tip":"The fountain is off for restoration, but the terrace is open; look up at the Minton tile ceiling in the lower arcade.","x":202.05,"y":837.51},{"name":"Belvedere Castle","address":"Mid-park at 79th St","why":"Vaux's miniature 1869 castle on Vista Rock, with the best overlook in the park.","tip":"Climb to the top terrace for the view over Turtle Pond and the Great Lawn.","x":191.76,"y":798.19},{"name":"Strawberry Fields","address":"Central Park West & W 72nd St","why":"The memorial garden for John Lennon, across from the Dakota where he lived.","tip":"Find the 'Imagine' mosaic, then look across the street at the Dakota's gate.","x":170.01,"y":836.87}],"coffee":[{"name":"Double Dutch Espresso","address":"2194 Frederick Douglass Blvd","why":"A long-running Harlem cafe a short walk up from the park's northwest corner, good for a cortado before the North Woods.","x":169.74,"y":591.81},{"name":"Superhet Coffee","address":"390 Manhattan Ave","why":"A heavy-metal-themed Harlem coffee shop praised for carefully made drinks; open mornings into early afternoon.","x":160.65,"y":600.69},{"name":"Bo's Bagels","address":"235 W 116th St","why":"A Harlem bagel shop with real hand-rolled bagels and coffee to carry down to the Harlem Meer.","x":188.22,"y":603.93}],"park":[{"name":"The Ramble","address":"Mid-park, 73rd St to 79th St","why":"Thirty-eight acres of winding paths and woods, one of the city's best birding spots during fall migration.","tip":"Go in the morning with binoculars and check the bird-sighting board near the Boathouse. Ramble restrooms are closed until Oct 30.","x":190.64,"y":812.43},{"name":"Conservatory Garden","address":"5th Ave & E 105th St","why":"The park's only formal garden, entered through the Vanderbilt Gate, with three gardens in Italian, French and English styles.","tip":"Go in late October for the chrysanthemum display in the North Garden.","x":225.72,"y":662.22},{"name":"North Woods & The Loch","address":"Central Park West & W 103rd St","why":"The park's wildest corner, with a stream, small waterfalls and the rough-stone Huddlestone Arch.","tip":"Follow the Loch from the Pool east to Huddlestone Arch and Harlem Meer.","x":169.8,"y":672.56}],"bite":[{"name":"Melba's","address":"300 W 114th St","why":"A beloved Harlem comfort-food spot a few blocks from the park's northwest corner.","order":"Chicken and eggnog waffles","x":169.77,"y":614.67},{"name":"Burger Joint","address":"119 W 56th St","why":"The hidden, graffiti-covered burger counter behind a curtain, a short walk south of Central Park South.","order":"Cheeseburger 'the works', fries and a milkshake","x":200.53,"y":920.93},{"name":"Tavern on the Green","address":"W 67th St & Central Park West","why":"The restored 1870s sheepfold inside the park, with its lantern-lit courtyard as the draw.","order":"Drinks and a burger in the outdoor courtyard","x":170.04,"y":863.21}],"bite_gf":[],"bar":[{"name":"The Coliseum Bar","address":"312 W 58th St","why":"An old-school sports pub a block from Columbus Circle with cheap pints and no pretension.","type":"dive","x":168.08,"y":909.73},{"name":"Robert","address":"2 Columbus Circle","why":"A ninth-floor bar atop the Museum of Arts and Design overlooking the park, with live music most nights.","type":"music","x":171.12,"y":906.62}]}},{"name":"Chelsea","tagline":"Galleries, an elevated rail park and a factory full of food","getting_there":"From 1 Av take the L west to 8 Av (about 10 min), then walk; or walk about 25 minutes west along 14th St.","stops":{"known_for":[{"name":"Chelsea Market","address":"75 9th Ave","why":"The old Nabisco factory where the Oreo was invented, now a brick-tunnel food hall.","tip":"Go on a weekday morning to beat the crowds, and look for the Nabisco-era details and the waterfall.","x":152.28,"y":1130.46},{"name":"West Chelsea gallery crawl (David Zwirner)","address":"537 W 20th St","why":"West 18th to 27th Streets between 10th and 11th Aves hold the city's densest run of blue-chip galleries, all free.","tip":"Go Thursday evening for openings; galleries are closed Sundays and Mondays.","x":127.79,"y":1107.68},{"name":"Hotel Chelsea","address":"222 W 23rd St","why":"The red-brick home of Dylan Thomas, Patti Smith, Leonard Cohen and Warhol's crowd, with the iron balconies and bronze plaques out front.","tip":"Read the bronze plaques by the door to see who lived here.","x":184.31,"y":1092.26}],"coffee":[{"name":"La Cabra (Chelsea Bakery)","address":"515 W 18th St","why":"The Danish roaster's bakery does light Nordic roasts and some of the city's best cardamom buns, right by the High Line.","tip":"Get a cardamom bun warm and walk up to the High Line.","x":132.03,"y":1117.35},{"name":"Variety Coffee Roasters","address":"261 7th Ave","why":"A Brooklyn roaster with a roomy, wood-heavy cafe that does well-made espresso drinks.","tip":"The big tables are good for working an hour before you head out.","x":188.29,"y":1082.22},{"name":"Seven Grams Caffe","address":"275 7th Ave","why":"A neighborhood espresso bar known for its chocolate chip cookies and careful milk drinks.","tip":"Get the cookie.","x":188.26,"y":1078.46}],"park":[{"name":"The High Line (10th Avenue Square)","address":"High Line at W 17th St & 10th Ave","why":"The elevated rail-line park, at its best where the amphitheater windows look straight down 10th Ave.","tip":"Sit in the sunken overlook at 17th St and watch the traffic, then walk north to the 23rd St lawn.","x":133.89,"y":1122.18},{"name":"Pier 62 & Chelsea Waterside","address":"Pier 62, W 22nd St & Hudson River Greenway","why":"A Hudson River Park pier with a hand-carved carousel, a skatepark and a big lawn on the water.","tip":"Watch the skatepark at golden hour.","x":116.21,"y":1098.12},{"name":"Clement Clarke Moore Park","address":"W 22nd St & 10th Ave","why":"A small, leafy neighborhood park named for the 'Night Before Christmas' poet, who owned this land.","tip":"Walk next door to the General Theological Seminary's brownstone row on W 20th-21st Sts.","x":134.9,"y":1097.73}],"bite":[{"name":"Los Tacos No. 1","address":"75 9th Ave","why":"The original Chelsea Market counter that set the city's taco standard, with fresh corn tortillas pressed in front of you.","order":"Adobada taco on corn with everything and an agua fresca.","x":152.28,"y":1130.46},{"name":"Txikito","address":"240 9th Ave","why":"Alex Raij's tiny Basque spot has been a Chelsea favorite for years.","order":"Croquetas, the squid-ribbon 'noodles' and a glass of txakoli.","x":152.67,"y":1084.27},{"name":"Lobster Place","address":"75 9th Ave","why":"A real working fish market inside Chelsea Market with a sushi counter and lobster bar, a step up from the food-hall stalls.","order":"A hand roll set from the sushi counter or a steamed lobster.","x":152.28,"y":1130.46}],"bite_gf":[{"name":"Friedman's","address":"75 9th Ave","why":"A celiac-founded diner that says 99% of its menu is gluten-free or can be made GF, with GF bread and GF fried food.","order":"Fried chicken and waffles, GF.","gf_level":"GF options w/ precautions","x":152.28,"y":1130.46}],"bar":[{"name":"Peter McManus Cafe","address":"152 7th Ave","why":"The McManus family has run this wood-and-tin pub since 1936, and the pint and burger are both good.","tag":"Family-run since 1936 · Guinness on tap","type":"dive","x":188.34,"y":1112.0},{"name":"Porchlight","address":"271 11th Ave","why":"Danny Meyer's Southern-leaning bar near the river, with good cocktails, warm hospitality and a daily 3-7pm happy hour.","type":"cocktail","x":117.0,"y":1068.57},{"name":"Sid Gold's Request Room","address":"165 W 26th St","why":"Piano karaoke: you sing with a live pianist in a gold-lit lounge, and it's more fun than it sounds.","type":"music","x":194.31,"y":1076.55}]}},{"name":"Chinatown","tagline":"Dim sum, roast pork and mahjong on crooked old streets","getting_there":"Take the 6 from Astor Pl three stops to Canal St. Or walk about 25 minutes straight down the Bowery.","stops":{"known_for":[{"name":"Doyers Street","address":"Doyers St between Pell St and Bowery","why":"A crooked, one-block street once called the 'Bloody Angle' for tong wars, now lined with barbershops, a dim sum parlor and a speakeasy.","tip":"Walk it from Pell St to the Bowery to catch the bend, then duck into the old tunnel arcade off Doyers.","x":281.93,"y":1285.39},{"name":"Mahayana Buddhist Temple","address":"133 Canal St","why":"The largest Buddhist temple in Chinatown, right at the foot of the Manhattan Bridge, with a golden Buddha about 16 feet tall.","tip":"It's free. A $1 donation gets you a fortune slip, and keep quiet in the main hall.","x":287.85,"y":1269.32},{"name":"Museum of Chinese in America","address":"215 Centre St","why":"A Maya Lin-designed museum telling 160 years of Chinese American history in New York.","tip":"Check the hours before you go. It keeps limited days, often Thursday through Sunday.","x":259.62,"y":1256.96}],"coffee":[{"name":"Artbean Coffee Roasters","address":"19 Doyers St","why":"A tiny takeaway shop on Doyers that doubles as a gallery for Asian American artists and roasts its own blends.","order":"Ube latte or the Vietnamese-style egg coffee","x":283.2,"y":1287.02},{"name":"Round K","address":"78 Canal St","why":"A Korean-run cafe that recently reopened after a renovation under its founder, known for unusual espresso drinks.","order":"Butter latte, plus Korean party toast","x":301.62,"y":1267.75},{"name":"Kam Hing Coffee Shop","address":"118 Baxter St","why":"A decades-old counter shop famous for its fluffy sponge cakes, with milk tea and Vietnamese iced coffee.","order":"Sponge cake and a Hong Kong milk tea","x":263.67,"y":1267.22}],"park":[{"name":"Columbus Park","address":"Mulberry St & Bayard St","why":"The neighborhood's living room, where older residents play xiangqi, cards and erhu every day.","tip":"Watch the Chinese chess and card games under the pavilion. Mornings bring tai chi.","x":269.52,"y":1280.15},{"name":"Chatham Square & Kimlau Memorial Arch","address":"Chatham Sq at Park Row & East Broadway","why":"The arch honors Chinese American WWII veterans, and the square has a statue of Lin Zexu.","tip":"Read the memorial plaques, then look down East Broadway and Bowery from the center of the square.","x":281.28,"y":1293.56},{"name":"Manhattan Bridge walkway","address":"Canal St & Forsyth St","why":"The bridge's grand Beaux-Arts arch opens onto a walkway with subway trains rattling past and big views of the Brooklyn Bridge.","tip":"Walk out to about mid-span for the Brooklyn Bridge and lower Manhattan view, then come back.","x":294.76,"y":1268.61}],"bite":[{"name":"Nom Wah Tea Parlor","address":"13 Doyers St","why":"Serving dim sum on Doyers since 1920, with a vintage room and made-to-order food (no carts).","order":"The 'Original' egg roll, shrimp and snow pea leaf dumplings, and a roast pork bun","x":283.59,"y":1287.11},{"name":"Wah Fung No. 1","address":"79 Chrystie St","why":"A takeout window with a line for some of the best and cheapest roast pork over rice in the city.","order":"Roast pork and roast chicken combo over rice","x":288.91,"y":1258.72},{"name":"Great NY Noodletown","address":"28 Bowery","why":"A late-night Cantonese institution for wonton noodle soup and roast meats.","order":"Shrimp wonton noodle soup and roast pork","x":284.3,"y":1279.06}],"bite_gf":[{"name":"Kimmi","address":"125 Canal St","why":"Opened in 2026 by the team behind Tiger Lily Kitchen, serving Asian-inspired food from a gluten-free menu.","order":"Five-spiced short rib and the mango papaya salad","gf_level":"fully GF menu","x":289.66,"y":1269.08}],"bar":[{"name":"Apotheke","address":"9 Doyers St","why":"An apothecary-themed speakeasy behind an old opium-den facade, making serious seasonal cocktails.","type":"cocktail","x":283.85,"y":1287.13},{"name":"Upstairs Bar","address":"59 Canal St (2nd floor)","why":"A second-floor karaoke bar open until 4am on weekends, with cocktails and dumplings to keep you going.","type":"other","x":307.74,"y":1266.96}]}},{"name":"Civic Center","tagline":"City Hall, grand courthouses, and the Brooklyn Bridge on-ramp","getting_there":"Take the 6 from Astor Pl straight down to Brooklyn Bridge-City Hall (about 8 minutes).","stops":{"known_for":[{"name":"African Burial Ground National Monument","address":"290 Broadway","why":"It marks the burial ground of an estimated 15,000 free and enslaved Africans in colonial New York, rediscovered in 1991. It's a powerful memorial with a visitor center.","tip":"It's open Wed-Sun 10-4 (closed Mon-Tue). See the indoor exhibit first, then the outdoor memorial on Duane St.","x":242.43,"y":1304.86},{"name":"Surrogate's Courthouse (Hall of Records)","address":"31 Chambers St","why":"A Beaux-Arts landmark whose Egyptian-style marble lobby and mosaic ceiling are among the most beautiful interiors in the city.","tip":"Go on a weekday, clear security, and just stand in the atrium and look up. Lots of films have shot here.","x":252.31,"y":1310.23},{"name":"Brooklyn Bridge walk","address":"Centre St & Chambers St","why":"The bridge's pedestrian promenade starts right here, and walking to the Brooklyn tower is the classic downtown walk.","tip":"Walk out to the first tower and back (about 30 minutes) late in the day for the light on the Manhattan skyline. Stay in the pedestrian lane.","x":256.58,"y":1310.34}],"coffee":[{"name":"Takahachi Bakery","address":"25 Murray St","why":"A tucked-away Japanese bakery a block from City Hall Park. Order a coffee with a matcha pastry.","x":233.45,"y":1318.94}],"park":[{"name":"City Hall Park","address":"Broadway & Chambers St","why":"It was the town common of colonial New York, where the Declaration of Independence was read to troops in 1776, and it's now a leafy plaza around City Hall.","tip":"Circle the Mould fountain with its gaslight-style lamps and read the historical markers along the paths.","x":242.18,"y":1309.81},{"name":"Foley Square / Thomas Paine Park","address":"Centre St & Worth St","why":"This is the courthouse plaza seen in endless Law & Order shots, built over the old Five Points edge.","tip":"See the 'Triumph of the Human Spirit' sculpture and the steps of the New York County Courthouse.","x":258.8,"y":1292.38},{"name":"Collect Pond Park","address":"Centre St & Leonard St","why":"It's on the site of the Collect Pond, which was Manhattan's main freshwater source until it was filled in, and the redesign has a reflecting pool and a boardwalk.","tip":"Walk the boardwalk over the shallow pool and read the panels about the lost pond and the Five Points slum around it.","x":258.81,"y":1287.53}],"bite":[{"name":"Nha Trang One","address":"87 Baxter St","why":"A courthouse-crowd favorite for Vietnamese food just behind Foley Square.","order":"Phở gà (chicken pho)","x":264.26,"y":1275.74},{"name":"Thai Son","address":"89 Baxter St","why":"A next-door Vietnamese rival with big cheap bowls (cash keeps pho under $15) and a long menu.","order":"#13a phở cà ri gà (curry chicken noodle soup) or shaking beef","x":264.21,"y":1275.04}],"bite_gf":[],"bar":[{"name":"Whiskey Tavern","address":"79 Baxter St","why":"A friendly, unfussy whiskey-and-beer bar by the courthouses, where jurors and lawyers come to unwind.","type":"dive","x":264.4,"y":1277.82},{"name":"The Patriot Saloon","address":"110 Chambers St","why":"A rowdy, cheap-beer dive steps from City Hall Park, famous for a lively bartending crew.","type":"other","x":230.51,"y":1309.29}]}},{"name":"East Harlem","tagline":"El Barrio: murals, salsa roots, coal-oven pizza, and Puerto Rican pride","getting_there":"6 train straight from Astor Pl to 103 St, 110 St or 116 St, about 20-25 min with no transfer.","stops":{"known_for":[{"name":"El Museo del Barrio","address":"1230 Fifth Ave","why":"Founded by Puerto Rican activists in 1969, it's the city's leading museum of Latino and Latin American art.","tip":"Walk east on 104th-106th afterward. That stretch is lined with murals, including the Julia de Burgos tributes on Lexington.","x":225.67,"y":667.43},{"name":"Graffiti Hall of Fame","address":"E 106th St & Park Ave","why":"Since 1980 top writers have painted the walls of this schoolyard, and it's a living gallery of NYC graffiti.","tip":"Go on a weekend afternoon, when you can usually see the walls from the fence or catch someone painting.","x":245.09,"y":656.66},{"name":"Keith Haring 'Crack Is Wack' mural","address":"E 128th St & Harlem River Dr","why":"Haring painted this famous 1986 handball-court mural illegally, and the city later protected it.","tip":"It's at the playground by the 2nd Ave/Harlem River Dr ramp. Look from the playground side for the best photo.","x":280.44,"y":539.32}],"coffee":[{"name":"Indomable Coffee","address":"228 E 116th St","why":"This independent cafe is right in the middle of the 116th St corridor, El Barrio's main drag.","x":270.02,"y":6
