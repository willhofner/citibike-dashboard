04.0},{"name":"Frenchy Coffee","address":"129 E 102nd St","why":"A small cafe near the 103rd St 6 stop, and a good way to start a day heading up to the murals and El Museo.","x":253.96,"y":677.82},{"name":"Super Nice Coffee & Bakery","address":"156 E 117th St","why":"This friendly little coffee and bakery spot is good for a pastry break on a side street off 116th.","x":257.22,"y":598.39}],"park":[{"name":"Conservatory Garden","address":"Fifth Ave & E 105th St","why":"Go through the Vanderbilt Gate into Central Park's only formal garden, and catch the fall chrysanthemums in the north garden.","x":225.72,"y":662.22},{"name":"Thomas Jefferson Park","address":"E 112th St & First Ave","why":"El Barrio's big neighborhood park has ballfields, a track and a huge public pool. It's a real slice of local life on weekends.","x":294.93,"y":624.92},{"name":"Wards Island Bridge & East River Esplanade","address":"E 103rd St & FDR Dr","why":"Walk the esplanade, then cross the purple pedestrian lift bridge over the river to Randall's Island for skyline views.","x":313.85,"y":682.07}],"bite":[{"name":"Patsy's Pizzeria","address":"2287 1st Ave","why":"The 1933 coal-oven original has thin, charred slices that helped define New York pizza, and the neighborhood still loves it.","order":"Plain slices at the takeout window, or a whole margherita pie inside (cash)","x":294.91,"y":595.18},{"name":"Taco Mix","address":"234 E 116th St","why":"This tiny late-night taqueria on 116th is famous for al pastor carved straight off the trompo.","order":"Al pastor tacos and a tamale","x":270.88,"y":604.0},{"name":"Cocotazo","address":"349 E 109th St","why":"Chef Frances Roman cooks homey Puerto Rican food fresh each day in a small El Barrio dining room.","order":"Whatever plates are on the board that day, with arroz con gandules and pernil","x":287.38,"y":640.78}],"bite_gf":[],"bar":[{"name":"Earl's Beer & Cheese","address":"1259 Park Ave","why":"This log-cabin-style beer dive serves cheap happy-hour pints and grilled cheese with a kick, and it's East Harlem's low-key local hangout.","type":"dive","x":246.8,"y":702.3},{"name":"The Terrace","address":"332 E 116th St","why":"A moody, neon-lit cocktail bar behind a fake tailor-shop facade, with a backyard and a 2am close.","type":"cocktail","x":284.92,"y":604.0},{"name":"Bar Goyana","address":"177 E 100th St","why":"This Brazilian cocktail bar plays Brazilian music and throws occasional roda de samba street parties. Order a caipirinha and coxinhas.","type":"music","x":261.5,"y":688.21}]}},{"name":"East Village","tagline":"Ukrainian diners, punk ghosts, poets, and gardens behind chain-link fences","getting_there":"You're already here: everything is a 5-15 minute walk from Astor Pl / 1 Av.","stops":{"known_for":[{"name":"The Ukrainian Museum","address":"222 E 6th St","why":"The anchor of the old Ukrainian Village, celebrating its 50th year with a show on its own history.","tip":"Open Wed-Sun 12-6; 'A Living Canvas: The Ukrainian Museum at 50' and Zhanna Kadyrova's show both close Nov 7, 2026.","x":272.01,"y":1178.94},{"name":"St. Mark's Church in-the-Bowery / The Poetry Project","address":"131 E 10th St","why":"Peter Stuyvesant is buried in the churchyard, and the Poetry Project has run readings here since Ginsberg's era.","tip":"Catch an 8pm reading ($10), e.g. Mon Oct 26 or Wed Oct 28, 2026; wander the churchyard first.","x":270.06,"y":1159.28},{"name":"Museum of Reclaimed Urban Space (MoRUS)","address":"155 Avenue C","why":"A volunteer-run museum of the Lower East Side squats, community gardens, and activist history, in a former squat.","tip":"Open weekend afternoons (about 12-5); ask about their walking tours of the gardens and squats.","x":338.97,"y":1161.12}],"coffee":[{"name":"Abraço","address":"81 E 7th St","why":"The neighborhood's cult espresso counter, with an olive oil cake people cross town for.","x":292.99,"y":1174.15},{"name":"Ninth Street Espresso","address":"341 E 10th St","why":"A serious espresso bar facing Tompkins, with rotating photo shows on the walls; open 7am-7pm.","x":323.04,"y":1159.33},{"name":"Mud (Mudspot)","address":"307 E 9th St","why":"A scrappy, long-running EV coffee spot with a back garden, born from the orange Mud Truck.","x":281.75,"y":1164.2}],"park":[{"name":"Tompkins Square Park","address":"Avenue A to Avenue B, E 7th St to E 10th St","why":"The neighborhood's living room, with riot history, drummers, and the elm known as the Hare Krishna Tree.","tip":"Find the Hare Krishna Tree near the center, then watch the chaos at the dog run.","x":316.89,"y":1166.73},{"name":"La Plaza Cultural","address":"E 9th St & Avenue C","why":"One of the biggest and oldest Loisaida community gardens, with an amphitheater and willow trees.","tip":"Go on a weekend afternoon when the gate is open; MoRUS screens films here in the fall.","x":338.94,"y":1164.18},{"name":"6th & B Garden","address":"E 6th St & Avenue B","why":"A dense, volunteer-run community garden that hosts music, film, and seasonal events.","tip":"Check the gate on weekend afternoons and walk the narrow plot paths.","x":324.22,"y":1178.93}],"bite":[{"name":"Veselka","address":"144 2nd Ave","why":"The Ukrainian Village's 24-hour heart since 1954, now open around the clock again on weekends.","order":"Boiled pierogi combo and a bowl of borscht.","x":280.83,"y":1164.2},{"name":"B&H Dairy","address":"127 2nd Ave","why":"A tiny kosher dairy lunch counter with a handful of stools, unchanged for decades.","order":"Challah toast with matzo ball or mushroom barley soup, plus a blintz.","x":280.89,"y":1170.75},{"name":"Superiority Burger","address":"119 Avenue A","why":"Brooks Headley's beloved vegetarian diner in the old Odessa space, a modern EV institution.","order":"The Superiority Burger, a side of yuba Philly or burnt broccoli salad, and gelato.","x":309.61,"y":1171.59}],"bite_gf":[{"name":"Risotteria Melotti","address":"309 E 5th St","why":"A 100% gluten-free Veronese risotto restaurant, so the whole menu is safe.","order":"Risotto all'Amarone and the GF arancini; save room for a rice-flour dessert.","gf_level":"dedicated","x":282.18,"y":1184.02},{"name":"Sushi Counter","address":"523 E 12th St","why":"A handroll counter run by an owner with celiac disease; the shop is gluten-free (and nut- and sesame-free).","order":"Three handrolls for $12, with the roll of the month and a spicy tuna.","gf_level":"dedicated","x":312.85,"y":1149.08}],"bar":[{"name":"McSorley's Old Ale House","address":"15 E 7th St","why":"The neighborhood's oldest bar, with sawdust floors and walls nobody has dusted since Lincoln; it only pours its own light and dark ales, so there's no Guinness.","tag":"Oldest bar · since 1854","type":"dive","x":270.38,"y":1174.07},{"name":"Death & Co","address":"433 E 6th St","why":"The dark-wood East Village bar that helped launch the modern craft cocktail era and is still excellent.","type":"cocktail","x":300.33,"y":1178.92},{"name":"Nublu","address":"151 Avenue C","why":"An Avenue C jazz and global-groove club upstairs, with late sets and the weekly Producer Mondays.","type":"music","x":338.96,"y":1162.34}]}},{"name":"Financial District","tagline":"Colonial cobblestones and Revolutionary taverns under the glass canyons of Wall Street","getting_there":"Walk to 8 St–NYU (Broadway & 8th) and take the R/W downtown to Rector St or Whitehall St, about 15 minutes; or the 6 from Astor Pl to Brooklyn Bridge–City Hall and walk south.","stops":{"known_for":[{"name":"Trinity Church & Churchyard","address":"75 Broadway","why":"The Gothic Revival church that once topped the skyline, with Alexander Hamilton buried in its graveyard right at the head of Wall Street.","tip":"Walk the churchyard to find Hamilton's and Eliza's graves on the south side, then look down Wall Street from the gate.","x":238.71,"y":1367.24},{"name":"Federal Hall National Memorial","address":"26 Wall St","why":"Site of George Washington's 1789 inauguration and the first US Capitol, with the big Washington statue on the steps facing the Stock Exchange.","tip":"Free to enter on weekdays; pop in for the rotunda and the Bible Washington swore on, then cross to the NYSE facade.","x":247.34,"y":1366.23},{"name":"Stone Street Historic District","address":"Stone St between Hanover Sq and Coenties Alley","why":"One of Manhattan's first paved streets, a cobblestone lane of 1830s buildings that turns into one long communal outdoor table on nice evenings.","tip":"Go around 5:30 on a weekday to see the after-work crowd spill onto the picnic tables; it's quiet and charming on weekends.","x":257.45,"y":1381.59}],"coffee":[{"name":"Black Fox Coffee","address":"70 Pine St","why":"The neighborhood's go-to specialty bar, rotating serious roasters in a bright Art Deco-tower storefront.","tip":"Ask what's on the guest grinder; open weekends 8-4.","x":263.05,"y":1363.84},{"name":"Voyager Espresso","address":"110 William St","why":"A tiny, nerdy espresso bar tucked on the lower level by the Fulton St station, with a cult following among coffee people.","tip":"Look for the downstairs entrance; the cortado and seasonal signature drinks are the move.","x":256.65,"y":1346.88},{"name":"Bean & Bean","address":"71 Broadway","why":"Family-run Queens roaster whose FiDi flagship faces Trinity Church, good for a solid pour-over before the churchyard.","tip":"Open daily 7-5.","x":238.67,"y":1367.96}],"park":[{"name":"Elevated Acre","address":"55 Water St","why":"A hidden raised lawn and boardwalk above Water Street with an unexpectedly calm East River and Brooklyn view.","tip":"Take the escalator up from Water St; most people working in the building don't know it's there.","x":262.82,"y":1385.84},{"name":"Bowling Green","address":"Broadway & Whitehall St","why":"New York's oldest public park, ringed by its original 1771 iron fence, with the Charging Bull at its north tip.","tip":"Check the fence posts where the crowns were sawed off in 1776, then pop into the Beaux-Arts Custom House next door.","x":244.72,"y":1392.08},{"name":"The Battery","address":"State St & Battery Pl","why":"The harbor-front park at Manhattan's tip with gardens, Castle Clinton and Statue of Liberty views.","tip":"Ride the SeaGlass Carousel's glowing fish, or walk the Battery Bosque gardens toward the water at golden hour.","x":237.66,"y":1391.82}],"bite":[{"name":"Adrienne's Pizzabar","address":"54 Stone St","why":"The beloved Stone Street pizza spot whose thin, crispy square pie is a downtown institution.","order":"The Old Fashioned square pie, eaten at the outdoor tables on Stone St.","x":257.73,"y":1381.45},{"name":"Leo's Bagels","address":"3 Hanover Sq","why":"Hand-rolled bagels and proper smoked fish that FiDi regulars swear by.","order":"Everything bagel with Nova and scallion cream cheese, or The Leo (eggs, lox and onions).","x":260.91,"y":1379.09},{"name":"Pisillo Italian Panini","address":"97 Nassau St","why":"A tiny counter turning out enormous, imported-prosciutto-and-mozzarella panini on fresh bread that's become a FiDi lunch legend.","order":"Any prosciutto-and-fresh-mozzarella panino on the board; one easily feeds two.","x":249.48,"y":1336.4}],"bite_gf":[],"bar":[{"name":"Ulysses' Folk House","address":"95 Pearl St","why":"A big, friendly Irish pub that runs through to Stone Street, open 11am to 4am and proud of its pint of Guinness.","tag":"Guinness on tap","type":"dive","x":260.09,"y":1381.54},{"name":"The Dead Rabbit","address":"30 Water St","why":"The world-famous Irish cocktail bar, with a rowdy Taproom downstairs and the serious Parlor cocktail room upstairs.","type":"cocktail","x":259.14,"y":1391.71},{"name":"Fraunces Tavern","address":"54 Pearl St","why":"The 18th-century tavern where Washington bid farewell to his officers now hosts live music and a piano bar upstairs among its warren of rooms.","type":"music","x":254.84,"y":1391.17}]}},{"name":"Flatiron District","tagline":"Wedge-shaped skyscrapers, Ladies' Mile palaces and Madison Square","getting_there":"The 6 from Astor Pl to 23 St (2 stops), or a 15-minute walk up Broadway.","stops":{"known_for":[{"name":"Flatiron Building","address":"175 5th Ave","why":"Built in 1902, this triangular tower at Broadway and Fifth is one of the city's first skyscrapers and the source of the neighborhood's name.","tip":"Look at it from the Flatiron Plaza at 23rd St; the 'prow' view at sunset is the classic shot.","x":226.32,"y":1095.93},{"name":"Theodore Roosevelt Birthplace","address":"28 E 20th St","why":"A free National Park Service rebuild of the brownstone where TR was born, with original family furniture.","tip":"The upstairs rooms are guided-tour only, so check the NPS tour times before you go.","x":235.78,"y":1107.75},{"name":"Ladies' Mile (Siegel-Cooper building)","address":"616 6th Ave","why":"Sixth Ave from 18th to 23rd St is lined with Gilded Age department-store palaces; Siegel-Cooper was once the world's largest store.","tip":"Walk 6th Ave from 18th to 23rd and look above the ground-floor chain stores at the cast-iron and terra-cotta.","x":206.18,"y":1116.85}],"coffee":[{"name":"Devoción","address":"25 E 20th St","why":"Colombian beans that get from farm to roast in days, served in a skylit room full of plants.","tip":"Ask for whatever single-origin is on pour-over and sit under the skylight.","x":235.2,"y":1107.74},{"name":"Joe Coffee (Flatiron)","address":"186 5th Ave","why":"A New York-grown roaster doing a consistently well-made espresso right by the Flatiron Building.","tip":"It closes at 5pm weekdays and 3pm weekends.","x":226.33,"y":1092.94},{"name":"Maman","address":"3 W 18th St","why":"A French-Canadian bakery-cafe known for its huge nutty chocolate chip cookies and a pretty country-kitchen room.","tip":"Get the cookie to go.","x":225.95,"y":1117.39}],"park":[{"name":"Madison Square Park","address":"Madison Square Park, 23rd St & 5th Ave","why":"A Victorian park with a big public-art installation and views of the Flatiron and Met Life towers; the Statue of Liberty's arm was displayed here.","tip":"See whatever the Madison Square Park Conservancy has on its central lawn, then look up at the Met Life clock tower.","x":234.25,"y":1084.18},{"name":"Flatiron Public Plazas","address":"Broadway & 5th Ave at 23rd St","why":"Pedestrian plazas carved out of the Broadway/Fifth crossing, with the best seats for watching the Flatiron.","tip":"Grab a cafe table at the north plaza and watch the traffic swirl around the building's prow.","x":226.35,"y":1085.37},{"name":"General Worth Square","address":"Broadway & 5th Ave at 25th St","why":"A tiny triangle with an obelisk that's actually a grave: General William Worth is buried under it.","tip":"Read the obelisk's inscriptions; General Worth is one of very few people buried under a Manhattan street monument.","x":226.35,"y":1085.37}],"bite":[{"name":"S&P Lunch","address":"174 5th Ave","why":"The revived old Eisenberg's counter, still serving egg creams and tuna melts at the lunch counter since 1929.","order":"A tuna melt and a chocolate egg cream at the counter.","x":226.31,"y":1097.09},{"name":"Breads Bakery","address":"18 E 16th St","why":"Tel Aviv-style bakery whose chocolate babka is the best-known loaf in the neighborhood.","order":"Chocolate babka and a rugelach to go.","x":228.36,"y":1127.08},{"name":"Rezdôra","address":"27 E 20th St","why":"Emilia-Romagna pasta that's become one of the city's most-loved Italian rooms; book lunch for an easier table.","order":"Whatever stuffed pasta is on, plus the gnocco fritto.","x":235.49,"y":1107.74}],"bite_gf":[{"name":"Springbone Kitchen","address":"38 E 23rd St","why":"A dedicated gluten-free bone-broth and bowls spot, so you can order anything on the menu.","order":"A bone broth plus a chicken or steak bowl.","gf_level":"dedicated","x":238.61,"y":1092.28},{"name":"COQODAQ","address":"12 E 22nd St","why":"Korean fried chicken that reviewers and celiac maps call crispy and gluten-free, from the team behind COTE.","order":"The fried chicken bucket; confirm sauces with your server.","gf_level":"GF options w/ precautions","x":231.28,"y":1097.79}],"bar":[{"name":"Old Town Bar","address":"45 E 18th St","why":"An 1890s saloon with a mahogany bar, tin ceiling, wooden booths and dumbwaiter, and still a cheap-pint neighborhood bar.","type":"dive","x":239.16,"y":1117.42},{"name":"Raines Law Room","address":"48 W 17th St","why":"A ring-the-bell speakeasy with velvet couches and a call button for table service, serious about its classics.","type":"cocktail","x":216.7,"y":1122.25},{"name":"Hill Country's Boot Bar","address":"30 W 26th St","why":"The downstairs bar at Hill Country has live country, honky-tonk and roots music just about every night.","type":"music","x":217.73,"y":1076.54}]}},{"name":"Governors Island","tagline":"Car-free island of forts, hammocks and hilltop harbor views, minutes from Manhattan","getting_there":"R/W from 8 St–NYU to Whitehall St (about 15 minutes), then walk to the Battery Maritime Building (10 South St) for the Trust ferry, a 7-minute ride at $5 round trip. It's free before 11am on Sat/Sun, ferries run about every 30 minutes (every 15 on weekend days), and you can reserve at govisland.com. FALL HOURS (Oct 2026): the island is open 7am-6pm daily, the last public ferry from Manhattan is 4:15pm, the last boat back is 6pm, and South Island (The Hills, Hammock Grove, Picnic Point) closes at dusk. NYC Ferry's South Brooklyn route from Wall St/Pier 11 also stops at the island, and weekend Brooklyn boats from Pier 6 and Red Hook run through Nov 1.","stops":{"known_for":[{"name":"Castle Williams","address":"Castle Williams, northwest shore of Governors Island","why":"A round red-sandstone fort from 1811, built to defend the harbor and later used as a military prison, now run by the National Park Service.","tip":"Forts are typically open Wed-Sun 10-5 in fall; go up to the rooftop for a dead-on view of the Statue of Liberty and FiDi.","x":255.59,"y":1479.23},{"name":"Fort Jay","address":"Fort Jay, center of Governors Island","why":"The star-shaped fort with a dry moat and grand sally port that has crowned the island since the Revolutionary era.","tip":"Walk the ramparts, and pick up the free NPS ranger talk if one is running.","x":275.73,"y":1479.81},{"name":"Nolan Park & Colonels Row","address":"Nolan Park, Governors Island","why":"Shady lawns lined with yellow 19th-century officers' houses, many now open as artist studios and galleries.","tip":"Wander into whichever houses have open doors for art shows; the island's Pumpkin Point fall festival has been held here in late October.","x":285.96,"y":1481.22}],"coffee":[{"name":"Makina Café","address":"Governors Island, near Liggett Terrace","why":"An Ethiopian and Eritrean spot on a big lawn with lawn games, where the coffee and food are a real step up from park-concession fare.","tip":"Open weekdays 9-3 and weekends 10-4; pair a buna with a lentil sambusa.","x":281.66,"y":1505.1},{"name":"Joe Coffee (Liggett Terrace)","address":"Liggett Terrace, Governors Island","why":"The reliable cup in the middle of the island, right by the food court and bike rentals.","tip":"Open daily 9-5; grab one before biking to the Hills.","x":281.66,"y":1505.1},{"name":"Joe Coffee (Battery Maritime Building)","address":"10 South St","why":"The ferry-terminal outpost for caffeinating before you board on the Manhattan side.","tip":"Opens 7am, closes 2pm in the off-season, so get it on the way out.","x":262.34,"y":1401.0}],"park":[{"name":"The Hills (Outlook Hill)","address":"Outlook Hill, South Island, Governors Island","why":"Man-made hills built from demolition fill, rising about 70 feet for 360-degree views of the Statue of Liberty, the harbor and lower Manhattan.","tip":"Climb Outlook Hill for the view and then take the long Slide Hill slides down; it closes at dusk.","x":284.8,"y":1535.6},{"name":"Hammock Grove","address":"Hammock Grove, South Island, Governors Island","why":"A young grove of trees strung with dozens of free public hammocks.","tip":"Claim a hammock on a weekday afternoon in fall when it's nearly empty.","x":291.46,"y":1513.72},{"name":"Picnic Point","address":"Picnic Point, southern tip of Governors Island","why":"The island's southern tip, with Adirondack chairs, picnic tables and the closest land view of Lady Liberty.","tip":"Grills can be reserved here through November ($30); otherwise just sit on the rocks and watch the harbor traffic.","x":282.45,"y":1555.09}],"bite":[{"name":"Taco Vista","address":"Soissons Landing, Governors Island","why":"The island's signature beach-shack taqueria by the ferry dock, with sand underfoot and a skyline view.","order":"Fish tacos and a frozen margarita.","x":279.2,"y":1466.78},{"name":"Little Eva's","address":"Liggett Terrace, Governors Island","why":"A longtime island favorite for burgers, hot dogs and fish and chips at the central food court.","order":"Fish and chips or a cheeseburger, eaten on the terrace.","x":281.66,"y":1505.1},{"name":"Pizzeria Fantastica","address":"Colonels Row, Governors Island","why":"From the Pizza Yard team, wood-fired pies right by the historic houses.","order":"A margherita; weekends only, 11-5.","x":275.73,"y":1491.03}],"bite_gf":[],"bar":[{"name":"Threes Brewing (Governors Island)","address":"Governors Island, near Liggett Terrace","why":"There's no dive on the island, so Brooklyn's Threes Brewing beer garden is the move for a fresh pint on the lawn (weekends 11-6).","type":"other","x":284.76,"y":1505.04},{"name":"Sunset Terrace at Collective Retreats","address":"Collective Retreats, Governors Island","why":"The glamping retreat's open-air cocktail bar faces the harbor at sunset, and it's open to day visitors through November.","type":"cocktail","x":274.74,"y":1528.78,"approx":1},{"name":"Six Coasts by Smorgasburg","address":"Soissons Landing, Governors Island","why":"Smorgasburg's big waterfront restaurant and 100-seat outdoor bar, which replaced Island Oyster and programs live music, film nights and tropical cocktails.","type":"music","x":279.2,"y":1466.78}]}},{"name":"Gramercy","tagline":"Gaslit townhouses, a locked private park, and 1860s taverns.","getting_there":"It's a walk: about 15 minutes north from Astor Pl up 3rd Ave or Irving Pl.","stops":{"known_for":[{"name":"National Arts Club","address":"15 Gramercy Park S","why":"Gov. Samuel Tilden's Gothic Revival mansion, now an arts club with public gallery shows.","tip":"Galleries are usually free on weekdays; buzz in and ask what's showing, and look for Tilden's carved stone heads on the facade.","x":254.36,"y":1107.76},{"name":"The Players","address":"16 Gramercy Park S","why":"Edwin Booth's 1888 actors' club, remodeled by Stanford White, right next door to the Arts Club.","tip":"Private club, so admire the ironwork porch from the sidewalk, then find Booth's statue inside the park fence.","x":254.36,"y":1107.76},{"name":"Block Beautiful","address":"E 19th St between Irving Pl and 3rd Ave","why":"One of Manhattan's prettiest single blocks: 1920s stucco-and-tile carriage houses with lanterns and ironwork.","tip":"Walk it east to west in late afternoon light; it's two minutes from Pete's Tavern.","x":261.7,"y":1112.59}],"coffee":[{"name":"Irving Farm Coffee Roasters","address":"71 Irving Pl","why":"The original Irving Farm, a cozy half-basement café that started the roaster back in 1996.","x":256.69,"y":1115.35},{"name":"Daily Provisions","address":"103 E 19th St","why":"Danny Meyer's bakery-café next to Union Square Cafe; get the maple cruller with your coffee.","x":247.76,"y":1112.63},{"name":"Caffè Panna","address":"77 Irving Pl","why":"Hallie Meyer's Roman-style gelato and coffee spot; the affogato is the move. Opens 1:30pm, closed Mondays.","x":256.68,"y":1113.28}],"park":[{"name":"Gramercy Park","address":"Gramercy Park S & Irving Pl","why":"Manhattan's last private, key-only park, ringed by 19th-century mansions.","x":256.6,"y":1107.76},{"name":"Stuyvesant Square","address":"2nd Ave between E 15th St and E 17th St","why":"An 1840s cast-iron-fenced square split by 2nd Ave, beside St. George's Church and the Friends Meeting House.","x":280.79,"y":1127.34},{"name":"Stuyvesant Cove Park","address":"FDR Dr between E 18th St and E 23rd St","why":"A native-plant waterfront strip on the East River, the closest river spot to Gramercy.","x":318.64,"y":1092.0}],"bite":[{"name":"Casa Mono","address":"52 Irving Pl","why":"A tiny, loud Spanish tapas counter that's been an Irving Place favorite for 20 years.","order":"Sit at the counter; get the razor clams a la plancha and the croquetas.","x":256.71,"y":1122.26},{"name":"Rolf's","address":"281 3rd Ave","why":"An old Bavarian beer hall famous for its over-the-top holiday decor; it gets wild from November on.","order":"Wiener schnitzel with potato pancakes and a liter of German beer.","x":266.68,"y":1097.82},{"name":"Ess-a-Bagel","address":"324 1st Ave","why":"One of the city's benchmark hand-rolled bagels; huge, chewy, and generously schmeared.","order":"Everything bagel with scallion cream cheese and nova.","x":296.76,"y":1112.6}],"bite_gf":[],"bar":[{"name":"Pete's Tavern","address":"129 E 18th St","why":"O. Henry's local, with a tin ceiling, old wooden booths, and a long mahogany bar. Neighborhood regulars, not a tourist set piece.","tag":"Oldest continuously operating bar · since 1864","type":"dive","x":256.97,"y":1117.42},{"name":"Dear Irving","address":"55 Irving Pl","why":"A plush, era-hopping cocktail parlor with real bartending craft and seated, reservation-friendly service.","type":"cocktail","x":256.7,"y":1120.64},{"name":"Irving Plaza","address":"17 Irving Pl","why":"A 1,000-capacity rock club with balcony bars and a busy fall 2026 lineup of indie, punk, and hip-hop shows.","type":"music","x":256.68,"y":1131.77}]}},{"name":"Greenwich Village","tagline":"Washington Square, folk-era stages and MacDougal Street late nights","getting_there":"A 10-minute walk west from Astor Pl along 8th St to Washington Square Park.","stops":{"known_for":[{"name":"Jefferson Market Library","address":"425 6th Ave","why":"A Victorian Gothic courthouse turned public library, with a clock tower that has been a Village landmark since 1877.","tip":"Go inside to see the stained glass and spiral stairs; the brick-vaulted basement reading room is the old jail.","x":206.27,"y":1163.66},{"name":"Comedy Cellar","address":"117 MacDougal St","why":"The city's best-known basement comedy club, where big names drop in unannounced on any night.","tip":"Book a few days ahead online; the late shows get the surprise drop-ins.","x":214.59,"y":1193.4},{"name":"Washington Mews","address":"Washington Mews, 5th Ave & Washington Sq N","why":"A cobblestone lane of converted 1830s stables just off the park, now NYU buildings.","tip":"Enter from Fifth Ave just north of the Arch and walk through to University Pl.","x":226.44,"y":1176.0}],"coffee":[{"name":"Caffe Reggio","address":"119 MacDougal St","why":"Open since 1927, it claims to have brought cappuccino to America, and the dark Renaissance-art room is unchanged.","tip":"Get a cappuccino and a cannoli at a sidewalk table and people-watch MacDougal.","x":214.66,"y":1192.45},{"name":"Third Rail Coffee","address":"240 Sullivan St","why":"A tiny, serious espresso bar near the park, popular with locals.","tip":"Take it to go and drink it at the fountain in Washington Square.","x":219.59,"y":1192.7},{"name":"Porto Rico Importing Co.","address":"201 Bleecker St","why":"A family coffee importer since 1907, with burlap sacks of beans and a counter selling a cheap, strong cup.","tip":"Buy a half-pound of a house blend to take home.","x":212.22,"y":1201.27}],"park":[{"name":"Washington Square Park","address":"Washington Square Park, 5th Ave & Waverly Pl","why":"The Village's town square, with buskers, chess hustlers, and the 1892 Stanford White arch.","tip":"Play or watch a game at the southwest-corner chess tables, then catch whoever's busking by the fountain.","x":227.05,"y":1180.76},{"name":"Jefferson Market Garden","address":"70A Greenwich Ave","why":"A volunteer-run garden on the site of the old women's prison, tucked behind the library with a fish pond and roses.","tip":"Open afternoons in season through October; enter from Greenwich Ave.","x":189.3,"y":1154.9},{"name":"LaGuardia Corner Gardens","address":"511 LaGuardia Pl","why":"A neighbors' community garden with fig trees and flowers, squeezed between NYU towers.","tip":"Weekend afternoons are when members are usually there to open the gate.","x":228.59,"y":1203.53}],"bite":[{"name":"Joe's Pizza","address":"7 Carmine St","why":"The benchmark New York slice, at this corner since 1975.","order":"A plain slice and a fresh mozzarella slice, eaten standing on Carmine.","x":205.54,"y":1195.34},{"name":"Mamoun's Falafel","address":"MacDougal St between Bleecker St and W 3rd St","why":"Falafel since 1971, open late, cheap and still the MacDougal standard.","order":"A falafel sandwich with plenty of the hot sauce.","x":214.44,"y":1195.96},{"name":"Rocco's Pastry Shop","address":"243 Bleecker St","why":"An old-line Italian pastry shop where the cannoli are filled to order.","order":"A cannoli and a sfogliatella with an espresso.","x":201.23,"y":1195.47}],"bite_gf":[{"name":"Senza Gluten","address":"206 Sullivan St","why":"A 100% gluten-free Italian restaurant whose kitchen and dining room are strictly GF, so you can order fresh pasta and bread without asking anything.","order":"Fresh fettuccine plus the fried calamari; it's cash only.","gf_level":"dedicated","x":219.11,"y":1200.37}],"bar":[{"name":"The Back Fence","address":"155 Bleecker St","why":"An old sawdust-and-peanuts Bleecker bar with cheap beer and a guy with an acoustic guitar most nights.","type":"dive","x":223.96,"y":1202.06},{"name":"Caffe Dante","address":"79-81 MacDougal St","why":"A 1915 Italian cafe reborn as a world-ranked cocktail bar; the Negroni list and martinis are excellent.","type":"cocktail","x":213.91,"y":1204.25},{"name":"The Bitter End","address":"147 Bleecker St","why":"NYC's oldest rock club (opened in 1961), with live music every night on the stage where Dylan, Joni and Springsteen played.","type":"music","x":226.78,"y":1202.26}]}},{"name":"Harlem","tagline":"Brownstone boulevards, soul food, and jazz that never really left","getting_there":"6 train from Astor Pl to 125 St (~25 min), then walk west along 125th; or walk to 8 St-NYU, R/W to Times Sq, and the 2/3 express to 116th, 125th or 135th St.","stops":{"known_for":[{"name":"Studio Museum in Harlem","address":"144 W 125th St","why":"The museum's new building on 125th is Harlem's showcase for artists of African descent, and it's the institution behind decades of breakout talent.","tip":"Get a coffee in the lower-level Studio Cafe. The Apollo marquee is a block west, but the theater itself is closed for renovations until spring 2027, so just take a photo outside.","x":197.43,"y":556.4},{"name":"Strivers' Row","address":"W 138th St & W 139th St between Adam Clayton Powell Jr Blvd and Frederick Douglass Blvd","why":"These are two blocks of 1890s rowhouses by McKim, Mead & White and others, and some of the finest residential architecture in the city.","tip":"Look for the old 'Walk Your Horses' signs on the alley gates, then go a block east to Abyssinian Baptist Church at 132 W 138th St.","x":176.68,"y":484.55},{"name":"Schomburg Center for Research in Black Culture","address":"515 Malcolm X Blvd","why":"The NYPL research library holds one of the world's great archives of the African diaspora, with free rotating exhibitions.","tip":"Langston Hughes's ashes are under the 'Rivers' floor medallion in the atrium, so find it before you leave.","x":204.9,"y":499.66}],"coffee":[{"name":"Double Dutch Espresso","address":"2194 Frederick Douglass Blvd","why":"This is a longtime Frederick Douglass Blvd hangout with seating out front and a back patio, and it's good for a slow first stop.","x":169.74,"y":591.81},{"name":"Sojourner Coffee Co.","address":"137 W 116th St","why":"It's a newer independent shop on 116th and a good refuel between Malcolm X Blvd and Frederick Douglass Blvd.","x":198.84,"y":603.92},{"name":"Common Good","address":"2801 Frederick Douglass Blvd","why":"This neighborhood favorite at the top of Harlem is a natural stop before or after Jackie Robinson Park and Sugar Hill.","x":169.64,"y":430.7}],"park":[{"name":"Marcus Garvey Park","address":"Mount Morris Park W & W 122nd St","why":"Climb the rocky 'acropolis' to the restored 1850s cast-iron fire watchtower, which is the last one left in the city, for views over Harlem's rooftops.","x":215.52,"y":572.31},{"name":"St. Nicholas Park","address":"St Nicholas Ave & W 135th St","why":"Take the stairs up the schist cliffs to City College's Gothic campus and Hamilton Grange at the top.","x":160.5,"y":504.07},{"name":"Harlem Meer","address":"Central Park N & Malcolm X Blvd","why":"Walk the loop of Central Park's northern lake past the Dana Discovery Center, which runs catch-and-release fishing in season, so check its hours.","x":204.92,"y":635.22}],"bite":[{"name":"Sylvia's","address":"328 Malcolm X Blvd","why":"The Queen of Soul Food has served Harlem since 1962, and it really is as beloved as its reputation.","order":"Fried chicken with collards, mac and cheese, and candied yams","x":205.85,"y":548.28},{"name":"Melba's","address":"300 W 114th St","why":"Melba Wilson's cozy corner spot is the neighborhood's go-to for Southern comfort food done with care.","order":"Chicken and eggnog waffles","x":169.77,"y":614.67},{"name":"Charles Pan-Fried Chicken","address":"439 W 125th St","why":"Chef Charles Gabriel's pan-fried chicken is a Harlem legend, crisp and juicy with no frills.","order":"Pan-fried chicken plate with mac and cheese and cornbread","x":140.81,"y":553.22}],"bite_gf":[],"bar":[{"name":"A Touch of Dee","address":"657 Malcolm X Blvd","why":"A narrow, red-neon, cash-only Lenox Ave saloon with regulars yelling at the TV — Harlem's real neighborhood dive.","type":"dive","x":204.93,"y":463.51},{"name":"Sugar Monk","address":"2292 Frederick Douglass Blvd","why":"This dim speakeasy builds serious, inventive cocktails on house spirits, and it launched a new 'celestial' menu in 2026.","type":"cocktail","x":169.72,"y":566.62},{"name":"Shrine","address":"2271 Adam Clayton Powell Jr Blvd","why":"Since 2007 this no-frills bar has packed several live acts into most nights, from Afrobeat and jazz to indie and reggae, often with no cover.","type":"music","x":188.05,"y":511.55}]}},{"name":"Hell's Kitchen","tagline":"Ninth Avenue food crawl, old tenement bars, and jazz basements.","getting_there":"L from 1 Av or 3 Av to 8 Av, then the A/C/E uptown to 42 St or 50 St (about 25 min). Or take the R/W to 49 St and walk west.","stops":{"known_for":[{"name":"Intrepid Museum","address":"Pier 86, W 46th St & 12th Ave","why":"A WWII aircraft carrier turned museum, home to the Space Shuttle Enterprise, which turned 50 in September 2026.","tip":"Go straight to the Space Shuttle Pavilion first, then the flight deck for Concorde and the Blackbird.","x":103.98,"y":972.5},{"name":"The Actors Studio","address":"432 W 44th St","why":"The converted church where Brando, Pacino and Newman studied the Method; you can only see it from the street, but it's a true pilgrimage spot.","tip":"Look for the small plaque by the door, then walk past the tenements on 44th that give the neighborhood its old grit.","x":146.65,"y":982.93},{"name":"Landmark Tavern","address":"626 11th Ave","why":"Open since 1868 on what used to be the Hudson waterfront, with a mahogany bar and a speakeasy past.","tip":"Order a pint at the original bar and ask to see the upstairs rooms.","x":116.81,"y":972.57}],"coffee":[{"name":"Coffee Project New York","address":"840 9th Ave","why":"This roaster opened its Hell's Kitchen cafe in December 2025, with rotating single-origin pour-overs and inventive signature drinks.","x":152.39,"y":926.04},{"name":"St Kilda Coffee","address":"374 W 46th St","why":"An Aussie-style flat white specialist with a tiny, friendly room just off Ninth Avenue.","x":156.82,"y":972.5},{"name":"Bird & Branch","address":"359 W 45th St","why":"A cozy local favorite known for its house-made nut milks and coffee flights.","x":159.71,"y":977.76}],"park":[{"name":"Clinton Community Garden","address":"434 W 48th St","why":"A community garden saved from developers in the 1970s, with a front garden open to the public.","tip":"Walk through the front lawn and look at the beehives and herb beds; open to the public on weekends.","x":146.23,"y":962.24},{"name":"Hudson River Park Pier 84","address":"W 44th St & 12th Ave","why":"A big public pier with river views, kayaking in season and the Intrepid next door.","tip":"Watch the sunset over New Jersey from the end of the pier.","x":103.03,"y":982.7},{"name":"DeWitt Clinton Park","address":"W 52nd St & 11th Ave","why":"The neighborhood's own park, with ballfields, a well-loved dog run and a WWI doughboy statue.","tip":"Watch the dogs at the 52nd St run, then find the doughboy statue near 11th Ave.","x":116.73,"y":941.55}],"bite":[{"name":"Pure Thai Cookhouse","address":"766 9th Ave","why":"A tiny, loud Thai kitchen that anchors Ninth Avenue's Little Thailand strip.","order":"Ratchaburi crab and pork dry noodles","x":152.38,"y":945.59},{"name":"Empanada Mama","address":"763 9th Ave","why":"A 24/7 Colombian empanada spot that works any time of day or night.","order":"A mix of empanadas, including the Viagra (seafood) and the beef","x":152.38,"y":945.71},{"name":"Sullivan Street Bakery","address":"533 W 47th St","why":"Jim Lahey's flagship bakery, famous for its Roman-style flatbreads and bombolini.","order":"Pizza bianca or patate squares, plus a bombolone","x":126.53,"y":967.41}],"bite_gf":[],"bar":[{"name":"Rudy's Bar & Grill","address":"627 9th Ave","why":"A red-booth dive with free hot dogs and cheap pitchers, open until 4am, with a giant pig statue out front.","tag":"Since 1933","type":"dive","x":152.46,"y":981.64},{"name":"Dutch Fred's","address":"307 W 47th St","why":"A 1920s-style speakeasy room with mosaic floors, old movies on the walls and a serious signature cocktail list.","type":"cocktail","x":169.17,"y":967.47},{"name":"Birdland","address":"315 W 44th St","why":"The jazz club named for Charlie Parker, with top-tier big bands and trios every night.","type":"music","x":167.73,"y":982.93}]}},{"name":"Inwood","tagline":"Manhattan's last forest, salt marsh, and Dyckman Street energy","getting_there":"Walk to W 4 St-Washington Sq (~12 min) and take the A express to Dyckman St or Inwood-207 St, about 40-45 min.","stops":{"known_for":[{"name":"Dyckman Farmhouse Museum","address":"4881 Broadway","why":"Manhattan's last Dutch colonial farmhouse (c. 1785) still stands on a hill above Broadway with its garden.","tip":"Check the open hours (usually Thu-Sun), and see the reconstructed Revolutionary War hut out back.","x":104.81,"y":122.47},{"name":"Shorakkopoch Rock","address":"Inwood Hill Park near Seaman Ave & W 214th St","why":"A plaque marks where, by legend, Peter Minuit bought Manhattan from the Lenape under a giant tulip tree.","tip":"Keep going uphill into the old-growth forest to find the rock overhangs known as the 'Indian caves'.","x":82.3,"y":89.69},{"name":"Columbia 'C' Rock view","address":"Indian Rd & W 218th St","why":"From the Muscota Marsh boardwalk you look across Spuyten Duyvil Creek at the huge blue Columbia 'C' painted on the cliff.","tip":"Go near sunset, when the cliff and the Henry Hudson Bridge glow.","x":106.22,"y":72.14}],"coffee":[{"name":"Kuro Kirin Espresso & Coffee","address":"4795 Broadway","why":"A small specialty espresso bar by the Dyckman St station, quiet and friendly.","x":95.45,"y":135.5},{"name":"Mon Amour Coffee & Wine","address":"231A Dyckman St","why":"This Parisian-style Dyckman cafe does good espresso, pastries and sandwiches, and turns to wine later in the day.","x":86.41,"y":141.62},{"name":"CHOCnyc","address":"4996 Broadway","why":"This Inwood bakery-cafe is known for its croissants and chocolate chip cookies, so pair one with a coffee.","x":121.06,"y":101.62}],"park":[{"name":"Inwood Hill Park","address":"Indian Rd & W 218th St","why":"Hike the trails through Manhattan's last natural forest and salt marsh, from the nature center up to the ridge overlooking the Hudson.","x":106.22,"y":72.14},{"name":"Isham Park","address":"Isham St & Seaman Ave","why":"This quiet, sloping lawn overlooks the neighborhood and makes a good picnic spot before you head into Inwood Hill Park.","x":105.38,"y":98.5},{"name":"Swindler Cove Park","address":"Harlem River Dr & Dyckman St","why":"Walk the restored Harlem River cove and its gardens and see the floating Peter Jay Sharp Boathouse.","x":120.51,"y":183.4}],"bite":[{"name":"Patacon Pisao","address":"431 W 202nd St","why":"The original Venezuelan truck-turned-institution stays open into the small hours, and its fried-plantain sandwiches are legendary uptown.","order":"Patacón with pernil or carne mechada (cash)","x":141.88,"y":153.55},{"name":"Mamajuana Cafe","address":"247 Dyckman St","why":"It's the high-energy heart of Dyckman's Latin dining strip, and a classic for brunch or a loud dinner.","order":"Mofongo and a mamajuana cocktail","x":82.78,"y":140.4},{"name":"Tiny Tapas and Bites","address":"501 W 214th St","why":"This little neighborhood tapas spot is cozy, lively and good for sharing a lot of small plates.","order":"Croquetas and a few plates to share","x":133.84,"y":90.88}],"bite_gf":[],"bar":[{"name":"Tubby Hook Tavern","address":"4946 Broadway","why":"This no-frills Broadway tavern does trivia and karaoke, and it's the locals' cheap-beer hangout at the old Piper's Kilt address.","type":"dive","x":112.82,"y":111.61},{"name":"Liffy II Bar","address":"5009 Broadway","why":"A cozy, cheap, drinks-first bar up near 207th St that locals love for an easy round.","type":"cocktail","x":126.24,"y":93.0},{"name":"Cinco Ocho Wine Room","address":"3775 10th Ave","why":"This speakeasy-style wine room has Prohibition decor, a cork-covered ceiling and live jazz, and it opens Thu-Sun from 4pm.","type":"music","x":133.81,"y":153.01}]}},{"name":"Kips Bay","tagline":"Curry Hill spice aisles, deli legends, and a quiet East River edge.","getting_there":"6 train from Astor Pl to 28 St (two stops), or walk about 20 minutes up 3rd Ave.","stops":{"known_for":[{"name":"Kalustyan's","address":"123 Lexington Ave","why":"A spice and specialty-food emporium open since 1944, the anchor of Curry Hill.","tip":"Go upstairs for the hard-to-find spices and dried chilies; it's open until 8pm Monday to Saturday.","x":256.59,"y":1064.67},{"name":"69th Regiment Armory","address":"68 Lexington Ave","why":"A Beaux-Arts armory and the site of the 1913 Armory Show that brought modern art to America.","tip":"Check the schedule for an art fair or event, since that's how you get inside; otherwise admire the mansard drill-hall facade from Lex.","x":256.61,"y":1079.43},{"name":"Bellevue Hospital & Old Psychiatric Pavilion","address":"462 1st Ave","why":"Bellevue, founded in 1736, is the oldest public hospital in the US; the brick-and-iron 1930s psych pavilion still stands on 30th St.","tip":"See the old pavilion's gates at 1st Ave & E 30th St, then walk the Bellevue courtyard to the river.","x":295.53,"y":1071.52}],"coffee":[{"name":"Felix Roasting Co.","address":"450 Park Ave S","why":"A maximalist, jewel-box café with a serious espresso program and inventive coffee cocktails.","x":246.07,"y":1053.91},{"name":"Banter","address":"201 E 31st St","why":"An Aussie-style café with good flat whites and an all-day menu, a cut above the corner-deli options.","x":266.59,"y":1051.08},{"name":"Sunflower Gramercy","address":"335 3rd Ave","why":"A sunny neighborhood café with outdoor seating, good for a coffee before Curry Hill.","x":266.64,"y":1082.86}],"park":[{"name":"Bellevue South Park","address":"E 26th St to E 28th St between 1st Ave and 2nd Ave","why":"The neighborhood's green heart, tucked between the towers.","x":288.14,"y":1071.52},{"name":"Waterside Plaza","address":"FDR Dr between E 25th St and E 30th St","why":"A raised 1970s plaza over the East River, reached by a footbridge, and almost nobody knows it's public.","x":311.07,"y":1068.97},{"name":"Asser Levy Recreation Center","address":"392 Asser Levy Pl","why":"A 1908 Roman-bathhouse-style public bath, landmarked and still in use as a rec center.","x":313.53,"y":1088.14}],"bite":[{"name":"2nd Ave Deli","address":"162 E 33rd St","why":"The kosher deli institution, still piling pastrami a mile high since it moved here from the East Village.","order":"Pastrami on rye and a bowl of matzo ball soup; the free pickles and health salad come first.","x":260.35,"y":1040.89},{"name":"Taste From Everest","address":"102 Lexington Ave","why":"A tiny Nepali spot on Curry Hill that locals swear by for dumplings.","order":"Jhol momos and the Nepali duck curry.","x":256.59,"y":1070.93},{"name":"Vatan","address":"409 3rd Ave","why":"A Gujarati vegetarian thali house in a village-style dining room, with unlimited refills.","order":"The prix-fixe thali; come hungry.","x":266.61,"y":1062.44}],"bite_gf":[],"bar":[{"name":"Failte Irish Whiskey Bar","address":"531 2nd Ave","why":"A wood-and-brick Irish pub with fireplaces, a proper pour, and a regulars' crowd instead of a frat scene.","type":"dive","x":280.75,"y":1058.73},{"name":"Nonna Dora's Pasta Bar","address":"606 2nd Ave","why":"Handmade-pasta spot with a big, serious Negroni list; take a bar stool for drinks.","type":"other","x":280.67,"y":1038.96},{"name":"Paddy Reilly's Music Bar","address":"519 2nd Ave","why":"A long-running Irish music bar with trad sessions and bands most nights and Guinness as the house drink.","type":"music","x":280.67,"y":1061.31}]}},{"name":"Little Italy","tagline":"Red-sauce Mulberry Street, old cafes and Sinatra-era bars","getting_there":"Take the 6 from Astor Pl two stops to Spring St, then walk east to Mulberry. Or walk about 20 minutes down Lafayette or the Bowery.","stops":{"known_for":[{"name":"Mulberry Street","address":"Mulberry St between Canal St and Broome St","why":"The heart of what's left of Little Italy and the route of the Feast of San Gennaro, with Chinatown pressing in from the south.","tip":"Skip the hosts waving menus. Look at the 1880s tenements and stop at Most Precious Blood (113 Baxter St), the shrine church of San Gennaro.","x":267.11,"y":1257.65},{"name":"Di Palo's Fine Foods","address":"200 Grand St","why":"A family Italian food shop since 1925 where the fourth generation still hand-picks cheese and cures. This is the real Little Italy.","tip":"Take a number and ask for a taste of the fresh ricotta and an aged Parmigiano.","x":270.94,"y":1252.92},{"name":"Old Police Headquarters","address":"240 Centre St","why":"A 1909 Beaux-Arts palace with a dome, built as the NYPD's headquarters and now luxury condos.","tip":"Look from Centre Market Place behind it, where the old gun shops served the cops.","x":259.92,"y":1250.96}],"coffee":[{"name":"Caffe Roma","address":"385 Broome St","why":"An 1891 pastry cafe with tin ceilings and marble tables that's barely changed in a century.","order":"Espresso and a cannoli or sfogliatella","x":265.34,"y":1244.56},{"name":"Ferrara Bakery & Cafe","address":"195 Grand St","why":"Serving espresso and Italian pastries on Grand St since 1892, and a true institution even if it gets busy.","order":"Cappuccino and a lobster tail","x":268.89,"y":1253.11},{"name":"Cafe Integral","address":"149 Elizabeth St","why":"A small specialty bar pouring single-origin Nicaraguan coffee, run by the family that sources it.","order":"Cortado or the house cold brew","x":274.36,"y":1241.05}],"park":[{"name":"Petrosino Square","address":"Lafayette St & Kenmare St","why":"A small triangular plaza named for Joe Petrosino, the NYPD detective who fought the Black Hand, with rotating public art.","tip":"See whatever public sculpture is up and read the Petrosino plaque.","x":257.15,"y":1240.24},{"name":"Elizabeth Street Garden","address":"209 Elizabeth St","why":"A one-acre sculpture garden full of statues and flowers, saved for good in 2026 after a 13-year fight.","tip":"Wander the statues and balustrades. It's open to the public most days.","x":271.08,"y":1226.37},{"name":"DeSalvio Playground","address":"Spring St & Mulberry St","why":"A small neighborhood park named for a local Little Italy figure, where old-timers still play bocce-style games and cards.","tip":"Grab a bench with a pastry from Caffe Roma.","x":262.99,"y":1233.9}],"bite":[{"name":"Nyonya","address":"199 Grand St","why":"A long-running, cash-friendly Malaysian spot that locals love, with big portions.","order":"Roti canai and the nasi lemak","x":270.53,"y":1252.96},{"name":"Pasquale Jones","address":"187 Mulberry St","why":"A wood-fired pizza and pasta place from the Charlie Bird team, right on Mulberry, and the best Italian meal on the strip.","order":"Clam pie and a pasta to share","x":264.25,"y":1239.64},{"name":"Golden Steamer","address":"143 Mott St","why":"A tiny takeout counter famous for its steaming pumpkin buns.","order":"Pumpkin bun and a salted egg yolk bun","x":272.55,"y":1254.78}],"bite_gf":[],"bar":[{"name":"Mulberry Street Bar","address":"176 1/2 Mulberry St","why":"The old Mare Chiaro, a.k.a. 'the Sinatra Bar': a long, dark wood barroom that has shown up in The Godfather Part III and The Sopranos.","tag":"Old-school · since 1908","type":"dive","x":265.34,"y":1244.56},{"name":"Onieal's","address":"174 Grand St","why":"A dark, old-world restaurant-bar in a former Prohibition speakeasy across from the old police headquarters, open late with solid cocktails.","type":"other","x":262.74,"y":1253.63},{"name":"Gelso & Grand","address":"186 Grand St","why":"A corner Italian spot with a big bar and windows open onto Mulberry, good for an aperitivo or spritz.","type":"other","x":267.25,"y":1253.26}]}},{"name":"Lower East Side","tagline":"Tenements, pickles and pastrami by day; loud little bars by night","getting_there":"Walk: about 15-20 minutes south down 1st or 2nd Ave to Houston St. Or take the F from 2 Av one stop to Delancey St-Essex St.","stops":{"known_for":[{"name":"Tenement Museum","address":"103 Orchard St","why":"Guided tours go through real restored apartments of immigrant families who lived at 97 Orchard St, and they're the best way into the neighborhood's history.","tip":"Book a timed apartment tour ahead. The new 4A Moores tour, 'A Union of Hope, 1869,' just launched.","x":304.82,"y":1238.29},{"name":"Museum at Eldridge Street","address":"12 Eldridge St","why":"An 1887 synagogue with a huge stained-glass rose window, one of the first great houses of worship built by Eastern European Jews in America.","tip":"Take the docent tour, and look up at the 2010 star-filled east window by Kiki Smith.","x":300.54,"y":1273.01},{"name":"Russ & Daughters","address":"179 E Houston St","why":"The appetizing shop that has been slicing smoked fish since 1914, and still the purest taste of the old Jewish Lower East Side.","tip":"Take a number and get a quarter pound each of Gaspe Nova and sable to eat in the park.","x":299.22,"y":1207.61}],"coffee":[{"name":"Fasan","address":"34 Allen St","why":"A tiny shop opened in 2025 by a husband-and-wife team, with a line out the door for its inventive cold brews.","order":"Yuzu Bright Brew (it sometimes sells out)","x":304.88,"y":1260.0},{"name":"Taikii Cafe","address":"55 Clinton St","why":"A Japanese cafe with a vinyl-record theme that opened in early 2026, focused on organic matcha and hojicha.","order":"Kinako matcha latte","x":326.16,"y":1218.28},{"name":"Caffe Vita","address":"124 Ludlow St","why":"A Ludlow St fixture that roasts its own beans and pulls a properly strong espresso, with a quick-moving line.","order":"Cortado","x":307.74,"y":1226.55}],"park":[{"name":"Seward Park","address":"Essex St & Canal St","why":"The country's first municipal playground, with a 1909 library on its edge and the old Forward Building looking over it.","tip":"Grab a bench under the trees with your Russ & Daughters haul and people-watch East Broadway.","x":318.44,"y":1265.52},{"name":"Hua Mei Bird Garden (Sara D. Roosevelt Park)","address":"Forsyth St & Delancey St","why":"Older Chinese men bring songbirds in bamboo cages here every morning to sing and socialize.","tip":"Go before about 11am to hear the birds, and keep a respectful distance.","x":290.31,"y":1236.26},{"name":"Corlears Hook Park & East River Esplanade","address":"Jackson St & Cherry St","why":"A quiet riverside park at the neighborhood's old shoreline, with a waterfront path running under the Williamsburg Bridge.","tip":"Walk north along the esplanade toward the Williamsburg Bridge for river and skyline views.","x":371.7,"y":1254.12}],"bite":[{"name":"Katz's Delicatessen","address":"205 E Houston St","why":"The 1888 deli is iconic for good reason: hand-carved pastrami that still sets the standard.","order":"Pastrami on rye with mustard; tip your cutter and get a sample slice","x":304.97,"y":1206.97},{"name":"Scarr's Pizza","address":"35 Orchard St","why":"A retro slice shop that mills its own flour, and probably the best slice downtown.","order":"Pepperoni slice with jalapeño, or a square slice","x":307.71,"y":1259.43},{"name":"Kossar's Bagels & Bialys","address":"367 Grand St","why":"Baking bialys on Grand St since 1936, and one of the last places that does them right.","order":"Onion bialy with scallion cream cheese","x":317.42,"y":1247.94}],"bite_gf":[],"bar":[{"name":"Welcome to the Johnsons","address":"123 Rivington St","why":"A 1970s-rec-room dive with cheap PBR, a pool table and a punk jukebox. The LES the way it used to be.","type":"dive","x":314.09,"y":1223.86},{"name":"Attaboy","address":"134 Eldridge St","why":"Veterans of Milk & Honey run it in that bar's old space: no menu, just tell them what you like and they'll make you something perfect.","type":"cocktail","x":296.16,"y":1240.88},{"name":"Arlene's Grocery","address":"95 Stanton St","why":"A rock club in a converted bodega with bands most nights, and famous for its live-band rock 'n' roll karaoke.","type":"music","x":303.29,"y":1216.21}]}},{"name":"Marble Hill","tagline":"The sliver of Manhattan that ended up on the Bronx mainland","getting_there":"6 train from Astor Pl to Grand Central, then Metro-North Hudson Line to Marble Hill (~45 min total); or A express from W 4 St to 168 St and transfer to the 1 to Marble Hill-225 St.","stops":{"known_for":[{"name":"Marble Hill Historic District","address":"W 228th St & Adrian Ave","why":"Victorian frame houses sit on a hill that's legally Manhattan but physically attached to the Bronx.","tip":"Wander Jacobus Pl and Adrian Ave, then ask a local whether they say they live in Manhattan or the Bronx.","x":129.79,"y":19.23},{"name":"Broadway Bridge & Harlem River Ship Canal","address":"Broadway & W 225th St","why":"The canal was cut in 1895 and made Marble Hill an island, then the old creek was filled in 1914 and attached it to the Bronx.","tip":"Stand mid-bridge to look down the canal toward the Columbia boathouse and Spuyten Duyvil.","x":140.53,"y":42.45},{"name":"Van Cortlandt House Museum","address":"Broadway & W 246th St","why":"The Bronx's oldest house (1748), just up Broadway from Marble Hill, hosted Washington during the Revolution.","tip":"Combine it with a walk around Van Cortlandt Lake right next door.","x":153.0,"y":-99.17}],"coffee":[{"name":"The Inwood Farm","address":"600 W 218th St","why":"Just across the Broadway Bridge at the edge of Inwood Hill Park, this cozy cafe is the closest good coffee-and-brunch stop.","x":107.0,"y":72.13}],"park":[{"name":"Ewen Park","address":"Riverdale Ave & W 232nd St","why":"Climb the long stone staircase up the hillside for a view back over Marble Hill and Kingsbridge.","x":133.09,"y":-6.28},{"name":"Van Cortlandt Park","address":"Broadway & W 242nd St","why":"Walk the John Muir Trail or the loop around Van Cortlandt Lake in the Bronx's third-largest park.","x":149.36,"y":-92.18},{"name":"Henry Hudson Park","address":"Kappock St & Independence Ave","why":"See the tall Henry Hudson monument column on the bluff above Spuyten Duyvil, a quiet and little-known overlook.","x":77.39,"y":46.95}],"bite":[{"name":"Loeser's Kosher Deli","address":"214 W 231st St","why":"This old-school Kingsbridge deli has been family-run since 1960 and is a short walk from Marble Hill.","order":"Hot pastrami on rye with a knish","x":142.7,"y":-2.52},{"name":"Lloyd's Carrot Cake","address":"6087 Broadway","why":"The famous Riverdale bakery across from Van Cortlandt Park has made its legendary carrot cake since 1985.","order":"A slice of the classic carrot cake","x":141.72,"y":-91.25,"approx":1}],"bite_gf":[],"bar":[{"name":"Piper's Kilt","address":"170 W 231st St","why":"This old Kingsbridge Irish pub, a few blocks from Marble Hill, is known for its burgers and pints.","type":"dive","x":150.2,"y":-2.55},{"name":"Bronx Ale House","address":"216 W 238th St","why":"It has a deep craft-beer list and a friendly crowd, the best drinks-focused bar near Marble Hill.","type":"other","x":144.33,"y":-44.76},{"name":"An Beal Bocht Café","address":"445 W 238th St","why":"A bohemian Irish pub in Riverdale with live trad sessions and bands.","type":"music","x":116.94,"y":-44.43,"approx":1}]}},{"name":"Midtown","tagline":"Beaux-Arts icons, Art Deco lobbies, and pocket parks between towers.","getting_there":"6 train from Astor Pl to Grand Central–42 St (about 10 minutes).","stops":{"known_for":[{"name":"Grand Central Terminal","address":"89 E 42nd St","why":"The 1913 Beaux-Arts terminal: celestial ceiling, marble concourse, Tiffany clock.","tip":"Stand in opposite corners of the tiled Whispering Gallery outside the Oyster Bar and whisper into the wall.","x":246.7,"y":993.78},{"name":"NYPL Stephen A. Schwarzman Building","address":"476 5th Ave","why":"The lions-out-front flagship library, with the soaring Rose Main Reading Room.","tip":"Go straight to the third-floor Rose Reading Room, then look for the free treasures exhibition downstairs.","x":226.14,"y":999.22},{"name":"30 Rockefeller Plaza Lobby","address":"30 Rockefeller Plaza","why":"The best Art Deco interior in the city: José María Sert's sepia murals and the gilded 'Wisdom' frieze over the entrance.","tip":"Skip the observation deck; just walk into the lobby and look up, then out at the sunken plaza.","x":218.21,"y":954.54}],"coffee":[{"name":"Culture Espresso","address":"72 W 38th St","why":"Midtown's best indie coffee since 2009, with a cult chocolate-chip cookie baked in-house.","x":211.43,"y":1014.53},{"name":"Little Collins","address":"708 3rd Ave","why":"The Aussie café that set the bar for Midtown East coffee, with a great breakfast sandwich.","x":266.47,"y":981.09},{"name":"Bibble & Sip","address":"253 W 51st St","why":"A tiny café-bakery with inventive lattes and cream puffs, an escape from Times Square chains.","x":176.69,"y":946.74}],"park":[{"name":"Bryant Park","address":"6th Ave between W 40th St and W 42nd St","why":"Midtown's living room behind the library, with movable chairs and a carousel.","x":205.91,"y":999.0},{"name":"Paley Park","address":"3 E 53rd St","why":"The original pocket park: a 20-foot waterfall wall that drowns out the city.","x":226.74,"y":936.42},{"name":"Greenacre Park","address":"217 E 51st St","why":"A terraced pocket park with a 25-foot granite waterfall, a quieter twin to Paley.","x":268.67,"y":946.82}],"bite":[{"name":"Grand Central Oyster Bar","address":"89 E 42nd St","why":"Under Guastavino tile vaults since 1913, still the best seat in Midtown.","order":"Sit at the counter for the oyster pan roast and a dozen East Coasts. Closed Sundays.","x":246.7,"y":993.78},{"name":"Burger Joint","address":"119 W 56th St","why":"A wood-paneled, graffiti-covered burger shack hidden off a hotel lobby, cash and attitude included.","order":"Cheeseburger 'the works', fries, and a pitcher.","x":200.53,"y":920.93},{"name":"Ess-a-Bagel","address":"831 3rd Ave","why":"The Midtown outpost of the classic hand-rolled bagel bakery; lines move fast.","order":"Pumpernickel bagel with lox spread.","x":266.38,"y":948.36}],"bite_gf":[{"name":"Bistango at the Kimberly","address":"145 E 50th St","why":"A long-time celiac haven: nearly the whole Italian menu can be made GF, using dedicated equipment and procedures.","order":"GF pasta or GF pizza; GF bread comes to the table.","gf_level":"GF options w/ precautions","x":259.3,"y":951.98}],"bar":[{"name":"P.J. Clarke's","address":"915 3rd Ave","why":"The original red-brick saloon that refused to sell to the skyscraper around it, with a wood bar, tile floor, and a cheeseburger Nat King Cole loved.","tag":"Old-school saloon · since 1884","type":"dive","x":266.4,"y":926.16},{"name":"The Campbell","address":"15 Vanderbilt Ave","why":"A 1920s tycoon's private office inside Grand Central, with a leaded-glass ceiling and stone fireplace, now serving well-made classics.","type":"cocktail","x":241.96,"y":990.67},{"name":"The Iridium","address":"1650 Broadway","why":"A basement club, Les Paul's longtime home, still booking jazz, fusion, and guitar heroes nightly.","type":"music","x":182.88,"y":946.75}]}},{"name":"Morningside Heights","tagline":"Cathedral stone, Columbia lawns and a pastry shop full of thesis writers","getting_there":"L from 1 Av to 14 St/6 Av, transfer to the uptown 1 train to 110 St or 116 St-Columbia University (~35-40 min).","stops":{"known_for":[{"name":"Cathedral of St. John the Divine","address":"1047 Amsterdam Ave","why":"A gargantuan, still-unfinished Gothic cathedral begun in 1892, one of the largest in the world.","tip":"Look for the resident peacocks on the grounds and the Peace Fountain on the south lawn.","x":134.12,"y":627.85},{"name":"Columbia University's Morningside campus","address":"W 116th St & Broadway","why":"McKim, Mead & White's Beaux-Arts campus centered on Low Library and the Alma Mater statue.","tip":"Enter at the 116th St gates and sit on Low Steps; find the owl hidden in Alma Mater's robe.","x":116.92,"y":603.93},{"name":"Riverside Church","address":"490 Riverside Dr","why":"Rockefeller-funded neo-Gothic church with one of the world's largest carillons in its 392-foot tower.","tip":"Step into the nave, and time a visit for a Sunday carillon recital if you can.","x":104.32,"y":574.25}],"coffee":[{"name":"Hungarian Pastry Shop","address":"1030 Amsterdam Ave","why":"Dim, unhurried, decades-old cafe across from the cathedral where Columbia students have written theses for generations.","tip":"Order a cherry danish or apricot hamantash; laptops are discouraged at peak times.","x":134.12,"y":631.76},{"name":"Picky Barista","address":"431 W 121st St","why":"Small specialty shop near Teachers College with carefully pulled espresso.","x":140.47,"y":577.41},{"name":"Cafe Amrita","address":"301 W 110th St","why":"Cozy corner cafe on Cathedral Parkway with good coffee and crepes.","x":164.57,"y":640.07}],"park":[{"name":"Morningside Park","address":"Morningside Ave & W 113th St","why":"Olmsted and Vaux's dramatic cliffside park, with a schist ridge dividing the Heights from Harlem.","x":160.56,"y":619.85},{"name":"Sakura Park","address":"Riverside Dr & Claremont Ave at W 122nd St","why":"Quiet formal park gifted with cherry trees by Japan in 1912, complete with a stone lantern.","x":105.7,"y":603.74},{"name":"General Grant National Memorial plaza","address":"Riverside Dr & W 122nd St","why":"Grant's Tomb is the largest mausoleum in North America, ringed by wavy Gaudí-inspired mosaic benches.","x":104.34,"y":572.36}],"bite":[{"name":"Koronet Pizza","address":"2848 Broadway","why":"Columbia institution famous for its absurdly large jumbo slice.","order":"Plain jumbo slice","x":117.0,"y":632.34},{"name":"Tom's Restaurant","address":"2880 Broadway","why":"The Seinfeld-facade diner, but loved by locals for honest diner food and milkshakes.","order":"A black-and-white milkshake and a patty melt","x":117.02,"y":625.0},{"name":"V&T Pizzeria","address":"1024 Amsterdam Ave","why":"Old-school red-sauce pizzeria near the cathedral, serving Columbia since the 1950s.","order":"A cheesy plain pie and baked ziti","x":134.13,"y":634.08}],"bite_gf":[],"bar":[{"name":"1020 Bar","address":"1020 Amsterdam Ave","why":"The quintessential Columbia dive: cheap pitchers, a pool table and a crowd of grad students, opposite the cathedral.","type":"dive","x":134.14,"y":635.63},{"name":"The Hamilton","address":"998 Amsterdam Ave","why":"Brick-walled tavern with a strong American whiskey program and well-made classic drinks.","type":"cocktail","x":134.13,"y":639.44},{"name":"Smoke Jazz Club","address":"2751 Broadway","why":"One of the city's great jazz rooms, booking heavyweight hard-bop acts nightly.","type":"music","x":120.61,"y":658.14}]}},{"name":"Murray Hill","tagline":"Hidden mews, a robber baron's library, and 24-hour pastrami.","getting_there":"6 train from Astor Pl to 33 St (three stops, about 10 minutes).","stops":{"known_for":[{"name":"The Morgan Library & Museum","address":"225 Madison Ave","why":"J.P. Morgan's private library: triple-tiered walnut stacks, Gutenberg Bibles, and medieval manuscripts.","tip":"The historic library rooms are free on Tuesdays and Sundays from 3 to 5pm, and the whole museum is free on Fridays from 5 to 8pm with a reservation.","x":236.21,"y":1021.83},{"name":"Sniffen Court","address":"150 E 36th St","why":"A gated mews of 1860s carriage houses, best known as the backdrop for the Doors' 'Strange Days' album cover.","tip":"It's private, so look through the gate and find the horse-relief plaques on the back wall.","x":262.63,"y":1024.77},{"name":"Scandinavia House","address":"58 Park Ave","why":"The Nordic cultural center, with rotating art and design shows in a sleek Park Ave building.","tip":"Check what's in the galleries, then look at the Nordic design shop.","x":245.77,"y":1017.1}],"coffee":[{"name":"for:ground","address":"8 E 41st St","why":"A gallery-like café with quiet seating in the back, rare for this stretch of Midtown's edge.","x":228.45,"y":999.22},{"name":"Hole in the Wall","address":"445 E 35th St","why":"An Aussie café near the river with strong flat whites and a brunch menu that labels its gluten-free options.","x":299.22,"y":1029.87},{"name":"Zucker's Bagels & Smoked Fish","address":"370 Lexington Ave","why":"A local hand-rolled bagel shop with good coffee and appetizing; it also stocks GF bagels.","x":256.46,"y":999.75}],"park":[{"name":"Tudor City Greens","address":"Tudor City Pl between E 41st St and E 43rd St","why":"Two tiny gated gardens on a raised 1920s Tudor-Gothic enclave, one of Manhattan's best secret spots.","x":291.67,"y":993.77},{"name":"St. Vartan Park","address":"1st Ave between E 35th St and E 36th St","why":"A neighborhood park next to the gold-domed St. Vartan Armenian Cathedral.","x":295.46,"y":1027.35},{"name":"Glick Park","address":"E 36th St & FDR Dr","why":"A small, newer East River park with tiered seating facing the water.","x":303.0,"y":1024.79}],"bite":[{"name":"Sarge's Deli","address":"548 3rd Ave","why":"A never-closing Jewish deli with a peppery pastrami that rivals the big names.","order":"Pastrami on rye; the cheesecake if you're splitting.","x":266.54,"y":1022.87},{"name":"Hyderabadi Zaiqa","address":"184 Lexington Ave","why":"A no-frills counter serving some of the best biryani in Manhattan.","order":"Goat dum biryani and chicken 65.","x":256.56,"y":1049.8},{"name":"Shuya","address":"517 3rd Ave","why":"A cozy ramen and izakaya spot with a smoky, deep shio broth.","order":"The shio ramen with chashu, plus a handroll.","x":266.56,"y":1031.94}],"bite_gf":[{"name":"The Little Beet","address":"125 Park Ave","why":"Fast-casual bowls and plates made with entirely gluten-free ingredients, by Grand Central.","order":"A build-your-own plate with the chicken and roasted veg.","gf_level":"dedicated","x":246.31,"y":996.14}],"bar":[{"name":"The Ginger Man","address":"11 E 36th St","why":"A dark-wood, leather-couch beer hall with dozens of taps; the neighborhood's go-to pub that isn't a bro bar.","type":"other","x":230.36,"y":1024.74},{"name":"Middle Branch","address":"154 E 33rd St","why":"A two-floor townhouse bar from the Milk & Honey family, with exacting classic cocktails and no velvet rope.","type":"cocktail","x":258.96,"y":1040.88},{"name":"Kawabun","address":"125 E 39th St","why":"A Japanese tavern with a deep sake list and clay-pot rice to soak it up.","type":"other","x":255.75,"y":1009.45}]}},{"name":"NoHo","tagline":"Cast-iron lofts, Gilded Age ghosts, and Lafayette Street swagger","getting_there":"A walk of about 5 minutes: head west across Astor Place / Cooper Square to Lafayette St.","stops":{"known_for":[{"name":"Merchant's House Museum","address":"29 E 4th St","why":"Manhattan's only 19th-century family home preserved intact inside and out, and reputedly its most haunted house.","tip":"Candlelight Ghost Tours run Oct 16-30, 2026; during restoration, enter via 35 E 4th St.","x":260.65,"y":1188.43},{"name":"Bayard-Condict Building","address":"65 Bleecker St","why":"Louis Sullivan's only New York building (1899), with terracotta angels under the cornice.","tip":"Stand across Bleecker at the top of Crosby St and look up at the six angels.","x":254.1,"y":1204.23},{"name":"Basquiat's Great Jones Studio","address":"57 Great Jones St","why":"Jean-Michel Basquiat lived and worked here, in a building owned by Andy Warhol, until his death in 1988.","tip":"Look for the plaque by the door, then walk Bond St's cobblestones one block north.","x":267.39,"y":1193.85}],"coffee":[{"name":"Gasoline Alley Coffee","address":"325 Lafayette St","why":"A small, sharp local espresso bar that has been a NoHo regular for years; open daily from 7 or 8am to 7pm.","x":256.67,"y":1207.44},{"name":"Librae Bakery","address":"35 Cooper Sq","why":"A 'third culture' bakery doing Middle Eastern flavors with Danish technique, plus good coffee.","x":266.89,"y":1182.0},{"name":"Lafayette Bakery Counter","address":"380 Lafayette St","why":"Andrew Carmellini's grand café; grab a coffee and a French pastry at the front counter without sitting down to brunch.","x":256.97,"y":1191.76}],"park":[{"name":"Astor Place Plaza & 'Alamo' Cube","address":"Astor Pl & Lafayette St","why":"The pedestrian plaza at NoHo's northeast corner, home of Tony Rosenthal's 1967 rotating cube.","tip":"Push the cube and it actually spins.","x":258.4,"y":1171.05},{"name":"Liz Christy Community Garden","address":"E Houston St between Bowery and 2nd Ave","why":"NYC's first community garden (1973), started by the Green Guerillas, just across the Bowery from NoHo.","tip":"Open some weekend afternoons; look for the turtle pond and the old dawn redwood.","x":276.93,"y":1209.35},{"name":"Washington Square Park","address":"5th Ave & Waverly Pl","why":"Three blocks west of NoHo's Broadway edge, and still the best people-watching downtown.","tip":"Listen for buskers by the fountain and chess hustlers at the southwest corner.","x":227.05,"y":1180.76}],"bite":[{"name":"Il Buco Alimentari & Vineria","address":"53 Great Jones St","why":"A rustic Italian market and restaurant with house-cured salumi and bread baked on site, the casual sibling of Il Buco.","order":"Short rib, cacio e pepe, and something from the salumi counter.","x":266.34,"y":1193.78},{"name":"Atla","address":"372 Lafayette St","why":"Enrique Olvera's all-day Mexican spot (Cosme's casual sibling), bright and easy for lunch.","order":"The shrimp taco, crispy maitake en salsa verde, and a quesadilla with maitake.","x":256.86,"y":1193.85},{"name":"Indochine","address":"430 Lafayette St","why":"The palm-leaf-wallpaper French-Vietnamese room that has been a NoHo scene since 1984.","order":"Spring rolls, crispy whole fish, and a lychee cocktail.","x":257.99,"y":1176.97}],"bite_gf":[],"bar":[{"name":"Swift Hibernian Lounge","address":"34 E 4th St","why":"A proper, unfussy Irish pub with a long bar and a back room, known for taking care with its Guinness pour.","tag":"Guinness on tap","type":"dive","x":262.38,"y":1188.53},{"name":"Temple Bar","address":"332 Lafayette St","why":"The revived 1989 Lafayette St legend: dark, sexy, with a long martini list and free popcorn and shrimp cocktail.","type":"cocktail","x":256.75,"y":1205.54},{"name":"Joe's Pub","address":"425 Lafayette St","why":"The Public Theater's intimate cabaret and music room, with shows nearly every night.","type":"music","x":257.86,"y":1178.74}]}},{"name":"Nolita","tagline":"Old Italian blocks, tiny boutiques, and the city's best slice lines","getting_there":"Walk: about 12-15 minutes south down Lafayette St or the Bowery from Astor Pl. Or take the 6 one stop to Bleecker St.","stops":{"known_for":[{"name":"Basilica of St. Patrick's Old Cathedral","address":"263 Mulberry St","why":"This is NYC's original Catholic cathedral, from 1815, and it has the only church catacombs in Manhattan, all behind a brick wall that wraps the block.","tip":"Book the candlelight catacombs tour ahead. If you skip it, walk the Mott St side of the cemetery wall, where Scorsese shot scenes for Mean Streets.","x":260.39,"y":1221.15},{"name":"Lombardi's","address":"32 Spring St","why":"It holds the claim to America's first licensed pizzeria (1905), with a coal oven still turning out charred-edge pies.","tip":"Order a whole pie, not slices, which they don't sell. Go at an off-hour like a weekday at 3pm to skip the line.","x":267.38,"y":1233.87},{"name":"Puck Building","address":"295 Lafayette St","why":"This red-brick Romanesque Revival landmark was built in 1886 for Puck magazine and still has the gilded Puck statues over its entrances.","tip":"Find both Pucks, one on the Lafayette St corner and one over the Mulberry St door, then walk Elizabeth St's boutiques heading south.","x":256.27,"y":1216.8}],"coffee":[{"name":"Café Integral","address":"149 Elizabeth St","why":"A small, serious shop pouring single-origin Nicaraguan coffee. It's one of the original Nolita third-wave spots.","x":274.36,"y":1241.05},{"name":"Urban Backyard","address":"180 Mulberry St","why":"A tiny, plant-filled corner cafe whose creative lattes and good espresso draw a loyal following.","x":265.12,"y":1243.57},{"name":"Yours Truly","address":"8 Spring St","why":"A low-key neighborhood counter near the Bowery that's good for a quick cortado before you wander.","x":274.85,"y":1233.78}],"park":[{"name":"Elizabeth Street Garden","address":"Elizabeth St between Prince St and Spring St","why":"A sculpture garden full of statues and stone relics, saved for good in 2026 after a decade-long fight over developing it.","tip":"Sit among the lions and Greek-style statuary with your coffee, and check the board for free events.","x":271.58,"y":1228.6},{"name":"Petrosino Square","address":"Lafayette St & Kenmare St","why":"A small triangle plaza named for the NYPD detective Joe Petrosino, who took on the Black Hand. It often hosts rotating public art.","tip":"Find the Petrosino plaque and look at whatever installation is up now.","x":257.15,"y":1240.24},{"name":"DeSalvio Playground","address":"Spring St & Mulberry St","why":"A neighborhood corner park at the old heart of the Italian enclave, named for a local Little Italy figure.","tip":"Grab a bench to eat a Prince Street slice and watch the Mulberry St scene.","x":262.99,"y":1233.9}],"bite":[{"name":"Prince Street Pizza","address":"27 Prince St","why":"The cult square-slice spot that's worth the line.","order":"Spicy Spring square slice (fra diavolo sauce, cupped pepperoni)","x":267.05,"y":1223.42},{"name":"Café Habana","address":"17 Prince St","why":"A Nolita classic since 1998, with a chrome diner counter and Cuban-Mexican plates.","order":"Grilled corn Mexican-style (mayo, cotija, chili, lime) and a Cuban sandwich","x":270.42,"y":1223.4},{"name":"Parm","address":"248 Mulberry St","why":"A casual Italian-American sandwich shop from the Torrisi/Carbone team that does red sauce perfectly.","order":"Chicken parm hero","x":260.86,"y":1224.04}],"bite_gf":[{"name":"Rubirosa","address":"235 Mulberry St","why":"Celiacs seek out its separate gluten-free menu, and its GF pizza crust is widely called the best in the city.","order":"GF tie-dye pizza (vodka sauce, tomato, pesto) and GF rigatoni vodka","gf_level":"GF options w/ precautions","x":261.81,"y":1228.43}],"bar":[{"name":"Milano's Bar","address":"51 E Houston St","why":"A narrow, no-nonsense dive with a rock jukebox and old regulars. It's the last survivor of the old Bowery saloon era.","tag":"Oldest bar · since 1880","type":"dive","x":262.24,"y":1211.74},{"name":"Mother's Ruin","address":"18 Spring St","why":"A tin-ceilinged, unpretentious bar with genuinely well-made cocktails, including slushies, and solid bar food.","type":"cocktail","x":271.38,"y":1233.82},{"name":"The Spring Lounge","address":"48 Spring St","why":"A century-old corner bar, home of the famous stuffed shark, with cheap drinks and beat-up wood floors.","type":"other","x":262.99,"y":1233.9}]}},{"name":"Randall's Island","tagline":"Bridges, salt marsh and ballfields between three boroughs","getting_there":"6 train from Astor Pl to 103 St, walk east to the 103rd St Footbridge over the Harlem River (~35-40 min); or 6 to 125 St and the M35 bus from Lexington Ave.","stops":{"known_for":[{"name":"Ward's Island Bridge (103rd St Footbridge)","address":"E 103rd St & FDR Dr","why":"A 1951 pedestrian lift bridge whose middle span rises for boats, the most fun way onto the island.","tip":"Cross on foot from East Harlem; it is the gateway to the island's southern waterfront path.","x":313.85,"y":682.07},{"name":"Icahn Stadium","address":"10 Central Rd, Randall's Island","why":"The track-and-field stadium on the site of Jesse Owens' 1936 Olympic Trials, freshly resurfaced and host of the 2026 USATF Championships.","tip":"Look for the Jesse Owens tribute at the entrance and check for NYCFC II or meet schedules.","x":363.58,"y":596.85},{"name":"Hell Gate Bridge","address":"Hell Gate Pathway, Randall's Island","why":"The 1917 steel arch railroad bridge that inspired Sydney Harbour's, crossing the notorious Hell Gate strait.","tip":"Walk the island's east shore path for the best view under the arch.","x":392.83,"y":657.26}],"coffee":[{"name":"East Harlem Café","address":"1651 Lexington Ave","why":"Neighborhood cafe two blocks from the 103 St station, ideal for coffee before the footbridge.","x":256.03,"y":667.46},{"name":"Café Ollin","address":"339 E 108th St","why":"Tiny Mexican cafe beloved for strong coffee and cemitas, on the way to the island.","x":291.75,"y":646.14},{"name":"Kinship Coffee","address":"30-05 Steinway St, Astoria","why":"Astoria's well-regarded independent roaster, a walk from the RFK Bridge's Queens end.","x":503.92,"y":775.01}],"park":[{"name":"Randall's Island Urban Farm","address":"Randall's Island Park, near Scylla Playground","why":"A 20-year-old working farm with vegetables, chickens and rice paddies.","x":348.18,"y":599.37,"approx":1},{"name":"Little Hell Gate Salt Marsh","address":"Randall's Island Park, Little Hell Gate inlet","why":"Restored tidal wetland in the middle of the city, home to fiddler crabs and oysters.","x":344.5,"y":609.68,"approx":1},{"name":"Randall's Island Connector & Bronx Kill shore","address":"Randall's Island Connector at E 132nd St, Bronx","why":"Waterfront path under the Hell Gate viaduct linking the island to the South Bronx.","x":348.82,"y":527.09,"approx":1}],"bite":[{"name":"Patsy's Pizzeria","address":"2287 1st Ave","why":"The original coal-oven pizzeria from 1933, a short walk from the RFK Bridge walkway at 125th.","order":"A plain coal-oven pie or slices at the take-out window","x":294.91,"y":595.18},{"name":"Taco Mix","address":"234 E 116th St","why":"Tiny East Harlem taqueria with an al pastor spit going all day.","order":"Al pas
