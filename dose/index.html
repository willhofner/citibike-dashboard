tor tacos","x":270.88,"y":604.0},{"name":"Taverna Kyclades","address":"33-07 Ditmars Blvd, Astoria","why":"Beloved Greek seafood spot a walk from the RFK Bridge's Queens landing.","order":"Grilled octopus and lemon potatoes","x":494.65,"y":670.2}],"bite_gf":[],"bar":[{"name":"Bohemian Hall & Beer Garden","address":"29-19 24th Ave, Astoria","why":"NYC's oldest beer garden, a short walk from the RFK Bridge's Queens end, with Czech beer under the trees.","tag":"Oldest beer garden · since 1910","type":"other","x":471.13,"y":698.96},{"name":"Port Morris Distillery","address":"780 E 133rd St, Bronx","why":"South Bronx distillery making Puerto Rican pitorro, near the Randall's Island Connector; tastings Fri 4-6pm and Sat 1-6pm by reservation.","type":"other","x":386.74,"y":499.44,"approx":1},{"name":"Camaradas El Barrio","address":"2241 1st Ave","why":"East Harlem Puerto Rican bar with live salsa and Latin jazz bands.","type":"music","x":294.93,"y":609.16}]}},{"name":"Roosevelt Island","tagline":"Ride the tram to a quiet island of ruins, asylums, and river views.","getting_there":"Walk about 12 min to 2 Av (F) at Houston, then take the F uptown directly to Roosevelt Island (about 20 min). Ride the tram back to 59th & 2nd Ave for the view.","stops":{"known_for":[{"name":"Roosevelt Island Tramway","address":"E 60th St & 2nd Ave (Manhattan station)","why":"The aerial tram, 50 years old in 2026, is a four-minute ride over the East River at Queensboro Bridge height.","tip":"Board at 59th/60th & 2nd Ave and stand at the downtown-facing window; it takes a regular subway fare.","x":280.41,"y":899.5},{"name":"Renwick Smallpox Hospital Ruin","address":"Southpoint Park, south end of Roosevelt Island","why":"James Renwick Jr.'s 1856 Gothic hospital is now a fenced, ivy-covered ruin and the only landmarked ruin in the city.","tip":"Go near sunset, when the floodlights come on behind the walls.","x":335.28,"y":948.19},{"name":"The Octagon","address":"888 Main St","why":"The domed rotunda of the old asylum where Nellie Bly went undercover in 1887 for 'Ten Days in a Mad-House'.","tip":"Look up at the spiral staircase dome through the lobby glass, then walk north to her monument at Lighthouse Park.","x":351.08,"y":794.72}],"coffee":[{"name":"Wholesome Factory","address":"586 Main St","why":"The island's local grab-and-go spot for coffee, smoothies and sandwiches before a walk on the promenade.","x":345.34,"y":848.56}],"park":[{"name":"FDR Four Freedoms State Park","address":"1 FDR Four Freedoms Park","why":"Louis Kahn's granite memorial at the island's south tip, framing the UN and Midtown.","tip":"Walk to 'The Room' at the very tip; open 9 to 5, closed Tuesdays.","x":332.77,"y":965.7},{"name":"Lighthouse Park","address":"North tip of Roosevelt Island (end of Main St)","why":"The 1872 stone lighthouse and 'The Girl Puzzle', the Nellie Bly monument, on a grassy point.","tip":"Find the five Girl Puzzle faces and read the Bly quotes on them.","x":353.6,"y":763.51},{"name":"Cornell Tech Campus","address":"2 W Loop Rd","why":"A new campus with lawns and waterfront paths that are open to the public, plus close-up Midtown views.","tip":"Walk the west-side path between the campus and the river for the skyline view.","x":335.21,"y":907.11}],"bite":[{"name":"Nisi","address":"549 Main St","why":"The island's best sit-down meal, a Greek and Mediterranean taverna on Main Street.","order":"Grilled octopus and a whole branzino","x":345.35,"y":853.78},{"name":"Fuji East","address":"455 Main St","why":"A solid neighborhood sushi spot, open daily.","order":"Chef's sushi platter","x":344.85,"y":879.24},{"name":"Piccolo Trattoria","address":"455 Main St","why":"A homey red-sauce Italian place for a casual dinner after the tram.","order":"Chicken parm or a pasta special","x":344.85,"y":879.24}],"bite_gf":[],"bar":[{"name":"Panorama Room","address":"22 N Loop Rd","why":"A rooftop cocktail bar on the 18th floor of the Graduate hotel with a 360-degree view of Manhattan and Queens.","type":"cocktail","x":339.43,"y":907.74},{"name":"Riverwalk Bar & Grill","address":"425 Main St","why":"The island's casual neighborhood bar near the tram, where locals watch games over beer and burgers; there's no live-music bar on the island.","type":"other","x":343.93,"y":887.43}]}},{"name":"SoHo","tagline":"Cast-iron facades, cobblestones, and secret art rooms above the shops","getting_there":"Take the 6 from Astor Pl two stops to Spring St (about 5 minutes). Or walk 15-20 minutes down Broadway.","stops":{"known_for":[{"name":"The New York Earth Room","address":"141 Wooster St","why":"Walter De Maria's 1977 installation is a second-floor loft filled with 280,000 pounds of soil, kept up by Dia for decades.","tip":"It's free. Ring the buzzer and walk up. It's open Wed-Sun with a midday break, and it closes for the summer, so check Dia's site before going.","x":232.81,"y":1219.05},{"name":"The Broken Kilometer","address":"393 W Broadway","why":"De Maria's companion piece is 500 polished brass rods laid out on a gallery floor, a quiet bit of minimalism blocks from the Earth Room.","tip":"See both De Maria works on the same walk, since they keep similar Dia hours.","x":226.54,"y":1235.49},{"name":"Haughwout Building & the Greene St cast-iron blocks","address":"488 Broadway","why":"The 1857 Haughwout had the world's first commercial passenger elevator. Greene St nearby holds the densest run of cast-iron facades anywhere.","tip":"After the Haughwout, cut over to Greene St between Canal and Grand and look up at the 'King' and 'Queen' of Greene St (72-76 and 28-30 Greene).","x":246.37,"y":1244.44}],"coffee":[{"name":"Ground Support","address":"399 W Broadway","why":"A long-running SoHo coffee bar with strong espresso and a sunny bench out front.","x":226.65,"y":1233.71},{"name":"La Cabra","address":"284 Lafayette St","why":"The Danish roaster's SoHo cafe, with very light, precise Nordic-style coffee and excellent cardamom buns.","x":256.15,"y":1219.05},{"name":"Café Lyria","address":"166 Crosby St","why":"A Greek-themed coffee bar whose iced Lyria (espresso, oat milk, honey) and homestyle Greek cookies are worth the stop.","x":253.98,"y":1206.1}],"park":[{"name":"Vesuvio Playground","address":"Thompson St between Spring St and Prince St","why":"A mid-block neighborhood park on old Italian South Village turf, with a bocce-era feel.","tip":"Take your pastry to a bench and watch neighborhood life away from the Broadway crowds.","x":222.56,"y":1227.0},{"name":"SoHo Square","address":"Spring St & Avenue of the Americas","why":"A small triangle plaza at the west end of Spring St, with a statue of Uruguayan hero José Artigas.","tip":"Find the Artigas statue, then head up Sullivan St for sandwiches.","x":210.64,"y":1233.12},{"name":"Father Fagan Park","address":"Avenue of the Americas & Prince St","why":"A tiny tree-shaded triangle honoring a FDNY chaplain who died on duty in 1945.","tip":"Rest your feet in the shade between the West Broadway galleries and Houston St.","x":211.04,"y":1221.33}],"bite":[{"name":"Dominique Ansel Bakery","address":"189 Spring St","why":"This is where the Cronut was born. The rest of the pastry case is just as inventive.","order":"The Cronut of the month, or a DKA (Dominique's Kouign Amann)","x":219.82,"y":1232.11},{"name":"Alidoro","address":"105 Sullivan St","why":"An old-school Italian sandwich counter with about 40 heroes named after people, made with excellent cured meats and fresh mozz.","order":"The Fellini or the Brando on focaccia","x":217.54,"y":1228.41},{"name":"Balthazar","address":"80 Spring St","why":"The iconic SoHo brasserie, which locals still love, especially at breakfast or a bar-seat lunch.","order":"Steak frites at lunch, or Le Panier bread basket and brioche French toast at breakfast","x":252.29,"y":1233.96}],"bite_gf":[],"bar":[{"name":"Fanelli Cafe","address":"94 Prince St","why":"A creaky old-New-York tavern with boxing photos, cheap burgers, and a crowd that's mostly locals despite the address.","tag":"Oldest bar · on site since 1847","type":"dive","x":242.48,"y":1223.12},{"name":"Bar Moga","address":"128 W Houston St","why":"A moody Japanese 'modern girl' bar mixing precise, playful cocktails alongside yoshoku comfort food like omurice.","type":"cocktail","x":218.46,"y":1210.9},{"name":"S.O.B.'s","address":"204 Varick St","why":"Sounds of Brazil has been the downtown home for live Latin, Afrobeat, Caribbean, and hip-hop shows since 1982.","type":"music","x":196.31,"y":1215.9}]}},{"name":"Stuyvesant Town","tagline":"Red-brick postwar towers, a big fountain oval, and squirrels everywhere","getting_there":"About a 12-15 minute walk north up 1st Ave or Avenue A to 14th St; or ride the L from 1 Av, whose station sits right at Stuy Town's southwest corner.","stops":{"known_for":[{"name":"Stuyvesant Oval & Fountain","address":"Stuyvesant Oval, between E 16th St and E 18th St (walk in from 1st Ave)","why":"The heart of MetLife's 1947 'tower in the park,' built over the old Gas House District, where 110 buildings cover only a quarter of the land.","tip":"Do a lap of the Oval loop, then look up for the 9,000+ nearly invisible rooftop solar panels.","x":316.28,"y":1121.33},{"name":"Asser Levy Recreation Center","address":"392 Asser Levy Pl (at E 23rd St)","why":"A landmarked 1908 Roman-bath-style public bathhouse at the northeast corner of Peter Cooper Village.","tip":"Admire the arched facade; the indoor pool requires an NYC Parks membership.","x":313.53,"y":1088.14},{"name":"Peter Cooper Village & Veterans Memorial Plaza","address":"E 20th St to E 23rd St, 1st Ave to FDR Dr","why":"Stuy Town's quieter twin, built with bigger apartments for returning officers, with an aluminum tree sculpture honoring the five military branches.","tip":"Cross E 20th St from the Oval and find the plaza sculpture.","x":310.26,"y":1100.18}],"coffee":[{"name":"Gemina Coffee Shop","address":"424 E 14th St","why":"A friendly neighborhood counter right across 14th St from Stuy Town, praised for its cappuccinos and iced chai.","x":301.74,"y":1138.31},{"name":"Kijitora","address":"534 E 14th St","why":"A Japanese-inspired café (from the Brooklyn original) for matcha, pastries, and a shokupan grilled cheese, facing Stuy Town.","x":318.63,"y":1138.42},{"name":"B Cup Café","address":"212 Avenue B","why":"A colorful corner café a block below 14th St, with good sandwiches and classic espresso drinks.","x":324.14,"y":1144.39}],"park":[{"name":"Stuyvesant Square Park","address":"2nd Ave to 1st Ave, E 15th St to E 17th St","why":"An 1836 iron-fenced square right across 1st Ave from Stuy Town, on land Peter Stuyvesant's family gave the city.","tip":"Walk the east half's paths and look at St. George's Church on the west side.","x":288.21,"y":1127.36},{"name":"Stuyvesant Cove Park","address":"FDR Dr & E 20th St (East River esplanade)","why":"A native-plant waterfront park on the East River, once grazed by goats brought in to clear invasive plants.","tip":"Watch the sunset over the river from the NYC Ferry landing, if the esplanade has reopened.","x":331.06,"y":1108.48},{"name":"Peter's Field","address":"2nd Ave & E 20th St","why":"A small city ballfield and playground named for Peter Stuyvesant, just west of the complex.","tip":"Pair it with the Stuyvesant Square walk.","x":280.75,"y":1107.75}],"bite":[{"name":"Ess-a-Bagel","address":"324 1st Ave","why":"The classic giant, hand-rolled NYC bagel, in its Stuy Town home since 2016.","order":"Everything bagel with scallion cream cheese and lox.","x":296.76,"y":1112.6},{"name":"Rosemary's East","address":"350 1st Ave","why":"The West Village favorite's Stuy Town outpost, with a sidewalk patio, handmade pastas, and sourdough pizzas.","order":"Cacio e pepe pizza or the 'stinger' pie, plus the cavatelli.","x":296.82,"y":1109.41}],"bite_gf":[],"bar":[{"name":"Rosemary's East (spritz bar)","address":"350 1st Ave","why":"There's no real dive inside Stuy Town; this is the only bar in the complex, with a 4-6pm weekday happy hour and spritzes on the patio.","type":"other","x":296.82,"y":1109.41},{"name":"Waiting on a Friend","address":"206 Avenue A","why":"A living-room-style cocktail lounge from the Garret team, two blocks below 14th St (23+).","type":"cocktail","x":309.59,"y":1144.45},{"name":"Otto's Shrunken Head","address":"538 E 14th St","why":"A tiki dive facing Stuy Town with live bands and punk shows in the back room, plus a Wednesday open mic.","type":"music","x":318.98,"y":1138.43}]}},{"name":"Theater District","tagline":"Marquees, stage doors, and a martini before curtain.","getting_there":"Walk 5 min to 8 St–NYU, take the R/W uptown to 49 St or Times Sq–42 St (about 15 min).","stops":{"known_for":[{"name":"Shubert Alley","address":"Shubert Alley between W 44th St and W 45th St","why":"The private alley behind the Shubert and Booth theatres has been Broadway's unofficial town square for a century.","tip":"Read the wall of current show posters, then hit the stage doors on W 44th/45th after a matinee lets out.","x":180.79,"y":980.31},{"name":"Lyceum Theatre","address":"149 W 45th St","why":"Opened in 1903, it is one of the oldest Broadway houses still running shows, with a Beaux-Arts facade worth stopping for.","tip":"Look up at the columned facade and the original marquee; enter the digital lottery for that night's show.","x":197.14,"y":977.73},{"name":"New Amsterdam Theatre","address":"214 W 42nd St","why":"The Ziegfeld Follies' old home, rescued by Disney in the 1990s, has the most ornate Art Nouveau interior on Broadway.","tip":"Even without a ticket, stand under the 42nd St entrance and look at the carved facade and lobby details.","x":185.57,"y":993.68}],"coffee":[{"name":"Bibble & Sip","address":"253 W 51st St","why":"Tiny, perpetually busy cafe known for creative lattes and matcha cream puffs made daily.","x":176.69,"y":946.74},{"name":"Masseria Caffè","address":"235 W 48th St","why":"An Italian-style espresso bar from the La Masseria team, a proper stand-up cornetto-and-cappuccino stop.","x":179.37,"y":962.27},{"name":"The Drama Book Shop Cafe","address":"266 W 39th St","why":"Lin-Manuel Miranda and friends' revived theater bookstore has a cafe where you can drink coffee among scripts and playbills.","x":176.14,"y":1009.4}],"park":[{"name":"TKTS Red Steps at Father Duffy Square","address":"Broadway & W 47th St","why":"The glowing red bleachers over the TKTS booth are the best seat for watching Times Square at night.","tip":"Sit near the top after dark, then check the TKTS board for same-day discount tickets below.","x":185.14,"y":967.48},{"name":"6½ Avenue","address":"Mid-block passage between 6th Ave and 7th Ave, W 51st St to W 57th St","why":"A chain of public atriums and plazas cut mid-block, a quiet back route most people walk right past.","tip":"Walk it end to end from 51st to 57th, ducking through the indoor arcades.","x":196.93,"y":928.81},{"name":"Worldwide Plaza","address":"825 8th Ave (between W 49th St and W 50th St)","why":"A tree-lined public plaza with a fountain, an easy breather at the western edge of the district.","tip":"Grab a bench by the fountain before a show; it is calmer than anything on Broadway.","x":170.23,"y":953.39}],"bite":[{"name":"Margon","address":"136 W 46th St","why":"A cash-only Cuban lunch counter that has fed Midtown workers for decades and makes one of the city's best Cubanos.","order":"Cuban sandwich and a café con leche","x":199.41,"y":972.64},{"name":"John's of Times Square","address":"260 W 44th St","why":"Coal-oven pies served under the stained glass of a restored former church.","order":"A whole plain pie with pepperoni; no slices","x":176.53,"y":982.94},{"name":"Joe Allen","address":"326 W 46th St","why":"The Broadway hangout on Restaurant Row since 1965, with posters from famous flops lining the walls.","order":"The burger and a martini","x":165.53,"y":972.53}],"bite_gf":[{"name":"Friedman's (Edison Hotel)","address":"228 W 47th St","why":"Friedman's calls itself a gluten-free pioneer and says nearly its whole menu is or can be made GF.","order":"Fried chicken and waffles made GF, or the GF mac and cheese","gf_level":"GF options w/ precautions","x":181.34,"y":967.48}],"bar":[{"name":"Jimmy's Corner","address":"140 W 44th St","why":"A narrow boxing-themed dive started by trainer Jimmy Glenn, still serving cheap drinks under fight photos a block from Times Square.","type":"dive","x":199.08,"y":982.97},{"name":"Bar Centrale","address":"324 W 46th St","why":"An unmarked upstairs bar between Orso and Joe Allen where actors come after the show for well-made martinis.","type":"cocktail","x":165.9,"y":972.53},{"name":"The Rum House","address":"228 W 47th St","why":"A dark, wood-paneled rum and whiskey bar with live piano and jazz every night.","type":"music","x":181.34,"y":967.48}]}},{"name":"Tribeca","tagline":"Cobblestone warehouse streets, Ghostbusters, and quiet Hudson River piers","getting_there":"Take the 6 from Astor Pl to Canal St and walk about 10 minutes west. Or take the R/W from 8 St-NYU to Canal St. Walking takes about 30 minutes.","stops":{"known_for":[{"name":"Hook & Ladder 8 (Ghostbusters firehouse)","address":"14 N Moore St","why":"It's a working FDNY firehouse that played Ghostbusters HQ, and the fans' Ghostbusters sign art is painted on the sidewalk.","tip":"Take your photo from across Varick St. If the doors are open and the crew isn't busy, they're often friendly about a peek.","x":220.1,"y":1275.67},{"name":"Mmuseumm","address":"4 Cortlandt Alley","why":"A tiny museum of modern artifacts built into a freight-elevator shaft in a back alley, curated by the Safdie brothers' circle.","tip":"It's open Saturday and Sunday 11-6. When it's closed, you can still look through the viewing windows on the door any time.","x":248.03,"y":1280.29},{"name":"Dream House (MELA Foundation)","address":"275 Church St, 3rd Fl","why":"La Monte Young and Marian Zazeela's sound-and-light environment has run for over three decades. It's a magenta-lit room of continuous sustained tones.","tip":"It's open Wed-Sat 2-10pm for a $10 donation. Take your shoes off and slowly walk the room, because the sound changes as you move.","x":232.64,"y":1278.48}],"coffee":[{"name":"Kaffe 1668","address":"275 Greenwich St","why":"A long-running Tribeca roaster-cafe with a big communal table and properly made pour-overs.","x":214.97,"y":1316.36},{"name":"Gotan","address":"130 Franklin St","why":"A bright, airy cafe with very good coffee and the cheddar biscuit egg sandwich people line up for.","x":221.77,"y":1280.12},{"name":"Rigor Hill Market","address":"227 W Broadway","why":"A tiny market-cafe from the Hudson Valley's Rigor Hill farm. Grab coffee with one of the best breakfast sandwiches downtown.","x":224.47,"y":1276.49}],"park":[{"name":"Pier 26 (Hudson River Park)","address":"West St & N Moore St","why":"The pier has a tidal 'Tide Deck' salt marsh, the Science Playground, and long Hudson views. It's next to Pier 25's volleyball courts.","tip":"Walk out to the end of the pier for sunset, then check the Tide Deck's restored estuary habitat.","x":192.0,"y":1286.68},{"name":"Washington Market Park","address":"Greenwich St & Chambers St","why":"A rolling neighborhood park with a gazebo and a community garden, named for the old market that once fed the city.","tip":"Sit on the lawn near the gazebo and read the market history markers.","x":212.36,"y":1308.69},{"name":"Duane Park","address":"Duane St & Hudson St","why":"One of NYC's oldest public parks, bought in 1797, sitting in a postcard-perfect triangle of cast-iron butter-and-egg warehouses.","tip":"Do a lap around the triangle and look up at the old 'butter and egg' district warehouses on Duane and Staple St.","x":219.07,"y":1299.86}],"bite":[{"name":"Bubby's","address":"120 Hudson St","why":"Tribeca's diner institution since 1990, known for scratch pies and a famous brunch.","order":"Pancakes and a slice of banoffee pie","x":210.99,"y":1279.29},{"name":"Walker's","address":"16 N Moore St","why":"An old-school tavern next to the Ghostbusters firehouse whose roast chicken recipe hasn't changed in decades.","order":"Roast chicken or the burger with a beer at the bar","x":220.1,"y":1275.67},{"name":"The Odeon","address":"145 W Broadway","why":"The 1980 downtown brasserie with the famous neon sign, still a lively, unfussy room for a long lunch.","order":"Steak frites or the cheeseburger, with a martini","x":223.89,"y":1296.06}],"bite_gf":[],"bar":[{"name":"Nancy Whiskey Pub","address":"1 Lispenard St","why":"A two-story Irish dive with cheap drinks, a graffitied bathroom, and one of the city's great shuffleboard tables.","type":"dive","x":224.79,"y":1266.03},{"name":"Smith & Mills","address":"71 N Moore St","why":"A tiny former carriage house with an industrial-antique look and carefully made classic cocktails.","type":"cocktail","x":203.44,"y":1282.24},{"name":"The Django","address":"2 Avenue of the Americas","why":"A 1930s Paris-style basement jazz club with live sets most nights, under the Roxy Hotel.","type":"music","x":230.64,"y":1276.21}]}},{"name":"Two Bridges","tagline":"Fuzhounese East Broadway, old graveyards and river views between two bridges","getting_there":"Take the F from 2 Av two stops to East Broadway. Or walk about 30 minutes south via Allen St and Rutgers St.","stops":{"known_for":[{"name":"First Shearith Israel Graveyard","address":"55 St James Pl","why":"Established in 1683, it's the oldest surviving Jewish cemetery in Manhattan. Revolutionary War-era headstones sit tucked behind a fence.","tip":"It's usually locked, but you can see the old stones clearly through the gate on St James Pl.","x":283.51,"y":1298.26},{"name":"Al Smith House","address":"25 Oliver St","why":"The modest rowhouse where Governor and 1928 presidential candidate Al Smith lived is a National Historic Landmark in the neighborhood that made him.","tip":"Pair it with a look at St. James Church around the corner on James St, where Smith was an altar boy.","x":289.32,"y":1299.29},{"name":"East Broadway Fuzhou strip","address":"East Broadway between Market St and Rutgers St","why":"New York's center of Fuzhounese life: noodle shops, bakeries, fish balls and groceries, with almost no tourists.","tip":"Wander and graze. Look for fish-ball soup, peanut-sauce noodles and the bakeries' sesame balls.","x":313.5,"y":1273.33}],"coffee":[{"name":"Dreamers Coffee House","address":"54 Henry St","why":"Opened in 2020 by Chinatown locals, with a great outdoor patio and creative drinks.","order":"Coke & a Dream (espresso over Mexican Coke)","x":300.58,"y":1287.23},{"name":"Kopitiam","address":"151 E Broadway","why":"A Malaysian coffee shop pouring strong, sweet kopi with homestyle Nyonya snacks.","order":"Kopi (iced) plus kaya toast or pandan chicken","x":317.26,"y":1269.49},{"name":"Little Canal","address":"26 Canal St","why":"A cozy corner cafe at the Dimes Square end of Canal St, good for a matcha and a breakfast wrap.","order":"Matcha latte and the Hangover Wrap","x":317.56,"y":1265.66}],"park":[{"name":"Pier 35","address":"South St & Clinton St","why":"A pier park on the East River with big porch swings and a sloped green wall, framed by the Manhattan Bridge.","tip":"Grab a swing at sunset and watch the boats and the bridge light up.","x":349.62,"y":1280.77},{"name":"Coleman Skatepark","address":"Pike St & Monroe St","why":"A free concrete skatepark tucked under the Manhattan Bridge approach and full of local skaters.","tip":"Watch the skaters under the bridge arches, and bring a board if you ride.","x":317.02,"y":1288.22},{"name":"Rutgers Slip & East River Esplanade","address":"Rutgers Slip & South St","why":"A stretch of riverside path where you can see both the Brooklyn and Manhattan Bridges, the two that name the neighborhood.","tip":"Walk the esplanade south toward the Brooklyn Bridge for the classic two-bridge view.","x":335.62,"y":1291.63}],"bite":[{"name":"Golden Diner","address":"123 Madison St","why":"A modern diner under the Manhattan Bridge, mixing Chinatown and American diner food, and one of downtown's most loved casual spots.","order":"Honey butter pancakes and the chicken katsu club","x":307.34,"y":1288.8},{"name":"Wu's Wonton King","address":"165 E Broadway","why":"A big, buzzy Cantonese banquet room that's great for a group, with roast meats and BYOB.","order":"Roast duck and the family-size wonton soup","x":320.3,"y":1267.32},{"name":"Lam Zhou Handmade Noodle","address":"144 E Broadway","why":"A no-frills counter where you watch noodles get hand-pulled and slapped, with cheap boiled dumplings.","order":"Beef noodle soup and pork-and-chive dumplings","x":315.43,"y":1270.79}],"bite_gf":[],"bar":[{"name":"Clandestino","address":"35 Canal St","why":"A laid-back, low-lit neighborhood bar with beer, wine and bar snacks, and sidewalk tables when the street is closed to cars.","type":"dive","x":313.58,"y":1266.22},{"name":"Mr. Fong's","address":"40 Market St","why":"A tiny, buzzy bar by the Manhattan Bridge with inventive cocktails and a good playlist.","type":"cocktail","x":305.95,"y":1289.78},{"name":"Forgtmenot","address":"138 Division St","why":"A friendly, cluttered corner bar next to Kiki's, open late and serving breakfast tacos.","type":"other","x":311.96,"y":1268.62}]}},{"name":"Upper East Side","tagline":"Museum Mile mornings, Yorkville sausage and old-money polish","getting_there":"6 train from Astor Pl straight uptown to 68 St, 77 St or 86 St (~15-20 min).","stops":{"known_for":[{"name":"The Metropolitan Museum of Art","address":"1000 5th Ave","why":"The city's encyclopedic museum, from the Temple of Dendur to the Met's period rooms.","tip":"NY residents pay what they wish; go straight to the Temple of Dendur, then the American Wing's courtyard.","x":225.86,"y":783.34},{"name":"The Frick Collection","address":"1 E 70th St","why":"Henry Clay Frick's Gilded Age mansion, freshly renovated, with Vermeers and Rembrandts in domestic rooms.","tip":"Pay what y /* pins: the day's five stops, or every venue of one kind in Explore */

/* gestures: drag to pan, pinch or wheel to zoom, tap to select. Nothing lights up under a dragging finger. */
const P=new Map(); let G=null;
const rel=e=>{const r=mapEl.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top};};
svg.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  svg.setPointerCapture(e.pointerId); P.set(e.pointerId,rel(e)); hideNote();
  if(anim){cancelAnimationFrame(anim.raf);anim=null;}
  if(P.size===1){const p=rel(e); G={t:'pan',sx:p.x,sy:p.y,cx:cam.x,cy:cam.y,moved:0,multi:false};}
  else if(P.size===2){const [a,b]=[...P.values()]; G={t:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,k0:cam.k,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,cx:cam.x,cy:cam.y,multi:true}; app.classList.add('dragging');}
});
svg.addEventListener('pointermove',e=>{
  if(!P.has(e.pointerId)||!G) return;
  P.set(e.pointerId,rel(e));
  if(G.t==='pan'&&P.size===1){
    const p=rel(e), dx=p.x-G.sx, dy=p.y-G.sy; G.moved=Math.max(G.moved,Math.hypot(dx,dy));
    if(G.moved>6) app.classList.add('dragging');
    cam.x=G.cx+dx; cam.y=G.cy+dy; clampPan(); applyCam();
  } else if(G.t==='pinch'&&P.size>=2){
    const [a,b]=[...P.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const k=clampK(G.k0*d/G.d0); const wx=(G.mx-G.cx)/G.k0, wy=(G.my-G.cy)/G.k0;
    cam={k,x:mx-wx*k,y:my-wy*k}; clampPan(); applyCam();
  }
});
function endPtr(e){
  if(!P.has(e.pointerId)) return;
  P.delete(e.pointerId);
  if(G&&G.t==='pan'&&!G.multi&&G.moved<8&&e.type==='pointerup') tapAt(e.clientX,e.clientY);
  if(P.size===1){const p=[...P.values()][0]; G={t:'pan',sx:p.x,sy:p.y,cx:cam.x,cy:cam.y,moved:99,multi:true};}
  if(P.size===0){G=null; app.classList.remove('dragging');}
}
svg.addEventListener('pointerup',endPtr); svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault(); const p=rel(e); zoomAt(p.x,p.y,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0018)));},{passive:false});
function tapAt(cx,cy){
  if(spinning) return;
  const el=document.elementFromPoint(cx,cy);
  const pin=el&&el.closest&&el.closest('[data-pin]');
  if(pin){
    const p=PINS[+pin.dataset.pin]; if(!p) return;
    if(S.view==='explore'){openVenue(p.id);return;}
    const st=body.querySelector(`[data-stopk="${p.c.k}"]`); setSheet(isDesk()?'full':'half'); if(st) setTimeout(()=>st.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}),reduce?0:360); return;
  }
  const n=el&&el.closest&&el.closest('[data-n]')?.dataset.n;
  if(!n) return;
  if(!BY[n]){note(`${n} isn't in ${B.scope} yet`);return;}
  if(S.view==='explore'){eHood=eHood===n?null:n; eSel=null; render(); setSheet(isDesk()?'full':'half'); return;}
  select(n,{state:'half'});
}

let SD=null;
grab.addEventListener('pointerdown',e=>{
  if(isDesk()||e.target.closest('button,a,input')) return;
  SD={y0:e.clientY,h0:sheet.offsetHeight,moved:0,ly:e.clientY,lt:performance.now(),v:0};
  grab.setPointerCapture(e.pointerId); sheet.classList.add('drag');
});
grab.addEventListener('pointermove',e=>{
  if(!SD) return; const dy=e.clientY-SD.y0; SD.moved=Math.max(SD.moved,Math.abs(dy));
  const now=performance.now(); SD.v=(e.clientY-SD.ly)/Math.max(1,now-SD.lt); SD.ly=e.clientY; SD.lt=now;
  sheet.style.height=Math.min(mapEl.clientHeight-10,Math.max(90,SD.h0-dy))+'px';
});
function endSheet(){
  if(!SD) return; const h=sheet.offsetHeight; sheet.classList.remove('drag'); sheet.style.height='';
  const st=sheet.dataset.state, order=['peek','half','full'];
  let next;
  if(SD.moved<6) next= st==='full'?'half':'full';
  else{
    const hs=order.map(sheetH);
    if(SD.v<-.45) next=order[hs.findIndex(x=>x>h+4)]||'full';
    else if(SD.v>.45){let i=hs.length-1; while(i>0&&hs[i]>=h-4) i--; next=order[i];}
    else next=order[hs.reduce((bi,x,i)=>Math.abs(x-h)<Math.abs(hs[bi]-h)?i:bi,0)];
  }

  S.view='day'; setCur(n); if(!o.drawn&&S.drawn!==n) S.drawn=null; save();
  view='detail'; body.scrollTop=0; render();
  const st=o.state||(isDesk()?'full':sheet.dataset.state==='peek'?'half':sheet.dataset.state);
  setSheet(st);
  return o.fly ? flyTo(n,st) : ensureVisible(n,st);
}
function setBoard(k){
  if(spinning||k===S.board) return;
  useBoard(k); eHood=null; eSel=null; save(); buildMap(); applySub();
  ticker.classList.add('gone'); parts=[]; cancelAnimationFrame(fxRaf); ctx.clearRect(0,0,fx.width,fx.height);
  view=curName()?'detail':'intro'; render(); fitAll(false);
}
function setView(v){
  if(spinning) return;
  S.view=v; eSel=null; save(); view=v==='day'?(curName()?'detail':'intro'):'explore'; body.scrollTop=0; render();
  setSheet(isDesk()?'full':(v==='explore'?'half':sheet.dataset.state));
}
document.querySelectorAll('[data-board]').forEach(b=>b.onclick=()=>setBoard(b.dataset.board));
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));

/* sheet interactions */
const keepScroll=fn=>{const top=body.scrollTop;fn();body.scrollTop=top;};
sheet.addEventListener('click',e=>{
  const t=e.target;
  const m=t.closest('[data-mode]'); if(m){S.mode=m.dataset.mode;save();keepScroll(render);return;}
  if(t.closest('[data-open="list"]')){view='list';render();setSheet('full');return;}
  const hb=t.closest('[data-hood]'); if(hb){select(hb.dataset.hood,{fly:true,state:'half'});return;}
  if(t.closest('[data-gf]')){S.gf=!S.gf;keepScroll(render);return;}
  const ec=t.closest('[data-ecat]'); if(ec){S.ecat=ec.dataset.ecat;eSel=null;save();keepScroll(render);return;}
  const bt=t.closest('[data-btype]'); if(bt){S.btype=bt.dataset.btype;eSel=null;save();keepScroll(render);return;}
  if(t.closest('[data-clearhood]')){eHood=null;render();return;}
  const vr=t.closest('[data-venue]'); if(vr){openVenue(vr.dataset.venue);body.scrollTop=0;return;}
  if(t.closest('[data-back]')){eSel=null;render();return;}
  const pl=t.closest('[data-plan]'); if(pl){const [hn,fk,i]=pl.dataset.plan.split('|'); const h=BY[hn]; setChoice(h,fk,+i); S.mode='choose'; select(hn,{fly:true,state:'half'}); return;}
  const st=t.closest('[data-step]');
  if(st){const nav=st.closest('.nav'), car=body.querySelector(`.car[data-fk="${nav.dataset.navfor}"]`); const j=Math.min(car.children.length-1,Math.max(0,carIndex(car)+(+st.dataset.step)));
    car.scrollTo({left:Math.min(car.children[j].offsetLeft,car.scrollWidth-car.clientWidth),behavior:reduce?'auto':'smooth'});return;}
  const h=BY[curName()]; if(!h) return;
  const b=t.closest('[data-stop]');
  if(b){const k=b.dataset.stop;S.done[h.name]=S.done[h.name]||{};S.done[h.name][k]=!S.done[h.name][k];save();keepScroll(render);return;}
  if(t.closest('[data-all]')){const full=doneCount(h.name)===5;S.done[h.name]={};if(!full)CATS.forEach(c=>S.done[h.name][c.k]=true);save();keepScroll(render);}
});
let armed=false;
sheet.addEventListener('change',e=>{
  if(e.target.id==='skip'){S.skip=e.target.checked;save();}
  if(e.target.id==='gfmode'||e.target.id==='gfmode2'){S.gf=e.target.checked;eSel=null;if(e.target.id==='gfmode2') keepScroll(render);}
});
sheet.addEventListener('click',e=>{
  if(e.target.id!=='reset') return;
  if(!armed){armed=true;e.target.textContent='Tap again to clear everything';setTimeout(()=>{armed=false;const r=$('#reset');if(r)r.textContent='Reset progress';},3000);return;}
  S.done={};S.choice={};armed=false;save();render();
});
$('#listbtn').onclick=()=>{
  if(S.view==='explore'){S.view='day';}
  if(view==='list'){view=curName()?'detail':'intro';render();setSheet(isDesk()?'full':'half');}
  else{view='list';render();setSheet('full');}
};

/* ---------- the draw ---------- */
let spinning=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function spin(){
  if(spinning) return;
  S.view='day'; eSel=null; eHood=null;
  let pool=DATA.filter(h=>!(S.skip&&explored(h.name))&&h.name!==curName());
  if(!pool.length) pool=DATA.filter(h=>h.name!==curName());
  const target=pool[Math.floor(Math.random()*pool.length)].name;
  const h=BY[target];
  if(S.mode==='auto') for(const fk of Object.keys(h.stops)){const n=h.stops[fk].length; if(n) setChoice(h,fk,Math.floor(Math.random()*n));}
  if(reduce){S.drawn=target;select(target,{fly:true,drawn:true,state:'half'});return;}
  spinning=true; app.classList.add('spinning'); $('#pick').disabled=true;
  view='spin'; setCur(null); hlName=null; headerCount(); hoodClasses();
  grab.innerHTML=`<div class="eyebrow">${esc(B.scope)}</div><h2 class="hname">Picking your day…</h2><p class="tag">Watch the map.</p>`; body.innerHTML='';
  setSheet('peek');
  await fitAll(true,'peek');
  const names=DATA.map(d=>d.name), N=22, seq=[]; let prev=null;
  for(let i=0;i<N-1;i++){let n; do{n=names[Math.floor(Math.random()*names.length)];}while(n===prev||(i===N-2&&n===target)); seq.push(n); prev=n;}
  seq.push(target);
  for(let i=0;i<N;i++){ hlName=seq[i]; hoodClasses(); tick(seq[i]); await sleep(48+430*Math.pow(i/(N-1),2.5)); }
  hlName=null; setCur(target); S.drawn=target; save();
  tick(target,true);
  const p=PATH[target]; p.classList.remove('landed'); void p.getBBox(); p.classList.add('landed');
  view='detail'; render(); body.scrollTop=0;
  setSheet('half');
  await flyTo(target,'half');
  const f=FEAT[target];
  confetti(f.x*cam.k+cam.x, f.y*cam.k+cam.y);
  setTimeout(()=>{ticker.classList.add('gone');},1800);
  spinning=false; app.classList.remove('spinning'); $('#pick').disabled=false;
}
$('#pick').onclick=spin;

/* confetti */
const fx=$('#fx'), ctx=fx.getContext('2d'); let parts=[], fxRaf=0;
function sizeFx(){const d=Math.min(2,devicePixelRatio||1); fx.width=mapEl.clientWidth*d; fx.height=mapEl.clientHeight*d; ctx.setTransform(d,0,0,d,0,0);}
function confetti(x,y){
  if(reduce) return; sizeFx();
  const cols=['#2f7bff','#ffbf1a','#ff6319','#00933c','#b933ad','#fccc0a','#ffffff'];
  for(let i=0;i<150;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.25, s=5+Math.random()*10;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0,round:Math.random()<.25});}
  cancelAnimationFrame(fxRaf); const t0=performance.now();
  const loop=now=>{
    ctx.clearRect(0,0,fx.width,fx.height);
    parts=parts.filter(p=>p.y<mapEl.clientHeight+20&&p.life<200);
    for(const p of parts){p.vy+=.28;p.vx*=.985;p.vy*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-p.life/200);ctx.fillStyle=p.c;
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.h/1.6,0,7);ctx.fill();} else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.3))+1);
      ctx.restore();}
    if(parts.length&&now-t0<4500) fxRaf=requestAnimationFrame(loop); else {parts=[];ctx.clearRect(0,0,fx.width,fx.height);}
  };
  fxRaf=requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
buildMap(); applySub();
for(const k in S.cur) if(S.cur[k]&&!BOARDS[k].hoods.some(h=>h.name===S.cur[k])) S.cur[k]=null;
view=S.view==='explore'?'explore':(curName()?'detail':'intro');
render();
setSheet(isDesk()?'full':'peek');
requestAnimationFrame(()=>{
  headerCount(); fitAll(false);
  if(matchMedia('(pointer: coarse)').matches) note('Pinch to zoom · tap any neighborhood',3500);
});
let rz=0; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(isDesk()) setSheet('full'); headerCount(); fitAll(false); sizeFx();},150);});
</script>
