<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}.hofb{color:var(--accent)}
.mark{text-decoration:none}
.homelink{color:var(--muted);font-size:12.5px}
</style>
<title>HofDose — A New Neighborhood a Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: the map fills the screen. A black signage bar sits on top; the day plan lives in a bottom sheet on phones and a side panel on desktop. Stops are drawn as a subway line. */
:root{
  --water:#cbd9df; --water-2:#c1d1d8; --land:#f7f5f0; --border:#59646b; --off:#e2e3de; --off-edge:#b3bbbf; --park:#d3e5cc;
  --done:#bfe6c9; --part:#e1f1e3;
  --ink:#17191b; --ink-2:#4a545a; --muted:#6c767c; --rule:#dde1df; --shadow:rgba(30,50,60,.22);
  --card:#fbfbf9; --card-2:#f1f2ef;
  --band:#0f1012; --band-2:#1b1d20; --band-line:#33363a; --band-fg:#f5f5f2; --band-muted:#a1a6aa;
  --accent:#ffbf1a; --accent-ink:#141414;
  --target:#2f7bff; --target-ink:#0a2a66;
  --l-coffee:#996633; --l-known:#ff6319; --l-park:#00933c; --l-bite:#fccc0a; --l-bar:#b933ad; --punched:#00933c;
  --display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --water:#0b161c; --water-2:#0f1d24; --land:#262b2f; --border:#95a3aa; --off:#14191c; --off-edge:#2d363b; --park:#22392b;
  --done:#1f4a2d; --part:#1d3326;
  --ink:#ebeee9; --ink-2:#b4bcc0; --muted:#8c969b; --rule:#2c3337; --shadow:rgba(0,0,0,.55);
  --card:#15191c; --card-2:#1c2124; --band:#050506; --band-2:#16181b; --band-line:#2e3135;
  --l-coffee:#b98552; --punched:#2fbf62; color-scheme:dark}}
:root[data-theme="dark"]{
  --water:#0b161c; --water-2:#0f1d24; --land:#262b2f; --border:#95a3aa; --off:#14191c; --off-edge:#2d363b; --park:#22392b;
  --done:#1f4a2d; --part:#1d3326;
  --ink:#ebeee9; --ink-2:#b4bcc0; --muted:#8c969b; --rule:#2c3337; --shadow:rgba(0,0,0,.55);
  --card:#15191c; --card-2:#1c2124; --band:#050506; --band-2:#16181b; --band-line:#2e3135;
  --l-coffee:#b98552; --punched:#2fbf62; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--water);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--band)}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;display:flex;flex-direction:column}

/* signage bar */
.top{flex:none;position:relative;z-index:8;background:var(--band);color:var(--band-fg);display:flex;align-items:center;gap:10px;
  padding-block:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));box-shadow:0 4px 16px var(--shadow)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.mark{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:900 16px/1 var(--display)}
.brand h1{margin:0;font-weight:850;font-stretch:68%;font-size:17px;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.brand small{display:block;white-space:nowrap;font:500 10.5px/1.2 var(--mono);color:var(--band-muted);letter-spacing:.04em;margin-top:3px;text-transform:none;font-stretch:100%}
.iconbtn{flex:none;width:42px;height:42px;border-radius:11px;border:1px solid var(--band-line);background:var(--band-2);color:var(--band-fg);display:grid;place-items:center}
.iconbtn[aria-pressed="true"]{background:var(--band-fg);color:var(--band)}
.iconbtn svg{width:20px;height:20px}
.pick{flex:none;height:42px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);font:850 15px/1 var(--display);font-stretch:85%;letter-spacing:.03em;text-transform:uppercase;padding:0 14px;display:flex;align-items:center;gap:8px}
.pick svg{width:18px;height:18px}
.pick:disabled{opacity:.6;cursor:default}
.pick:active{transform:scale(.97)}

/* map */
.map{position:relative;flex:1;min-height:0;overflow:hidden;background-color:var(--water);
  background-image:repeating-linear-gradient(-32deg,transparent 0 9px,var(--water-2) 9px 10px)}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.dragging #svg{cursor:grabbing}
.hood{fill:var(--land);stroke:var(--border);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .12s}
.hood.park{fill:var(--park)}
.hood.off{fill:var(--off);stroke:var(--off-edge)}
.hood.done{fill:var(--done)}
.hood.part{fill:var(--part)}
.hood.hl{fill:var(--target);transition:none}
.hood.sel{fill:var(--target)}
.hood.landed{animation:landed .5s ease-in-out 3}
@keyframes landed{50%{fill:var(--accent)}}
@media (hover:hover) and (pointer:fine){.app:not(.dragging):not(.spinning) .hood.sh:not(.sel):hover{fill:color-mix(in srgb,var(--land) 62%,var(--target));cursor:pointer}}
#selout{fill:none;stroke:var(--target-ink);stroke-width:3px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
#sub polyline{fill:none;stroke-width:1.6px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;opacity:.38;pointer-events:none}
.nosub #sub{display:none}
.hit{fill:transparent}
.lbl{font-family:var(--display);font-weight:750;font-stretch:72%;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-linejoin:round;pointer-events:none;opacity:0;transition:opacity .2s;letter-spacing:.02em}
.lbl tspan{dominant-baseline:middle}
.lbl.on{opacity:1}
.lbl.offl{fill:var(--muted);font-weight:600;stroke:var(--off)}
.lbl.blue{fill:#fff;stroke:var(--target-ink)}
.mapctl{position:absolute;z-index:4;top:12px;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--band-line);background:var(--band);color:var(--band-fg);font:600 20px/1 var(--display);box-shadow:0 2px 10px var(--shadow);display:grid;place-items:center}
.mapctl button.small{font:600 10.5px/1 var(--mono);letter-spacing:.03em}
.mapctl button[aria-pressed="false"]{color:var(--band-muted);background:var(--band-2);text-decoration:line-through}
.mapctl svg{width:18px;height:18px}
.ticker{position:absolute;z-index:4;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 120px);background:var(--band);color:var(--band-fg);border-radius:999px;padding:9px 16px;
  font:800 16px/1.1 var(--display);font-stretch:80%;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 18px var(--shadow);pointer-events:none;transition:opacity .35s}
.ticker.note{font:500 12px/1.2 var(--mono);text-transform:none;letter-spacing:0;padding:9px 13px}
.ticker.gone{opacity:0}
.ticker.pop{animation:tpop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes tpop{0%{transform:translateX(-50%) scale(.6)}60%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1)}}
.ticker .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--target);margin-right:8px;vertical-align:.08em}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* sheet / panel */
.sheet{position:absolute;z-index:7;left:0;right:0;bottom:0;height:var(--h);display:flex;flex-direction:column;background:var(--card);
  border-radius:18px 18px 0 0;box-shadow:0 -6px 26px var(--shadow);transition:height .34s cubic-bezier(.2,.8,.2,1)}
.sheet[data-state="peek"]{--h:132px}
.sheet[data-state="half"]{--h:56%}
.sheet[data-state="full"]{--h:calc(100% - 10px)}
.sheet.drag{transition:none}
.grab{flex:none;touch-action:none;cursor:grab;padding-top:22px;padding-bottom:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));position:relative;border-bottom:1px solid transparent}
.grab::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--rule)}
.sheet[data-state="full"] .grab,.sheet[data-state="half"] .grab{border-bottom-color:var(--rule)}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;
  padding-top:14px;padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.eyebrow{font:500 10.5px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.hname{margin:6px 0 0;font-weight:900;font-stretch:66%;text-transform:uppercase;font-size:44px;line-height:.88;letter-spacing:-.005em;text-wrap:balance}
.tag{margin:6px 0 0;color:var(--ink-2);font-size:15px;line-height:1.35;text-wrap:pretty;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sheet[data-state="peek"] .tag{-webkit-line-clamp:1}
.headrow{display:flex;align-items:flex-start;gap:12px}
.headrow>div{min-width:0;flex:1}
.ex{flex:none;margin-top:2px;font:600 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--punched);border:1.5px solid currentColor;border-radius:999px;padding:5px 8px}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card-2);border:1px solid var(--rule);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:9px 6px;font:750 14px/1.1 var(--display);font-stretch:85%;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button span{font:500 10.5px/1 var(--mono);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--band);color:var(--band-fg)}
.seg button[aria-pressed="true"] span{color:var(--band-muted)}
.ride{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);background:var(--card-2);border-radius:10px;padding:10px 12px}
.ride svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--ink)}
.ride b{color:var(--ink);font-weight:650}
.prog{display:flex;align-items:center;gap:10px;font:500 12px/1 var(--mono);color:var(--ink-2)}
.pips{display:flex;gap:4px}
.pips i{width:18px;height:6px;border-radius:3px;background:var(--rule)}
.pips i.on{background:var(--punched)}

.line{list-style:none;margin:0;padding:0}
.stop{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding-bottom:22px}
.stop:last-child{padding-bottom:0}
.stop::before{content:"";position:absolute;left:18px;top:40px;bottom:-2px;width:6px;border-radius:3px;background:var(--rule)}
.stop:last-child::before{display:none}
.bul{width:42px;height:42px;border-radius:50%;border:0;background:var(--c);color:#fff;font:900 21px/1 var(--display);display:grid;place-items:center;position:relative;z-index:1;padding:0;transition:transform .15s}
.bul.dk{color:#17191b}
.bul:active{transform:scale(.92)}
.bul .chk{display:none;width:22px;height:22px}
.stop.done .bul{background:var(--card);color:var(--punched);box-shadow:inset 0 0 0 4px var(--punched)}
.stop.done .bul .ltr{display:none}
.stop.done .bul .chk{display:block}
.sbody{min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.kind{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-height:24px}
.kind .cnt{margin-left:auto;letter-spacing:.04em;text-transform:none}
.gfsw{border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:4px 9px;font:600 10.5px/1 var(--mono);letter-spacing:.05em;color:var(--ink-2)}
.gfsw[aria-pressed="true"]{border-color:var(--punched);background:var(--punched);color:#fff}
.opt{display:flex;flex-direction:column;gap:5px;min-width:0}
.opt .nm{margin:0;font-weight:750;font-size:18px;line-height:1.2;text-wrap:balance}
.stop.done .opt .nm{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--punched)}
.opt .why{margin:0;color:var(--ink-2);text-wrap:pretty}
.opt .xtra{margin:0;font-size:13.5px}
.opt .xtra b{font-weight:650}
.opt .addr{align-self:flex-start;font:400 12px/1.4 var(--mono);color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule);margin-top:2px}
.opt .addr:hover{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 10.5px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.chip.oldest{color:var(--l-bar)}
.chip.gfd{color:var(--punched)}
.chip.gfo{color:var(--l-known)}
.car{position:relative;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;margin-right:calc(-1 * max(18px,env(safe-area-inset-right,0px)));padding-right:max(18px,env(safe-area-inset-right,0px))}
.car::-webkit-scrollbar{display:none}
.car .opt{flex:0 0 86%;scroll-snap-align:start;background:var(--card-2);border:1px solid var(--rule);border-radius:13px;padding:12px 13px}
.car .opt.cur{border-color:var(--ink-2)}
.nav{display:flex;align-items:center;gap:8px;font:500 11.5px/1 var(--mono);color:var(--muted)}
.nav .dots{display:flex;gap:5px}
.nav .dots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.nav .dots i.on{background:var(--ink)}
.nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:transparent;display:grid;place-items:center;font:600 16px/1 var(--display);color:var(--ink-2)}
.nav button:disabled{opacity:.35}
.nav .sp{flex:1}
.foot{display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid var(--rule);padding-top:14px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 15px;font:650 14px/1 var(--display);text-decoration:none;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--card)}
.btn svg{width:16px;height:16px}

/* list + intro */
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.legend span{display:flex;align-items:center;gap:9px;font-size:14px}
.legend i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font:900 13px/1 var(--display);display:grid;place-items:center;font-style:normal}
.legend i.dk{color:#17191b}
.lede{margin:0;color:var(--ink-2);max-width:60ch}
.set{display:flex;flex-direction:column;gap:10px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px;cursor:pointer}
.tog input{appearance:none;flex:none;width:44px;height:26px;border-radius:999px;background:var(--rule);position:relative;transition:background .15s;cursor:pointer;margin:0}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tog input:checked{background:var(--punched)}
.tog input:checked::after{transform:translateX(18px)}
.gfrow{background:var(--card-2);border:1px solid var(--rule);border-radius:11px;padding:10px 12px}
.tog small{display:block;color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.hb{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--card-2);border:1px solid var(--rule);border-radius:10px;padding:11px 12px;font:650 14px/1.2 var(--display);min-width:0}
.hb .st{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center}
.hb .st svg{width:12px;height:12px;display:none;color:#fff}
.hb.ex .st{background:var(--punched);border-color:var(--punched)}
.hb.ex .st svg{display:block}
.hb.pt .st{border-color:var(--punched);background:conic-gradient(var(--punched) var(--p),transparent 0)}
.hb.cur{border-color:var(--target);box-shadow:inset 0 0 0 1px var(--target)}
.bar{height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--punched);border-radius:4px}
.small{font-size:12.5px;color:var(--muted);margin:0}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:12.5px;color:var(--muted)}
h3.sec{margin:0;font:800 13px/1 var(--display);font-stretch:85%;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

@media (min-width:900px){
  .app{display:block}
  .top{position:absolute;top:16px;left:16px;width:410px;height:66px;border-radius:16px 16px 0 0;padding:12px 14px}
  .map{position:absolute;inset:0}
  .sheet{top:82px;left:16px;right:auto;bottom:16px;width:410px;height:auto!important;border-radius:0 0 16px 16px;box-shadow:0 10px 30px var(--shadow)}
  .grab{cursor:default;padding-top:16px;border-bottom-color:var(--rule)}
  .grab::before{display:none}
  .sheet .tag{-webkit-line-clamp:3!important}
  .ticker{left:calc(50% + 213px)}
  .mapctl{top:auto;bottom:16px;right:16px}
}
@media (max-width:380px){.pick span{display:none}.pick{padding:0 12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* v3: tabs row, pins, explore */
.top{flex-wrap:wrap;row-gap:8px}
.tabs{flex-basis:100%;display:flex;gap:8px}
.tabs .t2{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--band-2);border:1px solid var(--band-line);border-radius:10px;padding:3px;gap:3px}
.tabs .t2 button{border:0;background:transparent;color:var(--band-muted);border-radius:7px;padding:7px 4px;font:750 13px/1 var(--display);font-stretch:85%;letter-spacing:.03em;text-transform:uppercase}
.tabs .t2 button[aria-pressed="true"]{background:var(--band-fg);color:var(--band)}
.pin .ph{fill:transparent}
.pin .pc{stroke:var(--card);stroke-width:1.6px;vector-effect:non-scaling-stroke}
.pin.approx .pc{stroke-dasharray:2 2;fill-opacity:.55}
.pin.on .pc{stroke:var(--ink);stroke-width:2.6px}
.pin text{font-family:var(--display);font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#fff}
.pin text.dk{fill:#17191b}
.pin.dim{opacity:.35}
.explore .hood.sh{fill:var(--land)}
.explore .hood.sh.park{fill:var(--park)}
.explore .hood.flt{fill:color-mix(in srgb,var(--land) 70%,var(--target))}
.cats{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(18px,env(safe-area-inset-right,0px)));padding-right:max(18px,env(safe-area-inset-right,0px))}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:8px 13px;font:700 13.5px/1 var(--display);font-stretch:90%;display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
.cats button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.cats.sub button{padding:6px 11px;font-size:12.5px}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vgroup{font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px;border-bottom:1px solid var(--rule)}
.vrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;background:none;border:0;border-bottom:1px solid var(--rule);padding:11px 0}
.vrow .d{width:12px;height:12px;border-radius:50%;background:var(--c)}
.vrow b{display:block;font:700 15.5px/1.25 var(--display)}
.vrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.vrow .ty{font:600 10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:4px 7px;white-space:nowrap}
.vrow.on{background:color-mix(in srgb,var(--card) 80%,var(--target))}
.back{align-self:flex-start;background:none;border:0;padding:0;font:650 13.5px/1 var(--display);color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1.5px solid var(--target);color:var(--ink);background:transparent;border-radius:999px;padding:6px 10px;font:650 13px/1 var(--display)}
.chip.type{color:var(--ink-2)}
.chip.approx{color:var(--muted);border-style:dashed}
@media (min-width:900px){
  .top{height:auto!important}
  .sheet{top:var(--toph,128px)!important}
}

.body>*{flex-shrink:0}
.brand h1{min-width:0;overflow:hidden}
.brand small{overflow:hidden;text-overflow:ellipsis}
.brand{overflow:hidden}
.brand h1{font-size:15.5px}
</style>

ve (near Huron St)","why":"Small, quiet, queer-owned neighborhood shop with reliable Wi-Fi and a much-loved iced mocha.","x":210.76,"y":32.99},{"name":"Cafe Grumpy","address":"193 Meserole Ave (at Diamond St), Brooklyn, NY 11222","why":"A roomy, quiet roaster's cafe (the one from 'Girls') with excellent house-roasted espresso and lots of seating.","x":224.69,"y":45.56},{"name":"Variety Coffee Roasters (The Astral)","address":"190 Franklin St (between Java & India Sts), Brooklyn, NY 11222","why":"Variety's biggest cafe, opened June 2026 in a storefront of the landmark 1880s Astral Apartments, with booths, strong espresso and late hours.","x":203.42,"y":35.38}],"park":[{"name":"WNYC Transmitter Park","address":"West St at Greenpoint Ave","why":"Walk out on the pier at the end of Kent St for one of the best straight-on views of the Midtown skyline across the East River. The park sits on the old WNYC radio-transmitter site.","x":200.45,"y":41.88},{"name":"Msgr. McGolrick Park","address":"Russell St & Nassau Ave, Brooklyn, NY 11222","why":"Greenpoint's tree-lined, symmetrical green with a landmark colonnaded pavilion and a Sunday farmers market that runs until about 2pm.","x":233.7,"y":54.09},{"name":"Newtown Barge Park & Greenpoint Landing esplanade","address":"3 Commercial St (at Manhattan Ave), Brooklyn, NY 11222","why":"The neighborhood's northern waterfront tip, with lawn, benches and a wide-open view of Midtown at sunset.","x":198.54,"y":24.88}],"bite":[{"name":"Karczma","address":"136 Greenpoint Ave, Brooklyn, NY 11222","why":"A wood-beamed, folk-costumed Polish tavern that serves Little Poland's comfort food in heaping, cheap portions, even as several old Greenpoint Polish standbys have closed.","order":"Mixed pierogi plate (boiled or fried) with a side of white borscht","x":209.57,"y":40.74},{"name":"Peter Pan Donut & Pastry Shop","address":"727 Manhattan Ave, Brooklyn, NY 11222","why":"A Greenpoint institution with a retro counter, cheap coffee and some of the city's best old-school doughnuts.","order":"Red velvet and honey-dipped doughnuts at the counter","x":216.52,"y":52.65},{"name":"Taqueria Ramírez","address":"94 Franklin St, Brooklyn, NY 11222","why":"A tiny, no-frills Mexico City-style taqueria that's become one of NYC's most celebrated taco counters.","order":"Suadero and al pastor tacos, salsa from the bar (closed Mondays)","x":204.96,"y":47.73}],"bite_gf":[{"name":"Uzuki","address":"95 Guernsey St (at Norman Ave)","why":"Michelin-listed soba spot where every menu item is gluten-free, with hand-cut 100% buckwheat noodles and even GF soba beer. Pricey but celiac-worry-free.","order":"Cold 100% buckwheat soba (the ume shiosoba), plus soba ice cream for dessert","gf_level":"dedicated","x":213.89,"y":57.12},{"name":"Oxomoco","address":"128 Greenpoint Ave (at Franklin St), Brooklyn, NY 11222","why":"A Michelin-starred wood-fired Mexican spot where much of the menu is built on house-made corn masa.","order":"Guacamole and the lamb barbacoa tacos; tell the server about celiac and ask what is fried in shared oil","gf_level":"GF options w/ precautions","x":208.7,"y":40.84},{"name":"Le Botaniste","address":"673 Manhattan Ave, Brooklyn, NY 11222","why":"A plant-based counter where the entire menu is organic and gluten-free, so nothing needs to be modified.","order":"The Tibetan Mama bowl, plus a raw cake for dessert","gf_level":"fully GF menu","x":218.11,"y":56.33}],"bar":[{"name":"The Palace","address":"206 Nassau Ave","why":"A big old corner bar, kept mostly as it was, with a barn-like back room for pool and darts and a beer-and-shot in a frosty mug.","tag":"Old-school corner bar · Palace Cafe since 1956","type":"dive","x":233.7,"y":54.09},{"name":"Diamond Lil","address":"179 Nassau Ave","why":"A quiet, low-lit cocktail bar near McGolrick Park for a well-made drink, a book, and snacks like oysters and shrimp cocktail.","type":"cocktail","x":230.36,"y":54.84},{"name":"Warsaw","address":"261 Driggs Ave","why":"The concert hall inside the Polish National Home: touring bands most nights, with a bar that serves Polish beer and pierogi.","type":"music","x":225.43,"y":62.9}]}},{"name":"Williamsburg","tagline":"Old sugar-refinery waterfront turned Brooklyn's buzziest food-and-drink strip","getting_there":"L from 1 Av to Bedford Av, the first stop in Brooklyn (about 10 min)","stops":{"known_for":[{"name":"Domino Sugar Refinery & Domino Park","address":"River St between Grand St and S 5th St (Domino Park, 15 River St)","why":"The 1880s Domino refinery once processed most of America's sugar and made Williamsburg an industrial powerhouse. Its waterfront is now a park built from salvaged refinery machinery, with the restored yellow Domino Sugar sign above it.","tip":"Walk the elevated catwalk past the old syrup tanks and crane rails at dusk for the Williamsburg Bridge lit up. The park has taco and coffee kiosks.","x":182.22,"y":87.07},{"name":"Williamsburg Bridge walk","address":"Pedestrian entrance at Bedford Ave & S 5th St (Continental Army Plaza), Brooklyn, NY 11211","why":"The 1903 steel suspension bridge has a raised center path with J/M trains rattling past and the best skyline view in north Brooklyn.","tip":"Walk out to midspan and back (about 30 minutes) around golden hour.","x":195.36,"y":98.77},{"name":"Williamsburgh Savings Bank (Weylin)","address":"175 Broadway (at Driggs Ave), Brooklyn, NY 11211","why":"An 1875 domed bank palace at the foot of the bridge and one of Brooklyn's great Gilded Age interiors, now an event venue.","tip":"The inside is mostly for private events, so admire the dome from Broadway and watch for Open House New York access; Peter Luger is a block away.","x":193.57,"y":100.76}],"coffee":[{"name":"Devoción","address":"148 Grand St (at Berry St)","why":"Colombian roaster that flies in fresh green beans, set in a skylit former factory with a living plant wall. A Williamsburg classic.","x":194.08,"y":86.19},{"name":"Partners Coffee","address":"125 N 6th St (at Berry St), Brooklyn, NY 11249","why":"The flagship of a serious local roaster: an airy space with good pour-overs and laptop-free tables.","x":200.31,"y":77.06},{"name":"Oslo Coffee Roasters","address":"133 Roebling St (at N 4th St), Brooklyn, NY 11211","why":"An early Williamsburg micro-roaster, small and unfussy, with a reliably good espresso on a quiet corner.","x":206.0,"y":86.36}],"park":[{"name":"McCarren Park","address":"Bedford Ave & N 12th St (Lorimer St to Driggs Ave)","why":"Loop the running track or grab a bench on the lawn, and see the WPA-era McCarren Play Center pool arches on the Lorimer St side. On Saturdays the Greenmarket sets up at Union Ave & Driggs Ave.","x":210.57,"y":69.0},{"name":"Marsha P. Johnson State Park","address":"90 Kent Ave (at N 8th St), Brooklyn, NY 11249","why":"A waterfront lawn with a straight-on Manhattan view; on Saturdays in season it hosts Smorgasburg.","x":197.55,"y":66.55},{"name":"Bushwick Inlet Park","address":"Kent Ave at N 9th St (to Quay St), Brooklyn, NY 11249","why":"Big riverside fields plus a grassy green-roof building you can climb for a quieter skyline view.","x":197.55,"y":66.55}],"bite":[{"name":"L'industrie Pizzeria","address":"254 S 2nd St, Brooklyn, NY 11211","why":"A tiny counter that became the city's most-hyped slice by blending New York and Italian styles, a good snapshot of Williamsburg's line-out-the-door food culture.","order":"Burrata slice (and a plain slice to compare)","x":203.91,"y":95.56},{"name":"Peter Luger Steak House","address":"178 Broadway, Brooklyn, NY 11211","why":"The 1887 German beer-hall steakhouse that remains Williamsburg's most famous meal.","order":"Porterhouse for two with creamed spinach, or the burger at lunch; bring a card or cash","x":193.28,"y":100.63},{"name":"Edith's Sandwich Counter","address":"495 Lorimer St (at Powers St), Brooklyn, NY 11211","why":"A beloved daytime counter for Jewish-diaspora bagel sandwiches and pastries, perfect for a casual day out.","order":"A loaded bagel sandwich and a pastry from the case (open 8am to 3pm)","x":223.56,"y":95.27}],"bite_gf":[{"name":"Nami Nori","address":"236 N 12th St (at Driggs Ave)","why":"Hand-roll counter that has been reported as fully gluten-free, including the soy sauce. Its old website has lapsed, so confirm the GF policy when you order.","order":"A temaki set with the lobster tempura and fried oyster hand rolls, plus mochurros","gf_level":"dedicated","x":215.33,"y":72.83},{"name":"Kimbap Lab (inside Whole Foods)","address":"238 Bedford Ave (inside Whole Foods), Brooklyn, NY 11249","why":"A Korean kimbap counter from a brand that runs gluten-free kitchens, an easy grab-and-go lunch.","order":"Bulgogi or tuna kimbap with a side of their broth","gf_level":"dedicated","x":199.84,"y":82.17},{"name":"Impact Kitchen","address":"524 Driggs Ave (at N 8th St), Brooklyn, NY 11211","why":"A healthy all-day cafe whose kitchen is a dedicated gluten-free facility, so a celiac can order anything.","order":"The breakfast burrito or a protein bowl, plus the sea salt cookie","gf_level":"dedicated","x":208.36,"y":77.66}],"bar":[{"name":"Teddy's Bar & Grill","address":"96 Berry St","why":"A wood-paneled corner tavern with the old Peter Doelger brewery stained glass, a pub-food menu and a friendly local crowd.","tag":"Oldest bar · since 1887","type":"dive","x":202.31,"y":73.2},{"name":"Maison Premiere","address":"298 Bedford Ave","why":"New Orleans-style oyster and absinthe bar with a horseshoe bar, a garden, and some of the city's most serious cocktails.","type":"cocktail","x":195.4,"y":88.03},{"name":"Union Pool","address":"484 Union Ave","why":"A Williamsburg institution in a former pool-supply shop: indie bands in the back room, a taco truck in the big backyard, and free Sunday 'Summer Thunder' shows.","type":"music","x":217.28,"y":85.6}]}},{"name":"Bushwick","tagline":"Warehouse murals, coffin-factory bars, and serious masa","getting_there":"L from 1 Av to Jefferson St or Morgan Av (about 20 min)","stops":{"known_for":[{"name":"The Bushwick Collective","address":"Troutman St & St Nicholas Ave (spreads along Troutman, Jefferson and St Nicholas)","why":"This rotating open-air street-art gallery started in 2012 and turned Bushwick's warehouse walls into one of the world's best-known mural districts. It's the reason most people first visit the neighborhood.","tip":"Start at the Jefferson St L stop and walk Troutman St east to St Nicholas Ave. Murals change often, so go in daylight and wander the side streets too.","x":284.94,"y":107.52},{"name":"Bushwick Avenue brewers' mansions (Lipsius House)","address":"670 Bushwick Ave (at Willoughby Ave), Brooklyn, NY 11221","why":"Bushwick was a German brewing capital, and Bushwick Ave still has the brewers' grand houses, like the turreted 1889-90 Lipsius mansion (a city landmark).","tip":"Keep walking south on Bushwick Ave past 683-691 and toward Gates Ave for more mansard-roofed mansions and the old churches.","x":261.73,"y":138.61},{"name":"House of Yes","address":"2 Wyckoff Ave (at Jefferson St), Brooklyn, NY 11237","why":"Bushwick's famous anything-goes performance club, with aerialists, costumes and themed dance parties.","tip":"Open Thursday to Sunday nights only; buy tickets ahead and dress up, because the theme is the point.","x":280.82,"y":109.37}],"coffee":[{"name":"Sey Coffee","address":"18 Grattan St (near Morgan Av L)","why":"A light-roast specialty roaster in a bright, plant-filled warehouse space, and still a regular on 2026 NYC coffee lists.","x":260.61,"y":113.87},{"name":"La Cabra Roastery","address":"1329 Willoughby Ave (Unit 161), Brooklyn, NY 11237","why":"The Danish roaster's calm Brooklyn flagship, roasting on site behind glass and baking excellent cardamom buns.","x":286.36,"y":112.62},{"name":"Dayglow","address":"8 Wilson Ave (at Flushing Ave), Brooklyn, NY 11237","why":"Light-roast specialty espresso and creative drinks like the brown-butter Vienna, sharing space with a small brewery in back.","x":264.53,"y":119.59}],"park":[{"name":"Maria Hernandez Park","address":"Knickerbocker Ave & Irving Ave (to Starr St / Suydam St)","why":"Bushwick's neighborhood living room: watch the handball and pickup basketball, then head to the Ten Bells wine bar's patio across the street.","x":281.48,"y":121.53},{"name":"Irving Square Park","address":"Knickerbocker Ave & Halsey St (to Weirfield St), Brooklyn, NY 11207","why":"A leafy, well-kept square at the end of the Knickerbocker Ave shopping strip, with shaded benches and a lively dog scene.","x":315.74,"y":151.17},{"name":"The Evergreens Cemetery","address":"1629 Bushwick Ave (at Conway St), Brooklyn, NY 11207","why":"A 19th-century rural cemetery with hills, old trees and long Manhattan views, at the edge of Bushwick and almost empty.","x":328.08,"y":187.78}],"bite":[{"name":"Roberta's","address":"261 Moore St, Brooklyn, NY 11206","why":"The wood-fired pizza spot in a cinderblock warehouse that put Bushwick on the food map and still sets its scrappy, DIY tone.","order":"Bee Sting pizza (soppressata, chili, honey)","x":257.43,"y":115.92},{"name":"Bunna Cafe","address":"1084 Flushing Ave, Brooklyn, NY 11237","why":"A lively vegan Ethiopian restaurant serving big shared platters on injera, a Bushwick staple.","order":"The combination platter for the table, with coffee from a traditional ceremony pot","x":270.78,"y":115.47},{"name":"Tortillería Mexicana Los Hermanos","address":"271 Starr St (at Wyckoff Ave), Brooklyn, NY 11237","why":"A working tortilla factory with a few tables, serving cheap tacos on tortillas pressed just feet away.","order":"Three tacos (carnitas and al pastor), plus a fresh bag of tortillas to take home","x":284.95,"y":110.96}],"bite_gf":[{"name":"Sobre Masa","address":"52 Harrison Pl (at Bogart St)","why":"Tortillas and masa are house-made corn, but the kitchen makes no celiac claim and has a pastry dessert, so ask about flour and the fryer.","order":"Tacos on house-nixtamalized heirloom-corn tortillas, plus the guac and chips","gf_level":"GF options w/ precautions","x":263.23,"y":111.14},{"name":"Arepera Guacuco","address":"44 Irving Ave (at Troutman St), Brooklyn, NY 11237","why":"A Venezuelan spot whose arepas are made from corn, so most of the menu is naturally gluten-free.","order":"An asado negro or pabellón arepa; skip the tequeños (wheat) and ask about the fryer","gf_level":"GF options w/ precautions","x":278.58,"y":115.93}],"bar":[{"name":"Birdy's","address":"1215 Myrtle Ave","why":"A cash-only throwback old-man bar with cheap beer and a rotating set of vintage pinball machines.","tag":"Dive · cash-only, pinball","type":"dive","x":263.35,"y":137.94},{"name":"Pine Box Rock Shop","address":"12 Grattan St","why":"A cavernous beer bar and music venue inside a former coffin factory, steps from Sey for an easy coffee-to-beer day.","type":"other","x":259.96,"y":114.01},{"name":"Wonderville","address":"1186 Broadway","why":"An indie arcade bar full of homemade and indie video games, with mostly free live music and burlesque nights.","type":"music","x":272.27,"y":152.49}]}},{"name":"Bedford-Stuyvesant","tagline":"Block after block of brownstones, Black Brooklyn history, and stoop culture","getting_there":"L from 1 Av to Lorimer St, transfer to the G to Bedford-Nostrand Avs (about 30 min)","stops":{"known_for":[{"name":"Stuyvesant Heights Historic District","address":"MacDonough St & Stuyvesant Ave (roughly Tompkins to Stuyvesant Aves, Macon to Chauncey Sts)","why":"One of the largest and best-kept runs of 19th-century brownstones in the country. It's the heart of the neighborhood that became a center of Black Brooklyn life and the backdrop for Spike Lee's 'Do the Right Thing' (filmed on Stuyvesant Ave).","tip":"Walk MacDonough, Decatur and Bainbridge Sts between Tompkins and Stuyvesant Aves. The 'Do the Right Thing' block on Stuyvesant Ave between Quincy St and Lexington Ave is co-named Do The Right Thing Way.","x":261.99,"y":182.7},{"name":"Do the Right Thing Way","address":"Stuyvesant Ave between Quincy St and Lexington Ave, Brooklyn, NY 11221","why":"The block where Spike Lee shot 'Do the Right Thing' in 1989, now co-named for the film and still lined with the same brownstones.","tip":"Look for the street sign at Stuyvesant & Quincy, then walk the block with a few film stills on your phone to match the stoops.","x":258.88,"y":162.01},{"name":"Restoration Plaza & the Billie Holiday Theatre","address":"1368 Fulton St (at New York Ave), Brooklyn, NY 11216","why":"Home of Bed-Stuy Restoration, the first community development corporation in the US (founded 1967 with Robert F. Kennedy), plus a landmark Black theater.","tip":"Check the Billie Holiday Theatre calendar for a show, and look at the lobby art and Biggie exhibit.","x":230.36,"y":189.16}],"coffee":[{"name":"Corto","address":"260 Halsey St (at Throop Ave)","why":"Small, serious espresso bar on a brownstone stretch of Halsey St.","x":235.91,"y":182.21},{"name":"Brooklyn Kettle","address":"385 Tompkins Ave (at Putnam Ave), Brooklyn, NY 11216","why":"A small, long-running Tompkins Ave cafe pulling excellent La Colombe espresso, with sidewalk tables and a little shop inside.","x":234.51,"y":176.57},{"name":"Cafe Bossa","address":"925 Marcy Ave (near Fulton St), Brooklyn, NY 11216","why":"A women-owned neighborhood cafe with smooth espresso and a big backyard under a leafy canopy.","x":229.3,"y":185.44}],"park":[{"name":"Herbert Von King Park","address":"Tompkins Ave & Lafayette Ave (to Marcy Ave / Greene Ave)","why":"Bed-Stuy's oldest park (1857, once Tompkins Park), on Olmsted and Vaux's later redesign. Do a lap under the old London plane trees and check the cultural arts center and amphitheater schedule for free events.","x":231.76,"y":158.32},{"name":"Fulton Park","address":"70 Chauncey St (at Stuyvesant Ave), Brooklyn, NY 11233","why":"A shady square in Stuyvesant Heights with chess tables and a statue of Robert Fulton, steps from the historic district.","x":262.98,"y":189.25},{"name":"Hattie Carthan Community Garden","address":"363-365 Clifton Pl (at Marcy Ave), Brooklyn, NY 11216","why":"An urban farm named for Bed-Stuy's 'Tree Lady', with chickens, an herb apothecary and a weekend farmers market; her landmark 1885 Magnolia grandiflora is a block away at 679 Lafayette Ave.","x":223.76,"y":161.75}],"bite":[{"name":"Peaches HotHouse","address":"415 Tompkins Ave, Brooklyn, NY 11216","why":"A Southern soul-food mainstay on Tompkins Avenue that reflects Bed-Stuy's deep Black Brooklyn food heritage and its brownstone-block neighborhood dining.","order":"Nashville-style hot fried chicken with shrimp & grits on the side","x":235.05,"y":180.11},{"name":"Saraghina","address":"350 Lewis Ave, Brooklyn, NY 11233","why":"A rambling, rustic Neapolitan pizzeria on a corner of Stuyvesant Heights that put Lewis Ave on the map.","order":"A margherita or salsiccia pie and the burrata; weekend brunch starts at 10am","x":254.7,"y":179.08},{"name":"Ali's Trinbago Roti Shop","address":"1267 Fulton St (at Arlington Pl), Brooklyn, NY 11216","why":"A decades-old Trinidadian counter that's a Fulton Street institution for roti and doubles.","order":"Doubles to start, then a curry goat roti (closed Mondays)","x":219.65,"y":188.39}],"bite_gf":[{"name":"For All Things Good","address":"343 Franklin Ave (at Lexington Ave)","why":"A molino that grinds its own heirloom-corn masa, so most of the menu is naturally GF, and 100% of 18 Find Me Gluten Free voters rate it celiac friendly. Confirm fryer use and any wheat items.","order":"Mezcal mushroom tlayudita, or the tetela trio to share","gf_level":"GF options w/ precautions","x":205.52,"y":166.76}],"bar":[{"name":"Tip-Top Bar & Grill","address":"432 Franklin Ave","why":"A family-owned neighborhood institution with tinsel, a permanent birthday banner, a '70s R&B jukebox and cheap shot-and-beer specials.","tag":"Oldest bar · family-run since the 1950s","type":"dive","x":207.24,"y":178.13},{"name":"Cocktail Bedstuy","address":"305 Halsey St","why":"A friendly cocktail bar with inventive drinks and one of the best bar backyards in the neighborhood.","type":"cocktail","x":242.18,"y":181.25},{"name":"Bar Lunàtico","address":"486 Halsey St","why":"Tiny, candlelit cocktail bar with live jazz and world music most nights. It feels like a neighborhood salon, so arrive early to get a seat.","type":"music","x":255.4,"y":179.25}]}},{"name":"Clinton Hill","tagline":"Gilded Age mansions, Pratt's art campus, and leafy brownstone calm","getting_there":"L from 1 Av to Lorimer St, transfer to the G to Clinton-Washington Avs (about 30 min)","stops":{"known_for":[{"name":"Clinton Avenue mansions (Charles Pratt's 'Millionaires' Row')","address":"232 Clinton Ave (at DeKalb Ave) and Clinton Ave from Willoughby to Lafayette Aves","why":"In the 1880s and 90s oil baron Charles Pratt and his sons built a row of grand mansions here, which made Clinton Hill the Gilded Age address for Brooklyn's rich. The Notorious B.I.G. later grew up a few blocks away at 226 St. James Pl.","tip":"Walk Clinton Ave from Willoughby Ave south to Lafayette Ave and look for the Romanesque Pratt houses at 229-245. Then detour to St. James Pl between Fulton St and Gates Ave for Biggie's childhood block.","x":179.72,"y":156.32},{"name":"The Notorious B.I.G.'s childhood home","address":"226 St James Pl (near Fulton St)","why":"Christopher Wallace grew up in this brownstone and hustled on the corner of St. James and Fulton, now co-named Christopher Wallace Way.","tip":"It's a private home, so look from the sidewalk, then walk a block to the Christopher Wallace Way street sign at Fulton St.","x":190.15,"y":179.29},{"name":"Emmanuel Baptist Church","address":"279 Lafayette Ave (at St James Pl)","why":"An 1887 Gothic Revival church that Charles Pratt paid for, and the showpiece of the old Millionaires' Row area.","tip":"Sunday service is the easiest way to see the inside and hear the gospel choir. Otherwise admire the facade from Lafayette Ave.","x":186.83,"y":165.14}],"coffee":[{"name":"Prima Brooklyn","address":"147 Greene Ave (at Waverly Ave)","why":"A cozy cafe in a brownstone's garden level, serving Sweetleaf beans, with stoop-side tables out front and a back patio.","x":184.69,"y":169.93},{"name":"Otway Bakery","address":"920a Fulton St (near St James Pl)","why":"A tiny takeout bakery with seriously good coffee and some of Brooklyn's best laminated pastries.","x":189.32,"y":181.08},{"name":"Calyer","address":"519 Myrtle Ave (near Grand Ave)","why":"A bright Myrtle Ave cafe pouring Partners Coffee, with cult-favorite fried chicken sandwiches if you get hungry.","x":189.57,"y":149.1}],"park":[{"name":"Pratt Institute Sculpture Park","address":"200 Willoughby Ave (enter at Willoughby & Hall St)","why":"Pratt's tree-shaded campus doubles as a free outdoor sculpture park with dozens of works. Stroll the lawns, and if it's open, peek into the historic 1887 steam engine room, still running.","x":190.04,"y":153.82},{"name":"Underwood Park","address":"Lafayette Ave between Washington Ave & Waverly Ave","why":"A shady park on the site of the Underwood typewriter family's mansion; grab a bench under the trees after walking the mansion blocks.","x":184.48,"y":165.5},{"name":"Putnam Triangle Plaza","address":"Fulton St & Grand Ave at Putnam Ave","why":"A pedestrian plaza with cafe tables where Fulton St meets Grand Ave, a good place to sit with an Otway pastry and people-watch.","x":195.1,"y":182.68}],"bite":[{"name":"Speedy Romeo","address":"376 Classon Ave, Brooklyn, NY 11238","why":"A converted old auto-parts shop turned wood-fired grill and pizza joint, the kind of laid-back neighborhood anchor that defines Clinton Hill.","order":"The St. Louie pizza (Provel cheese, St. Louis-style)","x":199.37,"y":167.69},{"name":"Mike's Coffee Shop","address":"328 DeKalb Ave (at St James Pl)","why":"An old-school Greek diner that has fed Pratt students and longtime locals for decades, fast and cheap.","order":"Corned beef hash and eggs with rye toast, plus a glazed donut for the road.","x":186.8,"y":160.68},{"name":"Otway","address":"930 Fulton St (near Waverly Ave)","why":"The sit-down sister of the bakery, a breezy all-day spot known for its bread and brunch.","order":"Cardamom bun to start, then the fried chicken sandwich and a Bloody Mary.","x":190.47,"y":181.39}],"bite_gf":[{"name":"The Fly","address":"549 Classon Ave (at Fulton St)","why":"The rotisserie chicken itself is gluten-free per a GF-focused writer. The fries share a fryer, so swap them for roasted potatoes and skip the Caesar's croutons.","order":"Rotisserie chicken with roasted potatoes, not fries","gf_level":"GF options w/ precautions","x":201.83,"y":183.99},{"name":"LaRina Pastificio & Vino","address":"387 Myrtle Ave (at Clermont Ave)","why":"A handmade-pasta Italian spot with a leafy back patio that will swap in gluten-free pasta on request.","order":"GF pasta with the seasonal ragu, plus a grilled main. Tell them it's celiac so they cook the pasta in fresh water and keep it away from the focaccia.","gf_level":"GF options w/ precautions","x":174.94,"y":150.6}],"bar":[{"name":"Putnam's Pub & Cooker","address":"419 Myrtle Ave","why":"A big, friendly Irish-leaning pub with booths, a long draft list, trivia nights and fish and chips.","tag":"Irish pub · Guinness on tap","type":"dive","x":178.61,"y":150.71},{"name":"Golden Ratio","address":"216 1/2 Greene Ave","why":"A minimalist cocktail bar on the Clinton Hill/Fort Greene line, on the Infatuation's best cocktail bars list. Nearly every house cocktail has a zero-proof version.","type":"cocktail","x":192.99,"y":168.65},{"name":"Sisters","address":"900 Fulton St","why":"Big, easygoing bar and restaurant on Fulton with a back room for music and DJ nights.","type":"music","x":187.29,"y":180.51}]}},{"name":"Fort Greene","tagline":"BAM, brownstones, and Brooklyn's original hilltop park","getting_there":"L from 1 Av to Lorimer St, transfer to the G to Fulton St (about 30 min)","stops":{"known_for":[{"name":"BAM (Brooklyn Academy of Music)","address":"30 Lafayette Ave (at Ashland Pl)","why":"America's oldest continuously operating performing-arts center (founded 1861; current Beaux-Arts home from 1908). It anchors Fort Greene's identity as Black Brooklyn's arts hub, longtime home turf of Spike Lee's 40 Acres and a Mule.","tip":"Catch a film at BAM Rose Cinemas in the 1908 Peter Jay Sharp Building, or check the BAMcafé schedule for live music. Book Howard Gilman Opera House shows ahead.","x":158.78,"y":169.3},{"name":"Lafayette Avenue Presbyterian Church","address":"85 S Oxford St (at Lafayette Ave)","why":"An abolitionist church and documented Underground Railroad stop, with Tiffany windows and a large 1970s mural series upstairs.","tip":"Go Tue-Wed midday or after Sunday service, when the doors are open, and ask to see the Tiffany window and 'The Witnesses' paintings on the second floor.","x":168.07,"y":168.75},{"name":"Prison Ship Martyrs' Monument","address":"Fort Greene Park, top of the hill (enter at DeKalb Ave & St Edwards St)","why":"A 149-foot Doric column by McKim, Mead & White standing over a crypt for more than 11,000 American prisoners who died on British ships during the Revolution.","tip":"Climb the wide granite stairs from Myrtle Ave for the full approach, then look for the bronze eagles and the crypt door at the base.","x":163.56,"y":154.67}],"coffee":[{"name":"Bittersweet","address":"180 DeKalb Ave (at Carlton Ave)","why":"A tiny, always-lined-up neighborhood cafe one block from Fort Greene Park, with La Colombe beans.","x":170.62,"y":161.2},{"name":"The Center for Fiction Cafe & Bar","address":"15 Lafayette Ave (at Ashland Pl)","why":"Coffee inside a nonprofit literary center lined floor to ceiling with books, with plenty of seats and a reading-room calm.","x":157.11,"y":169.55},{"name":"Hungry Ghost (Fulton St)","address":"781 Fulton St (at S Portland Ave)","why":"A plant-filled cafe in a converted old tire shop near the park, open early and late.","x":168.57,"y":172.23}],"park":[{"name":"Fort Greene Park","address":"DeKalb Ave & Washington Park (Myrtle to DeKalb Aves, St. Edwards St to Washington Park)","why":"Climb to the 149-foot Prison Ship Martyrs' Monument (designed by McKim, Mead & White) for views over the brownstones. On Saturdays, stop at the Greenmarket at the Washington Park & DeKalb corner.","x":169.14,"y":161.12},{"name":"Cuyler Gore Park","address":"Fulton St & Greene Ave (at Carlton Ave)","why":"A shady triangular park with lots of tables, good for a takeout lunch off Fulton St.","x":169.26,"y":172.6},{"name":"Fowler Square","address":"Fulton St & Lafayette Ave (at S Elliott Pl)","why":"A newly redone pedestrian plaza with trees and cafe seating a block from BAM, the spot to sit with a coffee before a show.","x":162.19,"y":168.84}],"bite":[{"name":"Walter's","address":"166 DeKalb Ave, Brooklyn, NY 11217","why":"A buzzy brasserie-style corner across from Fort Greene Park that locals treat as the neighborhood's living room, famous for its fried chicken.","order":"Fried chicken","x":169.14,"y":161.12},{"name":"Miss Ada","address":"184 DeKalb Ave (at Carlton Ave)","why":"Israeli-leaning Mediterranean food with a lovely backyard, and the neighborhood's most reliable crowd-pleaser.","order":"Hummus with the lamb topping, the pita, and the babaganoush with ginger aioli.","x":171.12,"y":161.23},{"name":"Strange Delight","address":"63 Lafayette Ave (at S Elliott Pl)","why":"A New Orleans-style seafood spot with a fun bar, Infatuation-approved and good for a weekend brunch.","order":"Fried shrimp sandwich or the fried basket with cornbread, and chargrilled oysters if you're splurging.","x":162.99,"y":168.74}],"bite_gf":[{"name":"Colonia Verde","address":"219 DeKalb Ave (at Adelphi St)","why":"This Latin American spot marks GF items on its menu and makes its Brazilian cheese-bread bun without wheat. Fries share a fryer and some tacos use flour tortillas, so tell them you're celiac.","order":"Burger on the gluten-free pão de queijo (cheese bread) bun, with roasted potatoes instead of fries","gf_level":"GF options w/ precautions","x":174.75,"y":161.41},{"name":"Olea","address":"171 Lafayette Ave (at Adelphi St)","why":"A long-running Mediterranean spot where many dishes are naturally gluten-free and the dips can be served with endive instead of pita.","order":"Spicy labneh and red pepper dips with endive, half chicken, and squid ink rice. Flag celiac and skip the fried items unless they confirm a separate fryer.","gf_level":"GF options w/ precautions","x":174.68,"y":166.99}],"bar":[{"name":"Alibi","address":"242 DeKalb Ave","why":"Fort Greene's go-to cash-only dive, with cheap drafts, well-poured Guinness, a pool table and a big back courtyard.","tag":"Dive · Guinness on tap","type":"dive","x":177.43,"y":161.54},{"name":"Bar Francis","address":"810 Fulton St","why":"Low-lit cocktail bar on the Fulton strip, open Wednesday to Sunday from 4pm.","type":"cocktail","x":178.3,"y":177.37},{"name":"Black Forest Brooklyn","address":"733 Fulton St","why":"A German beer hall run by a German couple, with liter steins, pretzels, schnitzel and outdoor picnic tables.","type":"other","x":164.3,"y":169.95}]}},{"name":"Navy Yard","tagline":"Shipbuilding history, rooftop farms and whiskey behind the old gates","getting_there":"F from 2 Av to York St, then a 15-minute walk east along Flushing Ave (or the B57 bus) to the BLDG 92 entrance at Carlton Ave","stops":{"known_for":[{"name":"Brooklyn Navy Yard Center at BLDG 92","address":"63 Flushing Ave, Brooklyn, NY 11205","why":"Housed in the 1857 Marine Commandant's residence, this free exhibit covers two centuries of the yard, from building the USS Arizona and Missouri to today's manufacturing campus.","tip":"The exhibit is only open Thursday through Sunday, 11am-5pm. Ask there about walking tours (Turnstile Tours runs them) to see more of the yard, since most of it is off-limits on your own.","x":164.84,"y":136.16},{"name":"Brooklyn Grange rooftop farm (Navy Yard)","address":"63 Flushing Ave, Building 3 (enter via Navy Yard Cumberland/Flushing gate)","why":"Among the world's largest rooftop soil farms, growing vegetables and keeping beehives on a WWII-era building, with skyline views on every side.","tip":"You can only go up on a scheduled farm tour, yoga class or dinner. Book on brooklyngrangefarm.com; the season winds down in late fall.","x":164.84,"y":136.16},{"name":"Turnstile Tours of the Navy Yard","address":"Tours start at BLDG 92, 63 Flushing Ave (at Carlton Ave)","why":"Guided tours take you past the dry docks, Admiral's Row and the working factories that are otherwise behind the security gates.","tip":"This is the only way past the gate. Book ahead at turnstiletours.com, and bring photo ID.","x":164.84,"y":136.16}],"coffee":[{"name":"Brooklyn Roasting Company (Flushing Ave)","address":"200 Flushing Ave, Brooklyn, NY 11205","why":"The roaster's flagship cafe, in a big industrial space across from the yard; it roasts its beans inside the Navy Yard itself.","x":180.3,"y":136.99},{"name":"She Wolf Bakery (Market @ 77)","address":"141 Flushing Ave, Building 77 (Market @ 77 food hall)","why":"A cult Brooklyn bread bakery using organic regional grains, with coffee and pastries at its Navy Yard counter (weekdays only, 8am-2pm).","x":173.57,"y":136.64},{"name":"Peck's","address":"455A Myrtle Ave (at Washington Ave)","why":"A cozy cafe-deli with a back patio, about a 10-minute walk south of the Flushing Ave gates and open daily.","x":182.49,"y":150.17}],"park":[{"name":"Naval Cemetery Landscape","address":"Flushing Ave at Williamsburg St W, Brooklyn, NY 11205","why":"A former naval hospital cemetery turned into a free native-plant meadow on the Brooklyn Waterfront Greenway. Walk the raised boardwalk through the meadow; check Brooklyn Greenway Initiative's site for seasonal hours.","x":192.33,"y":136.1},{"name":"Commodore Barry Park","address":"Flushing Ave & Navy St","why":"A big lawn and set of fields just west of the Yard, where you can pick up a game or catch summer festivals like AfroPunk and the International African Arts Festival.","x":152.42,"y":135.47}],"bite":[{"name":"Russ & Daughters (Brooklyn Navy Yard)","address":"141 Flushing Ave, Building 77, Brooklyn, NY 11205","why":"The century-old Lower East Side appetizing shop runs its production bakery and a cafe counter inside the Yard's industrial Building 77, a fitting pairing of old-New York food craft and working waterfront.","order":"Classic bagel with Gaspe Nova lox and scallion cream cheese","x":173.57,"y":136.64},{"name":"Pizza Yard (Market @ 77)","address":"141 Flushing Ave, Building 77 (Market @ 77)","why":"Neapolitan pies made with 00 flour, right inside the Navy Yard's food hall.","order":"A margherita to share, eaten at the communal tables beside Transmitter.","x":173.57,"y":136.64},{"name":"Vinegar Hill House","address":"72 Hudson Ave (at Water St), Vinegar Hill","why":"A beloved, candlelit, wood-fired American spot just outside the Sands St gate, famous for brunch.","order":"Weekend brunch: the sourdough pancake and a side of sausage. At dinner, whatever is coming out of the wood oven.","x":151.1,"y":121.86}],"bite_gf":[{"name":"Wegmans Brooklyn","address":"21 Flushing Ave","why":"Nothing in the Navy Yard is confirmed celiac-safe, so this is the safe grab: labeled GF products (skip the hot bar). For a real meal, Springbone in DUMBO is a 15-minute walk and fully gluten-free.","order":"Packaged items from the gluten-free section, eaten on the waterfront","gf_level":"GF options w/ precautions","x":157.03,"y":135.74}],"bar":[{"name":"The Emerson","address":"561 Myrtle Ave","why":"A cash-only neighborhood bar with a vintage feel, a well-loved pool table, a huge backyard and a weekly open mic. It's just outside the Yard, about a 10-minute walk south from the Clinton Ave gate.","type":"dive","x":194.71,"y":148.32},{"name":"Kings County Distillery - The Gatehouse","address":"299 Sands St","why":"NYC's oldest operating whiskey distillery pours flights and cocktails in the restored 1896 gatehouses at the yard entrance, and runs tours of its Paymaster Building stills.","tag":"NYC's oldest whiskey distillery","type":"cocktail","x":152.6,"y":131.14},{"name":"Transmitter Brewing","address":"141 Flushing Ave","why":"A farmhouse-ale brewery with a big indoor taproom and a row of modern pinball machines, in Building 77 (Market @ 77).","type":"other","x":173.57,"y":136.64}]}},{"name":"DUMBO","tagline":"Cobblestones, converted warehouses and bridges framing the skyline","getting_there":"F from 2 Av to York St, one stop into Brooklyn and about 15 minutes","stops":{"known_for":[{"name":"Washington Street & Water Street Manhattan Bridge view","address":"Washington St at Water St, Brooklyn, NY 11201","why":"This cobblestone block of former factories frames the Empire State Building inside the Manhattan Bridge's arch. It's the neighborhood's defining image and a reminder of its past as a manufacturing district.","tip":"Go on a weekday morning before about 9am to get the shot without crowds, then walk under the bridge archway at Anchorage Pl, where the weekend market sets up.","x":132.04,"y":120.74},{"name":"Empire Stores","address":"53-83 Water St (between Main St & Dock St)","why":"Restored 1870s coffee and sugar warehouses, now with shops, the Time Out Market food hall and a free public rooftop facing the Brooklyn Bridge.","tip":"Take the elevator or stairs to the open roof for one of the best free bridge-and-skyline views in DUMBO, then poke into the courtyard garden.","x":125.89,"y":120.44},{"name":"Brooklyn Bridge walk","address":"Pedestrian stairs at Washington St & Prospect St (under the bridge)","why":"Walking the 1883 bridge from the Brooklyn side gives you the Manhattan skyline growing ahead of you the whole way.","tip":"Go early morning or near sunset to beat the crowds, walk out to the first tower and back, and stay on the pedestrian side of the line.","x":131.78,"y":131.17}],"coffee":[{"name":"Dawn's 'Til Dusk","address":"33 Main St","why":"Bright, plant-filled café a block from the water, good for a coffee before the bridge views.","x":129.59,"y":120.61},{"name":"Devoción DUMBO","address":"105 York St (at Jay St)","why":"Colombian beans flown in fresh and roasted on site, served in a skylit, plant-filled space.","x":138.43,"y":125.71},{"name":"Butler","address":"40 Water St (at Old Fulton St)","why":"A bright bakery-cafe a block from the bridge, with strong espresso and big windows.","x":125.53,"y":120.42}],"park":[{"name":"Brooklyn Bridge Park - Main Street section & Jane's Carousel","address":"Dock St & Water St (Main St entrance), Brooklyn, NY 11201","why":"Ride the restored 1922 Jane's Carousel in its glass pavilion, then sit on the pebble beach between the two bridges at sunset.","x":125.36,"y":120.41},{"name":"DUMBO Archway Plaza (Pearl Street Triangle)","address":"Water St between Pearl St & Anchorage Pl","why":"A cobblestone plaza under the Manhattan Bridge archway with summer flea markets, free performances and the DUMBO sign.","x":136.12,"y":120.82}],"bite":[{"name":"Juliana's","address":"19 Old Fulton St, Brooklyn, NY 11201","why":"Patsy Grimaldi's own coal-oven pizzeria under the Brooklyn Bridge, the real heir to the old DUMBO pizza legend that the touristy place next door trades on.","order":"Classic margherita coal-fired pie (or the No. 1 with mozzarella, scamorza, pancetta)","x":122.88,"y":122.57},{"name":"Ignazio's","address":"4 Water St (at Old Fulton St)","why":"A neighborhood pizzeria tucked under the Brooklyn Bridge, usually with a much shorter line than its famous neighbors.","order":"A thin-crust margherita, then carry it down to the river.","x":121.68,"y":120.97},{"name":"Grimaldi's","address":"1 Front St (at Old Fulton St)","why":"The classic coal-oven pizzeria under the bridge, with checkered tablecloths and a jukebox; a rite of passage.","order":"A large margherita with pepperoni. Go on a weekday afternoon to skip the line.","x":123.66,"y":123.02}],"bite_gf":[{"name":"Springbone Kitchen DUMBO","address":"55 Prospect St, Brooklyn, NY 11201","why":"Celiac review sites list the whole kitchen as 100% gluten-free, so nothing on the menu needs vetting; it's quick, good for lunch, and fuels a long walk.","order":"A bone broth with a protein bowl (e.g. chicken and rice bowl)","gf_level":"dedicated","x":134.31,"y":128.17},{"name":"Luke's Lobster Brooklyn Bridge Park","address":"11 Water St (at Old Fulton St)","why":"Maine lobster rolls with a gluten-free bun option, and staff experienced with allergy orders.","order":"Lobster roll on the GF bun with chowder. Say celiac so they change gloves and toast the bun separately.","gf_level":"GF options w/ precautions","x":121.91,"y":120.68},{"name":"The Maiz Project (Time Out Market)","address":"55 Water St, Empire Stores (Time Out Market)","why":"Venezuelan arepas made from corn dough pressed fresh at the counter, which several celiac reviewers rate as safe.","order":"Steak and chimichurri arepa or the mushroom arepa. Ask them to confirm nothing breaded is on the griddle.","gf_level":"GF options w/ precautions","x":126.06,"y":120.45}],"bar":[{"name":"68 Jay St Bar","address":"68 Jay St","why":"A worn-in corner bar that feels like a neighbor's living room. It predates the boutiques and is still DUMBO's best low-key drink.","type":"dive","x":138.61,"y":122.04},{"name":"Gair","address":"41 Washington St","why":"An architect-owned cocktail bar with serious drinks built on independent-distillery spirits, good low-ABV options and window seats facing the Manhattan Bridge.","type":"cocktail","x":132.04,"y":120.74},{"name":"Superfine","address":"126 Front St","why":"A queer-owned warehouse bar and restaurant that has run for 20+ years, with a weekly bluegrass/country brunch, Sunday live music and a jazz jam on the 2nd and 4th Wednesday.","type":"music","x":136.43,"y":122.95}]}},{"name":"Brooklyn Heights","tagline":"America's first suburb: brownstone lanes, abolitionist history, harbor views","getting_there":"6 from Astor Pl to Brooklyn Bridge-City Hall, transfer to the 4/5 one stop to Borough Hall. Or take the 6 there and walk across the Brooklyn Bridge","stops":{"known_for":[{"name":"Plymouth Church","address":"75 Hicks St, Brooklyn, NY 11201","why":"Henry Ward Beecher's 1847 church was a major Underground Railroad stop, nicknamed 'Grand Central Depot', and Lincoln worshipped here. It anchors the Heights' story as NYC's first historic district.","tip":"Call or check plymouthchurch.org for tour times. The Beecher statue in the garden on Orange St is always visible, and Willow and Cranberry Streets nearby make for the best brownstone wander.","x":122.21,"y":132.43},{"name":"Center for Brooklyn History","address":"128 Pierrepont St (at Clinton St)","why":"The former Long Island Historical Society building (1881), with a gorgeous wood-paneled library and rotating exhibits on Brooklyn's past.","tip":"Free; open Mon-Sat (closed Sunday). Peek into the second-floor Othmer Library, and check coats and bags first.","x":125.92,"y":145.12},{"name":"Truman Capote's house","address":"70 Willow St (at Orange St)","why":"The yellow Greek Revival house where Capote wrote Breakfast at Tiffany's and In Cold Blood while renting the basement.","tip":"It's private, so view it from the street, then walk Willow St to Pierrepont Pl for the best brownstone blocks before hitting the Promenade.","x":119.73,"y":133.26}],"coffee":[{"name":"Vineapple Cafe","address":"71 Pineapple St, Brooklyn, NY 11201","why":"Quirky, living-room-style neighborhood cafe that regulars bought and revived in 2020, a few blocks from the Promenade.","x":124.36,"y":135.68},{"name":"Brooklyn Roasting Company (One Clinton)","address":"1 Clinton St (at Cadman Plaza W)","why":"A big, airy outpost of the local roaster, easy to settle into before walking the Heights.","x":128.02,"y":141.67},{"name":"Nako","address":"18 Columbia Pl (near Joralemon St)","why":"A tiny cafe on a hidden lane that serves guest single-origin beans, cardamom 'Nako' lattes and great pastries.","x":111.85,"y":150.27}],"park":[{"name":"Brooklyn Heights Promenade","address":"Montague St to Orange St along Columbia Heights, Brooklyn, NY 11201","why":"Walk the third-of-a-mile esplanade over the BQE at golden hour for the classic straight-on view of the Lower Manhattan skyline and the Statue of Liberty.","x":114.42,"y":139.49},{"name":"Brooklyn Bridge Park Pier 2","address":"Furman St at Joralemon St (Pier 2 entrance)","why":"A pier of free courts for basketball, bocce, shuffleboard and handball, plus a seasonal roller rink under a giant shade roof.","x":110.27,"y":148.43}],"bite":[{"name":"Lassen & Hennigs","address":"114 Montague St, Brooklyn, NY 11201","why":"A decades-old Montague Street deli where Heights locals grab sandwiches before strolling the Promenade.","order":"A hero sandwich from the deli counter (to carry to the Promenade)","x":120.35,"y":145.36},{"name":"Fascati Pizza","address":"80 Henry St (at Orange St)","why":"A no-frills Heights slice joint loved by locals for decades.","order":"A plain slice and a Sicilian square, eaten on the way to the Promenade.","x":125.39,"y":134.84},{"name":"Yemen Cafe","address":"176 Atlantic Ave (at Clinton St)","why":"A bustling Atlantic Ave institution for Yemeni food in huge portions, with free tea and bread.","order":"Lamb fahsa with the flatbread, plus a whole charcoal-grilled chicken for the table.","x":122.95,"y":159.89}],"bite_gf":[{"name":"Chama Mama","address":"121 Montague St, Brooklyn, NY 11201","why":"Georgian spot with many naturally GF grilled and vegetable dishes. Celiac reviewers say staff personally oversee GF prep, but it's a bread-heavy cuisine, so flag celiac clearly.","order":"Mtsvadi (grilled meat skewers) with pkhali and an ajapsandali stew; skip the khachapuri and khinkali","gf_level":"GF options w/ precautions","x":120.85,"y":145.54},{"name":"Dellarocco's Brick Oven Pizza","address":"214 Hicks St (at Montague St)","why":"Brick-oven pizza with a gluten-free crust option, rated well by celiac diners on findmeglutenfree.","order":"GF margherita pie. Ask them to bake it on a clean tray or screen, not straight on the oven floor.","gf_level":"GF options w/ precautions","x":117.74,"y":144.9}],"bar":[{"name":"Montero Bar & Grill","address":"73 Atlantic Ave","why":"A 1939 longshoremen's dive covered in maritime junk, with weekend karaoke. New owners (Crew) took over in early 2026 and kept it essentially intact, though it now takes cards.","tag":"Oldest bar · since 1939","type":"dive","x":112.99,"y":156.26},{"name":"The Binc","address":"60 Henry St","why":"The neighborhood's go-to craft cocktail bar, with inventive drinks, custom orders and a small food menu.","type":"cocktail","x":126.11,"y":132.89},{"name":"Henry Street Ale House","address":"62 Henry St","why":"A dark, wood-paneled tavern with a solid tap list and well-loved fried chicken sandwiches.","type":"other","x":126.03,"y":133.11}]}},{"name":"Downtown Brooklyn","tagline":"Civic grandeur, subway history and a buzzing food-hall core","getting_there":"F from 2 Av to Jay St-MetroTech, about 15 minutes","stops":{"known_for":[{"name":"New York Transit Museum","address":"99 Schermerhorn St (at Boerum Pl), Brooklyn, NY 11201","why":"Set inside a decommissioned 1936 subway station, with walk-through vintage subway cars on the old tracks. It's the best way to see the transit hub that made Downtown Brooklyn.","tip":"Open Wed-Sun, 10am-4pm ($15). The museum recently posted that its galleries aren't climate-controlled, so dress in layers.","x":131.5,"y":158.84},{"name":"Brooklyn Borough Hall","address":"209 Joralemon St","why":"The 1848 Greek Revival city hall from when Brooklyn was its own city, and the borough's oldest public building.","tip":"Look up at the Lady Justice statue on the cupola; the lobby is open weekdays 9 to 5.","x":129.59,"y":152.57},{"name":"Dime Savings Bank & Brooklyn Tower","address":"9 DeKalb Ave","why":"A domed 1908 neoclassical bank that now forms the base of Brooklyn's first 1,000-foot tower.","tip":"For the full old-meets-new view, stand on Fulton St by Albee Square and look up past the dome.","x":147.91,"y":160.06}],"coffee":[{"name":"Compilation Coffee Roasters","address":"343 Gold St, Brooklyn, NY 11201","why":"Independent roaster-cafe on the Fort Greene edge of Downtown, with mixed seating that suits a lingering cup.","x":146.19,"y":147.79},{"name":"Cafe D'Avignon (DeKalb Market Hall)","address":"445 Albee Square W","why":"A long-running Brooklyn French bakery counter in the market hall, good for a croissant with your espresso.","x":148.64,"y":159.19},{"name":"White Noise Coffee","address":"57 Smith St","why":"A roastery cafe with house-roasted espresso, a big space and a solid brunch menu (closed Mondays).","x":134.93,"y":160.38}],"park":[{"name":"Columbus Park at Borough Hall","address":"Court St & Joralemon St, Brooklyn, NY 11201","why":"Shop the Borough Hall Greenmarket on the plaza (Tue, Thu and Sat), then look up at the 1848 Greek Revival Borough Hall and the Henry Ward Beecher statue.","x":128.9,"y":152.41},{"name":"Abolitionist Place (Willoughby Square Park)","address":"110 Willoughby St (at Albee Square)","why":"A long-awaited new downtown square that opened recently, named for Duffield Street's abolitionist history; grab a bench under the young trees across from City Point.","x":144.12,"y":153.7},{"name":"Cadman Plaza Park","address":"Cadman Plaza E & Tillary St","why":"A long lawn running up to the Brooklyn War Memorial; walk north along it and take the stairs onto the Brooklyn Bridge.","x":130.13,"y":135.87}],"bite":[{"name":"Junior's Restaurant","address":"386 Flatbush Ave Ext, Brooklyn, NY 11201","why":"The 1950 diner whose cheesecake became a Brooklyn icon, still holding down the corner of Flatbush and DeKalb amid the downtown towers.","order":"Original plain New York cheesecake slice (plus a corned beef sandwich if hungry)","x":150.03,"y":160.04},{"name":"Gage & Tollner","address":"372 Fulton St","why":"The restored 1879 chophouse with a landmarked gaslit dining room; it's pricey, so weekend brunch is the casual way in.","order":"Weekend brunch: the crispy hash browns, a burger and a Sherry Cobbler","x":136.35,"y":155.27},{"name":"Lele's Roman","address":"252 Schermerhorn St (Ace Hotel)","why":"An all-day Roman trattoria in the Ace Hotel by the Hoyt-Schermerhorn station, with very good pizza and pasta.","order":"Roman-style pizza and the cacio e pepe, plus pistachio gelato","x":144.65,"y":165.42}],"bite_gf":[{"name":"twentyonegrains (DeKalb Market Hall)","address":"445 Albee Square W, Brooklyn, NY 11201","why":"Fast-casual bowls and wraps made in what it calls a fully gluten-free kitchen, with no menu vetting needed inside an otherwise gluten-heavy food hall.","order":"Spicy Chicken Caesar bowl","gf_level":"dedicated","x":148.64,"y":159.19},{"name":"Eight Turn Crepe (DeKalb Market Hall)","address":"445 Albee Square W","why":"Japanese-style crepes in a cone, with a batter promoted as naturally gluten-free.","order":"A savory crepe, or strawberry and cream; skip cookie and cereal toppings","gf_level":"GF options w/ precautions","x":148.64,"y":159.19}],"bar":[{"name":"O'Keefe's Bar & Grill","address":"62 Court St","why":"An unpretentious Borough Hall pub packed with courthouse and office regulars, cheap happy hour and sports on every screen.","tag":"Old-school pub · on Court St since c. 1919","type":"dive","x":128.29,"y":154.03},{"name":"Sunken Harbor Club","address":"372 Fulton St","why":"A tiny nautical tiki bar hidden upstairs in the restored 1892 Gage & Tollner chophouse (enter through the restaurant), with theatrical drinks and ship-cabin decor.","type":"cocktail","x":136.35,"y":155.27},{"name":"House of Wax","address":"445 Albee Square W","why":"A moody cocktail bar on City Point's 4th floor outside the Alamo Drafthouse, with walls of antique wax anatomical figures and a deep draft list.","type":"other","x":148.64,"y":159.19}]}},{"name":"Boerum Hill","tagline":"Quiet brownstone blocks with Atlantic Avenue's shops and old taverns","getting_there":"F from 2 Av to Bergen St (about 20 minutes), or the 6 to Brooklyn Bridge, then the 4/5 to Nevins St","stops":{"known_for":[{"name":"Boerum Hill Historic District (State & Pacific Streets)","address":"State St between Hoyt St & Bond St, Brooklyn, NY 11217","why":"1840s-1870s Greek Revival and Italianate rowhouses that 1960s 'brownstoners' rescued. The neighborhood's name and identity grew out of that preservation fight.","tip":"Walk State, Pacific and Dean between Hoyt and Nevins, then stop at the Invisible Dog Art Center (51 Bergen St), a free gallery in a converted factory where the novelty 'invisible dog' leashes were made.","x":141.27,"y":165.98},{"name":"Hoyt-Schermerhorn station (The Warriors)","address":"Hoyt St & Schermerhorn St (A/C/G)","why":"This subway station appears in The Warriors, Coming to America and Michael Jackson's 'Bad' video, and its outer platforms have been abandoned since the 1940s.","tip":"From the active platforms, look across at the dark outer platforms; upstairs in the mezzanine, find the Art Deco Loeser's department store tiles.","x":139.76,"y":162.91},{"name":"Dean Street ('The Fortress of Solitude')","address":"Dean St between Bond St & Nevins St","why":"This is the brownstone block where Jonathan Lethem grew up and set The Fortress of Solitude, his novel about 1970s Boerum Hill.","tip":"Walk the block from Bond to Nevins and picture the stickball and stoop scenes from the book, then continue to Rucola at Dean & Bond.","x":143.25,"y":174.15}],"coffee":[{"name":"Absolute Coffee","address":"327 Atlantic Ave, Brooklyn, NY 11201","why":"A relaxed neighborhood cafe with window seats over Atlantic Avenue, good for people-watching between antique shops.","x":136.17,"y":165.75},{"name":"The Little Sweet Cafe","address":"77 Hoyt St","why":"A tiny laptop-free cafe known for crepes, Persian shakshuka and an excellent cortado.","x":138.59,"y":165.2},{"name":"Loved Ones Coffee","address":"253 Bergen St","why":"A one-man shop where the owner roasts his own beans and even keeps a siphon brewer in the back.","x":145.3,"y":177.59}],"park":[{"name":"David Foulke Memorial Garden","address":"248-250 Bergen St, Brooklyn, NY 11217","why":"A former dumping lot turned community woodland garden with native shade plants and a dogwood planted for violinist Noel Pointer. Sit on a bench during its open-garden hours (posted on the gate, mostly weekends in season).","x":144.22,"y":177.04},{"name":"Hoyt Street Garden","address":"98 Hoyt St","why":"A shady volunteer-run garden that opens to commuters and neighbors daily; sit among the beds a block from the Hoyt-Schermerhorn station.","x":137.43,"y":167.45},{"name":"Pacific Street Bears Community Garden","address":"150 Flatbush Ave (at Pacific St)","why":"A lush garden at Boerum Hill's Flatbush edge; on weekend afternoons, drop in for a quiet sit with Barclays looming behind it.","x":160.56,"y":179.82}],"bite":[{"name":"Mile End Deli","address":"97A Hoyt St, Brooklyn, NY 11217","why":"A small Montreal-Jewish deli that helped kick off Brooklyn's artisanal-deli revival and fits Boerum Hill's low-key brownstone-side-street charm.","order":"Montreal-style smoked meat sandwich (or poutine)","x":137.49,"y":167.32},{"name":"Rucola","address":"190 Dean St","why":"The rustic corner Italian spot at the center of Boerum Hill life, with a communal table and pastas that are always good.","order":"The escarole salad and a rigatoni, or brunch on the sidewalk","x":140.81,"y":172.9},{"name":"Piccola Cucina Casa","address":"141 Nevins St","why":"A warm Sicilian trattoria with generous homemade pastas and arancini (lunch on weekends only).","order":"Arancino, polpette and the agnolotti ossobuco, with cannoli to finish","x":144.82,"y":177.11}],"bite_gf":[{"name":"Sottocasa","address":"298 Atlantic Ave, Brooklyn, NY 11201","why":"Neapolitan pizzeria that makes its own GF crust, which celiac reviewers say tastes like the real thing. Confirm how they prep it and what they bake it on, since it shares the oven with wheat dough.","order":"Margherita on the house-made gluten-free crust, in the back garden","gf_level":"GF options w/ precautions","x":133.51,"y":164.39},{"name":"Betty Bakery","address":"448 Atlantic Ave","why":"A beloved cake shop with a lineup of gluten-free cupcakes, cookies and cheesecake.","order":"A GF cupcake or a slice of GF cheesecake","gf_level":"GF options w/ precautions","x":146.01,"y":170.79},{"name":"LuAnne's Wild Ginger","address":"112 Smith St","why":"A pan-Asian vegan restaurant with a separate gluten-free menu.","order":"From the GF menu: bibimbap or a curry, and say it's for celiac","gf_level":"GF options w/ precautions","x":131.85,"y":166.2}],"bar":[{"name":"The Brooklyn Inn","address":"148 Hoyt St","why":"An 1885 tavern with a towering carved-wood back bar, stained glass, a pool room and no TVs. It survived Prohibition as a speakeasy.","tag":"Oldest bar · 1800s saloon","type":"dive","x":134.96,"y":172.28},{"name":"Grand Army","address":"336 State St","why":"A buzzy State Street cocktail bar with pop-culture-themed drinks, oysters and a strong happy hour.","type":"cocktail","x":138.83,"y":164.73},{"name":"Bar Tabac","address":"128 Smith St","why":"A long-running French bistro-bar at Smith and Dean with a zinc bar, late hours and live music on select nights (traditionally jazz).","type":"music","x":131.01,"y":167.83}]}},{"name":"Cobble Hill","tagline":"Brownstone calm, hidden mews, and Atlantic Avenue spice stalls","getting_there":"Walk to 2 Av (F) at Houston St, ride the F to Bergen St (about 25 min). Bergen St drops you right on Smith St.","stops":{"known_for":[{"name":"Sahadi's","address":"187 Atlantic Ave, Brooklyn, NY 11201","why":"This family-run Middle Eastern grocery has been on Atlantic Ave since 1948 and a
