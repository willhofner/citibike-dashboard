<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Know Your New York</title>
<meta name="description" content="A map game for learning the neighborhoods of all five boroughs, with fun facts about each one.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: the map is a full-bleed canvas you pinch and drag. A black transit-signage console sits over it (left card on desktop, top band on phones); start and results screens are the same signage, larger. */
:root {
  --water: #cbd9df;
  --water-2: #c1d1d8;
  --land: #f7f5f0;
  --land-edge: #a3adb2;
  --border: #59646b;
  --park: #d3e5cc;
  --off: #e2e3de;
  --ink: #17191b;
  --muted: #5a646a;
  --shadow: rgba(30, 50, 60, .22);

  --band: #0f1012;
  --band-2: #1b1d20;
  --band-line: #33363a;
  --band-fg: #f5f5f2;
  --band-muted: #a1a6aa;

  --accent: #ffbf1a;
  --accent-ink: #141414;
  --target: #2f7bff;
  --target-ink: #0a2a66;

  --r3: #19d264;      /* first try */
  --r3-glow: #39ff88;
  --r2: #ffdd00;      /* second try or hint */
  --r1: #ff8f80;      /* third try */
  --r0: #c3131f;      /* missed */
  --r0-soft: #ff6b6b;

  --display: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --water: #0b161c; --water-2: #0f1d24; --land: #262b2f; --land-edge: #4b565d; --border: #95a3aa; --park: #22392b; --off: #121619;
  --ink: #ebeee9; --muted: #98a1a6; --shadow: rgba(0, 0, 0, .55);
  --band: #050506; --band-2: #16181b; --band-line: #2e3135;
  --r3: #14b956; --r2: #f0cc00; --r1: #e77565; --r0: #a40f1a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --water: #0b161c; --water-2: #0f1d24; --land: #262b2f; --land-edge: #4b565d; --border: #95a3aa; --park: #22392b; --off: #121619;
  --ink: #ebeee9; --muted: #98a1a6; --shadow: rgba(0, 0, 0, .55);
  --band: #050506; --band-2: #16181b; --band-line: #2e3135;
  --r3: #14b956; --r2: #f0cc00; --r1: #e77565; --r0: #a40f1a; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body { background: var(--water); color: var(--ink); font-family: var(--display); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--band); }
button { font-family: inherit; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr; touch-action: none; }
.app > .hud { grid-row: 1; }
.app > .mapwrap { grid-row: 2; }
@media (min-width: 900px) { .app { display: block; } }

/* ---------- map ---------- */
.mapwrap { position: relative; min-height: 0; height: 100%; overflow: hidden;
  background-color: var(--water);
  background-image: repeating-linear-gradient(-32deg, transparent 0 9px, var(--water-2) 9px 10px); }
.pane { position: absolute; inset: 0; touch-action: none; cursor: grab; }
.dragging .pane { cursor: grabbing; }
.pane svg { display: block; width: 100%; height: 100%; }
.land { filter: drop-shadow(0 2px 3px var(--shadow)); }
.hood { fill: var(--land); stroke: var(--border); stroke-width: 1px; vector-effect: non-scaling-stroke; transition: fill .1s ease-out; }
.hood.park { fill: var(--park); }
.hood.off { fill: var(--off); stroke: var(--land-edge); stroke-opacity: .6; }
.edges path { fill: none; stroke: var(--border); stroke-width: 1.4px; vector-effect: non-scaling-stroke; stroke-linejoin: round; pointer-events: none; }
.edges path.off { stroke: var(--land-edge); stroke-opacity: .5; stroke-width: .9px; }
.edges path.tgt { stroke: var(--target-ink); stroke-width: 2.6px; }
@media (hover: hover) and (pointer: fine) {
  .playing.find:not(.dragging) .hood:not(.off):not(.r3):not(.r2):not(.r1):not(.r0):hover { fill: color-mix(in srgb, var(--land) 75%, var(--target)); cursor: pointer; }
}
.hood.target { fill: var(--target); }
.hood.r3 { fill: var(--r3); }
.hood.r2 { fill: var(--r2); }
.hood.r1 { fill: var(--r1); }
.hood.r0 { fill: var(--r0); }
.hood.win { animation: win .55s ease-out; }
@keyframes win { 0% { fill: var(--r3-glow); } 100% { fill: var(--r3); } }
.hood.flash-no { fill: var(--r0-soft) !important; transition: none; }
.hood.attract { fill: var(--target); }
.hood.reveal { fill: var(--r0) !important; animation: pulse .8s ease-in-out 3; }
@keyframes pulse { 50% { fill-opacity: .35; } }
.lbl { font-family: var(--display); font-weight: 700; font-stretch: 72%; fill: var(--ink); text-anchor: middle; dominant-baseline: middle;
  paint-order: stroke; stroke: var(--land); stroke-width: calc(2.4px * var(--lz, 1)); font-size: calc(var(--fs) * var(--lz, 1) * 1px); stroke-linejoin: round; pointer-events: none; opacity: 0; transition: opacity .2s; }
.lbl.on, .lbl.temp { opacity: 1; }
.lbl.dark { fill: #fff; stroke: rgba(0,0,0,.55); }
.hit { fill: transparent; stroke: none; }
.burst { fill: none; stroke: var(--r3-glow); pointer-events: none; }
.streets { pointer-events: none; }
.streets line { stroke: var(--muted); stroke-width: .6; }
.streets .guide { stroke-dasharray: 2 3; stroke-width: .5; opacity: .5; }
.streets .rule { stroke-width: .8; }
.streets text { font-family: var(--mono); font-size: 6.5px; fill: var(--muted); text-anchor: end; dominant-baseline: middle; }
.streets text.named { font-style: italic; }
.subway { opacity: .42; }
.subway .line { fill: none; stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; }
.subway .stn { fill: var(--land); stroke: var(--muted); stroke-width: .4; }
.subway .bul circle { stroke: var(--land); stroke-width: .6; }
.subway .bul text { font: 800 4.6px/1 var(--display); text-anchor: middle; dominant-baseline: central; }
.hide-st .lyr-st, .hide-sub .lyr-sub { display: none; }
.layers { display: contents; }
.compass { pointer-events: none; }
.compass text { font-family: var(--mono); fill: var(--muted); font-size: 7px; }
.compass .ring { fill: none; stroke: var(--muted); stroke-width: .8; }
.compass line { stroke: var(--muted); stroke-width: .8; }
.compass .n { fill: var(--muted); }

.mapctl { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; z-index: 4; }
.mapctl button, .layers button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--band-line); background: var(--band); color: var(--band-fg); font: 600 20px/1 var(--display); cursor: pointer; box-shadow: 0 2px 10px var(--shadow); }
.mapctl button.small, .layers button.small { font: 600 11px/1 var(--mono); letter-spacing: .04em; }
.mapctl button[aria-pressed="false"], .layers button[aria-pressed="false"] { color: var(--band-muted); background: var(--band-2); text-decoration: line-through; }
.coach { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 4; pointer-events: none;
  font: 500 12px/1 var(--mono); color: var(--band-fg); background: color-mix(in srgb, var(--band) 85%, transparent); padding: 9px 12px; border-radius: 999px; white-space: nowrap; transition: opacity .4s; }
.coach.gone { opacity: 0; }

.pop { position: absolute; z-index: 6; pointer-events: none; font: 900 30px/1 var(--display); font-stretch: 80%; color: var(--r3);
  text-shadow: 0 0 2px #fff, 0 0 14px color-mix(in srgb, var(--r3-glow) 80%, transparent), 0 2px 0 rgba(0,0,0,.25);
  transform: translate(-50%, -50%); animation: rise .95s cubic-bezier(.2,.9,.3,1) forwards; }
.pop.t2 { color: #e0b800; text-shadow: 0 0 2px #fff, 0 2px 0 rgba(0,0,0,.2); font-size: 24px; }
.pop.t1 { color: #f06a5a; text-shadow: 0 0 2px #fff, 0 2px 0 rgba(0,0,0,.2); font-size: 22px; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, -30%) scale(.5); } 18% { opacity: 1; transform: translate(-50%, -70%) scale(1.25); } 35% { transform: translate(-50%, -80%) scale(1); } to { opacity: 0; transform: translate(-50%, -190%) scale(1); } }

/* ---------- console (signage) ---------- */
.sign { background: var(--band); color: var(--band-fg); }
.hud { position: relative; z-index: 5; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y;
  padding-block: 12px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-shadow: 0 4px 18px var(--shadow); transition: box-shadow .3s; }
.hud.win { animation: hudwin .6s ease-out; }
@keyframes hudwin { 0% { box-shadow: inset 0 0 0 2px var(--r3-glow), 0 0 28px color-mix(in srgb, var(--r3-glow) 55%, transparent); } 100% { box-shadow: inset 0 0 0 0 transparent, 0 4px 18px var(--shadow); } }
.hud.lose { animation: hudlose .45s ease-out; }
@keyframes hudlose { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 60% { transform: translateX(3px); } }
@media (min-width: 900px) {
  .hud { position: absolute; top: 20px; left: 20px; width: 370px; box-sizing: border-box; border-radius: 16px; padding: 18px 20px 16px; gap: 12px; max-height: calc(100% - 40px); overflow-y: auto; }
}
.hud-top { display: flex; align-items: center; gap: 10px; }
.bullet { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 900 14px/1 var(--display); }
.menu-btn { text-align: left; appearance: none; border: 0; background: none; color: var(--band-fg); display: flex; align-items: center; gap: 9px; padding: 0; cursor: pointer; font: 800 13px/1 var(--display); font-stretch: 78%; letter-spacing: .05em; text-transform: uppercase; }
.menu-btn small { font: 500 10px/1 var(--mono); color: var(--band-muted); letter-spacing: .06em; }
.hud-meta { margin-left: auto; display: flex; gap: 14px; font: 500 13px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--band-muted); align-items: baseline; }
.hud-meta b { color: var(--band-fg); font-weight: 600; font-size: 16px; display: inline-block; }
.hud-meta b.bump { animation: sbump .5s ease-out; }
@keyframes sbump { 30% { transform: scale(1.45); color: var(--r3-glow); } }
.eyebrow { font: 500 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--band-muted); }
.prompt-wrap { display: flex; flex-direction: column; gap: 6px; }
.prompt { font-weight: 850; font-stretch: 78%; font-size: clamp(30px, 8.5vw, 44px); line-height: .95; letter-spacing: -.005em; text-wrap: balance; min-height: .95em; }
.prompt.pending { color: var(--band-muted); }
.prompt.in { animation: slidein .28s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { opacity: 0; transform: translateY(8px); } }
.swatch { display: inline-block; width: .62em; height: .62em; border-radius: 3px; background: var(--target); vertical-align: .05em; margin-left: .15em; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.choice { appearance: none; position: relative; border: 1px solid var(--band-line); background: var(--band-2); color: var(--band-fg); font: 650 14.5px/1.15 var(--display); font-stretch: 90%;
  padding: 11px 10px 11px 30px; border-radius: 9px; text-align: left; cursor: pointer; min-height: 46px; transition: border-color .15s, background .15s, transform .08s; }
.choice kbd { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font: 500 10px/1 var(--mono); color: var(--band-muted); }
@media (hover: hover) and (pointer: fine) { .choice:hover:not(:disabled) { border-color: var(--accent); } }
.choice.right { background: var(--r3); border-color: var(--r3); color: #04210f; }
.choice.right kbd { color: rgba(0,0,0,.5); }
.choice.wrong { background: var(--r0); border-color: var(--r0); color: #fff; }
.choice.wrong kbd { color: rgba(255,255,255,.7); }
.choice:disabled { cursor: default; }
.fact { background: var(--band-2); border: 1px solid var(--band-line); border-radius: 11px; padding: 11px 13px 9px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.fact.in { animation: slidein .3s cubic-bezier(.2,.8,.2,1); }
.fact-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fact-k { font: 600 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.fact-dots { display: flex; gap: 4px; }
.fact-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--band-line); }
.fact-dots i.on { background: var(--band-fg); }
.fact-t { margin: 0; font-size: 14.5px; line-height: 1.42; color: #e9ebe8; text-wrap: pretty; }
.fact-bot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fact-photo { font: 500 11px/1 var(--mono); color: var(--band-muted); text-decoration: none; border-bottom: 1px solid var(--band-line); padding-bottom: 1px; }
.fact-next { appearance: none; border: 0; background: none; color: var(--band-fg); font: 650 12.5px/1 var(--display); padding: 6px 0 6px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.fact-next kbd { font: 500 10px/1 var(--mono); color: var(--band-muted); }
@media (max-width: 899px) { .fact { padding: 9px 11px 7px; gap: 4px; } .fact-t { font-size: 13.5px; line-height: 1.38; } }
.feedback { font-size: 14px; line-height: 1.4; color: #d5d8d6; min-height: 1.4em; }
.feedback b { color: var(--accent); }
.feedback .ok { color: var(--r3-glow); font-weight: 800; }
.feedback .meh { color: var(--r2); font-weight: 800; }
.feedback .no { color: var(--r0-soft); font-weight: 800; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { appearance: none; border: 1px solid var(--band-line); background: transparent; color: var(--band-fg); font: 650 13px/1 var(--display); padding: 10px 13px; border-radius: 9px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
@media (hover: hover) and (pointer: fine) { .btn:hover:not(:disabled) { border-color: var(--band-muted); } .btn.primary:hover { filter: brightness(1.05); } }
.btn kbd { font: 500 10px/1 var(--mono); color: var(--band-muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary kbd { color: rgba(0,0,0,.5); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.big { font-size: 16px; padding: 15px 20px; border-radius: 11px; font-weight: 800; justify-content: center; }
.streak { margin-left: auto; font: 600 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: #04210f; background: var(--r3); padding: 6px 9px; border-radius: 999px; }
.streak.hot { background: var(--r3-glow); box-shadow: 0 0 14px color-mix(in srgb, var(--r3-glow) 70%, transparent); }
.streak.bump { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.22); } }
.segs { display: flex; gap: 2px; height: 6px; }
.segs i { flex: 1; border-radius: 2px; background: var(--band-line); transition: background .25s; }
.segs i.now { background: var(--band-fg); }
.segs i.r3 { background: var(--r3); }
.segs i.r2 { background: var(--r2); }
.segs i.r1 { background: var(--r1); }
.segs i.r0 { background: var(--r0); }
.touch kbd { display: none; }
.touch .choice { padding-left: 12px; }
@media (max-width: 899px) {
  .hud { gap: 8px; }
  .prompt { font-size: 30px; }
  .feedback { font-size: 13px; }
  .btn { padding: 9px 12px; }
}

/* ---------- overlay screens ---------- */
.screen { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: flex-start; overflow-y: auto; touch-action: pan-y;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(90deg, color-mix(in srgb, var(--water) 82%, transparent) 0%, color-mix(in srgb, var(--water) 40%, transparent) 55%, transparent 80%); }
@media (max-width: 899px) { .screen { align-items: flex-end; justify-content: center; background: linear-gradient(0deg, color-mix(in srgb, var(--water) 85%, transparent) 30%, transparent 85%); padding-block: 16px max(16px, env(safe-area-inset-bottom, 0px)); } }
@media (min-width: 900px) { .screen { padding-left: max(48px, env(safe-area-inset-left, 0px)); } }
.panel { width: 100%; max-width: 420px; border-radius: 18px; padding: 26px 24px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 18px 50px var(--shadow); margin-block: auto; }
@media (max-width: 899px) { .panel { margin-block: auto 0; padding: 22px 18px 18px; gap: 16px; } }
.title { display: flex; flex-direction: column; gap: 4px; }
.title .eyebrow { display: flex; align-items: center; gap: 8px; }
.title h1 { margin: 0; font-weight: 900; font-stretch: 62%; font-size: 72px; line-height: .86; white-space: nowrap; letter-spacing: -.01em; text-transform: uppercase; }
.title h1 .pre { display: block; font-size: .36em; font-stretch: 100%; font-weight: 700; letter-spacing: .01em; text-transform: none; color: var(--band-muted); margin-bottom: 4px; }
.lede { margin: 0; font-size: 14.5px; line-height: 1.45; color: #cdd0ce; max-width: 38ch; }
.group { display: flex; flex-direction: column; gap: 8px; }
.modes { display: grid; gap: 6px; }
.mode { appearance: none; border: 1px solid var(--band-line); background: var(--band-2); color: var(--band-fg); border-radius: 11px; padding: 12px 14px; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; transition: border-color .15s; }
@media (hover: hover) and (pointer: fine) { .mode:hover { border-color: var(--band-muted); } }
.mode[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mode .mn { font-weight: 800; font-stretch: 85%; font-size: 17px; }
.mode .md { grid-column: 1; font-size: 12.5px; color: var(--band-muted); }
.mode .mb { grid-column: 2; grid-row: 1 / span 2; font: 500 11px/1.3 var(--mono); color: var(--band-muted); text-align: right; font-variant-numeric: tabular-nums; }
.mode .mb b { display: block; color: var(--band-fg); font-weight: 600; font-size: 13px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--band-2); border: 1px solid var(--band-line); border-radius: 11px; padding: 3px; gap: 3px; }
.seg-boards { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
.seg button { appearance: none; border: 0; background: transparent; color: var(--band-muted); border-radius: 8px; padding: 9px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; align-items: center; }
.seg button b { font: 800 14px/1 var(--display); font-stretch: 85%; color: inherit; }
.seg button span { font: 500 10.5px/1 var(--mono); }
.seg button[aria-checked="true"] { background: var(--band-fg); color: var(--band); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font: 500 11px/1 var(--mono); color: var(--band-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; }
.foot { display: flex; justify-content: space-between; gap: 12px; font: 500 11px/1.4 var(--mono); color: var(--band-muted); flex-wrap: wrap; }
.foot a { color: var(--band-fg); text-decoration: none; border-bottom: 1px solid var(--band-line); }
.foot a:hover { border-color: var(--accent); }

.grade { display: flex; align-items: flex-end; gap: 16px; }
.grade .letter { font: 900 96px/.8 var(--display); font-stretch: 62%; color: var(--accent); }
.grade h2 { margin: 0; font-weight: 850; font-stretch: 78%; font-size: 28px; line-height: 1; text-wrap: balance; }
.grade p { margin: 6px 0 0; color: var(--band-muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--band-line); border-radius: 11px; overflow: hidden; }
.stats div { background: var(--band-2); padding: 12px 12px 11px; display: flex; flex-direction: column; gap: 5px; }
.stats span { font: 500 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--band-muted); }
.stats b { font: 600 22px/1 var(--mono); font-variant-numeric: tabular-nums; }
.misses { display: flex; flex-wrap: wrap; gap: 5px; }

  </section>

["East Village","Gramercy","Kips Bay"],"Theater District":["Midtown","Hell's Kitchen"],"Tribeca":["SoHo","Civic Center","Battery Park City","Financial District","Chinatown"],"Two Bridges":["Civic Center","Chinatown","Financial District","Lower East Side"],"Upper East Side":["Central Park","Midtown","East Harlem"],"Upper West Side":["Central Park","Hell's Kitchen","Morningside Heights","Midtown","Harlem"],"Washington Heights":["Inwood","Harlem"],"West Village":["Chelsea","Greenwich Village","SoHo"]},"facts":{"Battery Park City":[{"k":"Landmark","t":"Brookfield Place's Winter Garden is a huge glass atrium with indoor palm trees, looking right out on the Hudson.","q":"Winter Garden Brookfield Place New York"},{"k":"History","t":"The whole neighborhood sits on landfill, much of it dirt and rock dug out when the original World Trade Center was built.","q":"Battery Park City landfill aerial history"},{"k":"Culture","t":"The Irish Hunger Memorial is a sloping patch of Irish countryside with a real stone cottage brought over from County Mayo.","q":"Irish Hunger Memorial Battery Park City"}],"Central Park":[{"k":"Landmark","t":"The angel atop Bethesda Fountain was sculpted by Emma Stebbins, the first woman commissioned for a major public artwork in the city.","q":"Bethesda Fountain Angel of the Waters Central Park"},{"k":"History","t":"Frederick Law Olmsted and Calvert Vaux won the 1858 design contest with their Greensward Plan, and nearly every hill and lake here is man-made.","q":"Olmsted Vaux Greensward Plan Central Park"},{"k":"Nature","t":"The Ramble is a wooded maze of trails that ranks among the best bird-watching spots in the country during migration.","q":"The Ramble Central Park birding"}],"Chelsea":[{"k":"Landmark","t":"The High Line is an old elevated freight railway turned into a planted park that opened in 2009.","q":"High Line park New York"},{"k":"Food","t":"Chelsea Market fills the old Nabisco factory complex, the place where the Oreo cookie was first made in 1912.","q":"Chelsea Market Nabisco building"},{"k":"Culture","t":"The Hotel Chelsea on West 23rd was home at various times to Arthur Miller, Patti Smith and Leonard Cohen.","q":"Hotel Chelsea West 23rd Street"}],"Chinatown":[{"k":"Food","t":"Nom Wah Tea Parlor on crooked little Doyers Street has been serving dim sum since 1920.","q":"Nom Wah Tea Parlor Doyers Street"},{"k":"Landmark","t":"The Mahayana Buddhist Temple on Canal Street houses a golden Buddha about 16 feet tall.","q":"Mahayana Buddhist Temple Canal Street Buddha"},{"k":"Culture","t":"In Columbus Park, older residents gather daily to play Chinese chess and cards and practice tai chi.","q":"Columbus Park Chinatown Chinese chess"}],"Civic Center":[{"k":"Landmark","t":"City Hall, finished in 1812, is the oldest city hall in the US still used for its original government purpose.","q":"New York City Hall building"},{"k":"History","t":"The 1914 Municipal Building is topped by Civic Fame, a gilded copper statue towering over the courthouses below.","q":"Manhattan Municipal Building Civic Fame statue"},{"k":"Culture","t":"The columned courthouse at 60 Centre Street on Foley Square is a TV favorite, showing up constantly in Law & Order.","q":"New York County Courthouse 60 Centre Street"}],"East Harlem":[{"k":"Culture","t":"El Museo del Barrio on Fifth Avenue was founded in 1969 by Puerto Rican artists and educators from the neighborhood.","q":"El Museo del Barrio Fifth Avenue"},{"k":"Food","t":"Rao's on Pleasant Avenue has been open since 1896 and is famous for having almost no way to get a table.","q":"Rao's restaurant East Harlem"},{"k":"People","t":"Mambo king Tito Puente grew up here, and a stretch of East 110th Street is named Tito Puente Way.","q":"Tito Puente Way East 110th Street"}],"East Village":[{"k":"History","t":"Hare Krishna founder A.C. Bhaktivedanta Swami chanted under a big elm in Tompkins Square Park in 1966, starting the movement in America.","q":"Hare Krishna tree Tompkins Square Park"},{"k":"Food","t":"Veselka on Second Avenue has been dishing out pierogi and borscht since 1954.","q":"Veselka restaurant Second Avenue"},{"k":"Culture","t":"The tenements at 96 and 98 St. Marks Place are the buildings on the cover of Led Zeppelin's Physical Graffiti.","q":"Physical Graffiti building St Marks Place"}],"Financial District":[{"k":"Landmark","t":"Arturo Di Modica dropped off the Charging Bull outside the Stock Exchange without permission in 1989. It now stands at Bowling Green.","q":"Charging Bull Bowling Green"},{"k":"History","t":"George Washington was sworn in as the first president on this spot on Wall Street in 1789, where Federal Hall and his statue stand now.","q":"Federal Hall Washington statue Wall Street"},{"k":"Food","t":"Stone Street, one of the city's oldest streets, is a cobblestone lane lined with pub tables on warm evenings.","q":"Stone Street outdoor dining Financial District"}],"Flatiron District":[{"k":"Landmark","t":"The 1902 Flatiron Building fills the skinny triangle where Broadway crosses Fifth Avenue.","q":"Flatiron Building New York"},{"k":"Food","t":"Shake Shack started as a hot dog cart in Madison Square Park in 2001, and the original kiosk still serves burgers there.","q":"Shake Shack Madison Square Park original"},{"k":"History","t":"The Statue of Liberty's torch-bearing arm was displayed in Madison Square Park for several years to raise money for the statue.","q":"Statue of Liberty arm Madison Square Park"}],"Governors Island":[{"k":"Landmark","t":"Castle Williams, a round red sandstone fort finished in 1811, was built to guard the harbor alongside Castle Clinton.","q":"Castle Williams Governors Island"},{"k":"Nature","t":"The Hills were built from the rubble of old demolished buildings and give some of the best Statue of Liberty views around.","q":"The Hills Governors Island Statue of Liberty view"},{"k":"History","t":"For nearly two centuries it was a military post, run by the Army and then the Coast Guard, which left in 1996.","q":"Governors Island Fort Jay history"}],"Gramercy":[{"k":"Landmark","t":"Gramercy Park is a private, gated park, and only residents of the surrounding buildings get keys.","q":"Gramercy Park gate key"},{"k":"Food","t":"Pete's Tavern has poured drinks since 1864 and claims O. Henry wrote The Gift of the Magi in one of its booths.","q":"Pete's Tavern Irving Place"},{"k":"People","t":"Actor Edwin Booth founded The Players club in 1888, and it still meets in his mansion on the park's south side.","q":"The Players club Gramercy Park"}],"Greenwich Village":[{"k":"Landmark","t":"The marble Washington Square Arch was designed by Stanford White and finished in 1892.","q":"Washington Square Arch"},{"k":"Culture","t":"Bob Dylan and Jimi Hendrix both played early gigs at Caf\u00e9 Wha? on MacDougal Street.","q":"Cafe Wha MacDougal Street"},{"k":"Food","t":"Joe's Pizza on Carmine Street has been selling classic New York slices since 1975.","q":"Joe's Pizza Carmine Street"}],"Harlem":[{"k":"Culture","t":"A teenage Ella Fitzgerald won Amateur Night at the Apollo Theater in 1934, launching her career.","q":"Apollo Theater 125th Street marquee"},{"k":"Food","t":"Sylvia's on Lenox Avenue has been serving fried chicken, ribs and collard greens since 1962.","q":"Sylvia's restaurant Harlem"},{"k":"People","t":"Poet Langston Hughes lived for two decades in a brownstone on East 127th Street.","q":"Langston Hughes House East 127th Street"}],"Hell's Kitchen":[{"k":"Landmark","t":"The Intrepid, a WWII aircraft carrier docked at Pier 86, is now a museum that also holds the Space Shuttle Enterprise.","q":"Intrepid Museum Space Shuttle Enterprise"},{"k":"Food","t":"Restaurant Row, West 46th Street between Eighth and Ninth, is packed with spots built around pre-theater dinners.","q":"Restaurant Row West 46th Street"},{"k":"Culture","t":"The Actors Studio has trained performers in a converted church on West 44th Street since 1955.","q":"Actors Studio West 44th Street"}],"Inwood":[{"k":"Nature","t":"Inwood Hill Park holds Manhattan's last natural forest and its last salt marsh.","q":"Inwood Hill Park forest"},{"k":"History","t":"Legend says Peter Minuit bought Manhattan from the Lenape under a tulip tree here, and a boulder called Shorakkopoch marks the spot.","q":"Shorakkopoch rock Inwood Hill Park"},{"k":"Landmark","t":"The Dyckman Farmhouse on Broadway, built around 1785, is the last Dutch colonial farmhouse left in Manhattan.","q":"Dyckman Farmhouse Museum"}],"Kips Bay":[{"k":"Landmark","t":"Bellevue, founded in 1736, is the oldest public hospital in the United States.","q":"Bellevue Hospital First Avenue"},{"k":"Food","t":"Lexington Avenue in the upper 20s is nicknamed Curry Hill for its Indian restaurants and the Kalustyan's spice shop.","q":"Kalustyan's Lexington Avenue Curry Hill"},{"k":"History","t":"It's named for Jacobus Kip's farm on an East River cove, where British troops landed in 1776 to take Manhattan.","q":"Landing at Kips Bay 1776"}],"Little Italy":[{"k":"Culture","t":"The Feast of San Gennaro has filled Mulberry Street with sausage stands and processions every September since 1926.","q":"Feast of San Gennaro Mulberry Street"},{"k":"Food","t":"Ferrara Bakery on Grand Street has been selling cannoli and espresso since 1892.","q":"Ferrara Bakery Grand Street"},{"k":"History","t":"It once covered dozens of blocks, but today the Italian strip is mostly a few blocks of Mulberry as Chinatown grew around it.","q":"Mulberry Street Little Italy restaurants"}],"Lower East Side":[{"k":"Food","t":"Katz's Delicatessen has piled up pastrami since 1888, and it's where Meg Ryan faked it in When Harry Met Sally.","q":"Katz's Delicatessen Houston Street"},{"k":"History","t":"The Tenement Museum at 97 Orchard Street preserves the apartments of real immigrant families who lived there.","q":"Tenement Museum 97 Orchard Street"},{"k":"Culture","t":"The Eldridge Street Synagogue, opened in 1887, was among the first great synagogues built by Eastern European Jews in America.","q":"Museum at Eldridge Street synagogue"}],"Marble Hill":[{"k":"History","t":"It was the tip of Manhattan island until an 1895 shipping canal cut it off, and filling the old creek later joined it to the Bronx.","q":"Marble Hill Harlem River Ship Canal"},{"k":"Culture","t":"In 1939 the Bronx borough president marched in and planted a Bronx flag to claim it. It stayed part of Manhattan.","q":"Marble Hill Bronx flag 1939"},{"k":"Nature","t":"The name comes from the white Inwood marble that was quarried around here.","q":"Inwood marble Marble Hill"}],"Midtown":[{"k":"Landmark","t":"The constellations on Grand Central's Main Concourse ceiling are painted backwards, as if seen from outside the sky.","q":"Grand Central Terminal ceiling constellations"},{"k":"Culture","t":"The Rockefeller Center Christmas tree tradition began in 1931 when construction workers put up a small tree on the site.","q":"Rockefeller Center Christmas tree"},{"k":"Food","t":"The Grand Central Oyster Bar has been shucking under its tiled vaulted ceiling since 1913.","q":"Grand Central Oyster Bar"}],"Morningside Heights":[{"k":"Landmark","t":"The Cathedral of St. John the Divine was begun in 1892 and is still unfinished.","q":"Cathedral of St John the Divine"},{"k":"History","t":"Columbia moved up here in 1897, and the Alma Mater statue sits on the steps of Low Library.","q":"Columbia University Low Library Alma Mater"},{"k":"Food","t":"Tom's Restaurant at Broadway and 112th is the diner whose sign stood in for Monk's in Seinfeld.","q":"Tom's Restaurant Broadway 112th Street"}],"Murray Hill":[{"k":"Culture","t":"The Morgan Library & Museum began as J.P. Morgan's private library and owns three Gutenberg Bibles.","q":"Morgan Library East 36th Street"},{"k":"History","t":"Local legend says Mary Murray stalled British officers with cake and wine in 1776 so American troops could slip away.","q":"Mary Lindley Murray 1776 legend"},{"k":"Landmark","t":"Sniffen Court on East 36th Street is a hidden row of 1860s carriage houses behind a gate.","q":"Sniffen Court East 36th Street"}],"NoHo":[{"k":"People","t":"Jean-Michel Basquiat lived and painted at 57 Great Jones Street, in a building owned by Andy Warhol.","q":"57 Great Jones Street Basquiat"},{"k":"Culture","t":"The Public Theater on Lafayette Street, in the old Astor Library, premiered both Hair and Hamilton.","q":"Public Theater Lafayette Street"},{"k":"Landmark","t":"The Bayard-Condict Building on Bleecker Street is the only New York building by Chicago architect Louis Sullivan.","q":"Bayard-Condict Building Bleecker Street"}],"Nolita":[{"k":"Landmark","t":"St. Patrick's Old Cathedral, finished in 1815, was the city's first Catholic cathedral, before the one on Fifth Avenue.","q":"St. Patrick's Old Cathedral Mulberry Street"},{"k":"Food","t":"Prince Street Pizza draws lines for its square pepperoni slice, covered in crispy little cups.","q":"Prince Street Pizza pepperoni square"},{"k":"History","t":"The name is short for North of Little Italy and only caught on in the 1990s.","q":"Nolita Elizabeth Street shops"}],"Randall's Island":[{"k":"Landmark","t":"The Triborough Bridge, now the RFK, opened in 1936 and uses the island as the hub linking Manhattan, Queens and the Bronx.","q":"RFK Triborough Bridge Randall's Island"},{"k":"Culture","t":"Jesse Owens ran in the 1936 Olympic trials at the stadium here, on the site where Icahn Stadium stands now.","q":"Icahn Stadium Randall's Island"},{"k":"History","t":"It used to be two islands, Randall's and Wards, until landfill joined them into one.","q":"Randall's Island Wards Island aerial"}],"Roosevelt Island":[{"k":"Landmark","t":"The aerial tram, opened in 1976, floats commuters over the East River next to the Queensboro Bridge.","q":"Roosevelt Island Tramway"},{"k":"Culture","t":"Four Freedoms Park was designed by Louis Kahn and finally built in 2012, nearly 40 years after he died.","q":"Four Freedoms Park Louis Kahn"},{"k":"History","t":"It was called Blackwell's Island, then Welfare Island, before being renamed for FDR in 1973.","q":"Blackwell House Roosevelt Island"}],"SoHo":[{"k":"Landmark","t":"The Haughwout Building on Broadway had the world's first commercial passenger elevator, installed by Otis in 1857.","q":"Haughwout Building Broadway cast iron"},{"k":"History","t":"Artists moved into empty cast-iron factory lofts in the 1960s and 70s, which helped save the area from a planned expressway.","q":"SoHo cast iron lofts Greene Street"},{"k":"Food","t":"Balthazar, Keith McNally's Parisian-style brasserie on Spring Street, has been a scene since 1997.","q":"Balthazar restaurant Spring Street"}],"Stuyvesant Town":[{"k":"History","t":"MetLife built it right after World War II, largely to house returning veterans and their families.","q":"Stuyvesant Town 1940s construction"},{"k":"Nature","t":"Cars are kept to the edges, so the middle is a leafy campus of lawns, playgrounds and the big central Oval fountain.","q":"Stuyvesant Oval fountain"},{"k":"People","t":"It's named for Peter Stuyvesant, the Dutch colony's director-general, whose farm once covered this part of Manhattan.","q":"Peter Stuyvesant portrait"}],"Theater District":[{"k":"Culture","t":"The New Year's Eve ball has dropped over Times Square since the end of 1907.","q":"Times Square ball drop"},{"k":"History","t":"Times Square got its name when The New York Times moved into its new tower there in 1904.","q":"One Times Square tower history"},{"k":"Food","t":"Sardi's on West 44th has lined its walls with caricatures of Broadway stars for close to a century.","q":"Sardi's caricatures West 44th Street"}],"Tribeca":[{"k":"Landmark","t":"The Hook & Ladder 8 firehouse on North Moore Street is the Ghostbusters headquarters.","q":"Hook and Ladder 8 firehouse Ghostbusters"},{"k":"Culture","t":"Robert De Niro co-founded the Tribeca Film Festival in 2002 to help bring life back downtown.","q":"Tribeca Film Festival"},{"k":"History","t":"The name was coined in the 1970s as shorthand for Triangle Below Canal Street.","q":"Tribeca cobblestone street warehouses"}],"Two Bridges":[{"k":"Landmark","t":"It's named for the Brooklyn and Manhattan Bridges, which frame the neighborhood on either side.","q":"Manhattan Bridge Two Bridges neighborhood"},{"k":"People","t":"Governor Al Smith grew up nearby, and his later home at 25 Oliver Street is a National Historic Landmark.","q":"Al Smith House 25 Oliver Street"},{"k":"Food","t":"East Broadway here is a hub of Fuzhounese restaurants, bakeries and groceries.","q":"East Broadway Chinatown Fuzhou"}],"Upper East Side":[{"k":"Culture","t":"The Met is the largest art museum in the country, and it has a whole Egyptian temple inside, the Temple of Dendur.","q":"Temple of Dendur Metropolitan Museum"},{"k":"Landmark","t":"Frank Lloyd Wright's spiraling Guggenheim Museum opened on Fifth Avenue in 1959.","q":"Guggenheim Museum Fifth Avenue"},{"k":"History","t":"Gracie Mansion in Carl Schurz Park has been the mayor's official residence since Fiorello La Guardia moved in.","q":"Gracie Mansion Carl Schurz Park"}],"Upper West Side":[{"k":"Culture","t":"A 94-foot blue whale model hangs over the Hall of Ocean Life at the American Museum of Natural History.","q":"AMNH blue whale Hall of Ocean Life"},{"k":"Landmark","t":"Lincoln Center is home to the Metropolitan Opera, New York Philharmonic and New York City Ballet.","q":"Lincoln Center Metropolitan Opera fountain"},{"k":"Food","t":"Zabar's on Broadway at 80th has been selling smoked fish, coffee and bagels since 1934.","q":"Zabar's Broadway 80th Street"}],"Washington Heights":[{"k":"Landmark","t":"The Little Red Lighthouse sits right under the George Washington Bridge, which opened in 1931.","q":"Little Red Lighthouse George Washington Bridge"},{"k":"Culture","t":"The Cloisters in Fort Tryon Park is the Met's medieval museum, home to the Unicorn Tapestries.","q":"The Met Cloisters Fort Tryon Park"},{"k":"History","t":"The Morris-Jumel Mansion, Manhattan's oldest surviving house, served as George Washington's headquarters in 1776.","q":"Morris-Jumel Mansion"}],"West Village":[{"k":"History","t":"The 1969 Stonewall uprising made the Stonewall Inn the first national monument to LGBTQ rights.","q":"Stonewall Inn Christopher Street"},{"k":"Landmark","t":"The streets here predate the grid, which is why West 4th Street somehow crosses West 10th, 11th and 12th.","q":"West 4th Street and West 12th Street sign"},{"k":"Food","t":"Magnolia Bakery on Bleecker became a cupcake pilgrimage after a cameo on Sex and the City.","q":"Magnolia Bakery Bleecker Street"}]},"nearText":{"Governors Island":"It's the island in the harbor, just off the southern tip.","Marble Hill":"It's at the very top, across the water from Inwood.","Randall's Island":"It's the island in the East River across from East Harlem.","Roosevelt Island":"It's the long, thin island in the East River, across from the Upper East Side."}},{"id":"kyn-bk","name":"Brooklyn","letter":"B","geo":{"w":448,"h":532,"f":[{"n":"Greenpoint","d":"M189.5,32.4L193.5,31.9L193.5,29.5L194.1,27.6L197.5,22.3L200.3,19.0L205.6,14.7L210.8,14.0L216.8,15.1L220.4,16.5L229.2,20.7L227.6,25.2L227.9,28.0L228.9,27.9L228.6,25.4L228.2,25.3L228.9,23.7L229.3,23.9L229.8,22.7L230.6,23.0L231.2,21.5L232.6,22.0L231.9,23.6L232.1,24.8L232.5,25.0L233.1,23.3L233.8,22.5L238.4,25.0L239.8,26.3L241.2,28.8L241.5,29.6L241.2,30.0L241.3,30.4L242.5,31.9L242.5,33.2L244.2,37.9L248.1,41.9L250.7,43.8L255.0,45.4L261.9,46.7L265.6,47.7L268.1,48.9L271.2,53.5L271.4,56.2L273.8,63.9L273.2,63.6L272.4,63.9L264.2,67.0L260.7,67.9L256.1,69.8L253.7,70.3L251.8,71.3L250.1,71.5L244.6,73.7L243.4,72.9L243.2,70.4L242.0,68.9L239.1,69.1L237.2,67.8L235.0,69.2L234.1,70.3L229.8,73.7L228.6,72.3L227.8,72.0L223.5,72.9L221.7,72.9L217.3,73.7L214.7,71.1L208.9,66.7L209.2,65.3L212.5,62.2L212.5,61.7L210.9,59.9L204.8,55.5L203.4,56.0L202.5,55.4L202.3,54.8L199.1,55.0L198.4,54.5L198.1,53.2L196.3,53.5L195.1,53.3L195.1,51.1L195.3,50.8L196.5,44.8L195.5,38.1L194.8,36.5L ,"Gerritsen Beach","Brooklyn Marine Park"],"Brooklyn Marine Park":["Barren Island","Gerritsen Beach","Marine Park","Sheepshead Bay"],"Gerritsen Beach":["Brooklyn Marine Park","Sheepshead Bay","Marine Park"],"Barren Island":["Brooklyn Marine Park","Marine Park"],"Sea Gate":["Coney Island"],"Coney Island":["Gravesend","Brighton Beach","Sea Gate"],"Brighton Beach":["Sheepshead Bay","Coney Island","Manhattan Beach"],"Manhattan Beach":["Brighton Beach"]},"facts":{"Greenpoint":[{"k":"Culture","t":"One of the city's biggest Polish communities lives here, and Manhattan Avenue is packed with Polish bakeries, delis and butcher shops.","q":"Polish bakery Manhattan Avenue Greenpoint"},{"k":"History","t":"The Civil War ironclad USS Monitor was built here at the Continental Iron Works and launched in 1862.","q":"USS Monitor ironclad 1862"},{"k":"Landmark","t":"Those giant silver 'eggs' by Newtown Creek are sewage digesters at the treatment plant, and they glow blue at night.","q":"Newtown Creek digester eggs"}],"Williamsburg":[{"k":"Landmark","t":"Domino Park sits on the site of the old Domino Sugar refinery, with salvaged syrup tanks and machinery built into the waterfront.","q":"Domino Park Williamsburg"},{"k":"Food","t":"Peter Luger Steak House has been serving porterhouse here since 1887, famously with gruff, old-school waiters.","q":"Peter Luger Steak House"},{"k":"History","t":"The Williamsburg Bridge opened in 1903 and held the title of world's longest suspension bridge until 1924.","q":"Williamsburg Bridge"}],"DUMBO":[{"k":"Landmark","t":"The Manhattan Bridge framed between brick warehouses on Washington Street is one of the most photographed views in the city.","q":"Washington Street Manhattan Bridge view DUMBO"},{"k":"Culture","t":"Jane's Carousel, a restored 1922 merry-go-round, spins inside a glass box designed by architect Jean Nouvel.","q":"Jane's Carousel Brooklyn"},{"k":"History","t":"The name stands for Down Under the Manhattan Bridge Overpass, coined by local residents in the late 1970s.","q":"DUMBO Brooklyn cobblestone street"}],"Navy Yard":[{"k":"History","t":"The battleship USS Missouri, where Japan signed its WWII surrender, was built here and launched in 1944.","q":"USS Missouri launch Brooklyn Navy Yard 1944"},{"k":"Culture","t":"Steiner Studios, one of the biggest film and TV studios on the East Coast, operates inside the old shipyard.","q":"Steiner Studios Brooklyn Navy Yard"},{"k":"Food","t":"A big Wegmans supermarket opened here in 2019, drawing shoppers from all over Brooklyn.","q":"Wegmans Brooklyn Navy Yard"}],"Brooklyn Heights":[{"k":"Landmark","t":"The Promenade, built over the BQE, has some of the best views of the Lower Manhattan skyline and the Statue of Liberty.","q":"Brooklyn Heights Promenade skyline"},{"k":"History","t":"In 1965 it became New York City's very first historic district, protecting its blocks of 1800s row houses.","q":"Brooklyn Heights historic district brownstones"},{"k":"People","t":"Truman Capote wrote Breakfast at Tiffany's while living in the basement apartment at 70 Willow Street.","q":"70 Willow Street Brooklyn Capote house"}],"Downtown Brooklyn":[{"k":"Food","t":"Junior's at Flatbush and DeKalb has been serving its famous cheesecake since 1950.","q":"Junior's Restaurant cheesecake Brooklyn"},{"k":"Landmark","t":"Borough Hall, finished in 1848, was City Hall back when Brooklyn was its own city.","q":"Brooklyn Borough Hall"},{"k":"History","t":"Cobblestoned Vinegar Hill was named after the 1798 Battle of Vinegar Hill in Ireland, a nod to its Irish settlers.","q":"Vinegar Hill Brooklyn cobblestones"}],"Clinton Hill":[{"k":"People","t":"The Notorious B.I.G. grew up in an apartment on St. James Place.","q":"St James Place Brooklyn Notorious BIG"},{"k":"Culture","t":"Pratt Institute, the art and design school, was founded here in 1887 by oil magnate Charles Pratt.","q":"Pratt Institute campus Brooklyn"},{"k":"Landmark","t":"Clinton Avenue is lined with Gilded Age mansions, several built for Charles Pratt's sons.","q":"Clinton Avenue mansions Clinton Hill"}],"Fort Greene":[{"k":"Culture","t":"BAM, the Brooklyn Academy of Music, was founded in 1861 and is one of the country's oldest performing arts centers.","q":"Brooklyn Academy of Music BAM building"},{"k":"Nature","t":"Fort Greene Park was redesigned by Olmsted and Vaux, the duo behind Central Park and Prospect Park.","q":"Fort Greene Park"},{"k":"People","t":"Spike Lee set his first feature, She's Gotta Have It, here and based his 40 Acres and a Mule company here too.","q":"Spike Lee 40 Acres and a Mule Fort Greene"}],"Boerum Hill":[{"k":"People","t":"Novelist Jonathan Lethem grew up on Dean Street and set his novel The Fortress of Solitude on these blocks.","q":"The Fortress of Solitude Jonathan Lethem"},{"k":"Culture","t":"The Invisible Dog Art Center on Bergen Street is named for the 'invisible dog' leash novelty once made in the building.","q":"Invisible Dog Art Center Brooklyn"},{"k":"History","t":"It's named for the Boerum family's colonial farm, and the name was revived by brownstone renovators in the 1960s.","q":"Boerum Hill brownstones"}],"Cobble Hill":[{"k":"Food","t":"Sahadi's on Atlantic Avenue has sold nuts, spices, olives and Middle Eastern groceries at this spot since 1948.","q":"Sahadi's Atlantic Avenue"},{"k":"Landmark","t":"The Home and Tower Buildings on Hicks Street were 1870s model housing for workers, built by reformer Alfred Tredway White.","q":"Tower Buildings Hicks Street Cobble Hill"},{"k":"Nature","t":"Cobble Hill Park, a small leafy square at Clinton and Congress Streets, is the neighborhood's backyard.","q":"Cobble Hill Park"}],"Carroll Gardens":[{"k":"History","t":"Those unusually deep front gardens come from an 1846 street plan that set the row houses far back from the sidewalk.","q":"Carroll Gardens front gardens brownstones"},{"k":"Food","t":"Old-school Italian spots still line Court Street, and Mazzola Bakery on Union Street is known for its lard bread.","q":"Mazzola Bakery lard bread Brooklyn"},{"k":"People","t":"It's named after Charles Carroll of Maryland, the only Catholic signer of the Declaration of Independence.","q":"Carroll Park Brooklyn"}],"Red Hook":[{"k":"Nature","t":"Louis Valentino Jr. Pier offers one of the closest, most head-on views of the Statue of Liberty in Brooklyn.","q":"Valentino Pier Statue of Liberty view"},{"k":"Landmark","t":"The IKEA here opened in 2008 on the site of the old Todd Shipyard, and the waterfront esplanade keeps bits of its past.","q":"IKEA Red Hook waterfront"},{"k":"Culture","t":"Pioneer Works, a free arts and science center, fills an 1860s ironworks building on Van Brunt Street.","q":"Pioneer Works Red Hook"}],"Gowanus":[{"k":"Nature","t":"The Gowanus Canal was named a federal Superfund site in 2010, and a big cleanup of its polluted bottom is underway.","q":"Gowanus Canal"},{"k":"Food","t":"The Whole Foods on the canal has a commercial rooftop greenhouse that grows produce sold in the store below.","q":"Whole Foods Gowanus rooftop greenhouse Gotham Greens"},{"k":"Culture","t":"The Bell House, in an old warehouse on 7th Street, is a favorite spot for concerts, comedy and live podcasts.","q":"The Bell House Brooklyn venue"}],"Park Slope":[{"k":"Culture","t":"The Park Slope Food Coop, founded in 1973, requires every member to work a shift in exchange for cheap groceries.","q":"Park Slope Food Coop"},{"k":"History","t":"The Old Stone House is a rebuilt 1699 Dutch farmhouse that saw fierce fighting in the 1776 Battle of Brooklyn.","q":"Old Stone House Brooklyn"},{"k":"Landmark","t":"The Montauk Club, an 1890s Venetian Gothic palazzo on Eighth Avenue, is one of the area's most ornate buildings.","q":"Montauk Club Park Slope"}],"Prospect Heights":[{"k":"Landmark","t":"Barclays Center, the rusty-steel arena that opened in 2012, is home to the Brooklyn Nets.","q":"Barclays Center Brooklyn"},{"k":"Culture","t":"The Brooklyn Museum is one of the largest art museums in the US and permanently shows Judy Chicago's The Dinner Party.","q":"Brooklyn Museum facade"},{"k":"Nature","t":"Crowds pack the Brooklyn Botanic Garden every spring when its cherry trees burst into bloom.","q":"Brooklyn Botanic Garden cherry blossoms"}],"Bedford-Stuyvesant":[{"k":"People","t":"JAY-Z grew up in the Marcy Houses here and has name-checked them throughout his career.","q":"Marcy Houses Brooklyn"},{"k":"Culture","t":"Spike Lee shot Do the Right Thing in 1988 on a single block of Stuyvesant Avenue, now co-named Do The Right Thing Way.","q":"Do The Right Thing Way Stuyvesant Avenue"},{"k":"Landmark","t":"Stuyvesant Heights has some of Brooklyn's grandest blocks of intact Victorian brownstones.","q":"Stuyvesant Heights brownstones"}],"Bushwick":[{"k":"Culture","t":"The Bushwick Collective turns blocks around Troutman Street into an outdoor gallery of huge street murals.","q":"Bushwick Collective murals"},{"k":"Food","t":"Roberta's started serving wood-fired pizza in a cinderblock building on Moore Street in 2008 and became a Brooklyn icon.","q":"Roberta's Pizza Bushwick"},{"k":"History","t":"In the late 1800s it was a beer capital, with so many breweries that one stretch was nicknamed Brewers' Row.","q":"Bushwick Brewers Row history"}],"Cypress Hills":[{"k":"Nature","t":"Highland Park sits on a ridge along the Queens border, with sweeping views back over Brooklyn.","q":"Highland Park Brooklyn"},{"k":"People","t":"Jackie Robinson is buried in Cypress Hills Cemetery, beside the parkway that now bears his name.","q":"Jackie Robinson grave Cypress Hills Cemetery"},{"k":"History","t":"The Ridgewood Reservoir once held Brooklyn's drinking water and has since grown back into a wild, wooded basin.","q":"Ridgewood Reservoir"}],"East New York":[{"k":"Nature","t":"Shirley Chisholm State Park, opened in 2019 on capped landfills by Jamaica Bay, is the largest state park in the city.","q":"Shirley Chisholm State Park"},{"k":"History","t":"Connecticut merchant John Pitkin founded it in 1835, hoping it would grow into a rival to New York City.","q":"East New York Brooklyn history"},{"k":"People","t":"Entertainer Danny Kaye grew up here and went to Thomas Jefferson High School.","q":"Danny Kaye"}],"Brownsville":[{"k":"People","t":"Boxing legend Mike Tyson grew up here before becoming the youngest heavyweight champion ever.","q":"Mike Tyson young boxer"},{"k":"History","t":"Pitkin Avenue was once one of Brooklyn's busiest shopping streets, serving a huge Jewish immigrant community.","q":"Pitkin Avenue Brownsville"},{"k":"Nature","t":"Betsy Head Park has a giant public pool that opened in 1936 as one of the city's big Depression-era pools.","q":"Betsy Head Pool Brooklyn"}],"Crown Heights":[{"k":"Culture","t":"Every Labor Day, the West Indian American Day Carnival brings huge crowds and costumed masqueraders to Eastern Parkway.","q":"West Indian Day Parade Eastern Parkway"},{"k":"History","t":"Ebbets Field, home of the Brooklyn Dodgers until 1957, stood by Empire Boulevard on the southern edge. Apartment towers fill the site now.","q":"Ebbets Field Brooklyn Dodgers"},{"k":"Landmark","t":"Weeksville Heritage Center preserves houses from one of America's first free Black communities, founded in 1838.","q":"Weeksville Heritage Center Hunterfly Road Houses"}],"Prospect Park":[{"k":"Nature","t":"The Long Meadow stretches about 90 acres, one of the longest unbroken meadows in any American city park.","q":"Long Meadow Prospect Park"},{"k":"History","t":"Olmsted and Vaux designed it after Central Park, and many think they considered this one their masterpiece.","q":"Prospect Park Olmsted Vaux"},{"k":"Landmark","t":"The white terracotta Boathouse on the Lullwater dates to 1905 and was saved from demolition in the 1960s.","q":"Prospect Park Boathouse"}],"Lefferts Gardens":[{"k":"Landmark","t":"The row houses of Lefferts Manor have been bound since the 1890s by a covenant limiting them to single-family homes.","q":"Lefferts Manor row houses"},{"k":"History","t":"It's named for the Dutch Lefferts family, whose 1783 farmhouse was moved into Prospect Park and is now a museum.","q":"Lefferts Historic House Prospect Park"},{"k":"Food","t":"Caribbean bakeries, roti shops and jerk spots line Flatbush Avenue on its western edge.","q":"Caribbean bakery Flatbush Avenue"}],"Windsor Terrace":[{"k":"Culture","t":"Farrell's Bar has been pouring beer since 1933 and is famous for serving it in giant 32-ounce cups.","q":"Farrell's Bar Windsor Terrace"},{"k":"People","t":"Sci-fi giant Isaac Asimov grew up here, where his father ran a candy store on Windsor Place.","q":"Isaac Asimov young"},{"k":"Landmark","t":"Bartel-Pritchard Square, the traffic circle at the park's edge, has entrance pillars designed by Stanford White.","q":"Bartel-Pritchard Square Prospect Park"}],"Green-Wood Cemetery":[{"k":"History","t":"Battle Hill is Brooklyn's highest point, and a bronze Minerva statue there salutes the Statue of Liberty.","q":"Minerva statue Battle Hill Green-Wood"},{"k":"People","t":"Leonard Bernstein and Jean-Michel Basquiat are among the famous New Yorkers buried here.","q":"Green-Wood Cemetery Basquiat grave"},{"k":"Nature","t":"Wild monk parakeets nest in the spires of the grand Gothic Revival main gate on Fifth Avenue.","q":"Green-Wood Cemetery gate monk parakeets"}],"Sunset Park":[{"k":"Culture","t":"Eighth Avenue is Brooklyn's Chinatown, one of the largest Chinese communities in the city.","q":"Eighth Avenue Chinatown Sunset Park"},{"k":"Nature","t":"The hilltop park itself has a sweeping view of the harbor, the Manhattan skyline and the Statue of Liberty.","q":"Sunset Park view Manhattan skyline"},{"k":"Landmark","t":"Industry City turned the old Bush Terminal warehouses into a complex of shops, studios and food halls.","q":"Industry City Brooklyn"}],"Prospect Park South":[{"k":"Landmark","t":"Developer Dean Alvord laid it out in 1899 as a suburb in the city, with big freestanding mansions on lawns.","q":"Prospect Park South Victorian mansions"},{"k":"Culture","t":"The pink Victorian at 101 Rugby Road played the boarding house in the 1982 film Sophie's Choice.","q":"101 Rugby Road Sophie's Choice house"},{"k":"History","t":"The Japanese House at 131 Buckingham Road is a 1900s pagoda-style home that looks nothing like its neighbors.","q":"131 Buckingham Road Japanese House Brooklyn"}],"Kensington & Parkville":[{"k":"Landmark","t":"Ocean Parkway starts here and runs to Coney Island. Its 1894 bike path is often called the first in the US.","q":"Ocean Parkway bike path Brooklyn"},{"k":"Culture","t":"In 2022 the corner of Church and McDonald Avenues was co-named Little Bangladesh for its Bangladeshi community.","q":"Little Bangladesh Church McDonald Avenue"},{"k":"People","t":"It's one of Brooklyn's most mixed areas, home to Bangladeshi, Pakistani, Orthodox Jewish, Uzbek, Polish and Latino families.","q":"Kensington Brooklyn street"}],"Flatbush":[{"k":"People","t":"Erasmus Hall High School, founded in 1786, counts Barbra Streisand and Neil Diamond among its alumni.","q":"Erasmus Hall High School"},{"k":"Landmark","t":"The Kings Theatre, a lavish 1929 movie palace, reopened in 2015 after a huge restoration.","q":"Kings Theatre Brooklyn interior"},{"k":"Culture","t":"Flatbush and Church Avenues anchor Little Caribbean, officially named in 2017 for its West Indian community.","q":"Little Caribbean Flatbush"}],"East Flatbush":[{"k":"Culture","t":"It's one of the biggest West Indian neighborhoods in the city, and Church Avenue is co-named Bob Marley Boulevard.","q":"Bob Marley Boulevard Church Avenue Brooklyn"},{"k":"Landmark","t":"Kings County Hospital, one of the country's oldest public hospitals, shares a big medical campus with SUNY Downstate.","q":"Kings County Hospital Brooklyn"},{"k":"People","t":"Hip-hop acts like the Flatbush Zombies and Joey Bada$$ have roots in these blocks.","q":"Flatbush Zombies"}],"Canarsie":[{"k":"Landmark","t":"The L train ends here at Rockaway Parkway, its last stop after running all the way from Manhattan.","q":"Canarsie Rockaway Parkway L train station"},{"k":"Nature","t":"Canarsie Pier juts into Jamaica Bay and is part of Gateway National Recreation Area, popular for fishing.","q":"Canarsie Pier Jamaica Bay"},{"k":"History","t":"The name comes from a Lenape word, and 'by way of Canarsie' was once slang for taking the long way around.","q":"Canarsie Brooklyn history"}],"Borough Park":[{"k":"Culture","t":"It's home to one of the largest Orthodox Jewish communities outside Israel, and the streets go quiet on Shabbat.","q":"Borough Park Brooklyn 13th Avenue"},{"k":"Food","t":"13th Avenue is a long strip of kosher bakeries, butchers and shops, busiest right before holidays.","q":"13th Avenue Borough Park shops"},{"k":"Landmark","t":"Maimonides Medical Center, one of Brooklyn's largest hospitals, anchors the neighborhood.","q":"Maimonides Medical Center Brooklyn"}],"Bay Ridge":[{"k":"Nature","t":"The Shore Road promenade runs along the Narrows with big views of the Verrazzano Bridge.","q":"Shore Road promenade Bay Ridge Verrazzano"},{"k":"Culture","t":"Saturday Night Fever's Tony Manero, played by John Travolta, was a Bay Ridge kid.","q":"Saturday Night Fever Travolta Brooklyn"},{"k":"History","t":"A Norwegian Constitution Day parade still marches here each May, a nod to its old Scandinavian community.","q":"Norwegian Day Parade Bay Ridge"}],"Fort Hamilton":[{"k":"Landmark","t":"The fort dates to the 1820s and is still an active US Army post, one of the oldest in the country.","q":"Fort Hamilton Brooklyn Army"},{"k":"History","t":"The Verrazzano-Narrows Bridge opened here in 1964 and held the record for world's longest suspension span until 1981.","q":"Verrazzano-Narrows Bridge"},{"k":"Nature","t":"John Paul Jones Park, nicknamed Cannonball Park, is home to a massive Civil War-era cannon.","q":"John Paul Jones Park cannon Fort Hamilton"}],"Dyker Heights":[{"k":"Culture","t":"Every December, homes go all out with giant Christmas light displays, and tour buses pour in to see them.","q":"Dyker Heights Christmas lights"},{"k":"People","t":"Lucy Spata is often credited with kicking off the lights craze with her 84th Street house in the 1980s.","q":"Lucy Spata house Dyker Heights"},{"k":"Nature","t":"Dyker Beach Golf Course is a public course with views of the Verrazzano Bridge.","q":"Dyker Beach Golf Course"}],"Bensonhurst":[{"k":"People","t":"Sandy Koufax grew up here and went to Lafayette High School before pitching for the Brooklyn Dodgers.","q":"Sandy Koufax Brooklyn Dodgers"},{"k":"Culture","t":"18th Avenue's Feast of Santa Rosalia is a long-running Italian street festival held each summer.","q":"Feast of Santa Rosalia 18th Avenue"},{"k":"Food","t":"Travolta's double-stacked slice in Saturday Night Fever was at Lenny's Pizza on 86th Street, which closed in 2023.","q":"Lenny's Pizza Bensonhurst"}],"Bath Beach":[{"k":"History","t":"It was named after the English spa town of Bath and was once a seaside retreat for well-off families.","q":"Bath Beach Brooklyn history"},{"k":"Nature","t":"Bensonhurst Park and the Shore Parkway promenade run along Gravesend Bay, popular for biking and fishing.","q":"Shore Parkway promenade Gravesend Bay"},{"k":"Culture","t":"The 86th Street strip under the elevated train shows up in films like The French Connection.","q":"86th Street elevated train Brooklyn"}],"Midwood":[{"k":"Food","t":"Di Fara on Avenue J is a pizza pilgrimage, made famous by founder Dom DeMarco, who made pies there until his 80s.","q":"Di Fara Pizza Avenue J"},{"k":"Landmark","t":"Brooklyn College's Georgian-style campus, with its clock tower and quad, opened here in the 1930s.","q":"Brooklyn College campus"},{"k":"Culture","t":"The Cosby Show was taped at NBC's studios here, a lot first used by the silent-film company Vitagraph.","q":"NBC Studios Brooklyn Cosby Show"}],"Flatlands":[{"k":"History","t":"Dutch settlers founded it in 1636 as Nieuw Amersfoort, one of Brooklyn's original six towns.","q":"Flatlands Brooklyn history Dutch"},{"k":"Landmark","t":"Flatlands Reformed Church's congregation dates to 1654, and its white 1848 church still stands on Kings Highway.","q":"Flatlands Reformed Church"},{"k":"People","t":"Basketball Hall of Famer Chris Mullin was born and raised here.","q":"Chris Mullin St Johns"}],"Bergen Beach":[{"k":"History","t":"In 1893 it opened as a beach resort with a casino and boardwalk, backed partly by chewing gum magnate Thomas Adams.","q":"Bergen Beach resort history"},{"k":"Nature","t":"The Jamaica Bay Riding Academy has offered horseback trail rides along the bay since 1971.","q":"Jamaica Bay Riding Academy"},{"k":"People","t":"It's named for early settler Hans Hansen Bergen, and was once an island called Bergen Island.","q":"Bergen Beach Jamaica Bay"}],"Mill Basin":[{"k":"Landmark","t":"Kings Plaza, Brooklyn's largest indoor mall, sits right on the water with its own marina.","q":"Kings Plaza mall marina"},{"k":"History","t":"It's named for a Dutch tide-powered grist mill that once stood on what was then Mill Island.","q":"Mill Basin Brooklyn"},{"k":"People","t":"Late-night host Jimmy Kimmel spent his early childhood here before his family moved to Las Vegas.","q":"Jimmy Kimmel"}],"Marine Park":[{"k":"History","t":"The Hendrick I. Lott House, built in 1720 and expanded around 1800, is one of Brooklyn's oldest homes.","q":"Hendrick I. Lott House"},{"k":"People","t":"Baseball great Joe Torre grew up here before his career as a player and Yankees manager.","q":"Joe Torre"},{"k":"Nature","t":"The neighborhood takes its name from Marine Park next door, the biggest park in Brooklyn.","q":"Marine Park Brooklyn"}],"Gravesend":[{"k":"History","t":"Lady Deborah Moody founded it in 1645, making it the first colonial town in the New World founded by a woman.","q":"Lady Deborah Moody Gravesend"},{"k":"Food","t":"L&B Spumoni Gardens has been serving square Sicilian pizza and spumoni on 86th Street since 1939.","q":"L&B Spumoni Gardens"},{"k":"Landmark","t":"The original 1640s town square is still traceable in the street grid around Gravesend Neck Road and McDonald Avenue.","q":"Gravesend town square cemetery"}],"Sheepshead Bay":[{"k":"Landmark","t":"Party and fishing boats line the piers along Emmons Avenue, ready for day trips out into the ocean.","q":"Sheepshead Bay fishing boats Emmons Avenue"},{"k":"Food","t":"Randazzo's Clam Bar on Emmons Avenue is a local institution for fried calamari in its spicy red sauce.","q":"Randazzo's Clam Bar"},{"k":"History","t":"The bay is named for the sheepshead fish, and the Sheepshead Bay Race Track drew big horse-racing crowds from 1880 to 1910.","q":"Sheepshead Bay Race Track"}],"Brooklyn Marine Park":[{"k":"Nature","t":"At about 530 acres, it's Brooklyn's largest park, much of it salt marsh along Gerritsen Creek.","q":"Marine Park salt marsh Gerritsen Creek"},{"k":"History","t":"Pilings from a 1600s tide-powered grist mill still poke out of Gerritsen Creek at low tide.","q":"Gerritsen grist mill pilings"},{"k":"Culture","t":"An unbuilt grand plan for the park won a silver medal in town planning at the 1936 Berlin Olympics.","q":"Marine Park Brooklyn plan Charles Downing Lay"}],"Gerritsen Beach":[{"k":"History","t":"It began in the 1920s as a summer bungalow colony, and many of those small homes still line its narrow streets.","q":"Gerritsen Beach bungalows"},{"k":"Culture","t":"It has its own volunteer fire department, a rarity in New York City.","q":"Gerritsen Beach volunteer fire department"},{"k":"People","t":"It's named for Wolfert Gerritsen, a Dutch settler who farmed this area in the 1600s.","q":"Gerritsen Beach Brooklyn"}],"Barren Island":[{"k":"History","t":"Floyd Bennett Field was the city's first municipal airport, and Howard Hughes began and ended his 1938 round-the-world flight here.","q":"Floyd Bennett Field Howard Hughes 1938"},{"k":"Nature","t":"Dead Horse Bay got its name from old horse-rendering plants, and its shore is littered with antique glass bottles.","q":"Dead Horse Bay bottles"},{"k":"Landmark","t":"Volunteers restore vintage aircraft in the old hangars, including a WWII C-47 transport plane.","q":"Floyd Bennett Field hangar aircraft restoration"}],"Sea Gate":[{"k":"Landmark","t":"The 1890 Coney Island Light stands here, long tended by Frank Schubert, one of the last civilian lighthouse keepers in the US.","q":"Coney Island Lighthouse Sea Gate"},{"k":"History","t":"It has been a private, gated community since the 1890s, with its own guards at the gate.","q":"Sea Gate gate Brooklyn"},{"k":"Nature","t":"Its private beaches face the Lower Bay, where ships pass on their way into New York Harbor.","q":"Sea Gate beach Brooklyn"}],"Coney Island":[{"k":"Landmark","t":"The Wonder Wheel has turned since 1920, and the wooden Cyclone coaster has rattled riders since 1927.","q":"Wonder Wheel Cyclone Coney Island"},{"k":"Food","t":"Nathan's Famous has sold hot dogs here since 1916 and hosts the big hot dog eating contest every Fourth of July.","q":"Nathan's Famous Coney Island"},{"k":"Culture","t":"The Mermaid Parade each June fills Surf Avenue and the boardwalk with glittery homemade costumes.","q":"Coney Island Mermaid Parade"}],"Brighton Beach":[{"k":"History","t":"Soviet immigrants who arrived starting in the 1970s turned it into Little Odessa.","q":"Little Odessa Brighton Beach"},{"k":"Food","t":"Under the train on Brighton Beach Avenue, shops sell smoked fish, pelmeni, caviar and Eastern European pastries.","q":"Brighton Beach Avenue Russian grocery"},{"k":"Culture","t":"Neil Simon set his semi-autobiographical play Brighton Beach Memoirs here.","q":"Brighton Beach Memoirs Neil Simon"}],"Manhattan Beach":[{"k":"History","t":"In 1877 railroad tycoon Austin Corbin opened the luxurious Manhattan Beach Hotel here for wealthy vacationers.","q":"Manhattan Beach Hotel Coney Island 1877"},{"k":"Landmark","t":"Kingsborough Community College sits on the site of a WWII US Maritime Service training station.","q":"Kingsborough Communi
