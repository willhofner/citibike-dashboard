Park":["Howard Beach","Richmond Hill","Woodhaven","South Ozone Park"],"Far Rockaway":["Bayswater","Edgemere"],"Briarwood":["Kew Gardens Hills","Jamaica","Kew Gardens","Jamaica Hills","Richmond Hill","Flushing Meadows Corona Park","Jamaica Estates"],"Middle Village":["Glendale","Rego Park","Maspeth","Elmhurst","Ridgewood"],"College Point":["Whitestone","Flushing"]},"facts":{"Hollis Hills":[{"k":"Nature","t":"Cunningham Park's 358 acres of woods and fields wrap around these hilly streets.","q":"Cunningham Park Queens woods"},{"k":"History","t":"William K. Vanderbilt's 1908 Long Island Motor Parkway, a private road for early auto races, cut through here. Pieces of it are now a bike path.","q":"Long Island Motor Parkway Queens bike path"},{"k":"Culture","t":"A suburban pocket of Queens Village, with Colonial, Tudor and ranch houses on big tree-lined lots.","q":"Hollis Hills Queens houses"}],"Ridgewood":[{"k":"Landmark","t":"Blocks of yellow and tan brick row houses from the early 1900s make up one of the largest historic districts in the country.","q":"Ridgewood Queens brick row houses"},{"k":"History","t":"The Vander Ende-Onderdonk House, a Dutch stone farmhouse from around 1709, is one of the oldest buildings in the city.","q":"Vander Ende-Onderdonk House Ridgewood"},{"k":"Food","t":"Rudy's Bakery on Seneca Avenue has been turning out German pastries and crumb cake since the 1930s.","q":"Rudy's Bakery Ridgewood"}],"Neponsit":[{"k":"History","t":"In May 1919 Navy seaplanes left from the air station just west of here. One, the NC-4, became the first plane to fly across the Atlantic.","q":"NC-4 seaplane 1919 Rockaway"},{"k":"Landmark","t":"The old Neponsit Beach Hospital, opened in 1915 for children with tuberculosis, still stands empty right on the beach.","q":"Neponsit Beach Hospital abandoned"},{"k":"Nature","t":"Jacob Riis Park and its Art Deco bathhouse sit just to the west. The name is said to mean \"place between waters.\"","q":"Jacob Riis Park bathhouse"}],"Jamaica":[{"k":"Landmark","t":"Jamaica Station is one of the busiest LIRR hubs, where you catch the AirTrain to JFK.","q":"Jamaica Station AirTrain JFK"},{"k":"History","t":"King Manor in Rufus King Park was the home of Rufus King, a signer of the U.S. Constitution.","q":"King Manor Museum Jamaica Queens"},{"k":"People","t":"Rapper 50 Cent grew up in South Jamaica.","q":"50 Cent"}],"Rockaway Beach":[{"k":"Culture","t":"The Ramones put it on the map with their 1977 song \"Rockaway Beach.\"","q":"Ramones Rockaway Beach"},{"k":"Nature","t":"The Beach 90s are home to the city's designated surfing beaches, busy with surfers year-round.","q":"surfing Rockaway Beach 90th Street"},{"k":"Landmark","t":"The boardwalk was rebuilt in concrete after Hurricane Sandy and runs about five and a half miles.","q":"Rockaway boardwalk concrete"}],"Flushing":[{"k":"Food","t":"The Golden Shopping Mall's basement food stalls are a noodle legend. Xi'an Famous Foods got its start there in 2005.","q":"Golden Shopping Mall Flushing food court"},{"k":"History","t":"The 1657 Flushing Remonstrance defended religious freedom, and the nearby Bowne House hosted banned Quaker meetings.","q":"Bowne House Flushing"},{"k":"Landmark","t":"The 1862 Town Hall on Northern Boulevard, built in Romanesque Revival style, is now an arts center.","q":"Flushing Town Hall"}],"Kew Gardens Hills":[{"k":"People","t":"Paul Simon and Art Garfunkel grew up here and met as kids at P.S. 164.","q":"Simon and Garfunkel young"},{"k":"History","t":"The old Pomonok Country Club here hosted the 1939 PGA Championship before the land became housing.","q":"Pomonok Country Club 1939 PGA Championship"},{"k":"Food","t":"Main Street is lined with kosher restaurants and bakeries, and many shops close for Shabbat.","q":"Main Street Kew Gardens Hills kosher"}],"Alley Pond Park":[{"k":"Nature","t":"The Queens Giant, a towering tulip tree here, is often called the oldest living thing in New York City.","q":"Queens Giant tulip tree Alley Pond"},{"k":"History","t":"Its kettle ponds were left behind by melting glacier ice at the end of the last Ice Age.","q":"Alley Pond Park kettle pond"},{"k":"Culture","t":"The Alley Pond Environmental Center runs nature walks and has a restored windmill on its grounds.","q":"Alley Pond Environmental Center windmill"}],"Cunningham Park":[{"k":"Nature","t":"Its southern woods are laced with some of the city's best mountain-bike trails.","q":"Cunningham Park mountain bike trails"},{"k":"History","t":"A stretch of Vanderbilt's 1908 Long Island Motor Parkway, one of the first roads built just for cars, runs through the park.","q":"Motor Parkway Cunningham Park"},{"k":"Landmark","t":"The park's tennis center puts up a bubble over its courts so people can play all winter.","q":"Cunningham Park Tennis Center"}],"Edgemere":[{"k":"History","t":"Developer Frederick J. Lancaster founded it in 1892 as a beach resort and first called it \"New Venice.\"","q":"Edgemere Rockaway history"},{"k":"Nature","t":"The Arverne East Nature Preserve opened in 2024, turning decades-empty oceanfront lots into dunes and trails.","q":"Arverne East Nature Preserve"},{"k":"Culture","t":"East of Beach 32nd Street, rows of small original beach bungalows still survive.","q":"Rockaway bungalows Edgemere"}],"Glendale":[{"k":"Food","t":"Zum Stammtisch on Myrtle Avenue has served schnitzel and German beer since 1972.","q":"Zum Stammtisch Glendale"},{"k":"People","t":"Harry Houdini is buried at Machpelah Cemetery here.","q":"Houdini grave Machpelah Cemetery"},{"k":"Landmark","t":"The Shops at Atlas Park are built on the site of the old Atlas Terminals industrial complex.","q":"Shops at Atlas Park Glendale"}],"Maspeth":[{"k":"History","t":"Settled by Europeans in 1642, it takes its name from the Mespeatches, a local Lenape people.","q":"Maspeth Queens history"},{"k":"Landmark","t":"The cable-stayed Kosciuszko Bridge, rebuilt in 2017 and 2019, carries the BQE over Newtown Creek to Brooklyn.","q":"Kosciuszko Bridge new"},{"k":"Food","t":"A long-standing Polish community means pierogi and kielbasa at delis along Grand Avenue.","q":"Polish deli Maspeth"}],"Rosedale":[{"k":"History","t":"It was known as Foster's Meadow until the late 1800s and stayed mostly farmland into the 1930s.","q":"Rosedale Queens history"},{"k":"Nature","t":"Brookville Park covers 90 acres along the western edge, with Conselyea's Pond in the middle.","q":"Brookville Park Queens"},{"k":"People","t":"Actor John Turturro grew up here after his family moved from Brooklyn.","q":"John Turturro"}],"Broad Channel":[{"k":"Nature","t":"The Jamaica Bay Wildlife Refuge, home to over 300 bird species, is right next door.","q":"Jamaica Bay Wildlife Refuge"},{"k":"Culture","t":"Many houses sit on stilts over the canals. Residents rented their land from the city until they could buy it in 1982.","q":"Broad Channel stilt houses"},{"k":"Landmark","t":"The A train rumbles straight across Jamaica Bay to its station here.","q":"Broad Channel A train Jamaica Bay"}],"Holliswood":[{"k":"People","t":"Mario Cuomo raised his family here, including future governor Andrew Cuomo.","q":"Mario Cuomo"},{"k":"History","t":"Developer Frederick Dunton named it in the 1880s after his hometown of Hollis, New Hampshire.","q":"Holliswood Queens homes"},{"k":"Culture","t":"Winding streets with names like Palo Alto, Como and Marengo curl over the hills.","q":"Palo Alto Street Holliswood"}],"Floral Park":[{"k":"Nature","t":"Queens County Farm Museum has been farmed since 1697, the largest stretch of working farmland left in the city.","q":"Queens County Farm Museum"},{"k":"People","t":"Photographer Robert Mapplethorpe was born and raised here.","q":"Robert Mapplethorpe"},{"k":"History","t":"Most of its Cape Cod houses went up after World War II for returning soldiers.","q":"Floral Park Queens Cape Cod houses"}],"Bellerose":[{"k":"Food","t":"Hillside Avenue near the Nassau line is a mini Little India, with Punjabi and Kerala restaurants and sari shops.","q":"Hillside Avenue Indian restaurants Floral Park"},{"k":"History","t":"The nearby Creedmoor grounds were once the Creedmoor Rifle Range, where the NRA hosted international shooting matches in the 1870s.","q":"Creedmoor Rifle Range 1870s"},{"k":"Landmark","t":"Its LIRR station is actually just over the border in Nassau County.","q":"Bellerose LIRR station"}],"Fresh Meadows":[{"k":"History","t":"Gene Sarazen won the 1932 U.S. Open at the Fresh Meadow Country Club, the golf course that once stood here.","q":"Gene Sarazen 1932 US Open"},{"k":"Landmark","t":"New York Life built the garden-apartment development here in the late 1940s, and critic Lewis Mumford praised it as a model.","q":"Fresh Meadows housing development 1940s"},{"k":"Nature","t":"The west side of Cunningham Park borders the neighborhood.","q":"Cunningham Park Fresh Meadows"}],"John F. Kennedy International Airport":[{"k":"History","t":"It opened in 1948 as Idlewild Airport and was renamed for President Kennedy in December 1963.","q":"Idlewild Airport 1950s"},{"k":"Landmark","t":"Eero Saarinen's swooping 1962 TWA Flight Center is now the TWA Hotel.","q":"TWA Flight Center Saarinen"},{"k":"Culture","t":"The Beatles landed here on February 7, 1964, kicking off their first U.S. visit.","q":"Beatles arrive JFK 1964"}],"Woodside":[{"k":"Food","t":"Little Manila runs along Roosevelt Avenue in the 60s and 70s, and the city's first Jollibee opened here in 2009.","q":"Little Manila Woodside Roosevelt Avenue"},{"k":"Culture","t":"Decades of Irish immigration left Roosevelt Avenue lined with Irish pubs under the 7 train.","q":"Woodside Irish pub Roosevelt Avenue"},{"k":"Landmark","t":"The 61st Street stop is a major transfer where you can switch between the 7 and the LIRR.","q":"Woodside 61st Street station"}],"Jamaica Hills":[{"k":"Nature","t":"Captain Tilly Park's Goose Pond is a kettle pond left by a glacier, the last one in the neighborhood.","q":"Captain Tilly Park Goose Pond"},{"k":"History","t":"The Tilly family sold the park land to the city for $1 in 1908, on the condition it stay a park.","q":"Captain Tilly Park Jamaica Hills"},{"k":"Landmark","t":"The grand 1920s Jamaica High School building sits on the hill above the park.","q":"Jamaica High School building Queens"}],"Cambria Heights":[{"k":"Culture","t":"The Ohel, resting place of the Lubavitcher Rebbe, draws tens of thousands of visitors each year.","q":"Ohel Lubavitcher Rebbe Cambria Heights"},{"k":"Landmark","t":"Two blocks of storybook Tudor-style houses from around 1931 were made city historic districts in 2022.","q":"Cambria Heights storybook houses historic district"},{"k":"History","t":"The name dates to the 1920s, from the Cambria Title Savings and Trust, a Pennsylvania bank that financed early building.","q":"Cambria Heights Queens houses"}],"Richmond Hill":[{"k":"Culture","t":"Liberty Avenue is Little Guyana, and each spring the Phagwah parade fills it with colored powder for Holi.","q":"Phagwah parade Richmond Hill"},{"k":"Food","t":"Roti shops and bakeries serve Guyanese and Trinidadian staples like doubles, pepperpot and curry roti.","q":"Liberty Avenue roti shop"},{"k":"People","t":"Photographer and reformer Jacob Riis lived here for about 25 years.","q":"Jacob Riis"}],"Douglaston":[{"k":"Landmark","t":"Douglas Manor, a waterfront enclave of Tudor and Arts and Crafts homes, became a city historic district in 1997.","q":"Douglas Manor historic district"},{"k":"People","t":"Tennis star John McEnroe grew up here.","q":"John McEnroe young"},{"k":"History","t":"George Douglas bought the estate in 1835. The old Van Zandt mansion is now the Douglaston Club.","q":"Douglaston Club mansion"}],"South Ozone Park":[{"k":"Landmark","t":"Aqueduct Racetrack has run thoroughbred races here since 1894.","q":"Aqueduct Racetrack"},{"k":"Culture","t":"Resorts World, the city's first casino, opened at Aqueduct in 2011.","q":"Resorts World Casino New York"},{"k":"Food","t":"A big Indo-Caribbean community from Guyana and Trinidad keeps the area full of roti shops and Hindu mandirs.","q":"Indo-Caribbean Queens mandir"}],"Bay Terrace":[{"k":"Landmark","t":"Fort Totten, a Civil War-era fort on Little Neck Bay, is now a park with a stone water battery and a castle-like officers' club.","q":"Fort Totten Water Battery"},{"k":"Nature","t":"Little Bay Park sits right at the foot of the Throgs Neck Bridge.","q":"Little Bay Park Throgs Neck Bridge"},{"k":"History","t":"It stayed farmland until the 1950s, when the Meyer family sold their 225-acre farm for co-ops and the shopping center.","q":"Bay Terrace Shopping Center Queens"}],"Whitestone":[{"k":"Landmark","t":"The Bronx-Whitestone Bridge opened in 1939, just in time for the World's Fair.","q":"Bronx-Whitestone Bridge"},{"k":"People","t":"Francis Lewis, a signer of the Declaration of Independence, lived here. The British burned his house in 1776.","q":"Francis Lewis signer Declaration"},{"k":"History","t":"The name comes from a big white rock that once sat on the shoreline.","q":"Whitestone Queens waterfront"}],"St. Albans":[{"k":"People","t":"Count Basie, Ella Fitzgerald, Jackie Robinson and James Brown all lived in Addisleigh Park here.","q":"Addisleigh Park St Albans"},{"k":"Landmark","t":"Addisleigh Park's Tudor and Colonial houses were made a city historic district in 2011.","q":"Addisleigh Park historic district houses"},{"k":"Culture","t":"LL Cool J grew up here.","q":"LL Cool J"}],"Woodhaven":[{"k":"Landmark","t":"Neir's Tavern, open since 1829, is one of the oldest bars in the city and shows up in Goodfellas.","q":"Neir's Tavern Woodhaven"},{"k":"Food","t":"Schmidt's Candy on Jamaica Avenue has made chocolates by hand since 1925.","q":"Schmidt's Candy Woodhaven"},{"k":"History","t":"The Union Course racetrack here hosted a famous 1823 North vs. South horse race that drew huge crowds.","q":"Union Course racetrack 1823"}],"Corona":[{"k":"Landmark","t":"Louis Armstrong lived in a modest brick house here from 1943 until 1971. It's now a museum.","q":"Louis Armstrong House Museum"},{"k":"Food","t":"The Lemon Ice King of Corona has scooped Italian ices on 108th Street since 1944.","q":"Lemon Ice King of Corona"},{"k":"History","t":"The Corona ash dumps inspired the \"valley of ashes\" in The Great Gatsby.","q":"Corona ash dumps Great Gatsby"}],"Little Neck":[{"k":"Food","t":"Littleneck clams are named after Little Neck Bay, whose clams were a delicacy in the 1800s.","q":"littleneck clams"},{"k":"Nature","t":"Udalls Cove, a 90-acre wetland preserve, lines the shore of Little Neck Bay.","q":"Udalls Cove Little Neck"},{"k":"History","t":"The local LIRR station opened in 1866 on what's now the Port Washington Branch.","q":"Little Neck LIRR station"}],"Bayside":[{"k":"People","t":"In the silent-film era, stars like Rudolph Valentino, Gloria Swanson and W.C. Fields had homes here.","q":"Bayside silent film stars"},{"k":"Food","t":"Bell Boulevard is the go-to strip for bars, pubs and Korean restaurants.","q":"Bell Boulevard Bayside"},{"k":"Landmark","t":"Boxer \"Gentleman Jim\" Corbett lived in a house here from 1902 until his death in 1933.","q":"Gentleman Jim Corbett house Bayside"}],"Elmhurst":[{"k":"Food","t":"Broadway and Whitney Avenue are packed with Thai, Indonesian and Malaysian spots.","q":"Whitney Avenue Elmhurst Thai food"},{"k":"History","t":"It was the colonial town of Newtown until 1896, when a developer renamed it to escape the polluted creek's reputation.","q":"Elmhurst Queens history Newtown"},{"k":"Landmark","t":"Newtown High School's 1920s building has a striking Flemish Renaissance clock tower.","q":"Newtown High School Elmhurst"}],"Bayswater":[{"k":"History","t":"William Trist Bailey laid it out around 1878. Trist Place and Bailey Court are named after him.","q":"Bayswater Queens history"},{"k":"Nature","t":"Bayswater Point State Park protects shore for migrating birds, and horseshoe crabs come to spawn on its beach.","q":"Bayswater Point State Park"},{"k":"Landmark","t":"The park was once the 1907 estate of banker Louis Heinsheimer. Only the mansion's conservatory remains.","q":"Bayswater Point State Park conservatory"}],"Queens Village":[{"k":"History","t":"It was called Little Plains, then Brushville after a blacksmith, before taking the name Queens. The LIRR added \"Village\" in 1923.","q":"Queens Village history"},{"k":"People","t":"White House press secretary Karine Jean-Pierre grew up here.","q":"Karine Jean-Pierre"},{"k":"Landmark","t":"Many of its Dutch Colonial and Tudor homes went up in a building boom in the 1920s and 30s.","q":"Queens Village Tudor homes"}],"Laurelton":[{"k":"History","t":"It's named after its LIRR station, which was named for the laurels that once grew here.","q":"Laurelton LIRR station"},{"k":"Landmark","t":"Developer Dean Alvord modeled it on an English village, with Tudor-style homes on tree-lined streets.","q":"Laurelton Queens Tudor homes"},{"k":"Nature","t":"The Laurelton Parkway stretch of the Belt has a restored greenway for walking and biking.","q":"Laurelton Parkway greenway"}],"LaGuardia Airport":[{"k":"Landmark","t":"The Art Deco Marine Air Terminal from 1940 once served Pan Am's flying boats to Europe.","q":"Marine Air Terminal LaGuardia"},{"k":"History","t":"Before the airport, this was Gala Amusement Park, the \"Coney Island of Queens\" built by the Steinway family.","q":"Gala Amusement Park North Beach Queens"},{"k":"People","t":"It's named for Fiorello La Guardia, the mayor who pushed to build it. It opened in 1939.","q":"Fiorello La Guardia airport"}],"Flushing Meadows Corona Park":[{"k":"Landmark","t":"The Unisphere, a 12-story steel globe, was built for the 1964 World's Fair.","q":"Unisphere Flushing Meadows"},{"k":"Culture","t":"The US Open is played here every summer, and Arthur Ashe Stadium is the biggest tennis stadium in the world.","q":"Arthur Ashe Stadium US Open"},{"k":"History","t":"The Queens Museum's Panorama is a giant scale model of all five boroughs, built for the 1964 fair.","q":"Queens Museum Panorama of the City of New York"}],"Ditmars Steinway":[{"k":"Landmark","t":"Steinway & Sons has been building its pianos in a factory here since the 1870s.","q":"Steinway piano factory Astoria"},{"k":"Food","t":"Ditmars Boulevard is known for Greek seafood tavernas like Taverna Kyclades.","q":"Taverna Kyclades Astoria"},{"k":"History","t":"The 1850s Steinway Mansion, once home to piano maker William Steinway, still stands on a hill near the factory.","q":"Steinway Mansion Astoria"}],"Forest Hills":[{"k":"Landmark","t":"Forest Hills Gardens, laid out in 1909 with Frederick Law Olmsted Jr., centers on Tudor-style Station Square.","q":"Forest Hills Gardens Station Square"},{"k":"Culture","t":"The West Side Tennis Club hosted the US Open until 1977, and the Beatles played its stadium in 1964.","q":"Forest Hills Stadium West Side Tennis Club"},{"k":"People","t":"The Ramones all grew up here and met as teenagers.","q":"Ramones Forest Hills"}],"Kew Gardens":[{"k":"History","t":"It's named after the Royal Botanic Gardens at Kew in London.","q":"Kew Gardens Queens Tudor apartments"},{"k":"People","t":"Nobel Peace Prize winner Ralph Bunche lived in a house here that's now on the National Register.","q":"Ralph Bunche House Kew Gardens"},{"k":"Landmark","t":"Queens Borough Hall, finished in 1940, stands on Queens Boulevard.","q":"Queens Borough Hall"}],"Howard Beach":[{"k":"History","t":"It's named for William Howard, a glove maker who developed the area around 1900.","q":"Howard Beach history"},{"k":"Landmark","t":"Its A train stop is where you transfer to the AirTrain for JFK.","q":"Howard Beach JFK Airport station AirTrain"},{"k":"Food","t":"Lenny's Clam Bar has been a Cross Bay Boulevard institution since the 1970s.","q":"Lenny's Clam Bar Howard Beach"}],"Rego Park":[{"k":"History","t":"The name comes from the Real Good Construction Company, which built homes here in the 1920s.","q":"Rego Park Queens 1920s houses"},{"k":"Food","t":"A large Bukharian Jewish community means plov, samsa and lamb skewers along 63rd Drive.","q":"Bukharian restaurant Rego Park"},{"k":"Landmark","t":"Lost Battalion Hall, a city rec center on Queens Boulevard, is named for a famous World War I unit.","q":"Lost Battalion Hall Rego Park"}],"Jackson Heights":[{"k":"Landmark","t":"Its 1910s and 20s garden co-ops, built around private interior gardens, were among the first of their kind in the U.S.","q":"Jackson Heights garden co-ops"},{"k":"Food","t":"74th Street is Little India, with sari shops, sweet shops and longtime spots like the Jackson Diner.","q":"74th Street Jackson Heights Little India"},{"k":"Culture","t":"The Queens Pride Parade has marched down 37th Avenue since 1993.","q":"Queens Pride Parade Jackson Heights"}],"Astoria":[{"k":"Food","t":"Bohemian Hall & Beer Garden, opened in 1910, is the oldest beer garden in the city.","q":"Bohemian Hall Beer Garden Astoria"},{"k":"Landmark","t":"The Astoria Park pool, the city's biggest, was built in 1936 and hosted Olympic swimming trials.","q":"Astoria Park pool"},{"k":"History","t":"Kaufman Astoria Studios made the Marx Brothers' first films in the 1920s. The Museum of the Moving Image is next door.","q":"Kaufman Astoria Studios"}],"Arverne":[{"k":"History","t":"The name comes from developer Remington Vernam's wife, who signed her name \"R. Vernam.\"","q":"Arverne Rockaway history"},{"k":"Landmark","t":"Arverne by the Sea's new homes went up in the 2000s on oceanfront land that sat empty for decades.","q":"Arverne by the Sea"},{"k":"Nature","t":"The Arverne East Nature Preserve, opened in 2024, has 35 acres of dunes and trails by the beach.","q":"Arverne East Nature Preserve"}],"Jamaica Estates":[{"k":"People","t":"Donald Trump grew up here, first on Wareham Place and then on Midland Parkway.","q":"Trump childhood home Jamaica Estates"},{"k":"History","t":"It was laid out in 1907 on hilly glacial land, keeping many of the original trees.","q":"Jamaica Estates Queens homes"},{"k":"Landmark","t":"A restored historic gatehouse marks the entrance to Midland Parkway, the neighborhood's grand main street.","q":"Jamaica Estates gatehouse Midland Parkway"}],"Sunnyside":[{"k":"Landmark","t":"Sunnyside Gardens, a 1920s planned community built around shared courtyards, became a city landmark in 2007.","q":"Sunnyside Gardens"},{"k":"Culture","t":"The Sunnyside arch sign over Queens Boulevard at 46th Street is the neighborhood's calling card.","q":"Sunnyside arch Queens Boulevard"},{"k":"People","t":"Urban critic Lewis Mumford lived in Sunnyside Gardens in its early years.","q":"Lewis Mumford"}],"Glen Oaks":[{"k":"Landmark","t":"Glen Oaks Village, a big garden-apartment co-op, was built starting in 1947 for returning WWII veterans.","q":"Glen Oaks Village garden apartments"},{"k":"History","t":"The North Shore Towers high-rises and their golf course sit on the site of the old Glen Oaks Golf Club.","q":"North Shore Towers"},{"k":"People","t":"Nobel Prize-winning physicist Frank Wilczek grew up here.","q":"Frank Wilczek"}],"Rockaway Park":[{"k":"Culture","t":"Rockaway's St. Patrick's Day parade is the second-biggest in the city, after Fifth Avenue's.","q":"Rockaway St Patrick's Day parade"},{"k":"Landmark","t":"Beach 116th Street, the main drag, ends at the last stop of the Rockaway shuttle.","q":"Rockaway Park Beach 116th Street station"},{"k":"History","t":"NYC Ferry started its Rockaway route in 2017, with a landing at Beach 108th Street.","q":"NYC Ferry Rockaway Beach 108th"}],"Forest Park":[{"k":"Landmark","t":"Its hand-carved carousel dates to 1903, came here in 1971 and became a city landmark in 2013.","q":"Forest Park Carousel"},{"k":"Nature","t":"Strack Pond is a glacial kettle pond tucked inside one of the borough's biggest oak forests.","q":"Strack Pond Forest Park"},{"k":"Culture","t":"The George Seuffert Bandshell hosts free summer concerts.","q":"Forest Park Bandshell"}],"Breezy Point":[{"k":"Culture","t":"A private co-op since 1960 with a big Irish community, it's often called the \"Irish Riviera.\"","q":"Breezy Point Cooperative"},{"k":"Nature","t":"Breezy Point Tip, part of Gateway, has dunes where piping plovers nest.","q":"Breezy Point Tip Gateway"},{"k":"History","t":"Next door, Fort Tilden was an Army coastal defense post whose old gun batteries now sit in the dunes.","q":"Fort Tilden battery"}],"Long Island City":[{"k":"Landmark","t":"The red Pepsi-Cola sign has glowed over the East River since the 1940s and became a city landmark in 2016.","q":"Pepsi-Cola sign Long Island City"},{"k":"Culture","t":"MoMA PS1 shows contemporary art inside a former public school.","q":"MoMA PS1"},{"k":"History","t":"Silvercup Studios, in an old bread bakery, is where The Sopranos and Sex and the City were filmed.","q":"Silvercup Studios"}],"Hollis":[{"k":"Culture","t":"Run-DMC came from here, and they shout it out in \"Christmas in Hollis.\"","q":"Run-DMC Hollis"},{"k":"People","t":"Def Jam co-founder Russell Simmons grew up here with his brother, Run.","q":"Russell Simmons"},{"k":"History","t":"Developer Frederick Dunton named it after his hometown of Hollis, New Hampshire.","q":"Hollis Queens history"}],"East Elmhurst":[{"k":"People","t":"Malcolm X and his family lived in a house on 97th Street here in the early 1960s.","q":"Malcolm X Promenade Flushing Bay"},{"k":"Culture","t":"Dizzy Gillespie lived here, part of a big jazz community in this corner of Queens in the 1950s and 60s.","q":"Dizzy Gillespie Queens"},{"k":"Landmark","t":"The Bulova Watch Company once had its headquarters here, right by the edge of LaGuardia.","q":"Bulova Corporate Center East Elmhurst"}],"Springfield Gardens":[{"k":"Nature","t":"Idlewild Park Preserve protects salt marsh on the edge of Jamaica Bay, right by JFK.","q":"Idlewild Park Preserve"},{"k":"Landmark","t":"Springfield Park has a small lake surrounded by lawns and playgrounds.","q":"Springfield Park lake Queens"},{"k":"History","t":"LIRR service brought a housing boom in the 1920s, and the area took its current name in 1927.","q":"Springfield Gardens Queens houses"}],"Belle Harbor":[{"k":"History","t":"The same developer who built Edgemere, Frederick J. Lancaster, named and laid out this area in the early 1900s.","q":"Belle Harbor Rockaway homes"},{"k":"Culture","t":"The local yacht club was founded in 1905 and was racing in the ocean by 1908.","q":"Belle Harbor Yacht Club"},{"k":"Food","t":"Beach 129th Street is the little local strip for coffee, bagels and pizza.","q":"Beach 129th Street Belle Harbor"}],"Ozone Park":[{"k":"History","t":"Developers picked the name to suggest healthy ocean breezes, back when \"ozone\" meant fresh sea air.","q":"Ozone Park Queens history"},{"k":"People","t":"Jack Kerouac lived here with his mother in the 1940s while writing his early novels.","q":"Jack Kerouac 1940s"},{"k":"Culture","t":"Cyndi Lauper grew up here.","q":"Cyndi Lauper young"}],"Far Rockaway":[{"k":"Landmark","t":"The Mott Avenue stop is the end of the A, the longest subway route in the city.","q":"Far Rockaway Mott Avenue A train"},{"k":"People","t":"Physicist Richard Feynman grew up here and went to Far Rockaway High School.","q":"Richard Feynman young"},{"k":"History","t":"Back in the 1830s, the grand Marine Pavilion hotel made this one of the country's first beach resorts.","q":"Marine Pavilion hotel Far Rockaway"}],"Briarwood":[{"k":"History","t":"It's named for the brambles in the thick woods that covered the area when developers arrived in the early 1900s.","q":"Briarwood Queens"},{"k":"Landmark","t":"Parkway Village was built in 1947 to house United Nations staff and is now a co-op.","q":"Parkway Village Queens"},{"k":"Culture","t":"Archbishop Molloy High School, alma mater of Andrew Cuomo and Kenny Smith, moved here in 1957.","q":"Archbishop Molloy High School"}],"Middle Village":[{"k":"History","t":"The name comes from its spot midway between Williamsburg and Jamaica on the old turnpike, now Metropolitan Avenue.","q":"Metropolitan Avenue Middle Village"},{"k":"Nature","t":"Juniper Valley Park, with ball fields, tennis courts and a track, was once a swamp.","q":"Juniper Valley Park"},{"k":"Landmark","t":"The M train ends its run here at Metropolitan Avenue.","q":"Middle Village Metropolitan Avenue station"}],"College Point":[{"k":"Landmark","t":"The 1868 Poppenhusen Institute, built by rubber maker Conrad Poppenhusen, housed one of the first free kindergartens in the U.S.","q":"Poppenhusen Institute"},{"k":"History","t":"It's named for St. Paul's College, a seminary founded here in the 1830s.","q":"College Point history"},{"k":"Culture","t":"The New York Times prints its papers at a big plant here.","q":"New York Times College Point printing plant"}]}},{"id":"kyn-bx","name":"Bronx","letter":"X","geo":{"w":448,"h":458,"f":[{"n":"Bronx Park","d":"M188.0,229.5L192.7,247.5L190.0,253.5L192.3,254.5L183.3,273.4L175.5,281.3L165.7,277.4L168.0,272.2L152.9,258.5L152.0,257.0L158.5,227.3L158.7,224.9L157.9,219.8L159.0,212.1L157.8,209.8L153.8,205.1L149.9,198.3L150.3,195.3L152.2,190.7L171.0,176.8L181.8,157.5L185.3,147.8L189.5,149.2L187.1,156.5L186.3,179.6L186.5,195.1L185.0,224.4L189.1,222.6L192.4,222.4Z","x":173.1,"y":246.6,"a":3304},{"n":"Castle Hill","d":"M228.0,379.4L227.8,379.8L226.5,374.3L227.4,374.2L225.6,366.7L222.8,351.4L261.9,344.4L260.0,333.9L263.5,333.2L268.6,347.1L268.5,348.0L269.8,351.2L270.3,353.5L270.1,355.9L269.5,358.0L269.9,358.5L269.8,359.4L269.0,359.9L268.8,360.7L264.4,363.6L264.1,366.2L261.4,371.6L261.2,373.4L259.5,376.7L255.6,388.5L254.1,389.6L253.0,392.8L251.0,393.4L250.2,393.2L249.4,392.0L247.4,386.4L244.2,383.6L241.4,382.3L240.8,381.1L239.4,379.4L235.7,379.8L235.9,379.3L234.5,379.0L234.8,379.6L235.3,379.5L235.4,381.0L234.6,381.3L234.7,381.9L233.3,382.3L230.6,381.3Z","x":246.3,"y":364.0,"a":1498},{"n":"Mount Hope","d":"M85.8,237.0L93.0,240.3L98.4,244.1L103.9,249.9L103.4,252.9L105.6,253.6L98.4,270.4L75.6,268.3L74.9,269.6L72.3,269.9L70.1,268.6L67.0,268.4L69.7,264.4L69.9,263.1L76.9,250.1Z","x":89. rth Riverdale","Spuyten Duyvil","Kingsbridge"],"Ferry Point Park":["Throgs Neck"],"Pelham Bay":["Pelham Bay Park","Schuylerville","Morris Park","Pelham Gardens","Westchester Square","Country Club"],"Mott Haven":["Port Morris","Longwood","Melrose","Concourse","Concourse Village"],"Eastchester":["Pelham Bay Park","Edenwald","Co-op City","Baychester"],"Concourse Village":["Concourse","Morrisania","Melrose","Claremont Village","Mott Haven"],"Hunts Point":["Longwood","Port Morris","Clason Point","Soundview"],"Olinville":["Williamsbridge","Bronx Park","Woodlawn","Wakefield","Allerton","Norwood"],"Port Morris":["Mott Haven","Hunts Point","Longwood"],"Claremont Village":["Concourse Village","Crotona Park","Mount Eden","Mount Hope","Morrisania","Tremont","Concourse"],"Crotona Park":["East Morrisania","Tremont","Claremont Village","Morrisania"],"Bronxdale":["Allerton","Morris Park","Bronx Park","Van Nest","Pelham Gardens"],"Edenwald":["Eastchester","Wakefield","Williamsbridge","Baychester"],"West Farms":["Bronx Park","East Morrisania","Parkchester","Tremont","Van Nest","Belmont"],"Van Cortlandt Park":["Woodlawn","Kingsbridge","Norwood","Fieldston","North Riverdale"],"Pelham Bay Park":["Co-op City","Eastchester","Pelham Bay","Country Club","Pelham Gardens"],"Throgs Neck":["Ferry Point Park","Schuylerville","Country Club","Unionport"],"Concourse":["Concourse Village","Highbridge","Mount Eden","Mott Haven","Claremont Village"],"North Riverdale":["Riverdale","Van Cortlandt Park","Fieldston"],"Fieldston":["Riverdale","Kingsbridge","Van Cortlandt Park","North Riverdale"],"Country Club":["Schuylerville","Pelham Bay Park","Throgs Neck","Pelham Bay"]},"facts":{"Bronx Park":[{"k":"Nature","t":"The Bronx Zoo opened here in 1899 and is one of the biggest city zoos in the country, with about 265 acres of habitats.","q":"Bronx Zoo entrance"},{"k":"Landmark","t":"The New York Botanical Garden's glass Enid A. Haupt Conservatory dates to 1902. The garden also protects a patch of old-growth forest.","q":"Enid A. Haupt Conservatory New York Botanical Garden"},{"k":"History","t":"The Lorillard family ground tobacco into snuff at the Stone Mill on the Bronx River. The 1840 mill still stands inside the garden.","q":"Stone Mill New York Botanical Garden Bronx River"}],"Castle Hill":[{"k":"People","t":"Jennifer Lopez grew up here on Blackrock Avenue. This is the block behind \"Jenny from the Block.\"","q":"Jennifer Lopez Castle Hill Bronx"},{"k":"History","t":"Explorer Adriaen Block found a fortified Siwanoy village on a hill here in the early 1600s, and settlers named the spot for that 'castle.'","q":"Castle Hill Point Bronx history"},{"k":"Nature","t":"Castle Hill Point Park at the end of Castle Hill Avenue has a boat ramp, fishing piers and views of the Throgs Neck and Whitestone bridges.","q":"Castle Hill Point Park Bronx"}],"Mount Hope":[{"k":"Landmark","t":"The 1896 Shuttleworth Mansion on Anthony Avenue, built for a stone dealer, is covered in ornate carvings and is a city landmark.","q":"Shuttleworth Mansion Anthony Avenue Bronx"},{"k":"Culture","t":"It's one of three hills, with Mount Eden and Fairmount, whose 'mounts' gave Tremont its name.","q":"Mount Hope Place Bronx"},{"k":"History","t":"An 1868 map called this area the Western Reserve of Upper Morrisania.","q":"Mount Hope Bronx history"}],"Morris Park":[{"k":"History","t":"The Morris Park Racecourse ran here from 1889. It hosted the Belmont Stakes for years and the 1890 Preakness.","q":"Morris Park Racecourse history"},{"k":"Food","t":"Conti's Pastry Shoppe on Morris Park Avenue has been baking Italian pastries since 1921.","q":"Conti's Pastry Shoppe Bronx"},{"k":"Culture","t":"The Albert Einstein College of Medicine is here, and since a $1 billion gift in 2024 it has been tuition-free.","q":"Albert Einstein College of Medicine campus"}],"Soundview":[{"k":"People","t":"Supreme Court Justice Sonia Sotomayor grew up in the Bronxdale Houses here, renamed the Sotomayor Houses in her honor.","q":"Sotomayor Houses Bronx"},{"k":"Nature","t":"Soundview Park's 205 acres were built on filled-in tidal marsh starting in 1939, with ballfields and a waterfront greenway.","q":"Soundview Park Bronx"},{"k":"History","t":"The name comes from old maps that showed the East River here as part of Long Island Sound.","q":"Soundview Bronx waterfront"}],"Spuyten Duyvil":[{"k":"Landmark","t":"A 16-foot bronze Henry Hudson stands atop a 100-foot column in Henry Hudson Park, dedicated in 1938.","q":"Henry Hudson Monument Spuyten Duyvil"},{"k":"History","t":"The Dutch name is often translated as 'spouting devil,' for the wild tides where the Harlem River meets the Hudson.","q":"Spuyten Duyvil Creek Hudson River"},{"k":"Culture","t":"The giant blue Columbia 'C' painted on the rock cliff, facing Columbia's Baker Field, is on this side of the creek.","q":"Columbia C rock Spuyten Duyvil"}],"University Heights":[{"k":"Landmark","t":"The Hall of Fame for Great Americans, opened in 1901, is a colonnade of bronze busts. It was the first hall of fame in the U.S.","q":"Hall of Fame for Great Americans Bronx"},{"k":"History","t":"NYU had its uptown campus here from 1894 until 1973, when it sold to CUNY. It's now Bronx Community College.","q":"Bronx Community College campus"},{"k":"Culture","t":"Stanford White designed the domed Gould Memorial Library, inspired by Rome's Pantheon.","q":"Gould Memorial Library Bronx"}],"Highbridge":[{"k":"Landmark","t":"The High Bridge, opened in 1848 to carry Croton water to Manhattan, is NYC's oldest standing bridge. It reopened to walkers in 2015.","q":"High Bridge Harlem River"},{"k":"People","t":"Rapper Cardi B grew up here, spending much of her childhood at her grandmother's apartment.","q":"Cardi B Highbridge Bronx"},{"k":"History","t":"Noonan Plaza on West 168th Street is an Art Deco gem from 1931, built around a grand landscaped courtyard.","q":"Noonan Plaza Bronx Art Deco"}],"Westchester Square":[{"k":"History","t":"Founded around 1654 by English settlers. Peter Stuyvesant had them arrested, but they stayed, and it became the Town of Westchester's seat.","q":"Westchester Square Bronx"},{"k":"Culture","t":"The Huntington Free Library, open since the 1890s, is a private reading room focused on Bronx history.","q":"Huntington Free Library Westchester Square"},{"k":"Landmark","t":"St. Peter's Church, a Gothic Revival stone church by Leopold Eidlitz, sits in an old churchyard and is a city landmark.","q":"St. Peter's Church Westchester Square Bronx"}],"Tremont":[{"k":"History","t":"A 1800s postmaster coined the name from 'tre' for three hills nearby: Mount Eden, Mount Hope and Fairmount.","q":"Tremont Avenue Bronx"},{"k":"Landmark","t":"The Tremont Library on Washington Avenue is a 1905 Carnegie library by Carrere and Hastings, architects of the main NYPL building.","q":"Tremont Library Bronx"},{"k":"Nature","t":"It's so hilly that some streets turn into public staircases connecting the blocks above and below.","q":"Bronx step street"}],"Norwood":[{"k":"Landmark","t":"The Valentine-Varian House, a fieldstone farmhouse from 1758, is now the Museum of Bronx History.","q":"Valentine-Varian House Bronx"},{"k":"Nature","t":"Williamsbridge Oval, a sunken park with ballfields and a track, was a reservoir that supplied the North Bronx with water.","q":"Williamsbridge Oval park Bronx"},{"k":"Culture","t":"Irish immigrants gave Bainbridge Avenue the nickname Little Belfast, and Irish pubs still line it.","q":"Bainbridge Avenue Norwood Bronx"}],"Williamsbridge":[{"k":"History","t":"Named for John Williams, an 18th-century farmer credited with building the first bridge over the Bronx River here.","q":"Williamsbridge Bronx River"},{"k":"Food","t":"Since the 1980s a big West Indian community has filled White Plains Road with Caribbean bakeries, patty shops and jerk spots.","q":"White Plains Road Williamsbridge"},{"k":"Culture","t":"Gun Hill Road is said to be named for a Revolutionary War cannon that patriots hauled up the hill.","q":"Gun Hill Road Bronx"}],"Belmont":[{"k":"Food","t":"Arthur Avenue is the Bronx's Little Italy. Mayor La Guardia opened its indoor Retail Market in 1940 to get pushcart vendors off the street.","q":"Arthur Avenue Retail Market Bronx"},{"k":"People","t":"Doo-wop group Dion and the Belmonts took their name from Belmont Avenue, where Dion DiMucci grew up.","q":"Dion and the Belmonts"},{"k":"Landmark","t":"Our Lady of Mount Carmel on East 187th Street has been the spiritual heart of Italian Belmont for over a century.","q":"Our Lady of Mount Carmel Church Belmont Bronx"}],"City Island":[{"k":"Food","t":"A little New England fishing village in the Bronx, lined with seafood spots. Johnny's Reef at the very end of the island fries clams by the water.","q":"Johnny's Reef City Island"},{"k":"History","t":"Minneford's yacht yard here built America's Cup winners, including Courageous, which won the Cup in 1974 and 1977.","q":"Courageous yacht America's Cup"},{"k":"Culture","t":"Born-and-raised islanders are called Clamdiggers, while newcomers are Musselsuckers.","q":"City Island Avenue Bronx"}],"Allerton":[{"k":"Landmark","t":"The Coops on Bronx Park East were built in the 1920s by Jewish garment workers as a utopian co-op colony. They're now a National Historic Landmark.","q":"United Workers Cooperative Colony Coops Bronx Park East"},{"k":"History","t":"Named for Daniel Allerton, an early settler who farmed this land with his wife, Hustace.","q":"Allerton Avenue Bronx"}],"Parkchester":[{"k":"History","t":"MetLife built this planned city from 1939 to 1942: 171 brick buildings with about 12,000 apartments around landscaped lawns.","q":"Parkchester Bronx aerial"},{"k":"Culture","t":"Hundreds of whimsical terra cotta figures, from animals to musicians, decorate the buildings.","q":"Parkchester terra cotta sculptures"},{"k":"Landmark","t":"Macy's opened its very first branch store, outside its Herald Square flagship, here in 1941.","q":"Macy's Parkchester"}],"Co-op City":[{"k":"Landmark","t":"The world's largest housing cooperative: 15,372 apartments in 35 towers plus townhouses, with its own power plant. First residents moved in in 1968.","q":"Co-op City Bronx towers"},{"k":"People","t":"Supreme Court Justice Sonia Sotomayor's family moved here when she was a teen.","q":"Sonia Sotomayor Co-op City"},{"k":"Culture","t":"Bay Plaza, on the south side, is the biggest shopping center in New York City. Its enclosed mall opened in 2014.","q":"Mall at Bay Plaza Bronx"}],"Kingsbridge":[{"k":"History","t":"Named for the King's Bridge, a 1693 toll bridge over Spuyten Duyvil Creek that was the first link between Manhattan and the mainland.","q":"King's Bridge 1693 Kingsbridge history"},{"k":"Culture","t":"Gaelic Park at 240th and Broadway has been home to Irish sports like hurling and Gaelic football for generations.","q":"Gaelic Park Bronx"},{"k":"Food","t":"Stella D'oro baked its famous breadsticks and cookies in a factory on Broadway here until 2009.","q":"Stella D'oro factory Bronx"}],"Longwood":[{"k":"Landmark","t":"The Longwood Historic District is lined with semi-detached rowhouses from around 1900, most designed by architect Warren C. Dickerson.","q":"Longwood Historic District Bronx"},{"k":"Culture","t":"Casa Amadeo on Prospect Avenue, opened in 1941 as Casa Hernandez, is on the National Register as NYC's oldest Latin music store.","q":"Casa Amadeo Prospect Avenue Bronx"},{"k":"People","t":"Colin Powell grew up on Kelly Street before heading to Morris High School and City College.","q":"Kelly Street Bronx Colin Powell"}],"Schuylerville":[{"k":"Food","t":"Louie & Ernie's, a pizzeria in a converted house at Crosby and Waterbury avenues, has been making pies since about 1959.","q":"Louie and Ernie's Pizza Bronx"},{"k":"Landmark","t":"Herbert H. Lehman High School is built right over the Hutchinson River Parkway.","q":"Herbert H. Lehman High School Hutchinson River Parkway"},{"k":"People","t":"Jazz singer Billie Holiday is buried in St. Raymond's Cemetery here.","q":"St. Raymond's Cemetery Bronx"}],"Pelham Gardens":[{"k":"History","t":"The Pelham name traces back to Thomas Pell, who bought this land from the Siwanoy in 1654 under the Treaty Oak.","q":"Thomas Pell Treaty Oak Pelham Bay"},{"k":"Nature","t":"Pelham Parkway, a wide, tree-lined boulevard from the 1880s, links Bronx Park and Pelham Bay Park along the southern edge.","q":"Pelham Parkway Bronx"},{"k":"People","t":"\"Raging Bull\" boxer Jake LaMotta lived on Pelham Parkway.","q":"Jake LaMotta"}],"Van Nest":[{"k":"Culture","t":"Playwright John Patrick Shanley named his 1987 movie \"Five Corners\" after a local intersection still called that.","q":"Five Corners Van Nest Bronx"},{"k":"People","t":"Civil rights leader Stokely Carmichael moved here from Harlem as a kid in 1952.","q":"Stokely Carmichael"}],"Mount Eden":[{"k":"History","t":"Named for Rachel Eden, who owned land on this hill in the 1820s.","q":"Mount Eden Avenue Bronx"},{"k":"Culture","t":"It's one of the three 'mounts' that gave Tremont its name, along with Mount Hope and Fairmount.","q":"Mount Eden Bronx Grand Concourse"},{"k":"Nature","t":"The Grand Concourse rides along a natural rocky ridge through here, with steep side streets dropping off either side.","q":"Grand Concourse ridge Bronx"}],"Fordham":[{"k":"Culture","t":"Fordham University's leafy Gothic Rose Hill campus was founded in 1841 as St. John's College, and often stands in for Ivy League schools on film.","q":"Fordham University Rose Hill campus"},{"k":"People","t":"Edgar Allan Poe lived in a small cottage here from 1846 to 1849 and wrote \"Annabel Lee\" there. It's now a museum in Poe Park.","q":"Edgar Allan Poe Cottage Bronx"},{"k":"Landmark","t":"The Loew's Paradise on the Grand Concourse opened in 1929 as one of the city's grandest movie palaces, with stars twinkling on its ceiling.","q":"Loew's Paradise Theater Grand Concourse"}],"Morris Heights":[{"k":"Culture","t":"Hip-hop was born at 1520 Sedgwick Avenue, where DJ Kool Herc spun at his sister's back-to-school party on August 11, 1973.","q":"1520 Sedgwick Avenue hip hop"},{"k":"Nature","t":"Roberto Clemente State Park, opened in 1973 on the Harlem River, was New York's first state park in an urban setting.","q":"Roberto Clemente State Park Bronx"},{"k":"Landmark","t":"River Park Towers, finished in 1975 at 44 stories, became the tallest buildings in the Bronx.","q":"River Park Towers Bronx"}],"Baychester":[{"k":"History","t":"Freedomland U.S.A., a theme park shaped like a map of the country, ran from 1960 to 1964 just east of here, where Co-op City stands now.","q":"Freedomland USA Bronx amusement park"},{"k":"Culture","t":"This started out as a little fishing village on the salt marshes by the Hutchinson River.","q":"Baychester Bronx Hutchinson River marsh"},{"k":"Nature","t":"The Hutchinson River, named for 1640s settler Anne Hutchinson, runs along the eastern edge.","q":"Hutchinson River Bronx"}],"Wakefield":[{"k":"History","t":"Named after the Virginia plantation where George Washington was born. Mount Vernon, next door, is named for his later home.","q":"Wakefield 241st Street Bronx"},{"k":"Culture","t":"A big Jamaican and Guyanese community fills White Plains Road with Caribbean bakeries, jerk spots and roti shops.","q":"White Plains Road Wakefield Caribbean"},{"k":"Landmark","t":"Wakefield-241st Street is the northern end of the 2 train and the northernmost station in the subway.","q":"Wakefield 241st Street station"}],"East Morrisania":[{"k":"History","t":"Charlotte Street's suburban-style ranch houses with yards, built in the 1980s, became a famous symbol of the South Bronx's comeback.","q":"Charlotte Street ranch houses Bronx"},{"k":"People","t":"Genevieve Brooks co-founded the Mid-Bronx Desperadoes, a community group that helped rebuild these blocks.","q":"Mid-Bronx Desperadoes Charlotte Street"},{"k":"Nature","t":"Starlight Park on the Bronx River was an amusement park through the 1940s. Now it's a riverside park with playing fields and a greenway.","q":"Starlight Park Bronx River"}],"Clason Point":[{"k":"History","t":"Named for Isaac Clason, a Scottish merchant and big landowner. In the early 1900s it was a seaside resort with dance halls and amusement rides.","q":"Clason Point amusement park history"},{"k":"Culture","t":"Harding Park started as a waterfront bungalow colony, and its colorful little houses earned it the nickname Little Puerto Rico.","q":"Harding Park Bronx bungalows"},{"k":"Nature","t":"NYC Ferry's Soundview route has stopped at Clason Point Park since 2018, with kayaking right off the shore.","q":"Clason Point ferry landing Bronx"}],"Unionport":[{"k":"History","t":"Laid out in 1851, it was among the first Bronx towns with a street grid. Zerega Avenue was once Avenue A.","q":"Zerega Avenue Bronx"},{"k":"Landmark","t":"The 1901 PS 36 on Castle Hill Avenue still has its old street names, like Avenue C and 8th Street, carved into its corners.","q":"PS 36 Castle Hill Avenue Bronx"},{"k":"Nature","t":"Westchester Creek, a tidal inlet where early settlers hoped to build a port, runs along the neighborhood.","q":"Westchester Creek Bronx"}],"Woodlawn":[{"k":"People","t":"Woodlawn Cemetery is the resting place of Duke Ellington, Miles Davis, Herman Melville and Celia Cruz.","q":"Woodlawn Cemetery Bronx"},{"k":"Landmark","t":"Opened in 1863, the cemetery is a National Historic Landmark full of grand mausoleums, some with Tiffany glass.","q":"Woodlawn Cemetery mausoleum"},{"k":"Culture","t":"Katonah Avenue is the heart of an Irish community, lined with pubs, delis and bakeries.","q":"Katonah Avenue Woodlawn"}],"Morrisania":[{"k":"History","t":"This was the Morris family's manor. Lewis Morris, who signed the Declaration of Independence, was born here in 1726.","q":"Lewis Morris Morrisania manor"},{"k":"Landmark","t":"Morris High School's Gothic building, from 1904, anchors a landmark district of brownstones.","q":"Morris High School Bronx"},{"k":"People","t":"Rapper Fat Joe grew up in the Forest Houses here.","q":"Fat Joe Bronx"}],"Melrose":[{"k":"Culture","t":"The Hub, where five streets meet at 149th Street and Third Avenue, is the Bronx's second-biggest shopping district after Fordham Road.","q":"The Hub 149th Street Third Avenue Bronx"},{"k":"History","t":"Named after Melrose Abbey in Scotland. In the 1800s it was a German village, home to the Haffen Brewing Company.","q":"Melrose Bronx history"},{"k":"Landmark","t":"Via Verde, a green apartment complex with stepped rooftop gardens, has won national awards for design.","q":"Via Verde Bronx"}],"Riverdale":[{"k":"Nature","t":"Wave Hill is a public garden on a bluff with sweeping views of the Hudson and the Palisades.","q":"Wave Hill garden Palisades view"},{"k":"People","t":"Mark Twain lived at Wave Hill from 1901 to 1903, and a young Theodore Roosevelt summered there.","q":"Wave Hill house Mark Twain"},{"k":"History","t":"As a boy, John F. Kennedy lived on Independence Avenue here and attended Riverdale Country School.","q":"Riverdale Country School"}],"Ferry Point Park":[{"k":"Landmark","t":"A Jack Nicklaus-designed links golf course opened here in 2015 on a former landfill. It's now called Bally's Golf Links at Ferry Point.","q":"Ferry Point golf course Whitestone Bridge"},{"k":"History","t":"The Bronx-Whitestone Bridge, opened in 1939, touches down right in the park.","q":"Bronx-Whitestone Bridge from Ferry Point Park"},{"k":"Nature","t":"The waterfront paths look across the East River to Queens, with Manhattan's skyline off to the west.","q":"Ferry Point Park waterfront Bronx"}],"Pelham Bay":[{"k":"Culture","t":"In \"The Taking of Pelham One Two Three,\" the hijacked train leaves from Pelham Bay Park, the 6 train's last stop.","q":"Pelham Bay Park station 6 train"},{"k":"Nature","t":"Pelham Bay Park, the city's largest park, starts right at the neighborhood's northeast edge.","q":"Pelham Bay Park Bronx"},{"k":"Landmark","t":"The 6 train rides an elevated track along Westchester Avenue here on its way to the end of the line.","q":"James Coco actor"}],"Mott Haven":[{"k":"History","t":"Named for Jordan L. Mott, inventor of a coal-burning stove, who set up his iron works here in the 1800s.","q":"Jordan L. Mott iron works Mott Haven"},{"k":"Landmark","t":"St. Ann's Church, built in 1841, is the oldest church in the Bronx. Gouverneur Morris, who drafted much of the Constitution, is buried there.","q":"St. Ann's Church Bronx"},{"k":"Culture","t":"Alexander Avenue's 19th-century brownstones, nicknamed Doctors' Row, make up the Mott Haven Historic District.","q":"Alexander Avenue brownstones Mott Haven"}],"Eastchester":[{"k":"History","t":"This was part of the Town of Eastchester in Westchester County until New York City annexed it in the 1890s. Neighboring Mount Vernon was too.","q":"Eastchester Bronx history"},{"k":"Culture","t":"The 5 train's Dyre Avenue Line runs on the old route of the New York, Westchester and Boston Railway, a commuter line that folded in 1937.","q":"Dyre Avenue subway station Bronx"},{"k":"Landmark","t":"Boston Road here is U.S. Route 1, following the old colonial post road between New York and Boston.","q":"Boston Road Bronx"}],"Concourse Village":[{"k":"People","t":"Cardinal Hayes High School on the Grand Concourse counts Martin Scorsese, Regis Philbin and Don DeLillo among its grads.","q":"Cardinal Hayes High School Bronx"},{"k":"History","t":"The Concourse Village co-op opened in 1964, built by the Amalgamated Clothing Workers union as affordable homes.","q":"Concourse Village Bronx co-op"},{"k":"Landmark","t":"The Bronx General Post Office at 149th Street holds Depression-era murals by artist Ben Shahn.","q":"Bronx General Post Office Ben Shahn murals"}],"Hunts Point":[{"k":"Food","t":"One of the world's largest food distribution centers is here. The Fulton Fish Market moved in from Lower Manhattan in 2005.","q":"Hunts Point Food Distribution Center"},{"k":"Nature","t":"Barretto Point Park on the East River has fishing piers, a kayak launch and views of North Brother Island.","q":"Barretto Point Park Bronx"},{"k":"History","t":"Poet Joseph Rodman Drake, who wrote \"The Culprit Fay,\" is buried in the small park named after him.","q":"Joseph Rodman Drake Park Bronx"}],"Olinville":[{"k":"History","t":"Named in 1852 for Stephen Olin, a Methodist minister and president of Wesleyan University, who likely never visited.","q":"Olinville Avenue Bronx"},{"k":"People","t":"Novelist Richard Price, author of \"The Wanderers\" and \"Clockers,\" grew up in the Parkside Houses here.","q":"Richard Price novelist Bronx"},{"k":"Nature","t":"The Bronx River forms the western edge, with a greenway along its banks.","q":"Bronx River Greenway"}],"Port Morris":[{"k":"History","t":"Gouverneur Morris Jr. started a deep-water port on the East River here in 1842, giving the neighborhood its name.","q":"Port Morris Bronx waterfront"},{"k":"Culture","t":"This was once a piano-making hub. The Estey Piano factory's clock tower, from 1886, is now a landmark.","q":"Estey Piano Company Factory clock tower Bronx"},{"k":"Landmark","t":"The Hell Gate Bridge's 1917 approach arches march across the neighborhood on their way to Randall's Island.","q":"Hell Gate Bridge approach arches Bronx"}],"Claremont Village":[{"k":"History","t":"Claremont Park takes its name from the Claremont mansion, built in 1859 by the Zborowski family on what was once Morris family land.","q":"Claremont Park Bronx history"},{"k":"Nature","t":"Claremont Park's 38 acres sit on a ridge above Webster Avenue, with ballfields, a gazebo and two outdoor pools.","q":"Claremont Park Bronx pool"},{"k":"Culture","t":"In 1889 the park's grounds were considered as a site for the 1892 World's Fair. Chicago got it instead.","q":"Claremont Park Bronx"}],"Crotona Park":[{"k":"Landmark","t":"Crotona Pool opened in 1936 as a WPA project and is still the largest pool in the Bronx.","q":"Crotona Pool Bronx"},{"k":"History","t":"The park was nearly called Bathgate Park, but got the name Crotona after the ancient Greek city of Croton instead.","q":"Crotona Park Bronx"},{"k":"Nature","t":"Indian Lake, about 3 acres, is ringed by elms and has a lakeside amphitheater for summer shows.","q":"Indian Lake Crotona Park"}],"Bronxdale":[{"k":"History","t":"The name comes from a 1800s mill village on the Bronx River, near the Lorillard snuff mill that still stands in the Botanical Garden.","q":"Lorillard Snuff Mill Bronx River"},{"k":"Culture","t":"Many streets honor 1800s mayors and governors, like Hone Avenue for Mayor Philip Hone and Fish Avenue for Governor Hamilton Fish.","q":"Hone Avenue Bronx street sign"},{"k":"Nature","t":"Bronx Park, home to the Bronx Zoo, forms the western edge, and Pelham Parkway's tree-lined lanes run along the south.","q":"Pelham Parkway Bronx trees"}],"Edenwald":[{"k":"Nature","t":"Seton Falls Park hides a waterfall made when William Seton, son of Saint Elizabeth Ann Seton, dammed Rattlesnake Creek in the 1800s.","q":"Seton Falls Park Bronx waterfall"},{"k":"People","t":"Latin jazz greats Andy and Jerry Gonzalez grew up in the Edenwald Houses.","q":"Jerry Gonzalez Fort Apache Band"},{"k":"Landmark","t":"The Edenwald Houses, opened in 1953 with 40 buildings and about 2,000 apartments, are the Bronx's largest public housing complex.","q":"Edenwald Houses Bronx"}],"West Farms":[{"k":"History","t":"The land was granted in 1666 to Edward Jessup and John Richardson. It later became the Town of West Farms in 1846.","q":"West Farms Bronx history"},{"k":"Landmark","t":"West Farms Soldiers Cemetery on East 180th Street is the resting place of Civil War veterans.","q":"West Farms Soldiers Cemetery"},{"k":"Nature","t":"The Bronx River runs along the edge, and Bronx Park with the Bronx Zoo is just to the north.","q":"Bronx River West Farms"}],"Van Cortlandt Park":[{"k":"Landmark","t":"The Van Cortlandt House, built in 1748, is the oldest building in the Bronx and now a museum.","q":"Van Cortlandt House Museum"},{"k":"Culture","t":"Van Cortlandt Golf Course, opened in 1895, was the first public golf course in the country.","q":"Van Cortlandt Golf Course"},{"k":"Nature","t":"Van Cortlandt Lake is the biggest freshwater lake in the Bronx, and the park's 1,100-plus acres include old forests and a famous cross-country course.","q":"Van Cortlandt Lake"}],"Pelham Bay Park":[{"k":"Nature","t":"At about 2,770 acres, this is NYC's largest park, more than three times the size of Central Park.","q":"Pelham Bay Park aerial"},{"k":"Culture","t":"Orchard Beach, a crescent of sand built by Robert Moses in the 1930s, is known as the Bronx Riviera.","q":"Orchard Beach Bronx"},{"k":"Landmark","t":"The Bartow-Pell Mansion, a Greek Revival house from 1842, is a museum with formal gardens.","q":"Bartow-Pell Mansion"}],"Throgs Neck":[{"k":"Landmark","t":"Fort Schuyler, built 1833 to 1856 to guard the city, is now home to SUNY Maritime College and a maritime museum.","q":"Fort Schuyler SUNY Maritime"},{"k":"History","t":"Named for John Throckmorton, an English settler who got permission to settle the peninsula in 1642.","q":"Throgs Neck Bridge Bronx"},{"k":"Culture","t":"Edgewater Park and Silver Beach began as summer bungalow colonies and became tight-knit waterfront communities.","q":"Silver Beach Bronx bungalows"}],"Concourse":[{"k":"Landmark","t":"Yankee Stadium opened in 2009 right across 161st Street from the 1923 original, whose footprint is now Heritage Field.","q":"Yankee Stadium Bronx"},{"k":"History","t":"The Grand Concourse was modeled on Paris's Champs-Elysees, and it's lined with one of the best collections of Art Deco apartment houses anywhere.","q":"Grand Concourse Art Deco buildings"},{"k":"Culture","t":"The Bronx Museum of the Arts sits on the Concourse at 165th Street, showing contemporary art with a Bronx focus.","q":"Bronx Museum of the Arts"}],"North Riverdale":[{"k":"Landmark","t":"Fonthill, a little stone castle built around 1852 by actor Edwin Forrest, stands on the University of   const h = $('start-name'), h1 = $('start-title');
  let fs = 72; h1.style.fontSize = fs + 'px';
  requestAnimationFrame(() => { while (h.getBoundingClientRect().width > h1.parentElement.clientWidth && fs > 30) { fs -= 2; h1.style.fontSize = fs + 'px'; } });
}
$('go').onclick = () => { ac(); newRound(); };
document.fonts?.ready?.then(() => { if (screen === 'start') renderStart(); });

let attractT = null, attractLast = null;
function startAttract() {
  if (reduce) return;
  const step = () => {
    if (attractLast) { paths[attractLast].classList.remove('attract'); labels[attractLast].classList.remove('temp'); }
    const n = active[Math.floor(Math.random() * active.length)];
    paths[n].classList.add('attract'); labels[n].classList.add('temp'); attractLast = n;
  };
  attractT = setInterval(step, 1300); step();
}
function stopAttract() {
  clearInterval(attractT);
  if (attractLast) { paths[attractLast].classList.remove('attract'); labels[attractLast].classList.remove('temp'); attractLast = null; }
}

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (screen === 'start' && k === 'enter' && document.activeElement?.closest('#modes,#scopes') == null) { e.preventDefault(); ac(); newRound(); return; }
  if (screen === 'results' && k === 'enter') { e.preventDefault(); newRound(); return; }
  if (k === '=' || k === '+') return zoomBtn(1.6);
  if (k === '-') return zoomBtn(1 / 1.6);
  if ((k === 'f' || k === 'arrowright') && screen === 'play') { nextFact(); return; }
  if (screen !== 'play' || mode === 'study') { if (k === 'escape' && screen !== 'start') showScreen('start'); return; }
  if (k === 'escape') return showScreen('start');
  if (k === 'h') $('hint').click();
  else if (k === 's') $('skip').click();
  else if ((k === 'enter' || k === ' ') && st.answered && !$('next').hidden) { e.preventDefault(); advance(); }
  else if (mode === 'name' && /^[1-4]$/.test(k)) { const b = $('choices').children[+k - 1]; if (b && !b.disabled) b.click(); }
});

// ---------- boot ----------
function start(saved) {
  buildBoard(saved?.board || store('kyn-board') || APP.default || APP.boards[0].id);
  setScope(saved?.scope && C.scopes.some(s => s.id === saved.scope) ? saved.scope : C.scopes[0].id);
  if (saved?.mode) mode = saved.mode;
  if (saved?.st && saved.screen === 'play' && mode !== 'study' && saved.v === 3) { st = saved.st; showScreen('play'); }
  else showScreen('start');
  requestAnimationFrame(() => fit());
}
window.kynDebug = { focus: n => { const f = byName[n], a = availRect(); cam.x0 = f.x - (a.l + a.w / 2) / cam.s; cam.y0 = f.y - (a.t + a.h / 2) / cam.s; clampCam(); apply(); const p = toScreen(f.x, f.y), r = pane.getBoundingClientRect(); return { x: r.left + p.x, y: r.top + p.y }; }, cam };
window.claude?.hot?.snapshot?.(() => ({ v: 3, board: C.id, screen, mode, scope, st }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
