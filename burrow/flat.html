<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burrow — Flat View</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --emerald: #10b981;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  #map {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  .title-overlay { position: fixed; top: 16px; left: 16px; z-index: 1000; pointer-events: auto; }
  .title-overlay h1 { font-size: 22px; font-weight: 700; color: rgba(224,224,232,0.5); letter-spacing: -0.5px; }
  .title-overlay h1 span { color: var(--emerald); opacity: 0.6; }
  .title-overlay .nav-link {
    font-size: 11px; color: var(--text-dim); text-decoration: none; opacity: 0.6; transition: opacity 0.15s;
  }
  .title-overlay .nav-link:hover { opacity: 1; color: var(--emerald); }

  .stats-overlay {
    position: fixed; bottom: 24px; left: 16px; z-index: 1000;
    background: rgba(18,18,26,0.88); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; font-size: 12px; line-height: 1.6; backdrop-filter: blur(8px); min-width: 180px;
  }
  .stats-overlay .stat-label { color: var(--text-dim); }
  .stats-overlay .stat-val { color: var(--emerald); font-weight: 600; }
  .stats-overlay .stat-row { display: flex; justify-content: space-between; gap: 16px; }

  .coverage-overlay {
    position: fixed; bottom: 100px; right: 16px; z-index: 1000;
    background: rgba(18,18,26,0.88); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; text-align: center; backdrop-filter: blur(8px);
  }
  .coverage-overlay .pct { font-size: 28px; font-weight: 700; color: var(--emerald); line-height: 1; }
  .coverage-overlay .pct-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

  .config-panel {
    position: fixed; top: 16px; right: 16px; z-index: 1000;
    background: rgba(18,18,26,0.92); border: 1px solid var(--border); border-radius: 10px;
    backdrop-filter: blur(8px); overflow: hidden; width: 220px;
  }
  .config-toggle {
    padding: 10px 14px; font-size: 11px; color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    user-select: none; text-transform: uppercase; letter-spacing: 1px;
  }
  .config-toggle:hover { color: var(--text); }
  .config-toggle .arrow { transition: transform 0.2s; font-size: 10px; }
  .config-toggle .arrow.open { transform: rotate(180deg); }
  .config-body { display: none; padding: 0 14px 14px; }
  .config-body.open { display: block; }
  .config-row { margin-bottom: 10px; }
  .config-row label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .config-row label .cfg-val { color: var(--emerald); font-weight: 600; }
  .config-row input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none;
    height: 4px; background: var(--border); border-radius: 2px; outline: none;
  }
  .config-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%; background: var(--emerald); cursor: pointer;
  }

  .loading-overlay {
    position: fixed; inset: 0; z-index: 2000; background: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    transition: opacity 0.5s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-overlay .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--emerald); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  .loading-overlay .load-text { color: var(--text-dim); font-size: 13px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="load-text">Loading activity data...</div>
</div>

<div class="title-overlay">
  <h1>Bur<span>row</span></h1>
  <a class="nav-link" href="../index.html">Home</a>
  <a class="nav-link" href="3d.html" style="margin-left:12px">3D View</a>
</div>

<div class="stats-overlay" id="stats">
  <div class="stat-row"><span class="stat-label">Runs / Activities</span><span class="stat-val" id="stat-runs">—</span></div>
  <div class="stat-row"><span class="stat-label">Bike rides</span><span class="stat-val" id="stat-bikes">—</span></div>
  <div class="stat-row"><span class="stat-label">Subway trips</span><span class="stat-val" id="stat-subway">—</span></div>
  <div class="stat-row"><span class="stat-label">Uber rides</span><span class="stat-val" id="stat-uber">—</span></div>
  <div class="stat-row" style="border-top:1px solid var(--border);padding-top:6px;margin-top:4px"><span class="stat-label">Total routes</span><span class="stat-val" id="stat-total">—</span></div>
</div>

<div class="coverage-overlay" id="coverage">
  <div class="pct" id="coverage-pct">—%</div>
  <div class="pct-label">Manhattan explored</div>
</div>

<div class="config-panel">
  <div class="config-toggle" id="configToggle">
    <span>Settings</span>
    <span class="arrow" id="configArrow">▼</span>
  </div>
  <div class="config-body" id="configBody">
    <div class="config-row">
      <label>Trail radius <span class="cfg-val" id="trailRadiusVal">200m</span></label>
      <input type="range" id="trailRadius" min="50" max="500" value="200" step="10">
    </div>
    <div class="config-row">
      <label>Station radius <span class="cfg-val" id="stationRadiusVal">500m</span></label>
      <input type="range" id="stationRadius" min="100" max="1000" value="500" step="50">
    </div>
    <div class="config-row">
      <label>Fog opacity <span class="cfg-val" id="fogOpacityVal">0.85</span></label>
      <input type="range" id="fogOpacity" min="0.3" max="0.98" value="0.85" step="0.01">
    </div>
  </div>
</div>

<div id="map"></div>

<script>
(function() {
  'use strict';

  const cfg = { trailRadius: 200, stationRadius: 500, fogOpacity: 0.85 };

  const NYC_SW = [40.53, -74.15];
  const NYC_NE = [40.92, -73.58];
  const nycBounds = L.latLngBounds(NYC_SW, NYC_NE);
  const MAN_SW = [40.700, -74.020];
  const MAN_NE = [40.882, -73.907];
  const COVERAGE_CELL_M = 50;

  const map = L.map('map', {
    center: [40.735, -73.99], zoom: 13, minZoom: 12, maxZoom: 18,
    maxBounds: nycBounds, maxBoundsViscosity: 1.0, zoomControl: false
  });
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM &copy; CARTO', subdomains: 'abcd', maxZoom: 19
  }).addTo(map);

  const fogData = { trails: [], stations: [] };
  let stats = { runs: 0, bikes: 0, subway: 0, uber: 0 };

  function seededRandom(seed) {
    let s = Math.abs(seed) || 1;
    return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  }

  const FogLayer = L.Layer.extend({
    onAdd(map) {
      this._map = map;
      this._canvas = L.DomUtil.create('canvas', 'fog-canvas');
      this._canvas.style.position = 'absolute';
      this._canvas.style.top = '0';
      this._canvas.style.left = '0';
      this._canvas.style.pointerEvents = 'none';
      this._canvas.style.zIndex = '450';
      map.getPanes().overlayPane.appendChild(this._canvas);
      map.on('move zoom viewreset resize', this._redraw, this);
      this._redraw();
    },
    onRemove(map) {
      L.DomUtil.remove(this._canvas);
      map.off('move zoom viewreset resize', this._redraw, this);
    },
    _redraw() {
      const map = this._map;
      const size = map.getSize();
      const canvas = this._canvas;
      canvas.width = size.x;
      canvas.height = size.y;
      const topLeft = map.containerPointToLayerPoint([0, 0]);
      L.DomUtil.setPosition(canvas, topLeft);
      const ctx = canvas.getContext('2d');
      const zoom = map.getZoom();
      const lat = map.getCenter().lat;
      const metersPerPixel = 40075016.686 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom + 8);
      const trailRadiusPx = cfg.trailRadius / metersPerPixel;
      const stationRadiusPx = cfg.stationRadius / metersPerPixel;
      const sampleRate = zoom <= 12 ? 8 : zoom <= 13 ? 4 : zoom <= 14 ? 2 : 1;
      const bounds = map.getBounds();
      const pad = 0.02;
      const visS = bounds.getSouth() - pad, visN = bounds.getNorth() + pad;
      const visW = bounds.getWest() - pad, visE = bounds.getEast() + pad;

      // Build visited mask
      const maskCanvas = document.createElement('canvas');
      maskCanvas.width = size.x; maskCanvas.height = size.y;
      const mctx = maskCanvas.getContext('2d');
      mctx.strokeStyle = 'white'; mctx.lineCap = 'round'; mctx.lineJoin = 'round';
      mctx.lineWidth = trailRadiusPx * 2;
      for (const trail of fogData.trails) {
        const pts = trail.points;
        if (!pts.length) continue;
        mctx.beginPath();
        let started = false;
        for (let i = 0; i < pts.length; i += sampleRate) {
          const p = pts[i];
          if (p[0] < visS || p[0] > visN || p[1] < visW || p[1] > visE) { started = false; continue; }
          const px = map.latLngToContainerPoint(p);
          if (!started) { mctx.moveTo(px.x, px.y); started = true; } else mctx.lineTo(px.x, px.y);
        }
        mctx.stroke();
      }
      mctx.fillStyle = 'white';
      for (const st of fogData.stations) {
        if (st.lat < visS || st.lat > visN || st.lng < visW || st.lng > visE) continue;
        const px = map.latLngToContainerPoint([st.lat, st.lng]);
        mctx.beginPath(); mctx.arc(px.x, px.y, stationRadiusPx, 0, Math.PI * 2); mctx.fill();
      }
      const maskData = mctx.getImageData(0, 0, size.x, size.y).data;
      function isVisited(px, py) {
        if (px < 0 || py < 0 || px >= size.x || py >= size.y) return false;
        return maskData[(Math.floor(py) * size.x + Math.floor(px)) * 4] > 128;
      }
      function cellVisitedness(cx, cy, checkR) {
        let v = 0; const samples = 12;
        for (let s = 0; s < samples; s++) {
          const a = (s / samples) * Math.PI * 2;
          if (isVisited(cx + Math.cos(a) * checkR * 0.5, cy + Math.sin(a) * checkR * 0.5)) v++;
        }
        if (isVisited(cx, cy)) v += 4;
        return v / (samples + 4);
      }

      // Cloud drawing
      const geoStep = 0.005;
      function puff(px, py, pr, color, alpha) {
        ctx.globalAlpha = alpha; ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
      }
      function drawCloud(ctx, cx, cy, scale, opacity, seed) {
        const rng = seededRandom(seed);
        const shapeType = Math.floor(rng() * 5);
        let puffs = [];
        if (shapeType === 0) {
          const n = 7 + Math.floor(rng() * 4);
          for (let i = 0; i < n; i++) { const t = (i/(n-1))-0.5; puffs.push({ dx: t*scale*2.2+(rng()-0.5)*scale*0.3, dy: (rng()-0.5)*scale*0.4, r: scale*(0.35+rng()*0.3)*(1-Math.abs(t)*0.5) }); }
        } else if (shapeType === 1) {
          puffs.push({ dx: 0, dy: -scale*0.1, r: scale*(0.6+rng()*0.3) });
          const n = 6+Math.floor(rng()*3);
          for (let i = 0; i < n; i++) { const a=(i/n)*Math.PI*2+rng()*0.5, d=scale*(0.4+rng()*0.3); puffs.push({ dx: Math.cos(a)*d, dy: Math.sin(a)*d*0.7, r: scale*(0.25+rng()*0.25) }); }
        } else if (shapeType === 2) {
          const n = 4+Math.floor(rng()*3);
          for (let i = 0; i < n; i++) { const a=(i/n)*Math.PI*2+rng()*1.2, d=scale*(0.1+rng()*0.25); puffs.push({ dx: Math.cos(a)*d, dy: Math.sin(a)*d, r: scale*(0.35+rng()*0.2) }); }
        } else if (shapeType === 3) {
          const a=rng()*Math.PI*0.3-0.15, n=8+Math.floor(rng()*4);
          for (let i = 0; i < n; i++) { const t=(i/(n-1))-0.5; puffs.push({ dx: Math.cos(a)*t*scale*2.5+(rng()-0.5)*scale*0.15, dy: Math.sin(a)*t*scale*2.5+(rng()-0.5)*scale*0.25, r: scale*(0.2+rng()*0.15)*(1-Math.abs(t)*0.6) }); }
        } else {
          const n = 5+Math.floor(rng()*3);
          for (let i = 0; i < n; i++) { const a=rng()*Math.PI*2, d=scale*rng()*0.6; puffs.push({ dx: Math.cos(a)*d, dy: Math.sin(a)*d*0.8, r: scale*(0.3+rng()*0.4) }); }
        }
        const rot = rng()*Math.PI*2, cosR = Math.cos(rot), sinR = Math.sin(rot);
        for (const p of puffs) { const rx=p.dx*cosR-p.dy*sinR, ry=p.dx*sinR+p.dy*cosR; puff(cx+rx, cy+ry+p.r*0.18, p.r, '#b0b8c4', opacity*0.12); }
        for (const p of puffs) { const rx=p.dx*cosR-p.dy*sinR, ry=p.dx*sinR+p.dy*cosR; puff(cx+rx, cy+ry, p.r, '#ffffff', opacity*cfg.fogOpacity); }
        for (let i = 0; i < Math.min(3, puffs.length); i++) { const p=puffs[i], rx=p.dx*cosR-p.dy*sinR, ry=p.dx*sinR+p.dy*cosR; puff(cx+rx, cy+ry-p.r*0.25, p.r*0.7, '#eef2ff', opacity*0.25); }
        ctx.globalAlpha = 1;
      }

      const startLat = Math.floor((bounds.getSouth()-geoStep*2)/geoStep)*geoStep;
      const startLng = Math.floor((bounds.getWest()-geoStep*2)/geoStep)*geoStep;
      const endLat = bounds.getNorth()+geoStep*2, endLng = bounds.getEast()+geoStep*2;
      const cloudScale = Math.max(30, 500 / metersPerPixel);

      for (let glat = startLat; glat <= endLat; glat += geoStep) {
        const row = Math.round(glat/geoStep);
        const lngOffset = (row%2)*geoStep*0.5;
        for (let glng = startLng+lngOffset; glng <= endLng; glng += geoStep) {
          const px = map.latLngToContainerPoint([glat, glng]);
          const seed = Math.abs(Math.floor(glat*100000)*73856093 ^ Math.floor(glng*100000)*19349663);
          const jRng = seededRandom(seed+7);
          const jx = px.x+(jRng()-0.5)*cloudScale*1.2, jy = px.y+(jRng()-0.5)*cloudScale*1.2;
          const v = cellVisitedness(jx, jy, cloudScale);
          if (v > 0.6) continue;
          const opacity = Math.min(1, 1-v*1.3);
          if (opacity <= 0.05) continue;
          drawCloud(ctx, jx, jy, cloudScale*(0.7+jRng()*0.8), opacity, seed);
        }
      }
    },
    redraw() { this._redraw(); }
  });

  const fogLayer = new FogLayer();
  fogLayer.addTo(map);

  function computeCoverage() {
    const latStep = COVERAGE_CELL_M/111320, lngStep = COVERAGE_CELL_M/(111320*Math.cos(40.78*Math.PI/180));
    const rows = Math.ceil((MAN_NE[0]-MAN_SW[0])/latStep), cols = Math.ceil((MAN_NE[1]-MAN_SW[1])/lngStep);
    const visited = new Set();
    const trailCellR = Math.ceil(cfg.trailRadius/COVERAGE_CELL_M), stationCellR = Math.ceil(cfg.stationRadius/COVERAGE_CELL_M);
    function markCell(lat, lng, cellRadius) {
      const cr = Math.floor((lat-MAN_SW[0])/latStep), cc = Math.floor((lng-MAN_SW[1])/lngStep);
      for (let dr=-cellRadius; dr<=cellRadius; dr++) for (let dc=-cellRadius; dc<=cellRadius; dc++) {
        if (dr*dr+dc*dc>cellRadius*cellRadius) continue;
        const r=cr+dr, c=cc+dc;
        if (r>=0&&r<rows&&c>=0&&c<cols) visited.add(r*cols+c);
      }
    }
    for (const trail of fogData.trails) { const pts=trail.points; for (let i=0;i<pts.length;i+=5) { const p=pts[i]; if (p[0]>=MAN_SW[0]&&p[0]<=MAN_NE[0]&&p[1]>=MAN_SW[1]&&p[1]<=MAN_NE[1]) markCell(p[0],p[1],trailCellR); } }
    for (const st of fogData.stations) { if (st.lat>=MAN_SW[0]&&st.lat<=MAN_NE[0]&&st.lng>=MAN_SW[1]&&st.lng<=MAN_NE[1]) markCell(st.lat,st.lng,stationCellR); }
    document.getElementById('coverage-pct').textContent = (visited.size/(rows*cols)*100).toFixed(1)+'%';
  }

  async function loadAllData() {
    const [stravaData, citiRides, citiRoutes, subwayData, uberData] = await Promise.all([
      fetch('../strava/data/activities_enriched.json').then(r=>r.json()).catch(()=>[]),
      fetch('../citibike/data/rides_enriched.json').then(r=>r.json()).catch(()=>[]),
      fetch('../citibike/data/routes.json').then(r=>r.json()).catch(()=>({})),
      fetch('../subway/data/rides_enriched.json').then(r=>r.json()).catch(()=>({trips:[]})),
      fetch('../uber/data/rides_enriched.json').then(r=>r.json()).catch(()=>({rides:[]}))
    ]);
    let stravaCount=0;
    for (const a of stravaData) { if (a.latlng&&a.latlng.length>0) { fogData.trails.push({points:a.latlng}); stravaCount++; } }
    stats.runs=stravaCount;
    let bikeCount=0;
    for (const ride of citiRides) { const key=ride.startStation+'|'+ride.endStation, route=citiRoutes[key]; if (route&&route.coordinates&&route.coordinates.length>0) { fogData.trails.push({points:route.coordinates.map(c=>[c[1],c[0]])}); bikeCount++; } }
    stats.bikes=bikeCount;
    let subwayCount=0;
    for (const trip of (subwayData.trips||[])) { for (const leg of (trip.legs||[])) { if (leg.entryLat&&leg.entryLon) fogData.stations.push({lat:leg.entryLat,lng:leg.entryLon}); if (leg.exitLat&&leg.exitLon) fogData.stations.push({lat:leg.exitLat,lng:leg.exitLon}); } subwayCount++; }
    stats.subway=subwayCount;
    let uberCount=0;
    for (const ride of (uberData.rides||[])) { if (ride.city!=='New York City') continue; if (ride.startLat&&ride.startLon) fogData.stations.push({lat:ride.startLat,lng:ride.startLon}); if (ride.endLat&&ride.endLon) fogData.stations.push({lat:ride.endLat,lng:ride.endLon}); uberCount++; }
    stats.uber=uberCount;
    document.getElementById('stat-runs').textContent=stats.runs;
    document.getElementById('stat-bikes').textContent=stats.bikes;
    document.getElementById('stat-subway').textContent=stats.subway;
    document.getElementById('stat-uber').textContent=stats.uber;
    document.getElementById('stat-total').textContent=stats.runs+stats.bikes+stats.subway+stats.uber;
    fogLayer.redraw(); computeCoverage();
    document.getElementById('loading').classList.add('hidden');
  }

  document.getElementById('configToggle').addEventListener('click', () => {
    document.getElementById('configBody').classList.toggle('open');
    document.getElementById('configArrow').classList.toggle('open');
  });
  function bindSlider(id, configKey, suffix, transform) {
    const slider=document.getElementById(id), valEl=document.getElementById(id+'Val');
    slider.addEventListener('input', ()=>{ const v=transform?transform(slider.value):parseFloat(slider.value); cfg[configKey]=v; valEl.textContent=suffix==='m'?Math.round(v)+'m':v.toFixed(2); fogLayer.redraw(); computeCoverage(); });
  }
  bindSlider('trailRadius','trailRadius','m');
  bindSlider('stationRadius','stationRadius','m');
  bindSlider('fogOpacity','fogOpacity','',parseFloat);

  loadAllData();
})();
</script>
</body>
</html>
