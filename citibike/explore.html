<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HofBikes — Ride Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --green: #22c55e;
    --orange: #f59e0b;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: 380px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* Left panel */
  .sidebar {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    height: 100vh;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-header h1 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .sidebar-header h1 span { color: var(--accent); }
  .sidebar-header .back-link {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
  }
  .sidebar-header .back-link:hover { text-decoration: underline; }

  /* Filters */
  .filters {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .search-input {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-dim); }

  .filter-row {
    display: flex;
    gap: 6px;
  }
  .filter-btn {
    padding: 4px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .ride-count {
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 2px;
  }

  /* Ride list */
  .ride-list {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .ride-item {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }
  .ride-item:hover { background: rgba(59,130,246,0.05); }
  .ride-item.active { background: rgba(59,130,246,0.1); border-left: 3px solid var(--accent); }

  .ride-item .ride-date {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  .ride-item .ride-stations {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
  }
  .ride-item .ride-arrow {
    color: var(--accent);
    margin: 0 4px;
  }
  .ride-item .ride-meta {
    display: flex;
    gap: 12px;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .ride-item .ride-meta .tag {
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
  }
  .tag-ebike { background: rgba(59,130,246,0.2); color: var(--accent); }
  .tag-classic { background: rgba(34,197,94,0.2); color: var(--green); }

  /* Right panel — map */
  .map-panel {
    position: relative;
    height: 100vh;
  }
  #rideMap { height: 100%; width: 100%; }

  .ride-detail-overlay {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 1000;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    min-width: 260px;
    display: none;
  }
  .ride-detail-overlay.visible { display: block; }

  .ride-detail-overlay h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .detail-label { color: var(--text-dim); }
  .detail-row .detail-value { font-weight: 500; }

  .all-routes-hint {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .leaflet-container { background: #0a0a0f; }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) saturate(0.35) brightness(0.8) contrast(1.05); }


  .sort-row {
    display: flex;
    gap: 6px;
    padding-top: 6px;
  }
  .sort-btn {
    padding: 4px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    flex: 1;
    text-align: center;
  }
  .sort-btn:hover { border-color: var(--accent); color: var(--text); }
  .sort-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .station-popup { text-align: center; }
  .station-popup b { font-size: 13px; }

  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; height: 100dvh; }
    .sidebar { height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
    .map-panel { height: auto; }
    .ride-detail-overlay { top: auto; bottom: 12px; right: 12px; left: 12px; min-width: unset; }
    .all-routes-hint { display: none; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>Hof<span>Bikes</span></h1>
    <a href="../index.html" class="back-link">Home</a>
      <a href="index.html" class="back-link">Dashboard</a>
  </div>

  <div class="filters">
    <input type="text" class="search-input" id="searchInput" placeholder="Search stations...">
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="ebike">Ebike</button>
      <button class="filter-btn" data-filter="classic">Classic</button>
    </div>
    <div class="filter-row">
      <button class="filter-btn" data-filter="weekday">Weekday</button>
      <button class="filter-btn" data-filter="weekend">Weekend</button>
    </div>
    <div class="sort-row">
      <button class="sort-btn active" data-sort="date">Recent</button>
      <button class="sort-btn" data-sort="longest">Longest</button>
      <button class="sort-btn" data-sort="fastest">Fastest</button>
    </div>
    <div class="ride-count" id="rideCount"></div>
  </div>

  <div class="ride-list" id="rideList"></div>
</div>

<div class="map-panel">
  <div id="rideMap"></div>
  <div class="ride-detail-overlay" id="rideDetail"></div>
  <div class="all-routes-hint" id="mapHint">Click a ride to see its route</div>
</div>

// ============================================================
// STATE
// ============================================================
let activeFilters = new Set(['all']);
let searchQuery = '';
let selectedRideId = null;
let sortMode = "date";

// ============================================================
// MAP SETUP
// ============================================================
const map = L.map('rideMap', {
  zoomControl: false,
  attributionControl: false
}).setView([40.735, -73.99], 14);

L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// Layers
let activeRouteLayer = L.layerGroup().addTo(map);
let markersLayer = L.layerGroup().addTo(map);

// ============================================================
// SELECT A RIDE
// ============================================================
let rideAnimFrame = null;
function stopRideAnim() {
  if (rideAnimFrame) { cancelAnimationFrame(rideAnimFrame); rideAnimFrame = null; }
}

function selectRide(ride) {
  stopRideAnim();
  selectedRideId = ride.rideId;
  activeRouteLayer.clearLayers();
  markersLayer.clearLayers();

  const routeKey = `${ride.startStation}|${ride.endStation}`;
  const route = ROUTES[routeKey];
  const rideColor = ride.isEbike ? '#3b82f6' : '#22c55e';

  if (route) {
    const rawCoords = route.coordinates.map(c => [c[1], c[0]]);

    // Interpolate so point spacing is even (fixes bridge teleport where OSRM has sparse points)
    function interpolateEvenly(pts, targetCount) {
      if (pts.length < 2) return pts;
      // Compute cumulative distances
      const dists = [0];
      for (let i = 1; i < pts.length; i++) {
        const dlat = pts[i][0] - pts[i-1][0], dlon = pts[i][1] - pts[i-1][1];
        dists.push(dists[i-1] + Math.sqrt(dlat*dlat + dlon*dlon));
      }
      const totalDist = dists[dists.length - 1];
      if (totalDist === 0) return pts;
      const result = [pts[0]];
      let seg = 0;
      for (let j = 1; j < targetCount; j++) {
        const d = (j / targetCount) * totalDist;
        while (seg < dists.length - 2 && dists[seg+1] < d) seg++;
        const segLen = dists[seg+1] - dists[seg];
        const t = segLen > 0 ? (d - dists[seg]) / segLen : 0;
        result.push([
          pts[seg][0] + (pts[seg+1][0] - pts[seg][0]) * t,
          pts[seg][1] + (pts[seg+1][1] - pts[seg][1]) * t
        ]);
      }
      result.push(pts[pts.length - 1]);
      return result;
    }
    const coords = interpolateEvenly(rawCoords, 300);

    // Fit map first, then animate after zoom completes
    map.fitBounds(L.latLngBounds(coords).pad(0.15), { maxZoom: 15 });

    function startAnimation() {
      // Start marker
      L.circleMarker(coords[0], {
        radius: 8, fillColor: '#22c55e', fillOpacity: 1, color: '#fff', weight: 2
      }).bindPopup(`<div class="station-popup"><b>Start</b><br>${ride.startStation}</div>`).addTo(markersLayer);

      // Runner dot
      const runner = L.circleMarker(coords[0], {
        radius: 6, color: '#fff', fillColor: rideColor, fillOpacity: 1, weight: 2,
      }).addTo(markersLayer);

      // Animated trail
      const trail = L.polyline([], {
        color: rideColor, weight: 4, opacity: 0.9, lineCap: 'round', lineJoin: 'round'
      }).addTo(activeRouteLayer);

      // Glow trail
      const glowTrail = L.polyline([], {
        color: rideColor, weight: 10, opacity: 0.15,
      }).addTo(activeRouteLayer);

      // Fixed animation duration so all routes feel consistent regardless of zoom
      const targetSeconds = 3;
      const targetFrames = targetSeconds * 60;
      const baseRate = Math.max(1, Math.ceil(coords.length / targetFrames));

      let idx = 0;
      const totalPoints = coords.length;

      function step() {
        const end = Math.min(idx + baseRate, totalPoints);
        for (let i = idx; i < end; i++) {
          trail.addLatLng(coords[i]);
          glowTrail.addLatLng(coords[i]);
        }
        idx = end;
        const pos = coords[idx - 1];
        runner.setLatLng(pos);

        if (idx < totalPoints) {
          rideAnimFrame = requestAnimationFrame(step);
        } else {
          // Done — end marker, remove runner
          markersLayer.removeLayer(runner);
          L.circleMarker(coords[coords.length - 1], {
            radius: 8, fillColor: '#ef4444', fillOpacity: 1, color: '#fff', weight: 2
          }).bindPopup(`<div class="station-popup"><b>End</b><br>${ride.endStation}</div>`).addTo(markersLayer);
        }
      }
      rideAnimFrame = requestAnimationFrame(step);
    }

    // Wait for zoom to finish before starting animation
    let animStarted = false;
    function startOnce() {
      if (animStarted) return;
      animStarted = true;
      map.off('moveend', startOnce);
      startAnimation();
    }
    map.once('moveend', startOnce);
    setTimeout(startOnce, 300);

  } else {
    // Fallback to straight line
    if (ride.startLat && ride.endLat) {
      const coords = [[ride.startLat, ride.startLon], [ride.endLat, ride.endLon]];
      L.polyline(coords, { color: '#3b82f6', weight: 3, opacity: 0.8, dashArray: '8,8' }).addTo(activeRouteLayer);
      map.fitBounds(coords, { padding: [80, 80], maxZoom: 15 });
    }
  }

  // Detail overlay
  const dt = new Date(ride.startTime);
  const distKm = route ? (route.distance_m / 1000).toFixed(1) : '—';
  const distMi = route ? (route.distance_m / 1609.34).toFixed(1) : '—';

  const detail = document.getElementById('rideDetail');
  detail.classList.add('visible');
  detail.innerHTML = `
    <h3>${dt.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' })}</h3>
    <div class="detail-row"><span class="detail-label">Time</span><span class="detail-value">${dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span></div>
    <div class="detail-row"><span class="detail-label">From</span><span class="detail-value">${ride.startStation}</span></div>
    <div class="detail-row"><span class="detail-label">To</span><span class="detail-value">${ride.endStation}</span></div>
    <div class="detail-row"><span class="detail-label">Duration</span><span class="detail-value">${ride.durationMin.toFixed(0)} min</span></div>
    <div class="detail-row"><span class="detail-label">Distance</span><span class="detail-value">${distMi} mi (${distKm} km)</span></div>
    <div class="detail-row"><span class="detail-label">Cost</span><span class="detail-value">${ride.price > 0 ? '$' + ride.price.toFixed(2) : 'Free'}</span></div>
    <div class="detail-row"><span class="detail-label">Bike</span><span class="detail-value">${ride.bikeName} ${ride.isEbike ? '(ebike)' : '(classic)'}</span></div>
  `;

  document.getElementById('mapHint').style.display = 'none';

  // Update active state in list
  document.querySelectorAll('.ride-item').forEach(el => {
    el.classList.toggle('active', el.dataset.rideId === ride.rideId);
  });
}

// ============================================================
// FILTERS
// ============================================================
function getFilteredRides() {
  return RIDES.filter(r => {
    // Search
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!r.startStation.toLowerCase().includes(q) && !r.endStation.toLowerCase().includes(q)) return false;
    }

    // Type filter
    if (activeFilters.has('ebike') && !r.isEbike) return false;
    if (activeFilters.has('classic') && r.isEbike) return false;

    // Day filter
    if (activeFilters.has('weekday') && ['Saturday', 'Sunday'].includes(r.dayOfWeek)) return false;
    if (activeFilters.has('weekend') && !['Saturday', 'Sunday'].includes(r.dayOfWeek)) return false;

    return true;
  });
}

function renderRideList() {
  const filtered = getFilteredRides();

  // Sort
  if (sortMode === "longest") {
    filtered.sort((a, b) => {
      const rA = ROUTES[`${a.startStation}|${a.endStation}`];
      const rB = ROUTES[`${b.startStation}|${b.endStation}`];
      return (rB ? rB.distance_m : 0) - (rA ? rA.distance_m : 0);
    });
  } else if (sortMode === "fastest") {
    filtered.sort((a, b) => {
      const rA = ROUTES[`${a.startStation}|${a.endStation}`];
      const rB = ROUTES[`${b.startStation}|${b.endStation}`];
      const speedA = rA && a.durationMin > 0 ? rA.distance_m / (a.durationMin * 60) : 0;
      const speedB = rB && b.durationMin > 0 ? rB.distance_m / (b.durationMin * 60) : 0;
      return speedB - speedA;
    });
  } else {
    filtered.sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
  }
  document.getElementById('rideCount').textContent = `${filtered.length} rides`;

  const container = document.getElementById('rideList');
  container.innerHTML = filtered.map(r => {
    const dt = new Date(r.startTime);
    const dateStr = dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const timeStr = dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const tag = r.isEbike
      ? '<span class="tag tag-ebike">EBIKE</span>'
      : '<span class="tag tag-classic">CLASSIC</span>';

    return `
      <div class="ride-item ${r.rideId === selectedRideId ? 'active' : ''}" data-ride-id="${r.rideId}" onclick="selectRide(RIDES.find(x=>x.rideId==='${r.rideId}'))">
        <div class="ride-date">
          <span>${dateStr}</span>
          <span>${timeStr}</span>
        </div>
        <div class="ride-stations">
          ${r.startStation} <span class="ride-arrow">&rarr;</span> ${r.endStation}
        </div>
        <div class="ride-meta">
          ${tag}
          <span>${r.durationMin.toFixed(0)} min</span>
          <span>${r.price > 0 ? '$' + r.price.toFixed(2) : 'Free'}</span>
        </div>
      </div>
    `;
  }).join('');
}

// ============================================================
// EVENT HANDLERS
// ============================================================
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderRideList();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const filter = btn.dataset.filter;

    if (filter === 'all') {
      activeFilters = new Set(['all']);
    } else {
      activeFilters.delete('all');

      // Toggle within groups
      if (['ebike', 'classic'].includes(filter)) {
        if (activeFilters.has(filter)) { activeFilters.delete(filter); }
        else { activeFilters.delete(filter === 'ebike' ? 'classic' : 'ebike'); activeFilters.add(filter); }
      }
      if (['weekday', 'weekend'].includes(filter)) {
        if (activeFilters.has(filter)) { activeFilters.delete(filter); }
        else { activeFilters.delete(filter === 'weekday' ? 'weekend' : 'weekday'); activeFilters.add(filter); }
      }

      if (activeFilters.size === 0) activeFilters = new Set(['all']);
    }

    // Update button states
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', activeFilters.has(b.dataset.filter));
    });

    renderRideList();
  });
});

// Sort buttons
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sortMode = btn.dataset.sort;
    renderRideList();
  });
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  const filtered = getFilteredRides();
  if (!filtered.length) return;

  const currentIdx = filtered.findIndex(r => r.rideId === selectedRideId);

  if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    const next = Math.min(currentIdx + 1, filtered.length - 1);
    selectRide(filtered[next]);
    document.querySelector('.ride-item.active')?.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    const prev = Math.max(currentIdx - 1, 0);
    selectRide(filtered[prev]);
    document.querySelector('.ride-item.active')?.scrollIntoView({ block: 'nearest' });
  }
});

// ============================================================
// INIT
// ============================================================
renderRideList();

// Select first ride
if (RIDES.length > 0) {
  selectRide(RIDES[0]);
}
</script>
</body>
