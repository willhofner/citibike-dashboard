<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HofSubways — Ride Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --accent: #eab308;
    --accent2: #fbbf24;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: 380px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* Left panel */
  .sidebar {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    height: 100vh;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-header h1 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .sidebar-header h1 span { color: var(--accent); }
  .sidebar-header .nav-links {
    display: flex;
    gap: 12px;
  }
  .sidebar-header .back-link {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
  }
  .sidebar-header .back-link:hover { text-decoration: underline; }

  /* Filters */
  .filters {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .search-input {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-dim); }

  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    padding: 4px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  /* MTA bullet filter buttons */
  .line-filter-btn {
    cursor: pointer;
    border: 2px solid transparent;
    border-radius: 50%;
    padding: 1px;
    transition: all 0.15s;
    opacity: 1;
  }
  .line-filter-btn:hover { border-color: rgba(255,255,255,0.4); }
  .line-filter-btn.active { border-color: #fff; }
  .line-filter-btn.dimmed { opacity: 0.3; }

  .ride-count {
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 2px;
  }

  /* Ride list */
  .ride-list {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .ride-item {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .ride-item:hover { background: rgba(234,179,8,0.05); }
  .ride-item.active { background: rgba(234,179,8,0.1); border-left: 3px solid var(--accent); }

  .ride-item .ride-bullets {
    flex-shrink: 0;
    width: 38px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: center;
    justify-content: center;
  }

  .ride-item .ride-content {
    flex: 1;
    min-width: 0;
  }

  .ride-item .ride-date {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  .ride-item .ride-stations {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
  }
  .ride-item .ride-arrow {
    color: var(--accent);
    margin: 0 4px;
  }
  .ride-item .ride-duration {
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-dim);
  }

  /* MTA subway line bullets */
  .mta-bullet {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    flex-shrink: 0;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .mta-bullet.lg { width: 26px; height: 26px; font-size: 15px; }
  .mta-bullet.xl { width: 34px; height: 34px; font-size: 20px; }
  .mta-bullets { display: inline-flex; gap: 3px; align-items: center; }
  .mta-bullets.vertical { flex-direction: column; }
  .subway-emoji { font-size: 16px; }
  .subway-emoji.lg { font-size: 20px; }
  /* Lex Ave (green) */
  .mta-4, .mta-5, .mta-6 { background: #00933c; color: #fff; }
  /* Broadway (yellow) */
  .mta-N, .mta-Q, .mta-R, .mta-W { background: #fccc0a; color: #000; }
  /* 6th Ave (orange) */
  .mta-B, .mta-D, .mta-F, .mta-M { background: #ff6319; color: #fff; }
  /* 8th Ave (blue) */
  .mta-A, .mta-C, .mta-E { background: #0039a6; color: #fff; }
  /* Broadway-7th (red) */
  .mta-1, .mta-2, .mta-3 { background: #ee352e; color: #fff; }
  /* Canarsie (gray) */
  .mta-L { background: #a7a9ac; color: #fff; }
  /* Flushing (purple) */
  .mta-7 { background: #b933ad; color: #fff; }
  /* Nassau (brown) */
  .mta-J, .mta-Z { background: #996633; color: #fff; }
  /* Shuttle (gray) */
  .mta-S { background: #808183; color: #fff; }
  /* Crosstown (light green) */
  .mta-G { background: #6cbe45; color: #fff; }

  /* Right panel -- map */
  .map-panel {
    position: relative;
    height: 100vh;
  }
  #rideMap { height: 100%; width: 100%; }
  .leaflet-tile-pane { filter: saturate(0.5) brightness(1.5) contrast(1.05); }

  .ride-detail-overlay {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 1000;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    min-width: 280px;
    max-width: 340px;
    display: none;
  }
  .ride-detail-overlay.visible { display: block; }

  .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .detail-header h3 {
    font-size: 14px;
    font-weight: 600;
  }

  .leg-card {
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .leg-card:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .leg-card .leg-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .leg-card .leg-route {
    font-size: 13px;
    font-weight: 500;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
  }
  .detail-row .detail-label { color: var(--text-dim); }
  .detail-row .detail-value { font-weight: 500; text-align: right; max-width: 180px; }

  .all-routes-hint {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text-dim);
    pointer-events: none;
  }

  .rider-glow {
    animation: rider-pulse 1s ease-in-out infinite;
  }
  @keyframes rider-pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.6; }
  }

  .sort-row {
    display: flex;
    gap: 6px;
  }
  .sort-btn {
    padding: 4px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sort-btn:hover { border-color: var(--accent); color: var(--text); }
  .sort-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .no-rides {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; height: 100dvh; }
    .sidebar { height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
    .map-panel { height: auto; }
    .ride-detail-overlay { top: auto; bottom: 12px; right: 12px; left: 12px; min-width: unset; max-width: unset; }
    .all-routes-hint { display: none; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>Hof<span>Subways</span></h1>
    <div class="nav-links">
      <a href="../index.html" class="back-link">Home</a>
      <a href="dashboard.html" class="back-link">Dashboard</a>
    </div>
  </div>

  <div class="filters">
    <input type="text" class="search-input" id="searchInput" placeholder="Search stations...">

    <div class="filter-row" id="lineFilter">
      <span class="line-filter-btn active" data-line="all"><span class="mta-bullet lg" style="background:#888;color:#fff;">All</span></span>
      <span class="line-filter-btn" data-line="6"><span class="mta-bullet lg mta-6">6</span></span>
      <span class="line-filter-btn" data-line="4"><span class="mta-bullet lg mta-4">4</span></span>
      <span class="line-filter-btn" data-line="5"><span class="mta-bullet lg mta-5">5</span></span>
      <span class="line-filter-btn" data-line="R"><span class="mta-bullet lg mta-R">R</span></span>
      <span class="line-filter-btn" data-line="W"><span class="mta-bullet lg mta-W">W</span></span>
    </div>

    <div class="sort-row" id="sortRow">
      <button class="sort-btn active" data-sort="recent">Recent</button>
      <button class="sort-btn" data-sort="longest">Longest</button>
    </div>

    <div class="ride-count" id="rideCount">Loading...</div>
  </div>

  <div class="ride-list" id="rideList"></div>
</div>

<div class="map-panel">
  <div id="rideMap"></div>

  <div class="ride-detail-overlay" id="detailOverlay">
    <div id="detailContent"></div>
  </div>

  <div class="all-routes-hint" id="allRoutesHint">
    Loading...
  </div>
</div>

<script>
let TRIPS = [];
let STATIONS = {};
let selectedTripId = null;
let ghostLayer = null;
let routeLayers = [];
let stationMarkers = [];
let animFrame = null;

// Filters state
let lineFilter = 'all';  // 'all', '6', '4', '5', 'R', 'W'
let sortMode = 'recent';
let searchQuery = '';

// Init map
const map = L.map('rideMap', {
  center: [40.7350, -73.990],
  zoom: 13,
  zoomControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// Load data
fetch('data/rides_enriched.json')
  .then(r => r.json())
  .then(data => {
    TRIPS = data.trips;
    STATIONS = data.stations || {};
    document.getElementById('allRoutesHint').textContent =
      `${Object.keys(STATIONS).length} stations across ${TRIPS.length} trips — click a trip to view route`;
    renderGhostLayer();
    renderList();
    if (TRIPS.length > 0) selectTrip(TRIPS[0]);
  })
  .catch(err => {
    console.error('Failed to load data:', err);
    document.getElementById('rideList').innerHTML = '<div class="no-rides">Failed to load ride data</div>';
  });

// Ghost layer: all station dots
function renderGhostLayer() {
  if (ghostLayer) map.removeLayer(ghostLayer);
  ghostLayer = L.layerGroup();
  Object.entries(STATIONS).forEach(([name, s]) => {
    L.circleMarker([s.lat, s.lon], {
      radius: 4,
      fillColor: '#eab308',
      fillOpacity: 0.2,
      stroke: true,
      color: '#eab308',
      weight: 1,
      opacity: 0.15
    }).bindTooltip(displayStation(name), { permanent: false, direction: 'top', className: 'station-tooltip' })
     .addTo(ghostLayer);
  });
  ghostLayer.addTo(map);
}

// Strip line suffixes from station names for display: "Canal St (6)" → "Canal St"
function displayStation(name) {
  return name.replace(/\s*\([^)]*\)$/, '');
}

// Render MTA bullet circles for a line string like "6" or "4/5" or "R/W"
// size: 'xl' single-line selector, 'lg' multi-line selector / detail, default for inline
// layout: 'vertical' stacks them, default is horizontal
function mtaBullets(lineStr, size, layout) {
  const lines = lineStr.split('/').filter(l => l && l !== 'unknown');
  if (lines.length === 0) return `<span style="color:var(--text-dim)">${lineStr}</span>`;
  const cls = size || '';
  const dir = layout === 'vertical' ? 'vertical' : '';
  return `<span class="mta-bullets ${dir}">` +
    lines.map(l => `<span class="mta-bullet ${cls} mta-${l}">${l}</span>`).join('') +
    '</span>';
}

// Get line color
function lineColor(line) {
  if (line === '6') return '#00933c';           // MTA green
  if (line === '4/5' || line === '4/5/6') return '#00933c';
  if (line === 'R/W' || line === 'N/Q/R/W') return '#fccc0a';  // MTA yellow
  return '#eab308';
}

// Filter + sort trips
function getFilteredTrips() {
  let filtered = TRIPS.filter(t => {
    // Line filter — individual line (4 and 5 both match 4/5 trips)
    if (lineFilter !== 'all') {
      const tripLineStr = t.legs.map(l => l.line).join('/');
      if (!tripLineStr.includes(lineFilter)) return false;
    }
    // Search
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const searchable = `${t.entryStation} ${t.exitStation} ${t.line} ${t.legs.map(l => l.entryStation + ' ' + l.exitStation).join(' ')}`.toLowerCase();
      if (!searchable.includes(q)) return false;
    }
    return true;
  });

  if (sortMode === 'recent') filtered.sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
  else if (sortMode === 'longest') filtered.sort((a, b) => b.durationMin - a.durationMin);

  return filtered;
}

// Format helpers
function formatDate(dt) {
  const d = new Date(dt);
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function formatTime(dt) {
  const d = new Date(dt);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function formatDuration(min) {
  if (min < 1) return '<1 min';
  if (min < 60) return `${Math.round(min)} min`;
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  return `${h}h ${m}m`;
}

// Build route coordinates from station sequence for a leg
function legRouteCoords(leg) {
  const coords = [];
  // Entry station
  coords.push([leg.entryLat, leg.entryLon]);
  // Intermediate stations (skip duplicates of entry/exit)
  if (leg.intermediateStations) {
    leg.intermediateStations.forEach(s => {
      const last = coords[coords.length - 1];
      const dist = Math.abs(s.lat - last[0]) + Math.abs(s.lon - last[1]);
      if (dist > 0.0005) { // skip if too close to previous point
        coords.push([s.lat, s.lon]);
      }
    });
  }
  // Exit station
  const last = coords[coords.length - 1];
  const exitDist = Math.abs(leg.exitLat - last[0]) + Math.abs(leg.exitLon - last[1]);
  if (exitDist > 0.0005) {
    coords.push([leg.exitLat, leg.exitLon]);
  }
  return coords;
}

// Render ride list
function renderList() {
  const filtered = getFilteredTrips();
  const container = document.getElementById('rideList');
  document.getElementById('rideCount').textContent = `${filtered.length} trip${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-rides">No trips match your filters</div>';
    return;
  }

  container.innerHTML = filtered.map(t => {
    const from = displayStation(t.entryStation);
    const to = displayStation(t.exitStation);
    const lineCount = t.line.split('/').filter(l => l && l !== 'unknown').length;
    const bulletSize = lineCount === 1 ? 'xl' : 'lg';
    const bulletLayout = lineCount > 1 ? 'vertical' : '';

    return `
      <div class="ride-item ${t.id === selectedTripId ? 'active' : ''}" data-trip-id="${t.id}" onclick="selectTrip(TRIPS.find(x=>x.id===${t.id}))">
        <div class="ride-bullets">${mtaBullets(t.line, bulletSize, bulletLayout)}</div>
        <div class="ride-content">
          <div class="ride-date">
            <span>${formatDate(t.startTime)}</span>
            <span>${formatTime(t.startTime)}</span>
          </div>
          <div class="ride-stations">${from} <span class="subway-emoji">🚇</span> ${to}</div>
          <div class="ride-duration">${formatDuration(t.durationMin)}</div>
        </div>
      </div>
    `;
  }).join('');
}

// Stop any running animation
function stopAnimation() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
}

// Clear route layers
function clearActiveRoute() {
  stopAnimation();
  routeLayers.forEach(l => map.removeLayer(l));
  routeLayers = [];
  stationMarkers.forEach(m => map.removeLayer(m));
  stationMarkers = [];
}

// Select a trip
function selectTrip(trip) {
  if (!trip) return;
  selectedTripId = trip.id;

  // Update active state in list
  document.querySelectorAll('.ride-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.tripId) === trip.id);
  });

  // Scroll active into view
  const activeEl = document.querySelector('.ride-item.active');
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  // Clear previous route
  clearActiveRoute();

  // Build all coordinates for all legs
  const allCoords = [];
  const legCoordSets = [];

  trip.legs.forEach(leg => {
    const coords = legRouteCoords(leg);
    legCoordSets.push({ coords, leg });
    allCoords.push(...coords);
  });

  if (allCoords.length < 2) return;

  // Fit map to route bounds, then start animation after zoom completes.
  // If fitBounds doesn't change the view, moveend won't fire — use a fallback timer.
  const bounds = L.latLngBounds(allCoords).pad(0.2);
  const currentBounds = map.getBounds();
  const needsMove = !currentBounds.equals(bounds);
  map.fitBounds(bounds, { maxZoom: 15 });

  function startAnimation() {
    // Flatten all leg coords into one sequence for continuous animation
    const flatCoords = [];
    const legColors = [];
    legCoordSets.forEach(({ coords, leg }) => {
      const color = lineColor(leg.line);
      coords.forEach(c => {
        flatCoords.push(c);
        legColors.push(color);
      });
    });

    // Draw station dots for each leg
    legCoordSets.forEach(({ coords, leg }) => {
      const color = lineColor(leg.line);
      if (leg.intermediateStations) {
        leg.intermediateStations.forEach(s => {
          const marker = L.circleMarker([s.lat, s.lon], {
            radius: 4,
            fillColor: '#fff',
            fillOpacity: 0.6,
            color: color,
            weight: 2,
            opacity: 0.8
          }).bindTooltip(displayStation(s.station), { permanent: false, direction: 'top' }).addTo(map);
          stationMarkers.push(marker);
        });
      }

      // Glow trail (drawn immediately as faint guide)
      const glowTrail = L.polyline(coords, {
        color: color,
        weight: 12,
        opacity: 0.08
      }).addTo(map);
      routeLayers.push(glowTrail);
    });

    // Animated trail + rider dot
    const trail = L.polyline([], {
      color: legColors[0],
      weight: 4,
      opacity: 0.9
    }).addTo(map);
    routeLayers.push(trail);

    const glowTrail = L.polyline([], {
      color: legColors[0],
      weight: 10,
      opacity: 0.15
    }).addTo(map);
    routeLayers.push(glowTrail);

    // Rider glow
    const riderGlow = L.circleMarker(flatCoords[0], {
      radius: 14, color: legColors[0], fillColor: legColors[0],
      fillOpacity: 0.3, weight: 0, className: 'rider-glow'
    }).addTo(map);
    stationMarkers.push(riderGlow);

    // Rider dot
    const rider = L.circleMarker(flatCoords[0], {
      radius: 6, color: '#fff', fillColor: legColors[0],
      fillOpacity: 1, weight: 2
    }).addTo(map);
    stationMarkers.push(rider);

    // Interpolate extra points between stations for smooth animation
    function interpolateCoords(coords, pointsPerSegment) {
      if (coords.length < 2) return coords;
      const result = [coords[0]];
      for (let i = 1; i < coords.length; i++) {
        const [lat1, lon1] = coords[i - 1];
        const [lat2, lon2] = coords[i];
        for (let j = 1; j <= pointsPerSegment; j++) {
          const t = j / pointsPerSegment;
          result.push([lat1 + (lat2 - lat1) * t, lon1 + (lon2 - lon1) * t]);
        }
      }
      return result;
    }

    const smoothCoords = interpolateCoords(flatCoords, 30);
    const totalFrames = smoothCoords.length;
    let frameIdx = 0;

    function animStep() {
      const batchSize = Math.max(1, Math.ceil(totalFrames / 120)); // ~2 seconds total
      const end = Math.min(frameIdx + batchSize, totalFrames);

      for (let i = frameIdx; i < end; i++) {
        trail.addLatLng(smoothCoords[i]);
        glowTrail.addLatLng(smoothCoords[i]);
      }
      frameIdx = end;

      const pos = smoothCoords[frameIdx - 1];
      rider.setLatLng(pos);
      riderGlow.setLatLng(pos);

      // Update color if we've crossed into a new leg
      const origIdx = Math.min(Math.floor((frameIdx / totalFrames) * flatCoords.length), flatCoords.length - 1);
      const currentColor = legColors[origIdx];
      rider.setStyle({ fillColor: currentColor });
      riderGlow.setStyle({ color: currentColor, fillColor: currentColor });

      if (frameIdx < totalFrames) {
        animFrame = requestAnimationFrame(animStep);
      } else {
        // Done — remove rider, keep trail
        map.removeLayer(rider);
        map.removeLayer(riderGlow);
      }
    }

    animFrame = requestAnimationFrame(animStep);
  }

  // Wait for zoom/pan to finish before starting route animation.
  // Fallback: if no move needed, start immediately.
  let animStarted = false;
  function startOnce() {
    if (animStarted) return;
    animStarted = true;
    map.off('moveend', startOnce);
    startAnimation();
  }
  map.once('moveend', startOnce);
  // Fallback in case fitBounds didn't change the view (moveend won't fire)
  setTimeout(startOnce, 300);

  // Entry marker (green) on first leg
  const firstLeg = trip.legs[0];
  const entryMarker = L.circleMarker([firstLeg.entryLat, firstLeg.entryLon], {
    radius: 8, fillColor: '#22c55e', fillOpacity: 1, color: '#22c55e', weight: 2, opacity: 0.5
  }).bindTooltip(displayStation(firstLeg.entryStation), { permanent: false, direction: 'top' }).addTo(map);
  stationMarkers.push(entryMarker);

  // Exit marker (red) on last leg
  const lastLeg = trip.legs[trip.legs.length - 1];
  const exitMarker = L.circleMarker([lastLeg.exitLat, lastLeg.exitLon], {
    radius: 8, fillColor: '#ef4444', fillOpacity: 1, color: '#ef4444', weight: 2, opacity: 0.5
  }).bindTooltip(displayStation(lastLeg.exitStation), { permanent: false, direction: 'top' }).addTo(map);
  stationMarkers.push(exitMarker);

  // Transfer markers (yellow diamond)
  if (trip.transferStations && trip.transferStations.length > 0) {
    trip.transferStations.forEach(name => {
      const s = STATIONS[name];
      if (s) {
        const marker = L.circleMarker([s.lat, s.lon], {
          radius: 7, fillColor: '#eab308', fillOpacity: 1, color: '#eab308', weight: 2, opacity: 0.6
        }).bindTooltip('Transfer: ' + displayStation(name), { permanent: false, direction: 'top' }).addTo(map);
        stationMarkers.push(marker);
      }
    });
  }

  // Update detail overlay — one card per leg
  const overlay = document.getElementById('detailOverlay');
  const content = document.getElementById('detailContent');

  let html = '';

  trip.legs.forEach((leg, i) => {
    const legStart = formatTime(leg.startTime);
    const legEnd = formatTime(leg.endTime);
    const legDate = formatDate(leg.startTime);

    html += `<div class="leg-card">
      <div class="leg-header">
        <div>
          <div style="font-size:14px;font-weight:600;">${legDate}</div>
          <div style="font-size:12px;color:var(--text-dim);">${legStart} — ${legEnd}</div>
        </div>
        ${mtaBullets(leg.line, 'lg')}
      </div>
      <div class="leg-route">
        ${displayStation(leg.entryStation)} <span class="subway-emoji lg">🚇</span> ${displayStation(leg.exitStation)}
      </div>
      <div class="detail-row">
        <span class="detail-label">Duration</span>
        <span class="detail-value">${formatDuration(leg.durationMin)}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Direction</span>
        <span class="detail-value">${leg.direction}</span>
      </div>
    </div>`;
  });

  content.innerHTML = html;
  overlay.classList.add('visible');
}

// Deselect
function deselectTrip() {
  selectedTripId = null;
  clearActiveRoute();
  document.getElementById('detailOverlay').classList.remove('visible');
  document.querySelectorAll('.ride-item').forEach(el => el.classList.remove('active'));
  map.setView([40.7350, -73.990], 13);
}

// Line filter with MTA bullets
document.querySelectorAll('#lineFilter .line-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const selected = btn.dataset.line;
    lineFilter = selected;

    // Update active/dimmed states
    document.querySelectorAll('#lineFilter .line-filter-btn').forEach(b => {
      b.classList.remove('active', 'dimmed');
      if (selected === 'all') {
        // All selected — everything full color
      } else if (b.dataset.line === selected) {
        b.classList.add('active');
      } else if (b.dataset.line !== 'all') {
        b.classList.add('dimmed');
      }
    });

    // Also update the "All" button
    const allBtn = document.querySelector('#lineFilter .line-filter-btn[data-line="all"]');
    if (selected === 'all') {
      allBtn.classList.add('active');
    } else {
      allBtn.classList.remove('active');
      allBtn.classList.add('dimmed');
    }

    renderList();
  });
});

document.querySelectorAll('#sortRow .sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#sortRow .sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sortMode = btn.dataset.sort;
    renderList();
  });
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderList();
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const filtered = getFilteredTrips();
  if (filtered.length === 0) return;

  const currentIdx = filtered.findIndex(t => t.id === selectedTripId);

  if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    const next = Math.min(currentIdx + 1, filtered.length - 1);
    selectTrip(filtered[next]);
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    const prev = Math.max(currentIdx - 1, 0);
    selectTrip(filtered[prev]);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    deselectTrip();
  }
});
</script>
