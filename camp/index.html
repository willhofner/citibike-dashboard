<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>HofCamps — Gear Floor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the gear laid out on the floor fills one big stage; a slim header above, a jump list of every item below */
:root{
  --bg:#eceae4;--stage:#e4e1d9;--ink:#22262a;--muted:#686c6e;--line:#cfcabd;--chip:#f6f4ef;
  --accent:#b97c0e;--accent-ink:#fff;--ours:#8a5a1a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16191b;--stage:#1d2124;--ink:#e9e7e1;--muted:#9aa09f;--line:#30363a;--chip:#22272a;
  --accent:#e2a62b;--accent-ink:#1a1306;--ours:#e0a866;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16191b;--stage:#1d2124;--ink:#e9e7e1;--muted:#9aa09f;--line:#30363a;--chip:#22272a;
  --accent:#e2a62b;--accent-ink:#1a1306;--ours:#e0a866;color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--body)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:560px){.side{align-items:flex-start}}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 20px}
.eyebrow{font:600 .72rem/1 var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
h1 span{color:var(--accent)}
.eyebrow a.home{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.eyebrow a.home:hover{color:var(--ink)}
h1{font:700 clamp(2rem,6vw,3rem)/1 var(--display);margin:6px 0 0;text-wrap:balance}
.count{font:400 .8rem var(--mono);color:var(--muted)}
.stage{position:relative;height:min(72vh,680px);min-height:400px;border-radius:14px;overflow:hidden;background:var(--stage);border:1px solid var(--line);touch-action:none}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage canvas.hot{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:600 .85rem/1.3 var(--body);padding:7px 11px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 16px));opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip small{display:block;font:400 .7rem var(--mono);opacity:.75}
.hint{position:absolute;left:14px;bottom:12px;right:14px;font:400 .72rem var(--mono);color:var(--muted);pointer-events:none}
.bar{position:absolute;left:12px;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
.bar>*{pointer-events:auto}
.title{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:min(360px,100%)}
.title b{display:block;font:700 1.25rem/1.1 var(--display)}
.title span{font:400 .75rem var(--mono);color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.cue{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;opacity:0;transition:opacity .3s}
.cue.on{opacity:1}
.cue .finger{position:relative;width:46px;height:46px}
.cue .finger i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ping 1.4s ease-out infinite}
.cue .finger i+i{animation-delay:.7s}
.cue .finger b{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);animation:tap 1.4s ease-in-out infinite}
.cue span{font:600 .85rem var(--body);background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:999px;white-space:nowrap}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.9);opacity:0}}
@keyframes tap{0%,100%{transform:scale(1)}45%{transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.cue .finger i,.cue .finger b{animation:none}}
button{font:600 .85rem var(--body);border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.loading[hidden]{display:none}
@media (max-width:640px){.stage{height:calc(100svh - 150px);min-height:460px}}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 .9rem var(--mono);color:var(--muted);pointer-events:none}
.list{display:flex;flex-direction:column;gap:10px}
.arrange{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--chip)}
.seg button{border:0;border-radius:0;background:transparent;padding:7px 14px;font:600 .85rem var(--body);color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.group .eyebrow{min-width:64px}
.chip{font:500 .85rem var(--body);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dot-ours{background:var(--ours)}
.chip .two{font:400 .68rem var(--mono);color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin:0;max-width:72ch}
</style>

<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow"><a class="home" href="../">Home</a></div>
      <h1>Hof<span>Camps</span></h1>
    </div>
    <div class="side">
      <div class="count" id="count">Loading gear…</div>
      <div class="seg" role="group" aria-label="Arrange the floor">
        <button id="ar-free" aria-pressed="true">Laid out</button><button id="ar-owner" aria-pressed="false">By owner</button><button id="ar-cat" aria-pressed="false">By category</button>
      </div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="bar">
      <div class="title" id="title" hidden><b id="tName"></b><span id="tSub"></span></div>
      <div class="btns">
        <button id="toggle" class="primary" hidden>Unpack</button>
        <button id="back" hidden>Back to floor</button>
      </div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="cue" id="cue" aria-live="polite"><div class="finger"><i></i><i></i><b></b></div><span id="cueText">Tap it to unpack</span></div>
    <div class="loading" id="loading">Laying out the gear…</div>
    <div class="hint" id="hint">Click any item to pick it up · hover to see its name · drag to look around</div>
  </div>

</div>

/* ---------- DOM ---------- */
const $=id=>document.getElementById(id);
const stage=$('stage'),tip=$('tip');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

sun.position.set(2,5,3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);

// plank floor (like the apartment hallway the photos were taken in)
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}

  for(let r=0;r<rows;r++){let x=-rnd()*300;
    while(x<w){const len=260+rnd()*380,l=44+rnd()*10,hue=28+rnd()*6;

wood.wrapS=wood.wrapT=THREE.RepeatWrapping;wood.repeat.set(1.85,1.75);

const groundMat=new THREE.MeshLambertMaterial();
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundMat);ground.rotation.x=-PI/2;ground.position.y=-.002;ground.receiveShadow=true;scene.add(ground);
let dirty=true;
function applyTheme(){const bg=new THREE.Color(css('--stage')||'#e4e1d9').convertSRGBToLinear();scene.background=bg;scene.fog=new THREE.Fog(bg,8,20);groundMat.color=bg.clone().multiplyScalar(.9);dirty=true}

new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- loading models ---------- */
let useMeshopt=!!window.MeshoptDecoder;
const decoderReady=useMeshopt?MeshoptDecoder.ready.then(()=>true,()=>false):Promise.resolve(false);
function b64(j){const s=atob(j.data),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer}
// three r128 renders compressed (normalized integer) positions correctly but raycasts them as raw integers,
// which makes clicks land on the wrong item. Convert positions to plain floats once, after loading.
function dequant(root){root.traverse(o=>{if(!o.isMesh)return;const a=o.geometry.attributes.position;if(!a||!a.normalized)return;
  const src=a.isInterleavedBufferAttribute?a.data.array:a.array,m=src instanceof Int8Array?127:src instanceof Uint8Array?255:src instanceof Int16Array?32767:src instanceof Uint16Array?65535:1,signed=m===127||m===32767;
  const n=a.count,out=new Float32Array(n*3),f=v=>{v/=m;return signed?Math.max(v,-1):v};
  for(let i=0;i<n;i++){out[i*3]=f(a.getX(i));out[i*3+1]=f(a.getY(i));out[i*3+2]=f(a.getZ(i))}
  o.geometry.setAttribute('position',new THREE.BufferAttribute(out,3));o.geometry.computeBoundingBox();o.geometry.computeBoundingSphere()})}
async function loadGLB(f){
  const ok=await decoderReady;
  const tryLoad=async dir=>{const r=await fetch(dir+'/'+f+'.json');if(!r.ok)throw new Error(f);const buf=b64(await r.json());
    const L=new THREE.GLTFLoader();if(dir==='m')L.setMeshoptDecoder(MeshoptDecoder);
    return new Promise((res,rej)=>L.parse(buf,'',g=>{dequant(g.scene);res(g.scene)},rej))};
  if(ok){try{return await tryLoad('m')}catch(e){}}

}
// turn, scale to real size, sit on the floor, center on its own origin
function fit(model,spec){
  const pivot=new THREE.Group();const turn=new THREE.Group();
  if(spec.rot)turn.rotation.set(...spec.rot);
  turn.add(model);pivot.add(turn);
  if(spec.flat)layFlat(model,turn);
  let box=new THREE.Box3().setFromObject(pivot);const size=box.getSize(new THREE.Vector3());
  const k=spec.size/(spec.axis==='y'?size.y:Math.max(size.x,size.y,size.z));
  turn.scale.setScalar(k);

  turn.position.set(-c.x,-box.min.y,-c.z);

    pivot.updateMatrixWorld(true);const ys=[],v=new THREE.Vector3();

  if(focus){if(o===focus)toggleOpen(o);return}
  setHover(null);focusOn(o)});

/* ---------- animation ---------- */
const easeOut=t=>1-Math.pow(1-t,3);
const back=t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const approach=(v,t,dt,s)=>v+(t-v)*Math.min(1,dt*s);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(!focus&&!camGoal&&!flyby)goCam(floorView(),true);dirty=true}
new ResizeObserver(resize).observe(stage);resize();
let last=performance.now(),intro=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;let busy=false;
  const sp=reduce?1e3:1;
  objs.forEach((o,i)=>{
    if(!o.closed)return;
    // appear on the floor one after another
    const prevShow=o.show;o.show=approach(o.show,o.showT,dt,6*sp);
    o.hover=approach(o.hover,o.hoverT,dt,10*sp);
    const target=focus===o?new THREE.Vector3(FL.cx,0,FL.cz):o.home;
    o.root.position.lerp(target,Math.min(1,dt*5*sp));
    const ryT=focus===o?(o.item.focusRy||0):o.homeRy;o.root.rotation.y+=(ryT-o.root.rotation.y)*Math.min(1,dt*5*sp);
    if(o.spin>0){o.spin=Math.max(0,o.spin-dt/1.4);o.root.rotation.y=ryT+(1-easeOut(1-o.spin))*PI*2;busy=true}
    const s=Math.max(.001,o.show)*(1+.35*o.hover);
    o.root.scale.setScalar(s);o.root.position.y=.04*o.hover*(o.closed.userData.height>.3?.5:1);
    o.root.visible=o.show>.01;
    // unpack: packed version shrinks away, set-up version springs up
    if(o.open){
      o.openP=approach(o.openP,o.openT,dt,(o.openT?2.2:3)*sp);
      const p=o.openP;
      o.closed.visible=p<.45;o.closed.scale.setScalar(Math.max(.001,1-easeOut(Math.min(1,p/.4))));
      o.open.visible=p>.25;
      const q=Math.min(1,Math.max(0,(p-.25)/.75));
      const xz=.15+.85*easeOut(q),y=Math.max(.02,back(q));
      o.open.scale.set(xz,y,xz);
      if(Math.abs(o.openP-o.openT)>.001)busy=true;
    }
    if(o.lamp){
      o.lightP=approach(o.lightP,o.lightT,dt,7*sp);const L=o.lightP,f=L*(0.96+0.04*Math.sin(now/90));
      if(o.lamp.glow){o.lamp.halo.material.opacity=f;o.lamp.halo.visible=L>.01;o.lamp.pt.intensity=4.5*f;o.lamp.mats.forEach(m=>m.emissiveIntensity=2.6*f)}
      else{o.lamp.lens.material.opacity=L;o.lamp.halo.material.opacity=.55*f;o.lamp.beam.material.opacity=.07*f;o.lamp.spot.intensity=3.2*f;
      o.lamp.beam.visible=o.lamp.halo.visible=L>.01;}
      if(Math.abs(o.lightP-o.lightT)>.001)busy=true;
    }
    if(Math.abs(o.show-o.showT)>.001||Math.abs(o.hover-o.hoverT)>.001||o.root.position.distanceTo(target)>.001)busy=true;
  });
  {const lit=objs.reduce((m,o)=>Math.max(m,o.lightP||0),0);hemi.intensity=.65-.38*lit;sun.intensity=.85-.55*lit;fill.intensity=.3-.18*lit}
  if(flyby){
    const p=Math.min(1,(now-flyby.t0)/flyby.dur),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    const az=viewAz()-Math.PI*2*(1-e),lift=Math.max(0,(p-.55)/.45),le=lift*lift*(3-2*lift);
    const el=.14+(viewEl()-.14)*le,d=flyby.dLow+(flyby.dEnd-flyby.dLow)*le;
    controls.target.copy(flyby.t);camera.position.copy(dirFrom(az,el)).multiplyScalar(d).add(flyby.t);camera.lookAt(flyby.t);
    if(p>=1)flyby=null;busy=true}
  if(camGoal){
    controls.target.lerp(camGoal.t,Math.min(1,dt*4));
    const curDir=camera.position.clone().sub(controls.target).normalize();
    curDir.lerp(camGoal.dir,Math.min(1,dt*3)).normalize();
    const d=camera.position.distanceTo(controls.target);const nd=d+(camGoal.d-d)*Math.min(1,dt*4);
    camera.position.copy(controls.target).add(curDir.multiplyScalar(nd));
    if(Math.abs(nd-camGoal.d)<.005&&controls.target.distanceTo(camGoal.t)<.005)camGoal=null;busy=true}
  if(controls.update())busy=true;
  if(busy||dirty){renderer.render(scene,camera);dirty=false}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__gear={focus:id=>focusOn(id?objs.find(o=>o.item.id===id):null),open:()=>focus&&toggleOpen(focus),hover:id=>{const o=objs.find(x=>x.item.id===id);setHover(o)},ready:()=>loaded===ITEMS.length};
})();
</script>
