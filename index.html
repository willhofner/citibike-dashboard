<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --accent: #3b82f6;
    --green: #22c55e;
    --orange: #f59e0b;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .container {
    max-width: 700px;
    width: 100%;
    padding: 40px;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 40px;
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(59,130,246,0.1);
  }

  .card.disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  .card .icon {
    font-size: 36px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .card p {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .card .badge {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 600;
  }

  .badge-live {
    background: rgba(34,197,94,0.15);
    color: var(--green);
  }

  .badge-soon {
    background: rgba(245,158,11,0.15);
    color: var(--orange);
  }
</style>
</head>
<body>
<div class="container">
  <h1>Activity Dashboard</h1>
  <p class="subtitle">Personal ride and run data visualizations</p>

  <div class="cards">
    <a href="citibike/index.html" class="card">
      <span class="badge badge-live">Live</span>
      <div class="icon">🚲</div>
      <h2>CitiBike</h2>
      <p>318 rides across 50 stations with route maps, heatmaps, and analytics</p>
    </a>

    <a href="strava/dashboard.html" class="card">
      <span class="badge badge-live">Live</span>
      <div class="icon">🏃</div>
      <h2>Strava Runs</h2>
      <p>79 runs with stats, animated route replay, heatmaps, pace splits, and timelapse</p>
    </a>
  </div>
</div>
</body>
</html>
